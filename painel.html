<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Vendas · Raio-X</title>
<style>
:root{--bg:#F3F1EE;--card:#FFFFFF;--ink:#1E1C1A;--muted:#6B6762;--line:#E3DFDA;--zebra:#FAF9F7;--navy:#1F4E79;--navy2:#0F2A4A;--gold:#F2A900;--goldL:#F5E6B8;--red:#C1272D;--green:#1E7A4D;--terra:#8A3324;--amber:#B8860B}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.35}
header{background:#1E1C1A;color:#fff;padding:6px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:650;white-space:nowrap}
header h1 b{color:var(--gold)}
header small{color:#B8B3AD;font-size:11.5px}
header .dir{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.bt{border:0;border-radius:5px;padding:5px 11px;font-size:12px;font-weight:700}
.bt-r{background:var(--red);color:#fff}.bt-r:hover{background:var(--terra)}
.bt-l{background:transparent;color:#E8E4DF;border:1px solid #57524D}
.bt-f{display:none;background:var(--gold);color:#1E1C1A}
nav{background:var(--navy2);padding:0 6px;display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:30;border-bottom:2px solid #2F5B8F}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:8px 11px;font-size:12.5px;color:#CFE0F5;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-2px}
nav button:hover{color:#fff;background:#173B66}
nav button.on{color:#fff;font-weight:700;border-bottom-color:var(--gold);background:var(--navy)}
.layout{display:flex;align-items:flex-start}
aside{width:190px;flex:0 0 190px;background:var(--navy2);color:#fff;position:sticky;top:38px;height:calc(100vh - 38px);overflow-y:auto;padding:10px 9px 30px;font-size:11.5px}
aside h3{margin:0 0 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#9FC1E8}
aside label{display:block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#9FC1E8;margin:9px 0 3px}
aside select,aside input{width:100%;padding:5px 6px;font:inherit;font-size:12px;border:1px solid #2F5B8F;background:#0B2140;color:#fff;border-radius:4px}
aside input::placeholder{color:#7E9FC6}
aside .limpa{width:100%;margin-top:12px;background:#fff;color:var(--navy2);border:0;border-radius:4px;padding:6px;font-weight:700;font-size:12px}
aside .resumo{background:#173B66;border-radius:6px;padding:7px 8px;margin-bottom:6px;font-size:12px}
aside .resumo b{font-size:15px}
aside .fecha{display:none}
main{flex:1;min-width:0;padding:12px 14px 60px}
.base{font-size:11px;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;min-width:0}
.card h2{margin:0 0 8px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;text-align:center;color:#2B2825}
.card h2 small{display:block;font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:2px 0 8px}
.kpi{text-align:center}
.kpi .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .r{font-size:11px;color:var(--muted)}
.pos{color:var(--green)}.neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
svg{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted);margin-top:4px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.rosca{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
/* Raio-X numa tela so (p4): tiras de KPI, grades de 2 e 3 cartoes, graficos baixos */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;border-top:3px solid var(--navy)}
.tile .t{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:20px;font-weight:800;margin:2px 0 1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .c{font-size:11px;color:var(--muted);line-height:1.45}
.tile .c b{font-weight:700}
.g32{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g32 .card,.g3 .card{margin-bottom:8px;padding:8px 10px}
.g32 .card h2,.g3 .card h2{font-size:11.5px;margin-bottom:4px}
.peq-r svg{width:125px!important;flex:0 0 125px!important}
.peq-r ul{font-size:11.5px;min-width:120px}
.peq-r li span{font-size:10.5px}
.top5{list-style:none;margin:0;padding:0;font-size:12px}
.top5 li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.top5 li:last-child{border-bottom:0}
.top5 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1150px){.tiles{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}.g32,.g3{grid-template-columns:1fr}}
.rosca svg{width:190px;flex:0 0 190px}
.rosca ul{list-style:none;margin:0;padding:0;font-size:12px;min-width:170px;flex:1}
.rosca li{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
.rosca li i{width:11px;height:11px;border-radius:2px;flex:0 0 11px;margin-top:3px}
.rosca li span{color:var(--muted);font-size:11px;display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:10.5px;color:#fff;background:var(--navy);text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;cursor:pointer;white-space:nowrap}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr.clic{cursor:pointer}tbody tr.clic:hover{background:#FFF6DC}
td.d,th.d{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rol{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.peq{font-size:11.5px;color:var(--muted)}
.et{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;background:#EEE}
.et.fe{background:#E3F0E8;color:var(--green)}.et.en{background:#E3EBF5;color:var(--navy)}.et.fa{background:#FFF1C2;color:#8F6908}.et.ca{background:#F5E2DD;color:var(--terra)}.et.bo{background:#FBE9E4;color:var(--terra)}
.barra{display:inline-block;height:8px;border-radius:4px;background:var(--gold);vertical-align:middle}
.filtro{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.filtro input,.filtro select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12.5px;background:#fff}
.filtro .bt{background:#fff;border:1px solid var(--line);color:var(--ink)}
.vazio{padding:30px;text-align:center;color:var(--muted)}
.login{max-width:420px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.login h2{margin:0 0 4px}.login label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 4px;text-transform:uppercase}
.login input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}
.login .bt{width:100%;margin-top:16px;padding:11px;background:var(--navy);color:#fff;font-size:14px}
.erro{color:var(--red);font-weight:700;margin-top:10px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
.modal>div{background:#fff;border-radius:12px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 8px}
.rede-lojas td{background:#FFFBEF}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:50;transform:translateX(-100%);transition:transform .2s;width:260px;flex-basis:260px;box-shadow:4px 0 20px rgba(0,0,0,.35)}
  aside.aberto{transform:none}
  aside .fecha{display:block;width:100%;margin-bottom:8px;background:var(--gold);color:#1E1C1A;border:0;border-radius:4px;padding:7px;font-weight:700}
  .bt-f{display:inline-block}
  main{padding:10px 8px 60px}
  .kpi .v{font-size:17px}
  header small{display:none}
  .rosca svg{width:160px;flex-basis:160px}
}
@media print{header,nav,aside,.filtro,.bt{display:none!important}main{padding:0}.card{break-inside:avoid}body{background:#fff}.rol{max-height:none;overflow:visible}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* =========================================================
   PAINEL DE VENDAS · RAIO-X  (p3, 25/09/2026)
   Mesmo visual do painel da Forno, só com o que o app gera:
   Raio-X · Redes · Clientes · Produtos · Pedidos · Sem comprar.
   Lê a nuvem com login de gestor/suporte. Nada de preço, cliente ou chave no arquivo.
   ========================================================= */
const VERSAO = '2026-09-25 p5';
const K = 'painel.sessao.v1';
const NUVEM_URL = 'https://wzymaphljtwaoikyyqrk.supabase.co';
let S = null, DADOS = null, ERRO = '';
const F = { aba:'raio', mes:'', marca:'', vend:'', canal:'', seg:'', cidade:'', rede:'', busca:'', janela:'12', dias:30, ord:'', dir:-1, tipo:'venda', redeAberta:'' };
const el = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nm = (v,d) => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const mil = v => { v = Number(v)||0; return Math.abs(v)>=1e6 ? nm(v/1e6,2)+' mi' : Math.abs(v)>=1e3 ? nm(v/1e3,1)+' mil' : nm(v,0); };
const dbr = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '';
const sac = t => String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ymAdd = (ym, n) => { let y = +ym.slice(0,4), m = +ym.slice(5,7)-1+n; y += Math.floor(m/12); m = ((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); };
const ymRot = ym => MES[+ym.slice(5,7)-1]+'/'+ym.slice(2,4);
const pct = (a,b) => b ? (a/b-1)*100 : null;
const fmtPct = v => v==null ? '—' : (v>0?'+':'')+nm(v,1)+'%';
const cls = v => v==null ? '' : v>=0 ? 'pos' : 'neg';
const hojeYM = () => new Date().toISOString().slice(0,7);
const PAL = ['#1F4E79','#F2A900','#C1272D','#1E7A4D','#7B4FA0','#E07B39','#2F9FD3','#8A3324','#6B6762','#B8860B','#3D9970','#D6589B'];

try{ S = JSON.parse(localStorage.getItem(K)||'null'); }catch(e){ S = null; }
try{ const f = JSON.parse(localStorage.getItem('painel.filtros.v1')||'null'); if(f) Object.assign(F, f, {busca:'', redeAberta:'', mes:''}); }catch(e){}   /* o mes nao fica guardado: ao abrir, volta para o ultimo mes fechado */
const guardaFiltros = () => { try{ localStorage.setItem('painel.filtros.v1', JSON.stringify(F)); }catch(e){} };

/* ---------- nuvem ---------- */
async function api(caminho, corpo, semAuth, metodo, extra){
  const cab = Object.assign({ 'apikey': S.chave, 'Content-Type':'application/json' }, extra||{});
  if(!semAuth) cab['Authorization'] = 'Bearer '+S.access_token;
  const met = metodo || 'POST';
  const r = await fetch(NUVEM_URL+caminho, met==='GET' ? {method:'GET', headers:cab} : {method:met, headers:cab, body:JSON.stringify(corpo||{})});
  const txt = await r.text(); let js = null; try{ js = txt ? JSON.parse(txt) : null; }catch(e){ js = txt; }
  if(!r.ok){ const e = new Error((js && (js.message||js.msg||js.error_description||js.error)) || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return js;
}
async function renovar(){
  if(!S || !S.refresh_token) return;
  if((S.expires_at||0) - Math.floor(Date.now()/1000) > 90) return;
  const js = await api('/auth/v1/token?grant_type=refresh_token', {refresh_token:S.refresh_token}, true);
  S.access_token = js.access_token; S.refresh_token = js.refresh_token; S.expires_at = Math.floor(Date.now()/1000)+(js.expires_in||3600);
  localStorage.setItem(K, JSON.stringify(S));
}
async function entrar(chave, email, senha){
  S = { chave: chave.trim() };
  const js = await api('/auth/v1/token?grant_type=password', {email:email.trim(), password:senha}, true);
  S.access_token = js.access_token; S.refresh_token = js.refresh_token; S.expires_at = Math.floor(Date.now()/1000)+(js.expires_in||3600); S.email = email.trim();
  localStorage.setItem(K, JSON.stringify(S));
}
function sair(){ localStorage.removeItem(K); S = null; DADOS = null; DEMO = false; render(); }

/* ---------- DEMONSTRACAO: dados ficticios montados so na tela (nao toca a nuvem) ----------
   Serve para entender o painel e para mostrar a uma industria sem expor cliente nenhum.
   Nomes, precos e volumes sao inventados. */
let DEMO = false;
function carregarDemo(){
  let semente = 20260925; const rnd = () => { semente = (semente*1103515245 + 12345) % 2147483648; return semente/2147483648; };
  const pick = a => a[Math.floor(rnd()*a.length)];
  const marcas = [{id:'mh', nome:'Harus + PP'}, {id:'mc', nome:'Coffee ++'}];
  const vendedores = [{id:'v1', nome:'Anderson Santos', codigo:'001', gestor:false},{id:'v2', nome:'Vendedor Exemplo 2', codigo:'002', gestor:false}];
  const PR = [
    ['d1','D-01','Dadinho de Tapioca Tradicional','Dadinho de Tapioca','mh',190],['d2','D-02','Dadinho de Tapioca Calabresa','Dadinho de Tapioca','mh',195],
    ['q1','Q-01','Pão de Queijo Tradicional 1 kg','Pão de Queijo','mh',160],['q2','Q-02','Pão de Queijo Coquetel 1 kg','Pão de Queijo','mh',165],
    ['p1','P-01','Palitinho de Queijo','Palitinho','mh',140],['k1','K-01','Coxinha de Frango','Coxinha','mh',150],['c1','C-01','Croissant Amanteigado','Croissant','mh',210],
    ['g1','G-01','Café Especial Grão 250 g','Grão 250 g','mc',560],['m1','M-01','Café Especial Moído 250 g','Moído 250 g','mc',560],['r1','R-01','Café Drip (display 10 sachês)','Drip','mc',170]];
  const prod = {}; PR.forEach(x=>{ prod[x[0]] = {id_local:x[0], cod:x[1], nome:x[2], categoria:x[3], marca_id:x[4]}; });
  const BAI = [['Centro','Petrópolis'],['Itaipava','Petrópolis'],['Quitandinha','Petrópolis'],['Corrêas','Petrópolis'],['Várzea','Teresópolis'],['Alto','Teresópolis'],['Centro','Três Rios']];
  const SEG = ['Supermercado','Padaria','Lanchonete','Cafeteria','Mercadinho','Restaurante'];
  const clientes = [];
  const redes = [['Rede Serrana',6],['Supermercados Vale Verde',4],['Padarias Pão da Serra',3]];
  let n = 0;
  redes.forEach(([r,q])=>{ for(let i=1;i<=q;i++){ const b = pick(BAI); clientes.push({id:'c'+(++n), razao:r+' Ltda', fantasia:r, rede:r, loja:String(i), canal:/Padaria/.test(r)?'FOODSERVICE':'VAREJO', bairro:b[0], cidade:b[1], vendedor_id:'v1', dados:{segmento:/Padaria/.test(r)?'Padaria':'Supermercado', contato:'Comprador', fone:'(24) 2200-00'+String(n).padStart(2,'0')}, apagado:false}); } });
  const NOMES = ['Mercado Bom Preço','Padaria Estrela','Lanchonete do Zé','Café da Praça','Mercadinho São José','Empório Serra','Padaria Imperial','Lanches Rápido','Cafeteria Aroma','Mercado Central','Restaurante Sabor','Padaria Nova','Mercadinho Família','Café Colonial','Lanchonete Ponto Certo','Mercado União','Padaria Trigo de Ouro','Café Expresso','Mercearia Popular','Padaria Doce Lar','Lanchonete Bom Gosto','Mercado Econômico','Cafeteria Serra Café','Padaria Real','Mercadinho do Bairro'];
  NOMES.forEach(nome=>{ const b = pick(BAI); const seg = /Padaria/.test(nome)?'Padaria':/Lanch/.test(nome)?'Lanchonete':/Caf/.test(nome)?'Cafeteria':/Restaur/.test(nome)?'Restaurante':/Mercadinho|Mercearia/.test(nome)?'Mercadinho':'Supermercado';
    clientes.push({id:'c'+(++n), razao:nome+' Ltda', fantasia:nome, rede:'', loja:'', canal:/Mercad|Mercea/.test(seg)||seg==='Supermercado'?'VAREJO':'FOODSERVICE', bairro:b[0], cidade:b[1], vendedor_id:rnd()<0.8?'v1':'v2', dados:{segmento:seg, contato:'Responsável', fone:'(24) 9'+String(10000000+n*371).slice(0,8)}, apagado:false}); });
  const pedidos = []; let num = 0;
  const hoje = new Date(); const base = ymAdd(hojeYM(), -24);
  for(let k=0; k<=24; k++){
    const ym = ymAdd(base, k); const mes = +ym.slice(5,7);
    const sazon = [0.85,0.8,0.95,1,1.05,1.1,1.15,1.05,1,1.05,1.15,1.35][mes-1];
    const cresc = 0.8 + k*0.025;
    const ativos = clientes.filter(()=>rnd() < 0.55*sazon*Math.min(1.2,cresc));
    ativos.forEach(c=>{
      const vezes = rnd()<0.3 ? 2 : 1;
      for(let v=0; v<vezes; v++){
        const cafe = rnd() < (c.dados.segmento==='Cafeteria'?0.7:0.25);
        const ps = PR.filter(x=>x[4]===(cafe?'mc':'mh'));
        const escolh = ps.filter(()=>rnd()<0.45); if(!escolh.length) escolh.push(pick(ps));
        const tam = c.rede ? 2.2 : 1;
        const itens = escolh.map(x=>({skuId:x[0], cod:x[1], nome:x[2], un:'CX', qtd:Math.max(1,Math.round((1+rnd()*4)*tam*cresc)), preco:Math.round(x[5]*(0.92+rnd()*0.12)*100)/100}));
        const dia = Math.min(28, 1+Math.floor(rnd()*27));
        const data = ym+'-'+String(dia).padStart(2,'0');
        if(data > hoje.toISOString().slice(0,10)) continue;
        const bon = rnd()<0.05;
        const st = rnd()<0.04 ? 'Cancelado' : (ym>=ymAdd(hojeYM(),-1) ? pick(['Fechado','Enviado','Faturado']) : 'Faturado');
        const total = itens.reduce((s,i)=>s+i.qtd*i.preco,0);
        num++;
        pedidos.push({id:'p'+num, num:(cafe?'COF-':'HAR-')+String(num).padStart(4,'0'), status:st, data:data, total:total, kg:0, cx:itens.reduce((s,i)=>s+i.qtd,0),
          vendedor_id:c.vendedor_id, cliente_id:c.id, marca_id:cafe?'mc':'mh', dados:{itens:itens, tipo:bon?'bonificacao':'venda', marca:cafe?'Coffee ++':'Harus + PP', cond:pick(['21 dias','28 dias','14/28 dias']), numCliente:rnd()<0.3?'OC '+(1000+num):''}});
      }
    });
  }
  const cli = {}; clientes.forEach(c=>{ c.seg = c.dados.segmento; cli[c.id] = c; });
  const mk = {}; marcas.forEach(m=>mk[m.id]=m.nome);
  DADOS = { quem:{vendedor:'Demonstração', codigo:'DEMO'}, clientes, cli, carteira:clientes, vendedores, marcas, mk, prod, quando:new Date() };
  DADOS.pedidos = pedidos.map(prep);
  if(!F.mes) F.mes = ymAdd(hojeYM(), -1);
  DEMO = true; render();
}
async function carregar(){
  await renovar();
  let quem = {}; try{ quem = await api('/rest/v1/rpc/quem_sou', {}) || {}; }catch(e){ quem = {}; }
  const cab = {'Range':'0-49999'};
  const [pedidos, clientes, vendedores, marcas, produtos] = await Promise.all([
    api('/rest/v1/pedidos?select=id,num,status,data,total,kg,cx,vendedor_id,vendedor_codigo,cliente_id,marca_id,dados&apagado=is.false&order=data.desc', null, false, 'GET', cab),
    api('/rest/v1/clientes?select=id,razao,fantasia,rede,loja,canal,bairro,cidade,vendedor_id,dados,apagado', null, false, 'GET', cab),
    api('/rest/v1/vendedores?select=id,nome,codigo,gestor,ativo', null, false, 'GET'),
    api('/rest/v1/marcas?select=id,nome', null, false, 'GET'),
    api('/rest/v1/produtos?select=id_local,marca_id,cod,nome,categoria', null, false, 'GET', cab)
  ]);
  const prod = {}; (produtos||[]).forEach(p=>{ prod[p.id_local] = p; });

function prep(p){

  const bruto = itens.reduce((s,it)=>s+it.qtd*it.preco, 0);

           vendedor_id:p.vendedor_id, cliente_id:p.cliente_id, marca: d.marca || DADOS.mk[p.marca_id] || '',

const VALE = st => st==='Fechado' || st==='Enviado' || st==='Faturado';

/* ---------- filtros ---------- */
const cliDe = id => DADOS.cli[id] || {};

}
const base = () => DADOS.pedidos.filter(p=>VALE(p.status) && passaPed(p));
const vendasB = () => base().filter(p=>p.tipo!=='bonificacao');
const bonifB = () => base().filter(p=>p.tipo==='bonificacao');
function janelaIni(){ const n = F.janela==='ano' ? (+F.mes.slice(5,7)-1) : (+F.janela-1); return ymAdd(F.mes, -n); }
const naJanela = p => p.ym>=janelaIni() && p.ym<=F.mes;
const rotJanela = () => F.janela==='1' ? ymRot(F.mes) : F.janela==='ano' ? 'ano até '+ymRot(F.mes) : 'últimos '+F.janela+' meses até '+ymRot(F.mes);

/* ---------- graficos (SVG na mao) ---------- */
function serie(meses, fn){ const m = {}; meses.forEach(x=>m[x]=0); return m; }
function barrasMes(valores, opc){
  /* valores: {ym: v}, 24 meses ate mesRef + mes corrente parcial se houver */
  opc = opc || {};

  const W = compacto ? 560 : 1000, H = opc.alt || (compacto ? 280 : 250), top = 20, bot = 44, esq = 6;
  const max = Math.max(1, ...meses.map(m=>valores[m]));

    h += '<rect x="'+(x-bw/2).toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,(H-bot-y(v))).toFixed(1)+'" fill="'+cor+'" stroke="'+borda+'" stroke-width="'+(ref?2:1.2)+'"'+(ly?' stroke-dasharray="4 3"':'')+' rx="2"><title>'+ymRot(m)+': '+(opc.fmt||mil)(v)+'</title></rect>';
    if(v>0) h += '<text x="'+x.toFixed(1)+'" y="'+(Math.min(y(v)+ (H-bot-y(v)>34? 16 : -4), H-bot-4)).toFixed(1)+'" font-size="'+(compacto?15:(n>18?12:13))+'" text-anchor="middle" font-weight="700" fill="'+(ref||(opc.escuro&&!ly&&!parcial)?'#fff':'#2B2825')+'"'+(H-bot-y(v)>34?'':' fill-opacity=".9"')+'>'+(compacto ? (opc.fmtBar||mil)(v).replace(' mil','k').replace(' mi','M') : (opc.fmtBar||mil)(v))+'</text>';

    const ano = m.slice(0,4);

      if(i>0) h += '<line x1="'+(esq+i*lw).toFixed(1)+'" x2="'+(esq+i*lw).toFixed(1)+'" y1="'+top+'" y2="'+(H-6)+'" stroke="#D6D3D1" stroke-dasharray="3 3"/>';
      const fim = meses.filter(q=>q.slice(0,4)===ano).length;

function linhaMes(valores, fmt, pequena){

  let h = '<svg viewBox="0 0 '+W+' '+H+'"><polyline fill="none" stroke="#1F4E79" stroke-width="2.5" points="'+meses.map((m,i)=>x(i).toFixed(1)+','+y(valores[m]).toFixed(1)).join(' ')+'"/>';
  meses.forEach((m,i)=>{ const ref = m===F.mes;
    h += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(valores[m]).toFixed(1)+'" r="'+(ref?7:4.5)+'" fill="'+(ref?'#fff':'#1F4E79')+'" stroke="#1F4E79" stroke-width="2"><title>'+ymRot(m)+': '+fmt(valores[m])+'</title></circle>';

function rosca(itens, centro, pequena){
  const tot = itens.reduce((s,x)=>s+x.v,0);

  const R = 90, r = 56, cx = 100, cy = 100; let a0 = -Math.PI/2, h = '<svg viewBox="0 0 200 200">';
  top.forEach((x,i)=>{
    const a1 = a0 + x.v/tot*Math.PI*2, g = a1-a0>Math.PI ? 1 : 0;
    const p = (a,rad)=>[cx+rad*Math.cos(a), cy+rad*Math.sin(a)].map(n=>n.toFixed(2)).join(',');
    if(top.length===1) h += '<circle cx="100" cy="100" r="73" fill="none" stroke="'+PAL[0]+'" stroke-width="34"/>';
    else h += '<path d="M'+p(a0,R)+' A'+R+','+R+' 0 '+g+' 1 '+p(a1,R)+' L'+p(a1,r)+' A'+r+','+r+' 0 '+g+' 0 '+p(a0,r)+' Z" fill="'+PAL[i%PAL.length]+'"><title>'+esc(x.nm)+': '+brl(x.v)+'</title></path>';
    a0 = a1;

  return '<div class="rosca'+(pequena?' peq-r':'')+'">'+h+'<ul>'+top.map((x,i)=>'<li><i style="background:'+PAL[i%PAL.length]+'"></i><div>'+esc(x.nm)+'<span>'+nm(x.v/tot*100,1)+'% · '+brl(x.v)+'</span></div></li>').join('')+'</ul></div>';
}
const legendaBarras = () => '<div class="leg"><span><i style="background:#E8604C;border:1px solid #8A3324"></i>mês ref. '+ymRot(F.mes)+'</span><span><i style="background:#F2C4B8;border:1px dashed #E8604C"></i>mesmo mês ano anterior '+ymRot(ymAdd(F.mes,-12))+'</span>'+(F.mes<hojeYM()?'<span><i style="background:#F2A900"></i>mês corrente (parcial)</span>':'')+'</div>';

function janela24(){ const ini = ymAdd(F.mes,-23); const fim = F.mes<hojeYM() ? hojeYM() : F.mes; const out = []; for(let m=ini; m<=fim; m=ymAdd(m,1)) out.push(m); return out; }
function porMes(peds, fn){ const out = {}; janela24().forEach(m=>out[m]=0); peds.forEach(p=>{ if(out[p.ym]!=null) out[p.ym] += fn(p); }); return out; }
function kpisDe(porMesVal, fmt, rotAcum){

function ordenar(L, cols){
  const c = cols[F.ord]; if(!c) return L;
  return L.sort((a,b)=>{ const x=c(a), y=c(b); return (x>y?1:x<y?-1:0)*F.dir; });
}

function baixar(nome, linhas){
  const cel = v => { const s = String(v==null?'':v); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const b = new Blob(['﻿'+linhas.map(l=>l.map(cel).join(';')).join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

}
function telaLogin(msg){
  return '<div class="login"><h2>Painel de vendas</h2><div class="peq">Entre com o login de gestor ou suporte. A chave e a senha ficam só neste navegador.</div>'+
    '<label>Chave da nuvem (sb_publishable_…)</label><input id="l_chave" value="'+esc(S&&S.chave||'')+'">'+
    '<label>E-mail</label><input id="l_email" type="email" value="'+esc(S&&S.email||'')+'">'+
    '<label>Senha</label><input id="l_senha" type="password">'+
    '<button class="bt" id="l_ok">Entrar</button>'+(msg?'<div class="erro">'+esc(msg)+'</div>':'')+
    '<button class="bt" id="l_demo" style="background:#fff;color:var(--navy);border:1px solid var(--navy);margin-top:8px">Ver demonstração (dados fictícios)</button>'+
    '<div class="peq" style="margin-top:14px">Painel · versão '+VERSAO+'</div></div>';
}
const ABAS = [['raio','Raio-X'],['redes','Redes'],['clientes','Clientes'],['produtos','Produtos'],['pedidos','Pedidos'],['sem','Sem comprar']];
function render(){
  const app = el('app');
  if(!DEMO && (!S || !S.access_token)){ app.innerHTML = telaLogin(ERRO); el('l_demo').onclick = ()=>{ F.mes=''; carregarDemo(); }; el('l_ok').onclick = aoEntrar; el('l_senha').onkeydown = e=>{ if(e.key==='Enter') aoEntrar(); }; return; }
  if(!DADOS){ app.innerHTML = '<div class="vazio" style="padding:60px">Carregando a nuvem…</div>'+(ERRO?'<div class="erro" style="text-align:center">'+esc(ERRO)+' <button class="bt bt-r" id="b_sair2">Sair</button></div>':''); const b = el('b_sair2'); if(b) b.onclick = sair; return; }
  const corpo = ({raio:telaRaio, redes:telaRedes, clientes:telaClientes, produtos:telaProdutos, pedidos:telaPedidos, sem:telaSem}[F.aba] || telaRaio)();
  const rolagem = window.scrollY;
  app.innerHTML = (DEMO ? '<div style="background:#F2A900;color:#1E1C1A;text-align:center;font-weight:800;font-size:12.5px;padding:5px 8px">DEMONSTRAÇÃO · dados fictícios, só nesta tela · <a href="#" id="b_sairdemo" style="color:#1E1C1A">sair da demonstração</a></div>' : '')+
    '<header><h1>Painel de Vendas · <b>'+esc(ABAS.find(a=>a[0]===F.aba)[1])+'</b></h1><small>atualizado '+DADOS.quando.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</small>'+
    '<div class="dir"><button class="bt bt-f" id="b_filtros">Filtros</button><button class="bt bt-l" id="b_rec">Atualizar</button><button class="bt bt-l" id="b_print">Imprimir / PDF</button><button class="bt bt-l" id="b_sair">Sair</button></div></header>'+
    '<nav>'+ABAS.map(a=>'<button class="'+(F.aba===a[0]?'on':'')+'" data-aba="'+a[0]+'">'+a[1]+'</button>').join('')+'</nav>'+
    '<div class="layout">'+lateral()+'<main>'+corpo+'</main></div>';
  window.scrollTo(0, rolagem);
  const liga = (id, fn, ev) => { const n = el(id); if(n) n[ev||'onchange'] = fn; };
  [['f_mes','mes'],['f_marca','marca'],['f_vend','vend'],['f_canal','canal'],['f_seg','seg'],['f_rede','rede'],['f_cidade','cidade'],['f_janela','janela'],['f_tipo','tipo'],['f_dias','dias']]
    .forEach(([id,k])=>liga(id, e=>{ F[k] = e.target.value; guardaFiltros(); render(); }));
  liga('f_busca', e=>{ F.busca = e.target.value; const pos = e.target.selectionStart; render(); const n = el('f_busca'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }, 'oninput');
  liga('b_limpa', ()=>{ Object.assign(F, {marca:'',vend:'',canal:'',seg:'',cidade:'',rede:'',busca:''}); guardaFiltros(); render(); }, 'onclick');
  liga('b_rec', ()=>{ if(DEMO) carregarDemo(); else recarregar(); }, 'onclick');
  liga('b_sairdemo', e=>{ e.preventDefault(); DEMO = false; DADOS = null; F.mes=''; render(); if(S && S.access_token) recarregar(); }, 'onclick'); liga('b_print', ()=>window.print(), 'onclick'); liga('b_sair', sair, 'onclick');
  liga('b_filtros', ()=>el('lat').classList.add('aberto'), 'onclick'); liga('b_fecha', ()=>el('lat').classList.remove('aberto'), 'onclick');
  document.querySelectorAll('[data-aba]').forEach(b=>b.onclick = ()=>{ F.aba = b.dataset.aba; F.busca=''; F.ord=''; guardaFiltros(); window.scrollTo(0,0); render(); });
  document.querySelectorAll('th[data-ord]').forEach(t=>t.onclick = ()=>{ const k = t.dataset.ord; if(F.ord===k) F.dir = -F.dir; else { F.ord = k; F.dir = /cli|nome|num|status/.test(k) ? 1 : -1; } render(); });
  document.querySelectorAll('tr[data-rede]').forEach(t=>t.onclick = ()=>{ F.redeAberta = F.redeAberta===t.dataset.rede ? '' : t.dataset.rede; render(); });
  document.querySelectorAll('tr[data-ped]').forEach(t=>t.onclick = ()=>modalPedido(t.dataset.ped));
  Object.keys(csvs).forEach(id=>liga(id, csvs[id], 'onclick'));
}
async function aoEntrar(){
  const chave = el('l_chave').value.trim(), email = el('l_email').value.trim(), senha = el('l_senha').value;
  if(!/^sb_publishable_/.test(chave)){ ERRO = 'A chave começa com sb_publishable_ — cole inteira.'; render(); return; }
  if(!email || !senha){ ERRO = 'Preencha e-mail e senha.'; render(); return; }
  ERRO = ''; el('l_ok').textContent = 'Entrando…';
  try{ await entrar(chave, email, senha); await recarregar(); }
  catch(e){ S = null; localStorage.removeItem(K); ERRO = /invalid|credentials/i.test(e.message) ? 'E-mail ou senha errados.' : (e.status===401 ? 'Chave da nuvem errada.' : 'Não entrou: '+e.message); render(); }
}
async function recarregar(){
  ERRO = ''; DADOS = null; render();
  try{ await carregar(); render(); }
  catch(e){ ERRO = 'Não consegui ler a nuvem: '+e.message; if(e.status===401){ S = null; localStorage.removeItem(K); } render(); }
}
render();
if(S && S.access_token) recarregar();
let _rz = null; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz = setTimeout(()=>{ if(DADOS) render(); }, 250); });
})();
</script>
