function verTexto(ped, paraCliente){

    'font-weight:650;cursor:pointer;list-style:none">Ver o texto que será enviado</summary>'+
    '<div class="corpo" style="padding-top:0"><pre style="white-space:pre-wrap;font-size:calc(12px * var(--esc));'+
    'line-height:1.5;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--grafite2)">'+

}

/* =====================================================
   TELA 1 — REVISAR: conferir e decidir o que fazer
   ===================================================== */
function telaRevisar(){
  const ped = pedidoPorId(VISTA.id) || pedidoRascunho();
  if(!ped){ VISTA=null; return telaPedido(); }
  const cli = clienteDe(ped) || {};
  const rasc = ped.status==='Rascunho';

  let h = cartaoCabecalhoPedido(ped, cli) + '<div id="rev-itens">'+cartaoItensPedido(ped)+'</div>' + cartaoDocumento(ped);

  if(rasc){
    /* etapa 3: desconto, pagamento e observacoes entram aqui, na conferencia */
    h += '<div class="secao">Fechamento</div><div class="cartao" id="fecha">'+blocoFechamento(ped)+'</div>'+
      '<datalist id="conds">'+CONDS_PAGTO.map(c=>'<option value="'+c+'">').join('')+'</datalist>';
    h += '<div class="secao">E agora?</div>';
    h += '<div class="peq" style="margin:-2px 0 10px;padding:0 3px">Confira acima antes de decidir. '+
      'Nada sai daqui sozinho — fechar o pedido só o marca como vendido e leva você para a tela '+
      'de compartilhar.</div>';
    h += '<button class="bt bt-v bt-bloco bt-alto" data-a="fecharPedido" data-i="'+esc(ped.id)+'">'+
      ico('check')+'FECHAR O PEDIDO</button>'+
      '<div class="peq" style="margin:7px 3px 14px">Entra no painel como venda do dia e vai direto '+
      'para as vias do pedido.</div>';
    h += '<button class="bt bt-l bt-bloco" data-a="salvarRascunho" data-i="'+esc(ped.id)+'">'+
      ico('salvar')+'Salvar como rascunho</button>'+
      '<div class="peq" style="margin:7px 3px 14px">Fica guardado do jeito que está. Você volta nele '+
      'pela tela de Pedido ou pelo Histórico.</div>';
    h += '<div class="linha-bt" style="margin-bottom:12px">'+
      '<button class="bt bt-l" data-a="editarPedido" data-i="'+esc(ped.id)+'">'+ico('editar')+'Editar itens</button>'+
      '<button class="bt bt-l" data-a="cancelarPedido" data-i="'+esc(ped.id)+'" '+
        'style="color:var(--terracota)">'+ico('x')+'Cancelar</button></div>';
  } else {
    h += '<div class="secao">Vias do pedido</div>'+
      '<button class="bt bt-d bt-bloco bt-alto" data-a="irEnviar" data-i="'+esc(ped.id)+'">'+
      ico('subir')+'COMPARTILHAR AS VIAS</button>'+
      '<div class="peq" style="margin:7px 3px 14px">WhatsApp ou e-mail para a indústria, PDF, '+
      'planilha e a confirmação do cliente.</div>';
    h += chipsSituacao(ped);
    h += cartaoEntrega(ped);
    h += '<div class="linha-bt" style="margin-top:10px">'+
      '<button class="bt bt-l" data-a="reabrirPedido" data-i="'+esc(ped.id)+'">'+ico('editar')+'Reabrir e editar</button>'+
      '</div>';
  }
  return h;
}

/* ---- conferencia de entrega: um toque no caso comum, lista so quando faltou ---- */
function precisaConferir(p){ return (p.status==='Enviado' || p.status==='Faturado') && !p.conferido; }
function cartaoEntrega(ped){
  if(ped.status!=='Enviado' && ped.status!=='Faturado') return '';
  const t = totais(ped);
  if(!ped.conferido){
    return '<div class="secao">Entrega</div><div class="cartao"><div class="corpo">'+
      '<div style="font-size:calc(15px * var(--esc));font-weight:700;margin-bottom:4px">O pedido veio completo?</div>'+
      '<div class="peq" style="margin-bottom:11px">Confira com a nota. Na maioria vem tudo: um toque e pronto.</div>'+
      '<div class="linha-bt">'+
        '<button class="bt bt-v" data-a="entregaCompleta" data-i="'+esc(ped.id)+'">'+ico('check')+'Veio tudo</button>'+
        '<button class="bt bt-l" data-a="entregaFaltou" data-i="'+esc(ped.id)+'">Faltou algo</button>'+
      '</div></div></div>';
  }
  return '<div class="secao">Entrega</div><div class="cartao"><div class="corpo">'+
    '<table class="tabelinha">'+
      '<tr><td>Pedido</td><td>'+brl(t.liquido)+'</td></tr>'+
      '<tr><td>Entregue</td><td class="v-verde">'+brl(t.entregue)+'</td></tr>'+
      (t.cortado>0?'<tr><td>Cortado pela indústria</td><td class="v-terra">'+brl(t.cortado)+'</td></tr>':'')+
      (t.pendente>0?'<tr><td>Ainda vai vir</td><td class="v-ambar">'+brl(t.pendente)+'</td></tr>':'')+
      (t.cortado<=0&&t.pendente<=0?'<tr><td>Situação</td><td class="v-verde">completo</td></tr>':'')+
    '</table>'+
    '<div class="peq mt10">Conferido em '+dbr(String(ped.conferido).slice(0,10))+'. '+
    '<button class="bt bt-t" data-a="entregaFaltou" data-i="'+esc(ped.id)+'" style="min-height:32px;padding:0 6px">Refazer</button></div>'+
    '</div></div>';
}
ACOES.entregaCompleta = id => {
  const p = pedidoPorId(id); if(!p) return;
  p.itens.forEach(it=>{ it.qtdFat = it.qtd; delete it.falta; });
  p.conferido = new Date().toISOString(); gravar(); render(); aviso('Entrega conferida: veio tudo');
};
let CONF = null;
ACOES.entregaFaltou = id => {
  const p = pedidoPorId(id); if(!p) return;
  CONF = { id:id, itens: p.itens.map(it=>({ skuId:it.skuId, un:it.un, qtd:it.qtd, preco:it.preco,
           qtdFat:(it.qtdFat==null?it.qtd:it.qtdFat), falta:(it.falta||'cortado') })) };
  modal('O que faltou?', corpoConferencia(), '<button class="bt bt-p bt-bloco" data-a="salvarConferencia">Salvar conferência</button>');
};
function corpoConferencia(){
  let h = '<div class="peq" style="margin-bottom:10px">Mexa só no que veio diferente. Quantidade entregue por item:</div>';
  CONF.itens.forEach((it,i)=>{
    const pr = porId[it.skuId]; const nome = pr ? pr.nome : it.skuId;
    const faltou = it.qtdFat < it.qtd;
    h += '<div class="cartao" style="margin:0 0 8px"><div class="corpo" style="padding:10px 12px">'+
      '<div style="font-size:calc(13.5px * var(--esc));font-weight:650;line-height:1.3">'+esc(nome)+'</div>'+
      '<div class="peq">pedido: '+nm(it.qtd, it.qtd%1?1:0)+' '+esc(UN_CURTO[it.un]||it.un)+'</div>'+
      '<div class="dupla" style="margin-top:8px;align-items:center">'+
        '<div class="campo mb0"><label>Entregue</label><input type="text" inputmode="decimal" value="'+nm(it.qtdFat, it.qtdFat%1?2:0)+'" data-in="confQtd" data-i="'+i+'"></div>'+
        (faltou ? '<div class="chips" style="padding:18px 0 0">'+
          '<button class="chip '+(it.falta==='cortado'?'on':'')+'" data-a="confFalta" data-i="'+i+':cortado">Cortou</button>'+
          '<button class="chip '+(it.falta==='pendente'?'on':'')+'" data-a="confFalta" data-i="'+i+':pendente">Vem depois</button></div>' : '<div></div>')+
      '</div></div></div>';
  });
  return h;
}
ENTRADAS.confQtd = (v,i) => {
  if(!CONF) return; const it = CONF.itens[+i]; const q = pnum(v);
  it.qtdFat = Math.max(0, Math.min(isNaN(q)?it.qtd:q, it.qtd));
  const c = document.querySelector('#modal .corpom'); if(c){ const foco=document.activeElement&&document.activeElement.dataset.i; c.innerHTML = corpoConferencia(); if(foco!=null){ const n=c.querySelector('[data-in="confQtd"][data-i="'+foco+'"]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } } }
};
ACOES.confFalta = par => {
  if(!CONF) return; const [i,f] = String(par).split(':'); CONF.itens[+i].falta = f;
  const c = document.querySelector('#modal .corpom'); if(c) c.innerHTML = corpoConferencia();
};
ACOES.salvarConferencia = () => {
  if(!CONF) return; const p = pedidoPorId(CONF.id); if(!p) return;
  CONF.itens.forEach((ci,i)=>{ const it = p.itens[i]; if(!it) return;
    it.qtdFat = ci.qtdFat; if(ci.qtdFat < ci.qtd) it.falta = ci.falta; else delete it.falta; });
  p.conferido = new Date().toISOString(); CONF = null;
  gravar(); fechaModal(); render();
  const t = totais(p); aviso('Conferência salva'+(t.cortado>0?' · corte '+brl(t.cortado):''));
};
/* linhas do painel: so aparecem quando ha pedido conferido no periodo */
function linhasEntrega(P){
  const f = perFaixa(P);
  const peds = D.pedidos.filter(p=>VALE(p.status) && p.conferido && p.data>=f.ini && p.data<=f.fim);
  if(!peds.length) return '';
  let ent=0, cor=0, pen=0; peds.forEach(p=>{ const t=totais(p); ent+=t.entregue; cor+=t.cortado; pen+=t.pendente; });
  const aConf = D.pedidos.filter(p=>VALE(p.status) && precisaConferir(p) && p.data>=f.ini && p.data<=f.fim).length;
  return '<tr><td>Entregue (pedidos conferidos)</td><td class="v-verde">'+brl0(ent)+'</td></tr>'+
    (cor>0?'<tr><td>Corte da indústria</td><td class="v-terra">'+brl0(cor)+'</td></tr>':'')+
    (pen>0?'<tr><td>Ainda vai vir</td><td class="v-ambar">'+brl0(pen)+'</td></tr>':'')+
    (aConf?'<tr><td>Entregas a conferir</td><td class="v-ambar">'+aConf+'</td></tr>':'');
}

/* =====================================================

  const t = totais(ped);

  let h = '<div class="cartao" style="margin-bottom:12px"><div class="corpo" '+
    'style="display:flex;align-items:center;gap:12px">'+

      '<div class="peq" style="margin-top:3px">Pedido '+esc(ped.num)+' · '+t.itens+' iten'+(t.itens===1?'':'s')+

    h += '<div class="aviso" style="margin-bottom:10px;border-color:var(--verde)">'+ico('check')+
      '<span><b>E-mail enviado em '+horaCurta(u.quando)+'</b> para '+esc(u.para.join(', '))+(u.cc&&u.cc.length?' (cópia: '+esc(u.cc.join(', '))+')':'')+'.</span></div>';
  }
  h += '<button class="bt bt-v bt-bloco bt-alto" data-a="gmailEnviar" data-i="'+esc(ped.id)+'" data-v="industria">'+ico('email')+
    (ped.emails && ped.emails.some(e=>!e.paraCliente) ? 'ENVIAR DE NOVO POR E-MAIL' : 'ENVIAR POR E-MAIL')+'</button>'+
    '<div class="peq" style="margin:7px 3px 12px">'+
    (dInd.para.length
      ? 'Sai direto do Gmail, com PDF e planilha anexados e o pedido em tabela no corpo. Vai para <b>'+esc(dInd.para.join(', '))+'</b>'+
        (dInd.cc.length?', cópia para '+esc(dInd.cc.join(', ')):'')+'. Você confere antes de sair.'

  } else {
    h += '<div class="peq" style="margin:-2px 0 9px;padding:0 3px">O app abre o WhatsApp com '+
      'o texto pronto. O pedido só sai quando você tocar em enviar lá dentro.</div>';
  }
  h += '<div class="cartao">';
  if(!contatosDaMarca().length){
    h += '<div class="vazio">'+ico('pessoa')+'<p>Nenhum contato cadastrado</p>'+
      '<span>Cadastre em Ajustes quem recebe os pedidos na '+esc(nomeMarca())+' — nome, WhatsApp e e-mail. '+
      'Depois é um toque por pedido.</span>'+
      '<button class="bt bt-l" style="margin-top:14px" data-a="aba" data-i="ajustes">'+
      ico('mais')+'Cadastrar contato</button></div>';

      '<span class="info"><span class="nm">'+esc(c.nome)+'</span>'+

      (c.tel?'<button class="bt bt-v" style="min-height:44px;padding:0 15px;flex:0 0 auto" '+

      (c.email?'<button class="bt bt-l" style="min-height:44px;padding:0 15px;flex:0 0 auto" '+
        'data-a="enviarMail" data-i="'+esc(c.id)+'" data-v="'+esc(ped.id)+'" aria-label="E-mail para '+esc(c.nome)+'">'+ico('email')+'</button>':'')+

      ico('doc')+'Ver como fica</button>'+

/* Fechar: a venda existe a partir daqui. Vai direto para as vias,
   que é o que ele faz em seguida com o comprador ainda na frente. */
ACOES.fecharPedido = id => {
  const p = pedidoPorId(id); if(!p) return;
  if(!p.itens.length){ aviso('Coloque pelo menos um item antes de fechar.'); return; }
  p.status = 'Fechado';
  p.fechadoEm = new Date().toISOString();
  /* lembra o prazo usado com este cliente nesta industria (proximo pedido ja nasce com ele) */
  { const c = clienteDe(p); if(c && p.cond && !ehBonif(p) && p.marcaId){ c.condPorMarca = c.condPorMarca || {}; c.condPorMarca[p.marcaId] = p.cond; } }
  /* a data do pedido e o dia da emissao (quando fecha), nao o dia em que comecou a digitar.
     Revisao de pedido ja faturado mantem a data original: e o mesmo pedido, corrigido. */
  if(!(p.reaberturas||[]).length) p.data = hoje();
  if(D.rascunhoId===id) D.rascunhoId = null;
  gravar();
  VISTA = {t:'enviar', id:id}; window.scrollTo(0,0); render();

ACOES.reabrirFaturadoOk = id => {

}

  /* no iPhone o clique programatico com _blank e barrado como pop-up; mailto: e wa.me abrem

function copiar(txt){
  const ok = ()=>aviso('Texto copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, ()=>copiaVelha(txt,ok));
  } else copiaVelha(txt,ok);
}
function copiaVelha(txt, ok){
  const a = document.createElement('textarea');
  a.value = txt; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.focus(); a.select();
  try{ document.execCommand('copy'); ok(); }
  catch(e){ aviso('Não consegui copiar. Use "Ver o texto" e copie à mão.'); }
  a.remove();
}

/* =====================================================
   TELA: CLIENTES
   ===================================================== */
let bqClientes = '';
let fCliCanal = null;
let fCliSeg   = null;
/* Tipos de negocio sugeridos no cadastro. O Canal continua mandando na tabela de preco;
   o tipo e para ele saber quem e quem e para o Painel somar por tipo. Pode digitar outro. */
const SEGMENTOS = ['Padaria','Lanchonete','Cafeteria','Restaurante','Pizzaria','Bar','Hotel / Pousada',
  'Supermercado','Mercadinho','Mercearia','Hortifruti','Açougue','Conveniência','Empório / Delicatessen',
  'Distribuidor / Atacado','Cozinha industrial','Escola / Refeitório','Outro'];
function contarSegmentos(lista){
  const m = {};
  lista.forEach(c=>{ const k=(c.segmento||'').trim(); if(k) m[k]=(m[k]||0)+1; });
  return Object.keys(m).map(k=>({nome:k, n:m[k]})).sort((a,b)=>b.n-a.n || a.nome.localeCompare(b.nome,'pt-BR'));
}

function resumoCliente(id){
  const ps = D.pedidos.filter(p=>p.clienteId===id && VENDE(p));
  let total=0, cx=0, kg=0;
  ps.forEach(p=>{ const t=totais(p); total+=t.liquido; cx+=t.cx; kg+=t.kg; });
  const u = ultimaCompra(id);
  return { qtd:ps.length, total:total, cx:cx, kg:kg, ultima:u,
           dias: u?diasEntre(u,hoje()):null, ticket: ps.length?total/ps.length:0 };
}
/* Redes já digitadas, para ele escolher em vez de redigitar (e não escrever
   "Bramil" numa loja e "BRAMIL" na outra, que quebraria o agrupamento). */
/* "Bairro · Cidade" — o endereço curto que serve para montar rota. */
function regiao(c){
  return [c.bairro, c.cidade].filter(Boolean).join(' · ');
}
function bairrosCadastrados(){
  const vistos = {}, fora = [];
  D.clientes.forEach(c=>{
    const bR = (c.bairro||'').trim();
    if(!bR) return;
    const k = sac(bR);
    if(!vistos[k]){ vistos[k] = 1; fora.push(bR); }
  });
  return fora.sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function redesCadastradas(){
  const vistas = {}, fora = [];
  D.clientes.forEach(c=>{
    const r = (c.rede||'').trim();
    if(!r) return;
    const k = sac(r);
    if(!vistas[k]){ vistas[k] = r; fora.push(r); }
  });
  return fora.sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
/* Duas lojas da mesma rede podem estar escritas diferente; a chave é o texto
   sem acento e sem caixa. O nome mostrado é o primeiro que ele digitou. */
const chaveRede = r => sac(String(r||'').trim());

function cnpjBonito(v){
  const n = soN(v);
  if(n.length!==14) return v||'';
  return n.slice(0,2)+'.'+n.slice(2,5)+'.'+n.slice(5,8)+'/'+n.slice(8,12)+'-'+n.slice(12);
}

function telaClientes(){
  const q = sac(bqClientes).trim();
  let lista = D.clientes.slice();
  if(fCliCanal) lista = lista.filter(c=>c.canal===fCliCanal);
  if(fCliSeg)   lista = lista.filter(c=>(c.segmento||'')===fCliSeg);
  if(q) lista = lista.filter(c=>sac([c.razao,c.fantasia,c.loja,c.rede,c.bairro,c.cidade,c.cnpj,c.contato,c.segmento].join(' ')).indexOf(q)>-1);
  lista.sort((a,b)=>
    (a.rede||'\uffff').localeCompare(b.rede||'\uffff','pt-BR') ||
    nomeCli(a).localeCompare(nomeCli(b),'pt-BR'));

  let h = '<div class="busca" style="margin-bottom:9px">'+ico('busca')+
    '<input type="text" placeholder="Buscar cliente, cidade ou CNPJ" value="'+esc(bqClientes)+'" data-in="bqClientes">'+
    (bqClientes?'<button class="limpar" data-a="limpaClientes">'+ico('x')+'</button>':'')+'</div>';

  const nV = D.clientes.filter(c=>c.canal==='VAREJO').length;
  const nF = D.clientes.filter(c=>c.canal==='FOODSERVICE').length;
  h += '<div class="chips">'+
    '<button class="chip '+(!fCliCanal?'on':'')+'" data-a="setCliCanal" data-i="">Todos<span class="n">'+D.clientes.length+'</span></button>'+
    '<button class="chip '+(fCliCanal==='VAREJO'?'on':'')+'" data-a="setCliCanal" data-i="VAREJO">Varejo<span class="n">'+nV+'</span></button>'+
    '<button class="chip '+(fCliCanal==='FOODSERVICE'?'on':'')+'" data-a="setCliCanal" data-i="FOODSERVICE">Food Service<span class="n">'+nF+'</span></button>'+
    '</div>';

  /* segunda fila de filtros: o tipo de negocio (padaria, supermercado...), so quando alguem tem */
  const segs = contarSegmentos(D.clientes.filter(c=>!fCliCanal || c.canal===fCliCanal));
  if(segs.length){
    h += '<div class="chips" style="margin-top:-4px">'+
      '<button class="chip '+(!fCliSeg?'on':'')+'" data-a="setCliSeg" data-i="">Todos os tipos</button>'+
      segs.map(x=>'<button class="chip '+(fCliSeg===x.nome?'on':'')+'" data-a="setCliSeg" data-i="'+esc(x.nome)+'">'+
        esc(x.nome)+'<span class="n">'+x.n+'</span></button>').join('')+
      '</div>';
  }

  /* cadastrar novo fica no alto: com 200 clientes ninguem rola ate o fim para achar o botao */
  h += '<button class="bt bt-d bt-bloco" style="margin-bottom:10px" data-a="novoCliente">'+ico('mais')+'Novo cliente</button>';

  if(!D.clientes.length){
    h += '<div class="cartao"><div class="vazio">'+ico('clientes')+'<p>Sua carteira começa aqui</p>'+
      '<span>Cadastre os clientes uma vez. Depois é só escolher e o pedido sai em poucos toques.</span></div></div>';
  } else if(!lista.length){
    h += '<div class="cartao"><div class="vazio">'+ico('busca')+'<p>Nenhum cliente encontrado</p></div></div>';
  } else {
    h += '<div class="cartao">';
    lista.forEach(c=>{
      const r = resumoCliente(c.id);
      const frio = r.dias!==null && r.dias>=30;
      h += '<button class="lin" data-a="verCliente" data-i="'+c.id+'">'+
        '<span class="ini">'+esc(iniciais(c.fantasia||c.razao))+'</span>'+
        '<span class="info"><span class="nm">'+esc(nomeCli(c))+'</span>'+
        '<span class="sub">'+
          (c.rede?'<span class="et et-rede">'+esc(c.rede)+'</span>':'')+
          '<span class="et '+(c.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+CANAL_NOME[c.canal]+'</span>'+
          (c.segmento?'<span>'+esc(c.segmento)+'</span>':'')+
          (c.demo?'<span class="et et-ex">exemplo</span>':'')+
          (regiao(c)?'<span>'+esc(regiao(c))+'</span>':'')+
          (r.dias===null?'<span>nunca comprou</span>':
            frio?'<span class="et et-al">'+r.dias+' dias sem comprar</span>':'<span>há '+r.dias+' dia'+(r.dias===1?'':'s')+'</span>')+
        '</span></span>'+
        '<span class="dir">'+(r.total?'<span class="val">'+brl0(r.total)+'</span>':'')+'</span>'+
        '<span class="seta">'+ico('seta')+'</span></button>';
    });
    h += '</div>';
  }
  return h;
}

/* Pagamento como lista aberta: mostra todas as opcoes (o campo antigo filtrava pelo que
   estava digitado e escondia os prazos menores). "Outro..." abre um campo para digitar. */
function selectCond(valor, attrs){
  const v = valor||'';
  const ops = CONDS_PAGTO.slice(); if(v && ops.indexOf(v)<0) ops.unshift(v);
  return '<select '+attrs+'>'+
    '<option value=""'+(v?'':' selected')+'>— escolher —</option>'+
    ops.map(o=>'<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+
    '<option value="__outro">Outro… (digitar)</option></select>';
}
/* Tipo de negocio: lista fixa + o valor atual (se for um "outro" ja gravado) + "Outro... (digitar)" */
function selectSegmento(valor){
  const v = (valor||'').trim();
  const ops = SEGMENTOS.filter(x=>x!=='Outro'); if(v && ops.indexOf(v)<0) ops.push(v);
  return '<select id="f_segmento" data-ch="segSel">'+
    '<option value=""'+(v?'':' selected')+'>— escolher —</option>'+
    ops.map(o=>'<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+
    '<option value="__outro">Outro… (digitar)</option></select>';
}

/* ---- preenchimento automatico pelo CNPJ (BrasilAPI / Receita Federal) e pelo CEP (ViaCEP) ----
   Servicos publicos, sem chave, so leitura. So preenche campo vazio: o que o representante ja digitou fica.
   Offline, nao faz nada e ele digita normal. */
function tituloCaso(t){
  const peq = {de:1, da:1, do:1, das:1, dos:1, e:1};
  const fix = {ltda:'Ltda', me:'ME', epp:'EPP', eireli:'EIRELI', sa:'S/A', 's/a':'S/A', 's.a.':'S.A.', ei:'EI', slu:'SLU', cia:'Cia', 'cia.':'Cia.'};
  return String(t||'').trim().toLowerCase().split(/\s+/).map((w,i)=>{
    if(fix[w]) return fix[w];
    if(peq[w] && i>0) return w;
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(' ').replace(/S A/g, 'S/A');
}
/* Atividade principal (CNAE) -> tipo de negocio e canal sugeridos. Sugestao: ele confirma ou troca. */
function sugestaoPorCnae(cod, nome){
  const c = String(cod||'').replace(/\D/g,''); const nm = sac(nome||'');
  const T = (tipo, canal) => ({tipo:tipo, canal:canal||''});
  if(/^47113/.test(c)) return T('Supermercado','VAREJO');
  if(/^47121/.test(c)) return T(/conveni/.test(nm) ? 'Conveniência' : 'Mercadinho','VAREJO');
  if(/^4721102/.test(c) || /^10911/.test(c) || /^10912/.test(c)) return T('Padaria','VAREJO');
  if(/^47211/.test(c)) return T('Mercearia','VAREJO');
  if(/^47229/.test(c)) return T('Açougue','VAREJO');
  if(/^47245/.test(c)) return T('Hortifruti','VAREJO');
  if(/^47296/.test(c)) return T('Empório / Delicatessen','VAREJO');
  if(/^47318/.test(c)) return T('Conveniência','VAREJO');

let CNPJ_BUSCANDO = '';
async function buscarCnpj(){
  const n = el('f_cnpj'); if(!n) return;
  const cnpj = soN(n.value);
  if(cnpj.length !== 14){ if(cnpj.length) cnpjStatus('CNPJ incompleto: são 14 números.', 'var(--terracota)'); return; }
  if(!cnpjValido(cnpj)){ cnpjStatus('Este CNPJ não bate (dígito verificador). Confira.', 'var(--terracota)'); return; }
  n.value = cnpjBonito(cnpj);
  if(!navigator.onLine){ cnpjStatus('Sem internet agora: preencha à mão.', 'var(--terracota)'); return; }
  if(CNPJ_BUSCANDO === cnpj) return; CNPJ_BUSCANDO = cnpj;
  cnpjStatus('Buscando na Receita…');
  try{
    const r = await fetch('https://brasilapi.com.br/api/cnpj/v1/'+cnpj, {cache:'no-store'});
    if(r.status === 404){ cnpjStatus('CNPJ não encontrado na Receita. Preencha à mão.', 'var(--terracota)'); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    let n_ = 0;
    if(preencheSeVazio('razao', tituloCaso(d.razao_social))) n_++;
    if(preencheSeVazio('fantasia', tituloCaso(d.nome_fantasia))) n_++;
    const end = [d.descricao_tipo_de_logradouro, d.logradouro].filter(Boolean).join(' ') + (d.numero ? ', '+d.numero : '') + (d.complemento ? ' '+tituloCaso(d.complemento) : '');
    if(preencheSeVazio('endereco', tituloCaso(end))) n_++;
    if(preencheSeVazio('bairro', tituloCaso(d.bairro))) n_++;
    if(preencheSeVazio('cidade', tituloCaso(d.municipio))) n_++;
    if(preencheSeVazio('cep', d.cep ? cepBonito(String(d.cep)) : '')) n_++;
    const tel = soN(d.ddd_telefone_1||'');
    if(tel.length>=10){ const alvo = tel.length===11 && /^[6-9]/.test(tel.slice(2)) ? 'whats' : 'fone'; if(preencheSeVazio(alvo, telBonito(tel))) n_++; }
    if(preencheSeVazio('email', String(d.email||'').toLowerCase())) n_++;
    const reg = el('f_regime');
    if(reg && !reg.value){ if(d.opcao_pelo_mei) reg.value = 'MEI'; else if(d.opcao_pelo_simples) reg.value = 'Simples Nacional'; if(reg.value) n_++; }
    /* tipo de negocio e canal pela atividade (CNAE principal; se nao reconhecer, tenta as secundarias) */
    let sug = sugestaoPorCnae(d.cnae_fiscal, (d.razao_social||'')+' '+(d.nome_fantasia||''));
    if(!sug) (d.cnaes_secundarios||[]).some(x=>{ sug = sugestaoPorCnae(x.codigo, d.razao_social); return !!sug; });
    let sugTxt = '';
    if(sug){
      const seg = el('f_segmento');
      if(seg && !seg.value){
        if(![...seg.options].some(o=>o.value===sug.tipo)){ const o=document.createElement('option'); o.value=sug.tipo; o.textContent=sug.tipo; seg.insertBefore(o, seg.lastElementChild); }
        seg.value = sug.tipo; n_++; sugTxt = ' Pela atividade da empresa, sugeri tipo '+sug.tipo;
      }
      const can = el('f_canal');
      if(can && sug.canal && !VISTA.id && !can.dataset.tocado){ can.value = sug.canal; sugTxt += ' · canal '+(sug.canal==='FOODSERVICE'?'Food Service':'Varejo'); }
    }
    const sit = String(d.descricao_situacao_cadastral||'').toUpperCase();
    if(sit && sit !== 'ATIVA'){
      cnpjStatus('Atenção: na Receita este CNPJ está "'+sit+'". Preenchi '+n_+' campo(s).'+sugTxt+' Confira com o cliente antes de vender.', 'var(--terracota)');
      aviso('CNPJ '+sit.toLowerCase()+' na Receita. Confira.');
    } else {
      cnpjStatus('Dados da Receita preenchidos ('+n_+' campo'+(n_===1?'':'s')+').'+sugTxt+' Confira com o cliente e complete inscrição estadual e contato.', 'var(--verde)');
      aviso(n_ ? 'Dados da Receita preenchidos — confira.' : 'Receita encontrada; os campos já estavam preenchidos.');
    }
  }catch(e){ cnpjStatus('Não consegui consultar a Receita agora ('+(e.message||'erro')+'). Preencha à mão.', 'var(--terracota)'); }
  finally{ CNPJ_BUSCANDO = ''; }
}
function cnpjValido(c){
  if(!/^\d{14}$/.test(c) || /^(\d)\1+$/.test(c)) return false;
  const calc = (base, pesos) => { let sm = 0; for(let i=0;i<pesos.length;i++) sm += +base[i]*pesos[i]; const r = sm % 11; return r < 2 ? 0 : 11 - r; };
  const d1 = calc(c, [5,4,3,2,9,8,7,6,5,4,3,2]); const d2 = calc(c, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
  return +c[12]===d1 && +c[13]===d2;
}
ENTRADAS.cnpjBusca = () => { buscarCnpj(); };

let mesPainel = hoje().slice(0,7);

function ehUtil(dt){
  const d = dia(dt).getDay();               // 0 dom ... 6 sáb
  if(D.cfg.diasUteis==='seg-sab') return d>=1 && d<=6;
  if(D.cfg.diasUteis==='todos')   return true;
  return d>=1 && d<=5;
}
function diasDoMes(ym){
  const [a,m] = ym.split('-').map(Number);
  const n = new Date(a, m, 0).getDate();
  const out = [];
  for(let i=1;i<=n;i++) out.push(ym+'-'+String(i).padStart(2,'0'));
  return out;
}
function mesBonito(ym){
  const [a,m] = ym.split('-').map(Number);
  return MES_NOME[m-1] + ' de ' + a;
}
function mesVizinho(ym, passo){
  let [a,m] = ym.split('-').map(Number);
  m += passo;
  if(m<1){ m=12; a--; } if(m>12){ m=1; a++; }
  return a+'-'+String(m).padStart(2,'0');
}

/* O painel trabalha sempre com um PERÍODO. Mês é o normal — é como ele
   pensa e como a meta é definida — mas dá para abrir uma faixa de datas
   qualquer sem que o resto da tela precise saber a diferença. */
let PER = {tipo:'mes', ym:hoje().slice(0,7)};

function somaDias(d, n){
  const x = dia(d); x.setDate(x.getDate()+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+
         String(x.getDate()).padStart(2,'0');
}
function perFaixa(P){
  if(P.tipo==='mes'){ const d = diasDoMes(P.ym); return {ini:d[0], fim:d[d.length-1]}; }
  return {ini:P.ini, fim:P.fim};
}
function perDias(P){
  const f = perFaixa(P), out = [];
  let d = f.ini;
  while(d <= f.fim){ out.push(d); d = somaDias(d,1); }
  return out;
}
/* O período de comparação: o mês anterior, ou a mesma quantidade de dias
   imediatamente antes. É o que dá sentido às setas de variação. */
function perAnt(P){
  if(P.tipo==='mes') return {tipo:'mes', ym:mesVizinho(P.ym,-1)};
  const f = perFaixa(P), n = diasEntre(f.ini, f.fim) + 1;
  const fim = somaDias(f.ini, -1);
  return {tipo:'faixa', ini:somaDias(fim, -(n-1)), fim:fim};
}
function perRot(P){
  if(P.tipo==='mes') return mesBonito(P.ym);
  const f = perFaixa(P);
  if(f.ini===f.fim) return dbr(f.ini);
  const mesmoAno = f.ini.slice(0,4)===f.fim.slice(0,4);
  return (mesmoAno ? dbr(f.ini).slice(0,5) : dbr(f.ini)) + ' a ' + dbr(f.fim);
}
function perCurto(P){
  return P.tipo==='mes' ? mesBonito(P.ym).split(' de ')[0] : 'o período anterior';
}

function dadosPer(P){
  const f = perFaixa(P);
  const peds = pedidosValidos().filter(p=>p.data>=f.ini && p.data<=f.fim);
  const dias = perDias(P);
  const porDia = {}; dias.forEach(d=>porDia[d]=0);
  let total=0, cx=0, kg=0;
  const clientes = {}, prods = {}, cliVal = {};
  peds.forEach(p=>{
    const t = totais(p);
    total += t.liquido; cx += t.cx; kg += t.kg;
    if(porDia[p.data]!==undefined) porDia[p.data] += t.liquido;
    if(p.clienteId){
      clientes[p.clienteId] = true;
      cliVal[p.clienteId] = (cliVal[p.clienteId]||0) + t.liquido;
    }
    const fator = t.bruto>0 ? t.liquido/t.bruto : 1;
    (p.itens||[]).forEach(it=>{
      const k = it.skuId;
      if(!prods[k]) prods[k] = {nome:it.nome, cod:it.cod, val:0, cx:0};
      prods[k].val += it.preco*it.qtd*fator;
      prods[k].cx  += caixasEquiv(porId[it.skuId], it.un, it.qtd);
    });
  });
  /* bonificacoes do periodo: investimento, fora do faturamento */
  const bon = pedidosBonif().filter(p=>p.data>=f.ini && p.data<=f.fim);
  let bonTotal = 0; bon.forEach(p=>{ bonTotal += totais(p).liquido; });
  const porCanal = {VAREJO:0, FOODSERVICE:0};
  const porSeg = {};
  peds.forEach(p=>{
    const c = clientePorId(p.clienteId);
    const v = totais(p).liquido;
    if(c && porCanal[c.canal] !== undefined) porCanal[c.canal] += v;
    /* por tipo de negocio: quem nao tem tipo entra como "Sem tipo", para a conta fechar */
    const k = (c && c.segmento && c.segmento.trim()) || 'Sem tipo';
    if(!porSeg[k]) porSeg[k] = {nome:k, val:0, n:0, cli:{}};
    porSeg[k].val += v; porSeg[k].n += 1; if(c) porSeg[k].cli[c.id] = 1;
  });
  const porSegmento = Object.keys(porSeg).map(k=>porSeg[k])
    .map(x=>({nome:x.nome, val:x.val, n:x.n, clientes:Object.keys(x.cli).length}))
    .sort((a,b)=>b.val-a.val);

  const hj = hoje();
  const ehMesAtual = hj>=f.ini && hj<=f.fim;
  const uteisTotal = dias.filter(ehUtil).length;
  const uteisAte   = ehMesAtual ? dias.filter(d=>d<=hj && ehUtil(d)).length : uteisTotal;
  const uteisFalta = Math.max(0, uteisTotal - uteisAte);

  return {
    P:P, ini:f.ini, fim:f.fim, ym:(P.tipo==='mes'?P.ym:f.ini.slice(0,7)),
    peds:peds, dias:dias, porDia:porDia, total:total, cx:cx, kg:kg,
    nClientes:Object.keys(clientes).length,
    ticket: peds.length ? total/peds.length : 0,
    nPedidos: peds.length,
    hojeVal: porDia[hj]||0,
    ehMesAtual:ehMesAtual, uteisTotal:uteisTotal, uteisAte:uteisAte, uteisFalta:uteisFalta,
    topProd: Object.keys(prods).map(k=>prods[k]).sort((a,b)=>b.val-a.val).slice(0,5),
    topCli: Object.keys(cliVal).map(k=>({id:k, val:cliVal[k]})).sort((a,b)=>b.val-a.val).slice(0,5),
    porCanal: porCanal,
    porSegmento: porSegmento,
    bonif: bonTotal, nBonif: bon.length,
    quemComprou: clientes
  };
}

/* Quem comprou no mês passado e ainda não comprou neste. É a lista que
   salva faturamento antes de virar cliente inativo. */
function sumiramNoPer(P){
  const a = perFaixa(P), b = perFaixa(perAnt(P));
  const compraramAntes = {}, compraramAgora = {};
  pedidosValidos().forEach(p=>{
    if(!p.clienteId) return;
    if(p.data>=b.ini && p.data<=b.fim)
      compraramAntes[p.clienteId] = (compraramAntes[p.clienteId]||0) + totais(p).liquido;
    if(p.data>=a.ini && p.data<=a.fim) compraramAgora[p.clienteId] = true;
  });
  return Object.keys(compraramAntes)
    .filter(id => !compraramAgora[id] && clientePorId(id))
    .map(id => ({ c: clientePorId(id), valor: compraramAntes[id] }))
    .sort((a,b)=>b.valor-a.valor);
}

function variacao(atual, antes){
  if(!antes) return null;
  return (atual/antes - 1) * 100;
}
function setinha(v){
  if(v === null) return '';
  const sobe = v >= 0;
  return '<span class="var '+(sobe?'v-verde':'v-terra')+'">'+(sobe?'▲':'▼')+' '+
         nm(Math.abs(v), Math.abs(v)<10?1:0)+'%</span>';
}

function cor(r){ return r>=1 ? 'verde' : r>=0.85 ? 'ambar' : 'terra'; }

function graficoMes(m){
  const dias = m.dias, n = dias.length;
  const W = 340, H = 150, x0 = 8, x1 = 332, yTopo = 12, yBase = 120;
  const larg = (x1-x0)/n;
  const bw = Math.max(3, larg*0.62);
  let max = 0; dias.forEach(d=>{ if(m.porDia[d]>max) max = m.porDia[d]; });
  const metaDia = (D.cfg.metaMes>0 && m.uteisTotal) ? D.cfg.metaMes/m.uteisTotal : 0;
  if(metaDia>max) max = metaDia;
  if(max<=0) max = 1;
  const y = v => yBase - (v/max)*(yBase-yTopo);
  const hj = hoje();

  let barras = '';
  dias.forEach((d,i)=>{
    const v = m.porDia[d];
    const cx = x0 + larg*i + larg/2;
    if(v>0){
      const alt = Math.max(2, yBase - y(v));
      barras += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(yBase-alt).toFixed(1)+
        '" width="'+bw.toFixed(1)+'" height="'+alt.toFixed(1)+'" rx="'+Math.min(2,bw/2).toFixed(1)+
        '" fill="'+(d===hj?'#33302E':'#F2A900')+'"/>';
    } else if(d<=hj || !m.ehMesAtual){
      barras += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(yBase-2)+'" width="'+bw.toFixed(1)+
        '" height="2" rx="1" fill="#E6E0D8"/>';
    }
  });

  let rotulos = '';
  const mostraUltimo = (n%5!==0) && (n - Math.floor(n/5)*5 >= 3);
  dias.forEach((d,i)=>{
    const num = i+1;
    if(num===1 || num%5===0 || (num===n && mostraUltimo)){
      rotulos += '<text x="'+(x0+larg*i+larg/2).toFixed(1)+'" y="136" text-anchor="middle" '+
        'font-size="9" fill="#8A8A8A" font-family="system-ui,sans-serif">'+num+'</text>';
    }
  });

  const metaLinha = metaDia>0 ?
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+y(metaDia).toFixed(1)+'" y2="'+y(metaDia).toFixed(1)+
    '" stroke="#8A3324" stroke-width="1.2" stroke-dasharray="4 3" opacity=".75"/>' : '';

  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" '+
    'aria-label="Venda por dia em '+mesBonito(m.ym)+'">'+
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+yBase+'" y2="'+yBase+'" stroke="#E6E0D8" stroke-width="1"/>'+
    metaLinha + barras + rotulos + '</svg>';
}

   SIMULADOR DE MARGEM — para a negociação na hora
   Custo (o que o cliente paga), margem, markup, preço de venda e
   lucro. Mexeu num, os outros seguem. A conta âncora é custo + margem:
   margem  = lucro / venda        (sobre o preço de venda)
   markup  = lucro / custo        (sobre o custo)
   ===================================================== */
/* =====================================================
   TABELAS E CONTRATOS (simulação)
   Cliente pede contrato de X% sobre a nota. Para o representante continuar
   recebendo o mesmo, a tabela dele sobe: preço ÷ (1 - X%), arredondado
   PARA CIMA no centavo. Ex.: 10,00 com 5% -> 10 / 0,95 = 10,5263 -> 10,53.
   ===================================================== */
function precoContrato(preco, pct){
  const p = Number(preco)||0, c = Number(pct)||0;
  if(c<=0 || c>=100) return Math.round(p*100)/100;
  return Math.ceil(p/(1-c/100)*100 - 1e-9)/100;
}
/* Contrato do cliente em CADA industria: pode ter 5% na Harus e nenhum na Coffee.
   Antigo (tabelaId) vale para a primeira industria (Harus). */
function tabelaIdDoCliente(cli, mk){
  if(!cli) return '';
  mk = mk || marcaAtual() || {};
  if(cli.tabelaPorMarca && Object.prototype.hasOwnProperty.call(cli.tabelaPorMarca, mk.id)) return cli.tabelaPorMarca[mk.id] || '';
  return (D.cfg.marcas[0] && mk.id===D.cfg.marcas[0].id) ? (cli.tabelaId||'') : '';
}
function tabelaDoCliente(cli, mk){
  const id = tabelaIdDoCliente(cli, mk);
  if(!id || !Array.isArray(D.cfg.tabelas)) return null;
  return D.cfg.tabelas.find(t=>t.id===id) || null;
}

function pdfDaTabela(t){
  const A4L = 595.28, A4A = 841.89, M = 38;
  const paginas = []; const recursos = {};
  const mk = marcaAtual();
  let pg, y, grupo = null, food = false;
  /* colunas: Varejo = cod, produto, caixa, R$ caixa, R$ pacote.
     Food Service = + R$ unidade (dentro do pacote) e R$ kg, que e como o cozinheiro compara. */
  const X_NOME = M+46;
  const col = () => food
    ? { caixa:M+218, pcx:A4L-M-152, ppct:A4L-M-102, pun:A4L-M-52, pkg:A4L-M-4, larg:M+218-X_NOME-8 }
    : { caixa:M+312, pcx:A4L-M-68,  ppct:A4L-M-4,   pun:0,        pkg:0,       larg:M+312-X_NOME-8 };
  const cabColunas = () => {
    const c = col();
    pg.ret(M, y-11, A4L-2*M, 16, GRAFITE_PDF);
    pg.txt(M+5, y, 'CÓD.', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(X_NOME, y, 'PRODUTO', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(c.caixa, y, 'CAIXA', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(c.pcx, y, 'R$ CAIXA', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(c.ppct, y, 'R$ PACOTE', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    if(food){ pg.txt(c.pun, y, 'R$ UNID.', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
              pg.txt(c.pkg, y, 'R$ KG', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'}); }
    y += 14;
  };
  const novaPagina = () => {
    pg = NovaPagina(A4L, A4A); paginas.push(pg); y = M;
    cabecalhoMarcaPdf(pg, recursos, M, y, 'Tabela de preços');
    if(logoDaMarca()) y += 12;
    pg.txt(A4L-M, y+12, dbr(hoje()), {tam:9, cor:CINZA_PDF, align:'r'});
    pg.txt(A4L-M, y+26, t.nome, {tam:10, negrito:true, cor:GRAFITE_PDF, align:'r'});
    y += 40; pg.linha(M, y, A4L-M, y, 2, GRAFITE_PDF); y += 16;
    /* na primeira pagina o cabecalho das colunas vem junto com a primeira secao; nas seguintes, repete */
    if(grupo){ pg.txt(M+5, y-2, grupo+' (continuação)', {tam:8, negrito:true, cor:CINZA_PDF}); y += 12; cabColunas(); }
  };
  novaPagina();
  let cat = null, zebra = 0;
  linhasTabela(t).forEach(l=>{
    if(y > A4A - M - 30) novaPagina();
    if(l.grupo !== grupo){
      grupo = l.grupo; food = l.food; cat = null;
      if(y > A4A - M - 74) { novaPagina(); }
      else {
        y += 6; pg.ret(M, y-9, A4L-2*M, 15, LINHA_PDF);
        pg.txt(M+5, y+1, grupo, {tam:8.5, negrito:true, cor:GRAFITE_PDF}); y += 18;
        cabColunas();
      }
    }
    if(l.categoria !== cat){
      cat = l.categoria;
      if(y > A4A - M - 44) novaPagina();
      y += 3; pg.txt(M+5, y, cat.toUpperCase(), {tam:7.5, negrito:true, cor:CINZA_PDF}); y += 12;
    }
    const c = col();
    const nomeL = quebrarLinhas(l.nome, c.larg, 8.5, false);
    const alt = Math.max(1, nomeL.length)*10 + 5;
    if(zebra%2===0) pg.ret(M, y-8, A4L-2*M, alt, CREME_PDF);
    pg.txt(M+5, y, l.cod, {tam:8, cor:GRAFITE_PDF});
    nomeL.forEach((ln,k)=>pg.txt(X_NOME, y+k*10, ln, {tam:8.5, negrito:k===0, cor:GRAFITE_PDF}));
    pg.txt(c.caixa, y, l.caixa, {tam:7, cor:CINZA_PDF});
    if(food && l.unTxt) pg.txt(c.caixa, y+9, l.unTxt, {tam:6.5, cor:CINZA_PDF});
    pg.txt(c.pcx, y, brl(l.pCaixa), {tam:8.5, negrito:true, cor:GRAFITE_PDF, align:'r'});
    if(l.pPacote) pg.txt(c.ppct, y, brl(l.pPacote), {tam:8.5, cor:GRAFITE_PDF, align:'r'});
    if(food){
      if(l.pUn) pg.txt(c.pun, y, brl(l.pUn), {tam:8.5, cor:GRAFITE_PDF, align:'r'});
      if(l.pKg) pg.txt(c.pkg, y, brl(l.pKg), {tam:8.5, cor:GRAFITE_PDF, align:'r'});
    }
    y += Math.max(alt, (food && l.unTxt) ? 19 : 0); zebra++;
  });
  y += 14; pg.linha(M, y, A4L-M, y, 0.5, LINHA_PDF); y += 14;
  const rep = [D.cfg.repNome, D.cfg.repTel?telBonito(D.cfg.repTel):'', D.cfg.repEmail].filter(Boolean).join('  ·  ');
  pg.txt(M, y, 'Representante: '+rep+'  ·  Preços por caixa fechada, sujeitos a confirmação no pedido.', {tam:8, cor:CINZA_PDF});
  return montarPdf(paginas, recursos);
}
function xlsxDaTabela(t){

  let g = null;

  });
  return xlsxDe('Tabela', L, [9, 13, 18, 9, 44, 20, 10, 12, 12, 12, 10]);
}
function textoTabela(t){

const MG = { vista:'margem', modo:'custo', ultimo:'custo', custo:10, venda:14.29, margem:30, rotulo:'', opcoes:null, voltarPedido:false, modal:false, item:null, busca:'' };
/* dois caminhos: 'custo' (custo + margem -> preço de venda) ou 'venda' (preço de venda + margem -> custo) */
function mgCalc(){
  const m = Math.min(Math.max(Number(MG.margem)||0, -900), 99.99);
  let c, v;
  if(MG.modo==='venda'){ v = Math.max(0, Number(MG.venda)||0); c = v*(1-m/100); }
  else { c = Math.max(0, Number(MG.custo)||0); v = c/(1-m/100); }
  return { custo:c, margem:m, markup: m/(100-m)*100, venda:v, lucro:v-c };
}
function mgFmt(campo, r){
  if(campo==='custo' || campo==='venda' || campo==='lucro') return vlr(r[campo]);
  return nm(r[campo], 2);
}
function mgTexto(){
  return MG.modo==='venda'
    ? 'o <b>preço de venda está travado</b> — mexendo na margem, muda o custo que você precisa fazer.'
    : 'o <b>custo está travado</b> — mexendo na margem, muda o preço de venda.';
}

function mgListaHTML(){
  const q = sac(MG.busca).trim(); if(!q || !CAT.length) return '';
  const lista = CAT.filter(p=>(p.busca||sac(p.nome+' '+p.cod)).indexOf(q)>-1).slice(0,6);
  if(!lista.length) return '<div class="peq" style="padding:6px 2px">Nada encontrado.</div>';
  return lista.map(p=>'<button class="lin" data-a="mgProduto" data-i="'+esc(p.id)+'" style="padding:9px 4px">'+
    '<span class="info"><span class="nm">'+esc(p.nome)+'</span><span class="sub"><span class="et et-cod">'+esc(p.cod)+'</span>'+
    '<span class="et '+(p.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+CANAL_NOME[p.canal]+'</span></span></span>'+
    '<span class="dir"><span class="val">'+brl(p.pCaixa)+'</span></span></button>').join('');
}

  return '<div class="chips" style="padding-bottom:8px">'+
    '<button class="chip '+(MG.vista!=='tabelas'?'on':'')+'" data-a="mgVista" data-i="margem">Margem do cliente</button>'+
    '<button class="chip '+(MG.vista==='tabelas'?'on':'')+'" data-a="mgVista" data-i="tabelas">Tabelas e contratos</button></div>';
}
ACOES.mgVista = v => { MG.vista = v==='tabelas' ? 'tabelas' : 'margem'; window.scrollTo(0,0); render(); };
function painelMargem(){
  if(!MG.modal && MG.vista==='tabelas') return chipsVistaMargem() + painelTabelas();
  const r = mgCalc(); const pv = MG.modo==='venda';
  /* ao tocar, o campo ja seleciona o numero: e so digitar por cima */
  const linha = (id, rot, un, cor) =>
    '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha)">'+
      '<i style="width:4px;align-self:stretch;border-radius:2px;background:'+(cor||'transparent')+'"></i>'+
      '<label for="mg_'+id+'" style="flex:1;font-size:calc(14px * var(--esc));color:var(--grafite2);font-weight:600">'+rot+'</label>'+
      '<input type="text" inputmode="decimal" id="mg_'+id+'" data-in="mg" data-i="'+id+'" value="'+mgFmt(id,r)+'" '+
        'onfocus="this.select()" onclick="this.select()" class="'+(id===MG.modo?'mg-anc':'')+'" '+
        'style="width:128px;text-align:right;font-size:calc(21px * var(--esc));font-weight:750;font-variant-numeric:tabular-nums;padding:6px 8px">'+
      '<span style="width:26px;font-size:calc(12px * var(--esc));color:var(--cinza);font-weight:600">'+un+'</span>'+
    '</div>';
  const ordem = ['custo','margem','markup','venda','lucro'];
  const rot = { custo:'Custo (o que ele paga)', margem:'Margem de lucro', markup:'Markup', venda:'Preço de venda', lucro:'Lucro' };
  const un  = { custo:'R$', venda:'R$', lucro:'R$', margem:'%', markup:'%' };
  const cor = { custo: pv?'var(--verde)':'', venda: pv?'':'var(--verde)', margem:'var(--dourado)', markup:'var(--verde)', lucro:'var(--verde)' };

  let h = (MG.modal ? '' : chipsVistaMargem()) + '<div class="chips" style="padding-bottom:8px">'+
    '<button class="chip '+(!pv?'on':'')+'" data-a="mgModo" data-i="custo">Travar o custo</button>'+
    '<button class="chip '+(pv?'on':'')+'" data-a="mgModo" data-i="venda">Travar o preço de venda</button></div>';
  h += '<div class="cartao"><div class="corpo">'+
    '<div class="peq" style="margin-bottom:6px">'+
      'O app segue o que você digitou por último: <span id="mg_txt">'+mgTexto()+'</span>'+
      (MG.rotulo?'<br><b>'+esc(MG.rotulo)+'</b>':'')+'</div>'+
    ordem.map(k=>linha(k, rot[k], un[k], cor[k])).join('')+
    '<div class="chips" style="padding:12px 0 0">'+
      [15,20,25,30,35,40,50].map(v=>'<button class="chip '+(Math.abs(r.margem-v)<0.005?'on':'')+'" data-a="mgMargem" data-i="'+v+'">'+v+'%</button>').join('')+
    '</div>'+
  '</div></div>';
  if(MG.opcoes && MG.opcoes.length){
    h += '<div class="secao">Custo pelo seu preço</div><div class="cartao"><div class="corpo">'+
      '<div class="peq" style="margin-bottom:8px">Toque para usar como custo o que o cliente paga por caixa, pacote ou unidade.</div>'+
      '<div class="chips chips-quebra" style="padding-bottom:0">'+
      MG.opcoes.map(o=>'<button class="chip '+(!pv && Math.abs(r.custo-o.v)<0.005?'on':'')+'" data-a="mgCusto" data-i="'+o.v+'">'+esc(o.rot)+' '+brl(o.v)+'</button>').join('')+
      '</div></div></div>';
  }
  if(CAT.length){
    h += '<div class="secao">Custo pelo preço de tabela</div><div class="cartao"><div class="corpo">'+
      '<div class="busca" style="margin-bottom:6px">'+ico('busca')+
        '<input type="text" placeholder="Buscar produto ou código" value="'+esc(MG.busca)+'" data-in="mgBusca" autocomplete="off" autocorrect="off" spellcheck="false"></div>'+
      '<div id="mg_lista">'+mgListaHTML()+'</div>'+
      '<div class="peq" style="margin-top:6px">Toque no produto: o custo vira o preço de tabela por pacote, com opção de caixa e unidade.</div>'+
      '</div></div>';
  }
  h += '<div class="cartao"><div class="corpo">'+
    '<div class="peq"><b>Margem</b> é sobre o preço de venda; <b>markup</b> é sobre o custo. '+
    'Com custo '+brl(r.custo)+' e venda '+brl(r.venda)+', ele fica com '+brl(r.lucro)+' por unidade: '+
    nm(r.margem,1)+'% de margem, '+nm(r.markup,1)+'% de markup. Mercado costuma falar em margem; padaria e lanchonete, em markup.</div>'+
    '</div></div>';
  if(MG.modal) return h;
  if(MG.voltarPedido)
    h += '<button class="bt bt-p bt-bloco" style="margin-top:4px" data-a="mgVoltarPedido">'+ico('volta')+'Voltar ao pedido</button>';
  h += '<button class="bt bt-t bt-bloco mt10" data-a="mgLimpar">Limpar</button>';
  return h;
}
/* Janela por cima do pedido: ele faz a conta na frente do cliente e volta para onde estava */
function abrirMargemModal(){
  MG.modal = true;
  modal('Margem do cliente', painelMargem(),
    (MG.item!=null ? '<button class="bt bt-l bt-bloco" data-a="editarPreco" data-i="'+MG.item+'">'+ico('editar')+'Voltar ao preço do item</button>' : '')+
    '<div class="linha-bt mt10"><button class="bt bt-t" data-a="mgLimpar">Limpar</button>'+
    '<button class="bt bt-p" data-a="fechaModal">'+ico('check')+'Voltar ao pedido</button></div>',
    ()=>{ MG.modal = false; });
  setTimeout(()=>{ const n=el(MG.modo==='venda'?'mg_venda':'mg_custo'); if(n && !MG.opcoes){ n.focus(); n.select(); } }, 150);
}
ACOES.abrirMargem = () => { MG.item = null; MG.rotulo=''; MG.opcoes=null; MG.busca=''; abrirMargemModal(); };
function mgPintar(exceto){
  const r = mgCalc();
  ['custo','margem','markup','venda','lucro'].forEach(k=>{
    if(k===exceto) return;
    const n = el('mg_'+k); if(n) n.value = mgFmt(k, r);
  });
  document.querySelectorAll('[data-a="mgMargem"]').forEach(b=>b.classList.toggle('on', Math.abs(r.margem-Number(b.dataset.i))<0.005));
  document.querySelectorAll('[data-a="mgModo"]').forEach(b=>b.classList.toggle('on', b.dataset.i===MG.modo));
  ['custo','venda'].forEach(k=>{ const n=el('mg_'+k); if(n) n.classList.toggle('mg-anc', k===MG.modo); });
  const tx = el('mg_txt'); if(tx) tx.innerHTML = mgTexto();
  document.querySelectorAll('[data-a="mgCusto"]').forEach(b=>b.classList.toggle('on', MG.modo!=='venda' && Math.abs(r.custo-Number(b.dataset.i))<0.005));
}
/* Mesa de negociacao: o ultimo valor em R$ que ele digitou (custo ou venda) fica travado.
   Digitou venda e depois margem -> muda o custo. Digitou custo e depois margem -> muda a venda.
   Digitou custo e venda em seguida -> os dois ficam e a margem e calculada. */
/* Regra da mesa de negociacao:
   - quem digita custo ou venda: o valor digitado vale. Se o OUTRO valor tambem foi digitado por ele
     (nao calculado), esse outro fica parado e a margem e que muda. Se o outro era calculado, a margem
     fica e o outro e recalculado.
   - quem digita margem/markup/lucro: o ultimo valor digitado (custo ou venda) fica travado e o outro muda.
   MG.digitado marca o que foi digitado pela pessoa; o que o app calculou nao conta. */
ENTRADAS.mg = (v, campo) => {
  const x = pnum(v); const r = mgCalc();
  MG.digitado = MG.digitado || {custo:true, venda:false};
  if(campo==='custo'){
    MG.custo = x;
    if(MG.digitado.venda && MG.venda>0){ MG.margem = (MG.venda-x)/MG.venda*100; }   /* venda digitada fica; margem muda */
    else { MG.venda = r.venda; MG.digitado.venda = false; }                          /* margem fica; venda recalcula */
    MG.digitado.custo = true; MG.modo = 'custo'; MG.ultimo = 'custo';
  } else if(campo==='venda'){
    MG.venda = x;
    if(MG.digitado.custo && MG.custo>0 && x>0){ MG.margem = (x-MG.custo)/x*100; }   /* custo digitado fica; margem muda */
    else { MG.custo = r.custo; MG.digitado.custo = false; }
    MG.digitado.venda = true; MG.modo = 'venda'; MG.ultimo = 'venda';
  } else {
    if(campo==='margem') MG.margem = Math.min(x, 99.99);
    else if(campo==='markup') MG.margem = x/(100+x)*100;
    else if(campo==='lucro'){
      if(MG.modo==='venda'){ if(r.venda>0) MG.margem = x/r.venda*100; }
      else { if(r.custo+x>0) MG.margem = x/(r.custo+x)*100; }
    }
    /* o valor travado (modo) fica; o outro passa a ser calculado */
    if(MG.modo==='venda') MG.digitado.custo = false; else MG.digitado.venda = false;
    MG.ultimo = campo;
  }
  mgPintar(campo);
};
ENTRADAS.mgBusca = v => { MG.busca = v; const l = el('mg_lista'); if(l) l.innerHTML = mgListaHTML(); };
ACOES.mgModo = m => { const r = mgCalc(); MG.modo = (m==='venda') ? 'venda' : 'custo'; MG.ultimo = MG.modo; MG.custo = r.custo; MG.venda = r.venda; MG.digitado = {custo:MG.modo==='custo', venda:MG.modo==='venda'}; mgRefazer(); };
ACOES.mgMargem = v => { MG.margem = Number(v)||0; mgPintar(null); };
ACOES.mgCusto  = v => { const r = mgCalc(); MG.modo = 'custo'; MG.ultimo = 'custo'; MG.custo = Number(v)||0; MG.margem = r.margem; MG.digitado = {custo:true, venda:false}; mgRefazer(); };
/* produto da tabela: custo = preco por pacote, com caixa e unidade como opcao */
ACOES.mgProduto = id => {
  const p = porId[id]; if(!p) return;
  const cx = p.pCaixa||0, pc = p.pPacote||0, un = p.pUnidade||0;
  MG.opcoes = [{rot:'Caixa', v:Math.round(cx*100)/100}];
  if(pc) MG.opcoes.push({rot:'Pacote', v:Math.round(pc*100)/100});
  if(un && (p.unPorPacote||0)>1) MG.opcoes.push({rot:'Unidade', v:Math.round(un*100)/100});
  MG.modo = 'custo'; MG.ultimo = 'custo'; MG.custo = pc || cx; MG.digitado = {custo:true, venda:false}; MG.rotulo = p.nome+' — cód. '+p.cod+' (tabela)'; MG.busca = '';
  mgRefazer();
};
ACOES.mgLimpar = () => {
  MG.modo='custo'; MG.ultimo='custo'; MG.custo = 0; MG.venda = 0; MG.margem = 30; MG.digitado = {custo:false, venda:false}; MG.rotulo=''; MG.opcoes=null; MG.voltarPedido=false; MG.item=null; MG.busca='';
  mgRefazer(); setTimeout(()=>{ const n=el('mg_custo'); if(n){ n.focus(); n.select(); } },150);
};
ACOES.mgVoltarPedido = () => { MG.voltarPedido = false; irPara('pedido'); };
/* Do preço do item no pedido: o custo do cliente é o que ele paga a você */
ACOES.simularMargem = i => {
  const ped = pedidoRascunho(); const it = ped ? ped.itens[+i] : null; if(!it) return;
  const p = porId[it.skuId] || {};
  const np = el('np'); const precoCx = np ? pnum(np.value) : it.preco;
  const cx = it.un==='CX' ? precoCx : (precoDe(p,'CX')||0);
  const pc = p.pacotesPorCaixa ? cx/p.pacotesPorCaixa : 0;
  const un = (pc && p.unPorPacote) ? pc/p.unPorPacote : 0;
  MG.opcoes = [{rot:'Caixa', v:Math.round(cx*100)/100}];
  if(pc) MG.opcoes.push({rot:'Pacote', v:Math.round(pc*100)/100});
  if(un && p.unPorPacote>1) MG.opcoes.push({rot:'Unidade', v:Math.round(un*100)/100});
  MG.modo = 'custo'; MG.ultimo = 'custo'; MG.custo = pc || cx; MG.digitado = {custo:true, venda:false}; MG.rotulo = it.nome + ' — cód. ' + it.cod; MG.voltarPedido = false; MG.item = +i; MG.busca = '';
  abrirMargemModal();
};

function telaPainel(){
  const mes = PER.tipo==='mes';
  let topo = chipsFiltroMarca() + '<div class="chips" style="justify-content:space-between;padding-bottom:8px">'+
    (mes?'<button class="chip" data-a="mesAnterior" aria-label="Período anterior">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:15px;height:15px;transform:rotate(180deg)">'+IC.seta+'</svg></button>':'')+
    '<button class="chip on" style="flex:1;justify-content:center" data-a="escolherPeriodo">'+
      esc(perRot(PER))+'</button>'+
    (mes?'<button class="chip" data-a="mesSeguinte" aria-label="Período seguinte">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:15px;height:15px">'+IC.seta+'</svg></button>'
        :'<button class="chip" data-a="voltarAoMes">Mês</button>')+
  '</div>';
  if(!mes){
    const n = perDias(PER).length;
    topo += '<div class="peq" style="margin:-4px 3px 9px">Período livre de '+n+' dia'+(n===1?'':'s')+
      ', comparado com os '+n+' dias anteriores. Toque em <b>Mês</b> para voltar ao normal.</div>';
  }
  topo += '<div class="chips">'+ VISTAS_PAINEL.map(v=>
    '<button class="chip '+(vistaPainel===v.id?'on':'')+'" data-a="setVistaPainel" data-i="'+v.id+'">'+
    v.rot+'</button>').join('') +'</div>';

  if(vistaPainel==='clientes') return topo + painelClientes();
  if(vistaPainel==='produtos') return topo + painelProdutos();
  if(vistaPainel==='redes')    return topo + painelRedes();
  return topo + painelDoMes();
}

/* ---- escolher o período ---- */
const ATALHOS_PER = [
  {id:'7',    rot:'Últimos 7 dias'},
  {id:'14',   rot:'Últimos 14 dias'},
  {id:'30',   rot:'Últimos 30 dias'},
  {id:'90',   rot:'Últimos 90 dias'},
  {id:'mes',  rot:'Este mês'},
  {id:'ant',  rot:'Mês passado'},
  {id:'tri',  rot:'Últimos 3 meses'},
  {id:'ano',  rot:'Este ano'}
];
ACOES.escolherPeriodo = () => {
  const f = perFaixa(PER);
  modal('Período do painel',
    '<div class="peq" style="margin:0 0 10px">Vale para os quatro cortes — mês, clientes, '+
    'produtos e redes. A comparação usa sempre o período de mesmo tamanho logo antes.</div>'+
    '<div class="chips chips-quebra" style="padding-bottom:12px">'+ ATALHOS_PER.map(a=>
      '<button class="chip" data-a="perAtalho" data-i="'+a.id+'">'+a.rot+'</button>').join('') +'</div>'+
    '<div class="dupla">'+
      '<div class="campo mb0"><label>De</label><input type="date" id="p_ini" value="'+esc(f.ini)+'"></div>'+
      '<div class="campo mb0"><label>Até</label><input type="date" id="p_fim" value="'+esc(f.fim)+'"></div>'+
    '</div>',
    '<button class="bt bt-p bt-bloco" data-a="perAplicar">'+ico('check')+'Usar este período</button>');
};
ACOES.perAtalho = id => {
  const hj = hoje();
  if(id==='mes'){ PER = {tipo:'mes', ym:hj.slice(0,7)}; mesPainel = PER.ym; }
  else if(id==='ant'){ PER = {tipo:'mes', ym:mesVizinho(hj.slice(0,7),-1)}; mesPainel = PER.ym; }
  else if(id==='ano'){ PER = {tipo:'faixa', ini:hj.slice(0,4)+'-01-01', fim:hj}; }
  else if(id==='tri'){ PER = {tipo:'faixa', ini:diasDoMes(mesVizinho(hj.slice(0,7),-2))[0], fim:hj}; }
  else { PER = {tipo:'faixa', ini:somaDias(hj, -(Number(id)-1)), fim:hj}; }
  fechaModal(); window.scrollTo(0,0); render();
};
ACOES.perAplicar = () => {
  const a = el('p_ini').value, b = el('p_fim').value;
  if(!a || !b){ aviso('Escolha as duas datas.'); return; }
  PER = a<=b ? {tipo:'faixa', ini:a, fim:b} : {tipo:'faixa', ini:b, fim:a};
  fechaModal(); window.scrollTo(0,0); render();
};
ACOES.voltarAoMes = () => {
  PER = {tipo:'mes', ym:mesPainel}; window.scrollTo(0,0); render();
};

function painelDoMes(){
  const m = dadosPer(PER);
  const meta = PER.tipo==='mes' ? (Number(D.cfg.metaMes)||0) : 0;
  const pct = meta>0 ? m.total/meta : 0;
  const esperado = meta>0 && m.uteisTotal ? meta*(m.uteisAte/m.uteisTotal) : 0;
  const ritmo = esperado>0 ? m.total/esperado : null;
  const c = ritmo===null ? '' : cor(ritmo);
  const projecao = m.uteisAte>0 ? m.total/m.uteisAte*m.uteisTotal : 0;
  const falta = Math.max(0, meta - m.total);
  const porDiaFalta = m.uteisFalta>0 ? falta/m.uteisFalta : falta;

  let h = '';

  /* --- meta do mês --- */
  h += '<div class="cartao"><div class="corpo">'+
    '<div class="rot" style="font-size:calc(11px * var(--esc));font-weight:700;letter-spacing:.5px;'+
      'text-transform:uppercase;color:var(--cinza);margin-bottom:4px">Faturamento '+
      (PER.tipo==='mes'?'do mês':'do período')+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">'+
      '<div style="font-size:calc(31px * var(--esc));font-weight:800;letter-spacing:-1px;line-height:1" class="'+(c?'v-'+c:'')+'">'+brl0(m.total)+'</div>'+
      (meta>0?'<div class="peq" style="font-weight:650">de '+brl0(meta)+'</div>':'')+
    '</div>'+
    (m.nBonif ? '<div class="peq" style="margin-top:6px"><b>Bonificação (investimento):</b> '+brl0(m.bonif)+' em '+m.nBonif+' pedido'+(m.nBonif===1?'':'s')+' — fora do faturamento acima.</div>' : '');
  if(meta>0){
    const larg = Math.min(100, pct*100);
    const marco = Math.min(100, (m.uteisTotal? m.uteisAte/m.uteisTotal:0)*100);
    h += '<div class="barra-p marco"><i class="b-'+(c||'ambar')+'" style="width:'+larg.toFixed(1)+'%"></i>'+
         '<span class="agulha" style="left:'+marco.toFixed(1)+'%"></span></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:7px;font-size:calc(12px * var(--esc));color:var(--cinza)">'+
        '<span>'+nm(pct*100,0)+'% da meta</span>'+
        '<span>'+(ritmo!==null?'ritmo '+nm(ritmo*100,0)+'%':'')+'</span></div>';
    if(m.ehMesAtual){
      h += '<hr><table class="tabelinha">'+
        '<tr><td>Projeção de fechamento</td><td class="'+(projecao>=meta?'v-verde':'v-terra')+'">'+brl0(projecao)+'</td></tr>'+
        '<tr><td>Falta para a meta</td><td>'+(falta>0?brl0(falta):'meta batida')+'</td></tr>'+
        linhasEntrega(PER)+
        (falta>0?'<tr><td>Por dia útil ('+m.uteisFalta+' restante'+(m.uteisFalta===1?'':'s')+')</td><td>'+
          (m.uteisFalta>0?brl0(porDiaFalta):'último dia')+'</td></tr>':'')+
        '</table>';
    }
  } else {
    if(PER.tipo==='mes'){
      h += '<div class="peq" style="margin-top:9px">Defina a meta do mês em Ajustes para acompanhar o ritmo, '+
        'a projeção e quanto falta por dia.</div>'+
        '<button class="bt bt-l bt-bloco mt10" data-a="aba" data-i="ajustes" style="min-height:44px">'+ico('alvo')+'Definir meta</button>';
    } else {
      h += '<div class="peq" style="margin-top:9px">'+dbr(m.ini)+' a '+dbr(m.fim)+' · '+
        m.nPedidos+' pedido'+(m.nPedidos===1?'':'s')+' · '+m.uteisTotal+' dias úteis. '+
        'A meta é mensal, então não entra numa faixa livre.</div>';
    }
  }
  /* entrega conferida aparece mesmo sem meta definida */
  { const le = linhasEntrega(PER); if(le && !(meta>0 && m.ehMesAtual)) h += '<table class="tabelinha mt10">'+le+'</table>'; }
  h += '</div></div>';

  /* --- comparação com o mês anterior --- */
  const ant = dadosPer(perAnt(PER));
  const vFat = variacao(m.total, ant.total);
  const vTic = variacao(m.ticket, ant.ticket);
  const vCx  = variacao(m.cx, ant.cx);
  const vCli = variacao(m.nClientes, ant.nClientes);

  const metaCx = Number(D.cfg.metaCaixas)||0;

        m.ehMesAtual ? dbr(hoje()).slice(0,5) : '') +
    kpi('Ticket médio', brl0(m.ticket),
        m.nPedidos+' pedido'+(m.nPedidos===1?'':'s')+' '+setinha(vTic)) +
    kpi('Positivação', carteira? nm(posit,0)+'%' : '—',
        carteira ? m.nClientes+' de '+carteira+' clientes '+setinha(vCli) : 'cadastre a carteira',
        posit>=70?'v-verde':posit>=40?'v-ambar':(carteira?'v-terra':'')) +
    kpi('Caixas', nm(m.cx, m.cx%1?1:0),
        (metaCx?'meta '+nm(metaCx)+' cx · ':nm(m.kg,0)+' kg ')+setinha(vCx)) +
  '</div>';

  /* --- mês contra mês --- */
  if(ant.total > 0 || m.total > 0){
    h += '<div class="cartao"><div class="corpo" style="padding:12px 14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'+
        '<div><div class="rot" style="font-size:calc(11px * var(--esc));font-weight:700;letter-spacing:.5px;'+
          'text-transform:uppercase;color:var(--cinza)">Contra '+esc(perCurto(perAnt(PER)))+'</div>'+
          '<div class="peq" style="margin-top:2px">'+brl0(ant.total)+' naquele mês</div></div>'+
        '<div style="font-size:calc(19px * var(--esc));font-weight:800">'+(vFat===null?'—':setinha(vFat))+'</div>'+
      '</div></div></div>';
  }

  /* --- mix por canal --- */
  const somaCanal = m.porCanal.VAREJO + m.porCanal.FOODSERVICE;
  if(somaCanal > 0){
    const pv = m.porCanal.VAREJO/somaCanal*100;
    h += '<div class="cartao"><div class="cab">'+ico('caixa')+'<h2>De onde veio a venda</h2></div>'+
      '<div class="corpo">'+
      '<div class="mix"><i class="mix-v" style="width:'+pv.toFixed(1)+'%"></i>'+
        '<i class="mix-f" style="width:'+(100-pv).toFixed(1)+'%"></i></div>'+
      '<div class="leg" style="margin-top:10px">'+
        '<span><i style="background:#1E7A4D"></i>Varejo '+nm(pv,0)+'% · '+brl0(m.porCanal.VAREJO)+'</span>'+
        '<span><i style="background:#B8860B"></i>Food Service '+nm(100-pv,0)+'% · '+brl0(m.porCanal.FOODSERVICE)+'</span>'+
      '</div></div></div>';
  }

  /* --- por tipo de negocio (padaria, supermercado...) --- */
  const segsComTipo = (m.porSegmento||[]).filter(x=>x.nome!=='Sem tipo');
  if(segsComTipo.length){
    const maxs = m.porSegmento[0].val || 1;
    const semTipo = (m.porSegmento||[]).find(x=>x.nome==='Sem tipo');
    h += '<div class="cartao"><div class="cab">'+ico('clientes')+'<h2>Por tipo de negócio</h2></div>'+
      '<div class="corpo">';
    m.porSegmento.forEach((x,i)=>{
      const pct = m.total>0 ? x.val/m.total*100 : 0;
      h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
        '<span class="nm" style="flex:1"><span style="display:block">'+esc(x.nome)+
          ' <span style="color:var(--cinza);font-weight:600">· '+x.clientes+' cliente'+(x.clientes===1?'':'s')+' · '+x.n+' pedido'+(x.n===1?'':'s')+'</span></span>'+
        '<span class="mini"><i style="width:'+((x.val/maxs)*100).toFixed(1)+'%'+(x.nome==='Sem tipo'?';background:var(--linha2)':'')+'"></i></span></span>'+
        '<span class="vl">'+brl0(x.val)+'<br><span style="font-size:calc(11px * var(--esc));color:var(--cinza);font-weight:600">'+nm(pct,0)+'%</span></span></div>';
    });
    if(semTipo) h += '<div class="peq" style="margin-top:10px">"Sem tipo" são clientes sem o tipo de negócio no cadastro. Preencha em Clientes › editar para a conta ficar completa.</div>';
    h += '</div></div>';
  }

  /* --- gráfico --- */
  h += '<div class="cartao"><div class="cab">'+ico('painel')+'<h2>Dia a dia</h2></div>'+
    '<div class="corpo" style="padding:10px 6px 12px">'+graficoMes(m)+
    '<div class="leg" style="padding:0 8px">'+
      '<span><i style="background:#F2A900"></i>venda do dia</span>'+
      (m.ehMesAtual?'<span><i style="background:#33302E"></i>hoje</span>':'')+
      ((D.cfg.metaMes>0)?'<span><i style="background:#8A3324"></i>meta diária</span>':'')+
    '</div></div></div>';

  /* --- os ultimos seis meses --- */
  const serie = serieMeses(m.fim.slice(0,7), 6);
  if(serie.some(x=>x.val>0)){
    h += '<div class="cartao"><div class="cab">'+ico('historico')+'<h2>Últimos 6 meses</h2></div>'+
      '<div class="corpo" style="padding:10px 6px 12px">'+graficoMeses(serie, Number(D.cfg.metaMes)||0)+
      (D.cfg.metaMes>0?'<div class="leg" style="padding:0 8px">'+
        '<span><i style="background:#8A3324"></i>meta do mês</span></div>':'')+
      '</div></div>';
  }

  /* --- top produtos --- */
  h += '<div class="secao">Top produtos</div><div class="cartao"><div class="corpo">';
  if(!m.topProd.length) h += '<div class="peq">Nenhuma venda registrada neste mês.</div>';
  else {
    const maxv = m.topProd[0].val || 1;
    m.topProd.forEach((p,i)=>{
      h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
        '<span class="nm" style="flex:1"><span style="display:block">'+esc(p.nome)+'</span>'+
        '<span class="mini"><i style="width:'+((p.val/maxv)*100).toFixed(1)+'%"></i></span></span>'+
        '<span class="vl">'+brl0(p.val)+
        (p.cx>=0.05?'<br><span style="font-size:calc(11px * var(--esc));color:var(--cinza);font-weight:600">'+
          nm(p.cx, p.cx%1?1:0)+' cx</span>':'')+'</span></div>';
    });
  }
  h += '</div></div>';

  /* --- top clientes --- */
  h += '<div class="secao">Top clientes</div><div class="cartao"><div class="corpo">';
  if(!m.topCli.length) h += '<div class="peq">Nenhum cliente comprou neste mês.</div>';
  else {
    const maxv = m.topCli[0].val || 1;
    m.topCli.forEach((c2,i)=>{
      const cl = clientePorId(c2.id);
      h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
        '<span class="nm" style="flex:1"><span style="display:block">'+esc(cl?(cl.fantasia||cl.razao):'Cliente removido')+'</span>'+
        '<span class="mini"><i style="width:'+((c2.val/maxv)*100).toFixed(1)+'%"></i></span></span>'+
        '<span class="vl">'+brl0(c2.val)+'</span></div>';
    });
  }
  h += '</div></div>';

  /* --- sumiram de um mês para o outro --- */
  const sumidos = sumiramNoPer(PER);
  if(sumidos.length){
    const perdido = sumidos.reduce((s,x)=>s+x.valor, 0);
    h += '<div class="secao">Compraram '+(PER.tipo==='mes'?'mês passado':'no período anterior')+
      ' e ainda não '+(PER.tipo==='mes'?'neste':'agora')+' ('+sumidos.length+')</div>';
    h += '<div class="aviso" style="margin-bottom:10px">'+ico('alerta')+
      '<span>Juntos, fizeram <b>'+brl0(perdido)+'</b> antes. É o dinheiro mais fácil '+
      'de recuperar: eles já compram.</span></div>';
    h += '<div class="cartao">';
    sumidos.slice(0,10).forEach(x=>{
      h += '<button class="lin" data-a="verCliente" data-i="'+x.c.id+'">'+
        '<span class="ini">'+esc(iniciais(x.c.fantasia||x.c.razao))+'</span>'+
        '<span class="info"><span class="nm">'+esc(x.c.fantasia||x.c.razao)+'</span>'+
        '<span class="sub"><span class="et '+(x.c.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+
          CANAL_NOME[x.c.canal]+'</span>'+
          (x.c.cidade?'<span>'+esc(x.c.cidade)+'</span>':'')+'</span></span>'+
        '<span class="dir"><span class="val">'+brl0(x.valor)+'</span>'+
          '<span class="peq" style="display:block">mês passado</span></span>'+
        '<span class="seta">'+ico('seta')+'</span></button>';
    });
    h += '</div>';
  }

  /* --- inativos --- */
  const frios = D.clientes.map(c=>({c:c, r:resumoCliente(c.id)}))
    .filter(x=>x.r.dias===null || x.r.dias>=30)
    .sort((a,b)=>(b.r.dias===null?99999:b.r.dias)-(a.r.dias===null?99999:a.r.dias));
  h += '<div class="secao">Sem comprar há 30 dias ou mais'+(frios.length?' ('+frios.length+')':'')+'</div>';
  h += '<div class="cartao">';
  if(!frios.length){
    h += '<div class="vazio">'+ico('check')+'<p>Carteira em dia</p>'+
      '<span>Todo cliente cadastrado comprou nos últimos 30 dias.</span></div>';
  } else {
    frios.slice(0,15).forEach(x=>{
      h += '<button class="lin" data-a="verCliente" data-i="'+x.c.id+'">'+
        '<span class="ini">'+esc(iniciais(x.c.fantasia||x.c.razao))+'</span>'+
        '<span class="info"><span class="nm">'+esc(x.c.fantasia||x.c.razao)+'</span>'+
        '<span class="sub">'+(x.c.cidade?'<span>'+esc(x.c.cidade)+'</span>':'')+
        '<span class="et et-al">'+(x.r.dias===null?'nunca comprou':x.r.dias+' dias')+'</span></span></span>'+
        '<span class="seta">'+ico('seta')+'</span></button>';
    });
    if(frios.length>15) h += '<div class="corpo peq">e mais '+(frios.length-15)+' na aba Clientes.</div>';
  }
  h += '</div>';
  return h;
}

/* =====================================================
   XLSX escrito a mao (zip sem compressao + XML do Excel).
   Sem biblioteca: continua arquivo unico e offline.
   ===================================================== */
const CRC_TAB = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_TAB[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function zipStore(arquivos){   /* [{nome, texto}] -> Uint8Array de um .zip (metodo STORE) */
  const enc = new TextEncoder(); const partes=[]; const central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  arquivos.forEach(a=>{
    const nome=enc.encode(a.nome), dados=(a.bytes instanceof Uint8Array) ? a.bytes : enc.encode(a.texto), crc=crc32(dados);
    const loc=new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nome.length), ...u16(0)]);
    partes.push(loc, nome, dados);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nome.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nome);
    off += loc.length + nome.length + dados.length;
  });
  const cdSize = central.reduce((s,x)=>s+x.length,0);
  const fim=new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(arquivos.length), ...u16(arquivos.length), ...u32(cdSize), ...u32(off), ...u16(0)]);
  const total=[...partes, ...central, fim]; const tam=total.reduce((s,x)=>s+x.length,0);
  const out=new Uint8Array(tam); let i=0; total.forEach(x=>{ out.set(x,i); i+=x.length; }); return out;
}
const xmlEsc = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colLetra(n){ let s=''; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
/* linhas: array de arrays. Celula pode ser numero, texto, ou {v, s:'moeda'|'negrito'|'titulo'|'cinza'} */
function xlsxDe(nomeAba, linhas, larguras, opc){
  /* celula: valor simples, ou {v, s} ; {f:'H18*G18', s:'moeda'} escreve FORMULA (o Excel calcula
     e recalcula se a industria mexer). Estilos: normal, negrito, moeda, titulo, cinza,
     moedaNegrito, inteiro, cab (cabecalho escuro), cabD (cabecalho escuro a direita), num,
     numNegrito, cel (borda), celD (borda a direita), rotulo (fundo creme + borda), total, totalMoeda */
  opc = opc || {};
  const estilos = { normal:0, negrito:1, moeda:2, titulo:3, cinza:4, moedaNegrito:5, inteiro:6,
                    cab:7, cabD:8, num:9, numNegrito:10, cel:11, celD:12, rotulo:13, total:14, totalMoeda:15, moedaCel:16, aviso:17, pct:18, nf:19 };
  let sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(opc.congelar){
    sheet += '<sheetViews><sheetView workbookViewId="0" showGridLines="'+(opc.grade===false?'0':'1')+'">'+
      '<pane ySplit="'+opc.congelar+'" topLeftCell="A'+(opc.congelar+1)+'" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  } else if(opc.grade===false){
    sheet += '<sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>';
  }
  if(larguras && larguras.length){ sheet += '<cols>'+larguras.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>'; }
  sheet += '<sheetData>';
  linhas.forEach((lin,r)=>{
    const alt = (lin && lin.__altura) ? ' ht="'+lin.__altura+'" customHeight="1"' : '';
    sheet += '<row r="'+(r+1)+'"'+alt+'>';
    (lin||[]).forEach((cel,c)=>{
      if(cel==null || cel==='') return;
      const ref = colLetra(c)+(r+1);
      let v = cel, st = 'normal', f = null;
      if(cel && typeof cel==='object'){ v = cel.v; st = cel.s||'normal'; f = cel.f||null; }
      const sIdx = estilos[st]||0;
      if(f){ sheet += '<c r="'+ref+'" s="'+sIdx+'"><f>'+xmlEsc(f)+'</f>'+(typeof v==='number'?'<v>'+v+'</v>':'')+'</c>'; return; }
      if(v==null || v===''){ if(st!=='normal') sheet += '<c r="'+ref+'" s="'+sIdx+'"/>'; return; }
      if(typeof v==='number') sheet += '<c r="'+ref+'" s="'+sIdx+'"><v>'+v+'</v></c>';
      else sheet += '<c r="'+ref+'" s="'+sIdx+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>';
    });
    sheet += '</row>';
  });
  sheet += '</sheetData>';
  if(opc.mesclar && opc.mesclar.length) sheet += '<mergeCells count="'+opc.mesclar.length+'">'+opc.mesclar.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>';
  sheet += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup orientation="'+(opc.paisagem?'landscape':'portrait')+'" fitToWidth="1" fitToHeight="0"/>';
  if(opc.logo) sheet += '<drawing r:id="rIdLogo"/>';
  sheet += '</worksheet>';
