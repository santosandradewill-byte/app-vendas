function larguraTexto(s, tam, negrito){
  const tab = negrito ? LARG_NEGRITO : LARG_NORMAL;
  let soma = 0;
  for(const ch of String(s)){
    const base = tab[ch] !== undefined ? ch : (BASE_ACENTO[ch] || ' ');
    soma += (tab[base] !== undefined ? tab[base] : 500);
  }
  return soma * tam / 1000;
}

/* texto -> bytes WinAnsi (o que as fontes padrão do PDF entendem) */
const WINANSI = {'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,
  '‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,
  '•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159,'−':45};
function paraWinAnsi(s){
  let out = '';
  for(const ch of String(s)){
    const c = ch.codePointAt(0);
    if(WINANSI[ch] !== undefined) out += String.fromCharCode(WINANSI[ch]);
    else if(c < 256) out += ch;
    else out += (BASE_ACENTO[ch] || '?');
  }
  return out.replace(/([\\()])/g, '\\$1');
}

/* ---------- página em construção ---------- */
function NovaPagina(larg, alt){
  return {
    larg: larg, alt: alt, ops: [], imagens: [],
    txt: function(x, y, s, o){
      o = o || {};
      const tam = o.tam || 9.5, neg = !!o.negrito;
      let px = x;
      if(o.align === 'r') px = x - larguraTexto(s, tam, neg);
      else if(o.align === 'c') px = x - larguraTexto(s, tam, neg)/2;
      const c = o.cor || [0.2,0.19,0.18];
      this.ops.push(c[0].toFixed(3)+' '+c[1].toFixed(3)+' '+c[2].toFixed(3)+' rg');
      this.ops.push('BT /'+(neg?'F2':'F1')+' '+tam+' Tf 1 0 0 1 '+
        px.toFixed(2)+' '+(this.alt-y).toFixed(2)+' Tm ('+paraWinAnsi(s)+') Tj ET');
      return px + larguraTexto(s, tam, neg);
    },
    ret: function(x, y, w, h, cor){
      this.ops.push(cor[0].toFixed(3)+' '+cor[1].toFixed(3)+' '+cor[2].toFixed(3)+' rg');
      this.ops.push(x.toFixed(2)+' '+(this.alt-y-h).toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+' re f');
    },
    linha: function(x1, y1, x2, y2, esp, cor){
      cor = cor || [0.2,0.19,0.18];
      this.ops.push(cor[0].toFixed(3)+' '+cor[1].toFixed(3)+' '+cor[2].toFixed(3)+' RG');
      this.ops.push((esp||0.5).toFixed(2)+' w '+x1.toFixed(2)+' '+(this.alt-y1).toFixed(2)+' m '+
        x2.toFixed(2)+' '+(this.alt-y2).toFixed(2)+' l S');
    },
    imagem: function(nome, x, y, w, h){
      this.ops.push('q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x.toFixed(2)+' '+
        (this.alt-y-h).toFixed(2)+' cm /'+nome+' Do Q');
      this.imagens.push(nome);
    }
  };
}

function quebrarLinhas(s, larguraMax, tam, negrito){
  const palavras = String(s).split(/\s+/).filter(Boolean);
  const linhas = []; let atual = '';
  palavras.forEach(p=>{
    const tentativa = atual ? atual+' '+p : p;
    if(larguraTexto(tentativa, tam, negrito) <= larguraMax) atual = tentativa;
    else { if(atual) linhas.push(atual); atual = p; }
  });
  if(atual) linhas.push(atual);
  return linhas.length ? linhas : [''];
}

/* ---------- montagem do arquivo ---------- */
function montarPdf(paginas, recursosImg){
  const objs = [];
  const num = corpo => { objs.push(corpo); return objs.length; };

  const fonte1 = num('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const fonte2 = num('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

  const refImg = {};
  for(const nome in recursosImg){
    const im = recursosImg[nome];
    refImg[nome] = num('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+
      ' >>\nstream\n'+im.bytes+'\nendstream');
  }

  const idPaginas = objs.length + 1 + paginas.length*2;
  const refsPag = [];
  paginas.forEach(pg=>{
    const fluxo = pg.ops.join('\n');
    const idFluxo = num('<< /Length '+fluxo.length+' >>\nstream\n'+fluxo+'\nendstream');
    let xo = '';
    if(pg.imagens.length){
      xo = ' /XObject << ' + pg.imagens.map(n=>'/'+n+' '+refImg[n]+' 0 R').join(' ') + ' >>';
    }
    const idPag = num('<< /Type /Page /Parent '+idPaginas+' 0 R /MediaBox [0 0 '+
      pg.larg.toFixed(2)+' '+pg.alt.toFixed(2)+'] /Resources << /Font << /F1 '+fonte1+
      ' 0 R /F2 '+fonte2+' 0 R >>'+xo+' >> /Contents '+idFluxo+' 0 R >>');
    refsPag.push(idPag);
  });

  const idPaginasReal = num('<< /Type /Pages /Count '+paginas.length+' /Kids ['+
    refsPag.map(r=>r+' 0 R').join(' ')+'] >>');
  const idRaiz = num('<< /Type /Catalog /Pages '+idPaginasReal+' 0 R >>');

  /* o /Parent foi escrito com o número previsto; confere */
  if(idPaginasReal !== idPaginas){
    refsPag.forEach(r=>{
      objs[r-1] = objs[r-1].replace('/Parent '+idPaginas+' 0 R', '/Parent '+idPaginasReal+' 0 R');
    });
  }

  let saida = '%PDF-1.4\n%âãÏÓ\n';
  const desloc = [];
  objs.forEach((o,i)=>{ desloc[i] = saida.length; saida += (i+1)+' 0 obj\n'+o+'\nendobj\n'; });
  const inicioXref = saida.length;
  saida += 'xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  desloc.forEach(d=>{ saida += String(d).padStart(10,'0')+' 00000 n \n'; });
  saida += 'trailer\n<< /Size '+(objs.length+1)+' /Root '+idRaiz+' 0 R >>\nstartxref\n'+inicioXref+'\n%%EOF';

  const bytes = new Uint8Array(saida.length);
  for(let i=0;i<saida.length;i++) bytes[i] = saida.charCodeAt(i) & 0xFF;
  return bytes;
}

/* ---------- a folha do pedido ---------- */
const GRAFITE_PDF = [0.200,0.188,0.180];
const CINZA_PDF   = [0.541,0.541,0.541];
const DOURADO_PDF = [0.949,0.663,0.000];
const CREME_PDF   = [0.980,0.968,0.949];
const CREME2_PDF  = [0.949,0.925,0.890];
const LINHA_PDF   = [0.902,0.878,0.847];
const TERRA_PDF   = [0.541,0.200,0.141];

function pdfDoPedido(ped, paraCliente){
  const A4L = 595.28, A4A = 841.89, M = 38;
  const cli = clienteDe(ped) || {};
  const t = totais(ped);
  const cfg = D.cfg;
  const paginas = [];
  const recursos = {};

  let pg = NovaPagina(A4L, A4A);
  paginas.push(pg);
  let y = M;

  /* ---- cabeçalho ---- */
  const mk = marcaAtual();
  const fim = pg.txt(M, y+16, (mk.logo1||mk.nome||'')+' ', {tam:20, negrito:true, cor:GRAFITE_PDF});
  if(mk.logo2) pg.txt(fim, y+16, mk.logo2, {tam:20, negrito:true, cor:DOURADO_PDF});
  pg.txt(M, y+29, paraCliente ? 'Confirmação de pedido' : 'Pedido de venda', {tam:8, cor:CINZA_PDF});

  /* rótulo em cinza + número em negrito, os dois alinhados pela direita */
  function parDireita(yy, rotulo, valor, tamR, tamV){
    const wr = larguraTexto(rotulo+' ', tamR, false);
    const wv = larguraTexto(valor, tamV, true);
    const x0 = A4L - M - (wr + wv);
    pg.txt(x0, yy, rotulo, {tam:tamR, cor:CINZA_PDF});
    pg.txt(x0 + wr, yy, valor, {tam:tamV, negrito:true, cor:GRAFITE_PDF});
  }
  let yd = y+9;
  if(ped.numCliente){
    parDireita(yd, 'Pedido do cliente (usar na NF)', ped.numCliente, 9.5, 12); yd += 15;
    parDireita(yd, 'Ref. do representante', ped.num, 8.5, 9); yd += 12;
  } else {
    parDireita(yd, 'Ref. do representante', ped.num, 9, 10); yd += 14;
  }
  pg.txt(A4L-M, yd, dbr(ped.data), {tam:9, cor:CINZA_PDF, align:'r'}); yd += 12;
  if(ped.dataEntrega){ parDireita(yd, 'Entrega', dbr(ped.dataEntrega), 9, 9.5); yd += 13; }
  pg.txt(A4L-M, yd, ped.status, {tam:9, cor:CINZA_PDF, align:'r'});

  y = Math.max(y+40, yd+8);
  pg.linha(M, y, A4L-M, y, 2, GRAFITE_PDF);
  y += 20;

  /* ---- cliente ---- */
  pg.txt(M, y, 'CLIENTE', {tam:7.5, negrito:true, cor:CINZA_PDF});
  y += 13;
  const dados = [
    ['Razão social', cli.razao],
    ['Nome fantasia', (cli.fantasia && cli.fantasia!==cli.razao) ? cli.fantasia : ''],
    ['Código', [cli.cod, cli.codIndustria?'indústria '+cli.codIndustria:''].filter(Boolean).join(' - ')],
    ['Descarga', cli.agendamento],
    ['CNPJ', cnpjBonito(cli.cnpj)],
    ['Inscrição estadual', cli.ie],
    ['Regime', cli.regime],
    ['Canal', CANAL_NOME[cli.canal] + (cli.segmento?' - '+cli.segmento:'')],
    ['Entrega', [cli.endereco, cli.bairro, cli.cidade, cli.cep?'CEP '+cepBonito(cli.cep):''].filter(Boolean).join(' - ')],
    ['Referência', cli.referencia],
    ['Contato', [cli.contato, cli.whats?telBonito(cli.whats):'',
                 cli.fone?telBonito(cli.fone):''].filter(Boolean).join(' - ')],
    ['E-mail', cli.email]
  ].filter(l=>l[1]);
  dados.forEach(l=>{
    pg.txt(M, y, l[0], {tam:9, cor:CINZA_PDF});
    quebrarLinhas(l[1], A4L-M-M-88, 9, false).forEach((ln,i)=>{
      pg.txt(M+88, y+i*11.5, ln, {tam:9, cor:GRAFITE_PDF});
      if(i>0) y += 11.5;
    });
    y += 13;
  });

  /* ---- itens ---- */
  y += 10;
  const colX = { n:M+4, cod:M+24, prod:M+68, cx:A4L-M-176, kg:A4L-M-126, pr:A4L-M-66, tot:A4L-M-4 };
  const larguraProduto = colX.cx - colX.prod - 34;

  function cabecalhoTabela(){
    pg.ret(M, y, A4L-2*M, 17, GRAFITE_PDF);
    pg.txt(colX.n,    y+11.5, '#',       {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(colX.cod,  y+11.5, 'CÓDIGO',  {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(colX.prod, y+11.5, 'PRODUTO', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(colX.cx,   y+11.5, 'CAIXAS',  {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(colX.kg,   y+11.5, 'PESO KG', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(colX.pr,   y+11.5, 'PREÇO CX',{tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(colX.tot,  y+11.5, 'TOTAL',   {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    y += 17;
  }
  cabecalhoTabela();

  ped.itens.forEach((it, i)=>{
    const p = porId[it.skuId] || {};
    const linhasNome = quebrarLinhas(it.nome, larguraProduto, 9, false);
    let refUn = '';
    if(paraCliente){
      const r = [];
      if(p.pPacote)  r.push(brl(p.pPacote)+' o pacote');
      if(p.pUnidade) r.push(brl(p.pUnidade)+' a unidade');
      if(p.pKg)      r.push(brl(p.pKg)+' o quilo');
      refUn = r.join('  ·  ');
    }
    const altura = Math.max(19, 8 + linhasNome.length*11 + (refUn?10:0));

    if(y + altura > A4A - 200){          /* estourou a página: começa outra */
      pg = NovaPagina(A4L, A4A); paginas.push(pg); y = M;
      pg.txt(M, y+10, 'Pedido '+ped.num+' — continuação', {tam:9.5, negrito:true});
      y += 24;
      cabecalhoTabela();
    }
    if(i % 2 === 1) pg.ret(M, y, A4L-2*M, altura, CREME_PDF);

    pg.txt(colX.n,    y+13, String(i+1), {tam:9, cor:CINZA_PDF});
    pg.txt(colX.cod,  y+13, it.cod,      {tam:9, negrito:true});
    linhasNome.forEach((ln,k)=> pg.txt(colX.prod, y+13+k*11, ln, {tam:9}));
    if(p.pacotesPorCaixa){
      const larg = larguraTexto(linhasNome[linhasNome.length-1], 9, false);
      pg.txt(colX.prod+larg+4, y+13+(linhasNome.length-1)*11,
        nm(p.pacotesPorCaixa)+' pct/cx', {tam:7, cor:CINZA_PDF});
    }
    if(refUn) pg.txt(colX.prod, y+13+linhasNome.length*10.5, refUn, {tam:7.5, cor:CINZA_PDF});
    pg.txt(colX.cx,  y+13, nm(it.qtd), {tam:9, align:'r'});
    pg.txt(colX.kg,  y+13, nm(kgDe(p,it.un)*it.qtd, 1), {tam:9, align:'r', cor:CINZA_PDF});
    pg.txt(colX.pr,  y+13, brl(it.preco), {tam:9, align:'r'});
    pg.txt(colX.tot, y+13, brl(it.preco*it.qtd), {tam:9, negrito:true, align:'r'});
    y += altura;
    pg.linha(M, y, A4L-M, y, 0.4, LINHA_PDF);
  });

  /* ---- fecho ---- */
  y += 18;
  const yFecho = y;
  let ye = y;
  if(ped.cond){
    const w = pg.txt(M, ye, 'Pagamento: ', {tam:9, negrito:true});
    pg.txt(w, ye, ped.cond, {tam:9}); ye += 14;
  }
  if(ped.dataEntrega){
    const we = pg.txt(M, ye, 'Entrega combinada: ', {tam:9, negrito:true});
    pg.txt(we, ye, dbr(ped.dataEntrega), {tam:9}); ye += 14;
  }
  const w2 = pg.txt(M, ye, 'Volume: ', {tam:9, negrito:true});
  pg.txt(w2, ye, nm(t.cx, t.cx%1?1:0)+' caixas · '+nm(t.kg,1)+' kg', {tam:9}); ye += 14;
  if(ped.obs){
    pg.txt(M, ye, 'Observações:', {tam:9, negrito:true}); ye += 12;
    quebrarLinhas(ped.obs, A4L-2*M-230, 9, false).forEach(ln=>{ pg.txt(M, ye, ln, {tam:9}); ye += 12; });
  }

  let yt = yFecho;
  const xr = A4L-M, xl = A4L-M-175;
  pg.txt(xl, yt, 'Subtotal', {tam:9, cor:CINZA_PDF});
  pg.txt(xr, yt, brl(t.bruto), {tam:9, align:'r'}); yt += 14;
  if(t.desc > 0){
    pg.txt(xl, yt, 'Desconto '+vlr(ped.desc).replace(/,00$/,'')+'%', {tam:9, cor:TERRA_PDF});
    pg.txt(xr, yt, '- '+brl(t.desc), {tam:9, align:'r', cor:TERRA_PDF}); yt += 14;
  }
  yt += 4;
  pg.linha(xl, yt, xr, yt, 1.4, GRAFITE_PDF); yt += 16;
  pg.txt(xl, yt, 'Total', {tam:13, negrito:true});
  pg.txt(xr, yt, brl(t.liquido), {tam:13, negrito:true, align:'r'});

  /* ---- assinaturas e rodapé ---- */
  let ya = Math.max(ye, yt) + 58;
  if(ya > A4A - 110) ya = A4A - 110;
  const meio = A4L/2;
  pg.linha(M+10, ya, meio-24, ya, 0.7, GRAFITE_PDF);
  pg.linha(meio+24, ya, A4L-M-10, ya, 0.7, GRAFITE_PDF);
  const c1 = (M+10+meio-24)/2, c2 = (meio+24+A4L-M-10)/2;
  pg.txt(c1, ya+12, cfg.repNome || 'Representante', {tam:8.6, align:'c'});
  pg.txt(c2, ya+12, cli.contato || 'Pelo cliente',  {tam:8.6, align:'c'});
  if(cfg.repEmpresa) pg.txt(c1, ya+23, cfg.repEmpresa, {tam:7.5, align:'c', cor:CINZA_PDF});
  if(cfg.repTel)     pg.txt(c1, ya+(cfg.repEmpresa?34:23), telBonito(cfg.repTel), {tam:7.5, align:'c', cor:CINZA_PDF});
  pg.txt(c2, ya+23, cli.fantasia || cli.razao || '', {tam:7.5, align:'c', cor:CINZA_PDF});

  const yr = A4A - M - 8;
  pg.linha(M, yr-10, A4L-M, yr-10, 0.4, LINHA_PDF);
  pg.txt(A4L/2, yr, 'Emitido pelo app de pedidos em '+dbr(hoje())+' · tabela '+cfg.tabelaVersao+
    (ped.demo ? ' · PEDIDO DE EXEMPLO, SEM VALIDADE' : ''),
    {tam:7.5, align:'c', cor:CINZA_PDF});

  /* ---- página do documento do cliente ---- */
  if(ped.anexo && ped.anexo.dados){
    try{
      const b64 = ped.anexo.dados.split(',')[1];
      const bin = atob(b64);
      recursos.Anexo1 = { w: ped.anexo.w, h: ped.anexo.h, bytes: bin };
      const pgA = NovaPagina(A4L, A4A);
      paginas.push(pgA);
      pgA.txt(M, M+10, 'Pedido original do cliente', {tam:11, negrito:true});
      pgA.txt(M, M+24, 'Anexo do pedido '+ped.num+
        (cli.fantasia||cli.razao ? ' — '+(cli.fantasia||cli.razao) : ''), {tam:8.5, cor:CINZA_PDF});
      pgA.linha(M, M+34, A4L-M, M+34, 1, LINHA_PDF);
      const dispW = A4L - 2*M, dispH = A4A - M - (M+52);
      const escala = Math.min(dispW/ped.anexo.w, dispH/ped.anexo.h);
      const iw = ped.anexo.w*escala, ih = ped.anexo.h*escala;
      pgA.imagem('Anexo1', M + (dispW-iw)/2, M+52, iw, ih);
    }catch(e){}
  }

  return montarPdf(paginas, recursos);
}

/* ---------- planilha do pedido ---------- */
function csvDoPedido(ped){
  const c = clienteDe(ped) || {};
  const L = [];
  L.push(['Pedido','PedidoCliente','Data','DataEntrega','Situacao','Cliente','CNPJ','Canal','Cidade','Pagamento'].join(';'));
  L.push([ped.num, ped.numCliente||'', dbr(ped.data), dbr(ped.dataEntrega)||'', ped.status, c.razao||'',
          cnpjBonito(c.cnpj)||'', CANAL_NOME[c.canal]||'', c.cidade||'', ped.cond||''
         ].map(csvCampo).join(';'));
  L.push('');
  L.push(['Item','Codigo','Produto','Caixas','PesoKg','PrecoCaixa','PrecoPacote','PrecoUnidade','Total'].join(';'));
  ped.itens.forEach((it,i)=>{
    const p = porId[it.skuId] || {};
    L.push([i+1, it.cod, it.nome, nm(it.qtd), csvNum(kgDe(p,it.un)*it.qtd),
            csvNum(it.preco), p.pPacote?csvNum(p.pPacote):'', p.pUnidade?csvNum(p.pUnidade):'',
            csvNum(it.preco*it.qtd)].map(csvCampo).join(';'));
  });
  const t = totais(ped);
  L.push('');
  L.push(['','','Subtotal','','','','','',csvNum(t.bruto)].join(';'));
  if(t.desc>0) L.push(['','','Desconto '+vlr(ped.desc).replace(/,00$/,'')+'%','','','','','','-'+csvNum(t.desc)].join(';'));
  L.push(['','','Total','',csvNum(t.kg),'','','',csvNum(t.liquido)].join(';'));
  if(ped.obs) { L.push(''); L.push(['Observacoes', ped.obs].map(csvCampo).join(';')); }
  return L.join('\r\n');
}

/* ---------- entrega dos arquivos ---------- */
function nomeArquivo(ped, ext, paraCliente){
  const c = clienteDe(ped);
  const apelido = c ? sac(c.fantasia||c.razao).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24) : 'pedido';
  return (paraCliente?'confirmacao-':'pedido-')+ped.num+'-'+apelido+'.'+ext;
}

ACOES.gerarPDF = (id, variante) => {
  const ped = pedidoPorId(id); if(!ped) return;
  if(!ped.itens.length){ aviso('O pedido está sem itens.'); return; }
  const paraCliente = variante === 'cliente';
  try{
    const bytes = pdfDoPedido(ped, paraCliente);
    baixar(nomeArquivo(ped,'pdf',paraCliente), bytes.buffer.slice(0), 'application/pdf');
  }catch(e){ aviso('Não consegui montar o PDF: '+e.message); }
};
ACOES.gerarCSVPedido = id => {
  const ped = pedidoPorId(id); if(!ped) return;
  baixar(nomeArquivo(ped,'xlsx'), xlsxDoPedido(ped), TIPO_XLSX);
};

/* Compartilhar abre a folha do aparelho com os arquivos já anexados —
   é o único caminho que leva PDF e planilha juntos para o WhatsApp ou o e-mail. */
ACOES.compartilhar = async (id, variante) => {
  const ped = pedidoPorId(id); if(!ped) return;
  if(!ped.itens.length){ aviso('O pedido está sem itens.'); return; }
  if(ehExemplo(ped)) return;
  const paraCliente = variante === 'cliente';
  let arquivos;
  try{
    arquivos = [ new File([pdfDoPedido(ped, paraCliente)],
                          nomeArquivo(ped,'pdf',paraCliente), {type:'application/pdf'}) ];
    if(!paraCliente) arquivos.push(new File([xlsxDoPedido(ped)], nomeArquivo(ped,'xlsx'), {type:TIPO_XLSX}));
    if(!paraCliente && ped.anexo && ped.anexo.dados){
      const bin = atob(ped.anexo.dados.split(',')[1]);
      const b = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
      arquivos.push(new File([b], 'pedido-original-'+ped.num+'.jpg', {type:'image/jpeg'}));
    }
  }catch(e){ aviso('Não consegui preparar os arquivos.'); return; }

  /* o pedido em tabela ja fica copiado antes de abrir a folha: se ele escolher o e-mail,
     e so colar no corpo por cima do texto simples (e-mail aberto por link nao aceita HTML) */
  try{ await copiarRico(emailHtml(ped, paraCliente), montarTexto(ped, false, paraCliente)); }catch(e){}

  /* O Chrome do Android (e do Windows) so aceita na folha de compartilhar alguns tipos de
     arquivo: PDF, foto, texto. Planilha .xlsx ele recusa e a folha nem abre. Nesse caso o
     pedido vai sem a planilha, e o app avisa em seguida como mandar ela a parte. */
  let semPlanilha = false;
  if(navigator.canShare && !navigator.canShare({files:arquivos})){
    const so = arquivos.filter(f=>f.type!==TIPO_XLSX);
    if(so.length && so.length<arquivos.length && navigator.canShare({files:so})){ arquivos = so; semPlanilha = true; }
  }

  const cli = clienteDe(ped) || {};
  try{
    if(navigator.canShare && navigator.canShare({files:arquivos})){
      await navigator.share({
        files: arquivos,
        title: assuntoPedido(ped, paraCliente),
        text: resumoTexto(ped, paraCliente, semPlanilha)
      });
      if(semPlanilha) avisarPlanilhaFicou(ped);
      else if(!paraCliente) perguntarSeSaiu(ped);
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   /* desistiu na folha de compartilhar */
  }
  modal('Compartilhar não está disponível aqui',
    '<p style="margin:2px 0 12px;font-size:calc(14.5px * var(--esc));line-height:1.5">'+
    'Este navegador não deixa mandar arquivo direto para o WhatsApp ou o e-mail. '+
    'Salve os arquivos e anexe você mesmo — leva o mesmo tempo. '+
    'O pedido em tabela já está copiado para colar no corpo do e-mail.</p>',
    '<div class="linha-bt">'+
    '<button class="bt bt-l" data-a="gerarPDF" data-i="'+esc(ped.id)+'" data-v="'+(paraCliente?'cliente':'')+'">Salvar PDF</button>'+
    (paraCliente?'':'<button class="bt bt-l" data-a="gerarCSVPedido" data-i="'+esc(ped.id)+'">Salvar planilha</button>')+'</div>');
};
/* Depois da folha, quando a planilha ficou de fora (regra do Chrome no Android) */
function avisarPlanilhaFicou(ped){
  modal('O PDF foi. A planilha ficou.',
    '<p style="margin:2px 0 10px;font-size:calc(14.5px * var(--esc));line-height:1.5">'+
    'A folha de compartilhar deste aparelho não aceita planilha do Excel (.xlsx) — é uma '+
    'regra do Chrome no Android, não do app. O PDF e a mensagem foram normalmente.</p>'+
    '<div class="peq">Se a indústria precisar da planilha: salve aqui e anexe pelo próprio e-mail. '+
    'O pedido em tabela também já está copiado, com todos os itens, para colar no corpo.</div>',
    '<button class="bt bt-p bt-bloco" data-a="planilhaESeguir" data-i="'+esc(ped.id)+'">'+ico('baixar')+'Salvar planilha</button>'+
    '<button class="bt bt-t bt-bloco mt10" data-a="seguirSemPlanilha" data-i="'+esc(ped.id)+'">Não precisa</button>');
}
ACOES.planilhaESeguir = id => {
  const ped = pedidoPorId(id); if(!ped) return;
  baixar(nomeArquivo(ped,'xlsx'), xlsxDoPedido(ped), TIPO_XLSX);
  fechaModal(); setTimeout(()=>perguntarSeSaiu(ped), 250);
};
ACOES.seguirSemPlanilha = id => {
  const ped = pedidoPorId(id); fechaModal();
  if(ped) setTimeout(()=>perguntarSeSaiu(ped), 250);
};

/* ---------- documento original do cliente ---------- */
ACOES.anexarDoc = id => {
  const ped = pedidoPorId(id); if(!ped) return;
  const ent = document.createElement('input');
  ent.type = 'file';
  ent.accept = 'image/*';
  ent.onchange = () => {
    const f = ent.files[0]; if(!f) return;
    aviso('Preparando a foto...');
    comprimirFoto(f, res=>{
      if(!res){ aviso('Não consegui ler essa imagem.'); return; }
      ped.anexo = res;
      gravar(); render();
      aviso('Documento anexado ao pedido '+ped.num);
    });
  };
  ent.click();
};
ACOES.verDoc = id => {
  const ped = pedidoPorId(id); if(!ped || !ped.anexo) return;
  modal('Pedido original do cliente',
    '<img src="'+ped.anexo.dados+'" alt="Documento do pedido" '+
    'style="width:100%;border-radius:10px;border:1px solid var(--linha)">'+
    '<div class="peq" style="margin-top:9px">'+ped.anexo.w+' × '+ped.anexo.h+' · '+
    Math.round(ped.anexo.dados.length/1400)+' KB · vai como última página do PDF.</div>',
    '<div class="linha-bt"><button class="bt bt-l" data-a="fechaModal">Fechar</button>'+
    '<button class="bt bt-l" data-a="tirarDoc" data-i="'+esc(ped.id)+'" style="color:var(--terracota)">Remover</button></div>');
};
ACOES.tirarDoc = id => {
  const ped = pedidoPorId(id); if(!ped) return;
  delete ped.anexo; gravar(); fechaModal(); render(); aviso('Documento removido');
};

function comprimirFoto(arquivo, pronto){
  const fr = new FileReader();
  fr.onerror = () => pronto(null);
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => pronto(null);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const maior = Math.max(w,h), teto = 1400;
      if(maior > teto){ const f = teto/maior; w = Math.round(w*f); h = Math.round(h*f); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.6, dados = cv.toDataURL('image/jpeg', q);
      while(dados.length > 300000 && q > 0.25){ q -= 0.1; dados = cv.toDataURL('image/jpeg', q); }
      pronto({ dados:dados, w:w, h:h, em:new Date().toISOString() });
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(arquivo);
}

function sorteador(semente){
  let x = semente;
  return () => { x = (x*1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; };
}
function diasAtras(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  return D.clientes.some(c=>c.demo) || D.pedidos.some(p=>p.demo);

function carregarExemplo(){
  const r = sorteador(20260930);

  const ids = CLI_EXEMPLO.map((c,i)=>{
    const id = 'exemplo-c'+(i+1);
    D.clientes.push({
      id:id, demo:true, razao:c.n, fantasia:c.f, rede:c.rd||'', loja:c.lj||'',
      cnpj:'', canal:c.ca,
      contato:c.ct, whats:'', email:'', endereco:'', bairro:c.br||'', cidade:c.ci,
      cond:c.co, obs:'Cliente de exemplo, criado só para você testar o app.',
      criadoEm:new Date().toISOString()
    });
    return id;
  });

  ROTEIRO.slice().sort((a,b)=>b.d-a.d).forEach(linha=>{
    const molde = CLI_EXEMPLO[linha.c];
    const pool = POOLS[molde.pool].filter(id=>porId[id]);
    if(!pool.length) return;

    const quantos = molde.it[0] + Math.floor(r()*(molde.it[1]-molde.it[0]+1));
    const escolhidos = [];
    const baralho = pool.slice();
    for(let k=0; k<quantos && baralho.length; k++){
      escolhidos.push(baralho.splice(Math.floor(r()*baralho.length),1)[0]);
    }

    D.seq++;
    const ped = {
      id:'exemplo-p'+D.seq, demo:true,
      num:(D.cfg.prefixo||'') + String(D.seq).padStart(4,'0'),
      clienteId: ids[linha.c],
      data: diasAtras(linha.d),
      status: linha.s,
      itens: escolhidos.map(sku=>{
        const p = porId[sku];
        return { skuId:sku, cod:p.cod, nome:p.nome, un:'CX',
                 qtd: molde.q[0] + Math.floor(r()*(molde.q[1]-molde.q[0]+1)),
                 preco: p.pCaixa };
      }),
      desc: r()<0.25 ? [2,3,5][Math.floor(r()*3)] : 0,
      cond: molde.co, obs:'',
      criadoEm:new Date().toISOString(),
      enviadoEm: (linha.s==='Rascunho'||linha.s==='Fechado') ? null : new Date().toISOString()
    };
    D.pedidos.unshift(ped);
  });

  /* meta coerente com o que foi gerado, para o semáforo dizer algo */
  const ym = hoje().slice(0,7);

    .filter(p=>p.demo && VALE(p.status) && p.data.slice(0,7)===ym)
    .reduce((s,p)=>s+totais(p).liquido, 0);
  const meta = Math.max(5000, Math.round(doMes/0.82/500)*500);
  const caixas = D.pedidos
    .filter(p=>p.demo && VALE(p.status) && p.data.slice(0,7)===ym)
    .reduce((s,p)=>s+totais(p).cx, 0);

  D.demoCfg = { metaMes:meta, metaCaixas:Math.round(caixas/0.82/10)*10, repNome:'Vendedor de exemplo' };
  for(const k in D.demoCfg){ if(!D.cfg[k]) D.cfg[k] = D.demoCfg[k]; }

  gravar();
}

function apagarExemplo(){
  D.clientes = D.clientes.filter(c=>!c.demo);
  D.pedidos  = D.pedidos.filter(p=>!p.demo);
  if(D.rascunhoId && !pedidoPorId(D.rascunhoId)) D.rascunhoId = null;

  /* devolve os ajustes que o exemplo tinha preenchido, se ninguém mexeu neles */
  if(D.demoCfg){
    for(const k in D.demoCfg){
      if(D.cfg[k] === D.demoCfg[k]) D.cfg[k] = CFG_PADRAO[k];
    }
    delete D.demoCfg;

  /* numeração recomeça de onde os pedidos reais pararam */
  let maior = 0;
  D.pedidos.forEach(p=>{
    const n = parseInt(String(p.num).replace(/\D/g,''), 10);

  D.seq = maior;

  gravar();

/* Um mês inteiro destrinchado por cliente, por SKU e por rede.
   Tudo que as telas de análise mostram sai daqui. */
function analisePer(P){
  const f = perFaixa(P);
  const peds = pedidosValidos().filter(p=>p.data>=f.ini && p.data<=f.fim);
  const cli = {};        /* clienteId -> {val, cx, kg, peds} */
  const sku = {};        /* skuId     -> {nome, cod, canal, val, cx, kg} */
  const cat = {};        /* categoria -> val */
  let total = 0;

  peds.forEach(p=>{
    const t = totais(p);
    total += t.liquido;
    if(p.clienteId){
      const c = cli[p.clienteId] || (cli[p.clienteId] = {val:0, cx:0, kg:0, peds:0});
      c.val += t.liquido; c.cx += t.cx; c.kg += t.kg; c.peds++;
    }
    /* o desconto do pedido é rateado no item, senão a soma dos SKUs
       não fecha com o faturamento */
    const fator = t.bruto>0 ? t.liquido/t.bruto : 1;
    (p.itens||[]).forEach(it=>{
      const pr = porId[it.skuId] || {};
      const s = sku[it.skuId] || (sku[it.skuId] =
        {nome:it.nome, cod:it.cod, canal:pr.canal||'', categoria:pr.categoria||'—',
         val:0, cx:0, kg:0});
      const v = it.preco*it.qtd*fator;
      s.val += v;
      s.cx  += caixasEquiv(pr, it.un, it.qtd);
      s.kg  += kgDe(pr, it.un)*it.qtd;
      cat[s.categoria] = (cat[s.categoria]||0) + v;
    });
  });
  return {P:P, total:total, nPedidos:peds.length, cli:cli, sku:sku, cat:cat};
}

/* Compara dois meses e devolve a lista já ordenada, com a variação.
   `chaves` é a união dos dois meses: quem sumiu importa tanto quanto quem cresceu. */
function comparar(agora, antes, nome){
  const chaves = {};
  Object.keys(agora).forEach(k=>chaves[k]=1);
  Object.keys(antes).forEach(k=>chaves[k]=1);
  return Object.keys(chaves).map(k=>{
    const a = agora[k] ? agora[k].val : 0;
    const b = antes[k] ? antes[k].val : 0;
    return {
      id:k, nome:nome(k, agora[k]||antes[k]),
      agora:a, antes:b, dif:a-b,
      pct: b>0 ? (a/b-1)*100 : (a>0 ? null : 0),   /* null = estreante */
      dados: agora[k] || null
    };
  }).sort((x,y)=>y.agora-x.agora);
}

/* --------- redes: várias lojas, uma bandeira --------- */
function redesDoPer(P){
  const a = analisePer(P), b = analisePer(perAnt(P));
  const redes = {};
  D.clientes.forEach(c=>{
    const k = chaveRede(c.rede);
    if(!k) return;
    const r = redes[k] || (redes[k] =
      {nome:c.rede, lojas:[], val:0, antes:0, cx:0, kg:0, peds:0, compraram:0});
    r.lojas.push(c);
    const da = a.cli[c.id], db = b.cli[c.id];
    if(da){ r.val += da.val; r.cx += da.cx; r.kg += da.kg; r.peds += da.peds; r.compraram++; }
    if(db){ r.antes += db.val; }
  });
  return Object.keys(redes).map(k=>{
    const r = redes[k]; r.chave = k;
    r.pct = r.antes>0 ? (r.val/r.antes-1)*100 : (r.val>0?null:0);
    r.posit = r.lojas.length ? r.compraram/r.lojas.length*100 : 0;
    r.ticket = r.peds ? r.val/r.peds : 0;
    return r;
  }).sort((x,y)=>y.val-x.val);
}

/* Faturamento dos últimos n meses, para o gráfico mensal. */
function serieMeses(ymFim, n){
  const out = [];
  let ym = ymFim;
  for(let i=0;i<n;i++){ out.unshift(ym); ym = mesVizinho(ym,-1); }
  return out.map(y=>{
    let v=0, cx=0;
    pedidosValidos().forEach(p=>{
      if(p.data.slice(0,7)===y){ const t=totais(p); v+=t.liquido; cx+=t.cx; }
    });
    return {ym:y, val:v, cx:cx};
  });
}

function graficoMeses(serie, meta){
  const W=340, H=142, x0=10, x1=330, yTopo=14, yBase=112;
  const n = serie.length, larg=(x1-x0)/n, bw=Math.min(34, larg*0.56);
  let max = meta>0 ? meta : 0;
  serie.forEach(s=>{ if(s.val>max) max=s.val; });
  if(max<=0) max=1;
  const y = v => yBase - (v/max)*(yBase-yTopo);
  let barras='', rot='';
  serie.forEach((s,i)=>{
    const cx = x0+larg*i+larg/2;
    const ult = i===n-1;
    const alt = Math.max(s.val>0?3:1.5, yBase-y(s.val));
    barras += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(yBase-alt).toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+alt.toFixed(1)+'" rx="3" fill="'+(ult?'#33302E':'#F2A900')+'"/>';
    if(s.val>0)
      barras += '<text x="'+cx.toFixed(1)+'" y="'+(yBase-alt-4).toFixed(1)+'" text-anchor="middle" '+
        'font-size="9" font-weight="700" fill="#5C5854" font-family="system-ui,sans-serif">'+
        (s.val>=1000? nm(s.val/1000,s.val<10000?1:0)+'k' : nm(s.val,0))+'</text>';
    rot += '<text x="'+cx.toFixed(1)+'" y="127" text-anchor="middle" font-size="9" fill="#8A8A8A" '+
      'font-family="system-ui,sans-serif">'+MES_NOME[Number(s.ym.slice(5,7))-1].slice(0,3)+'</text>';
  });
  const linhaMeta = meta>0 ?
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+y(meta).toFixed(1)+'" y2="'+y(meta).toFixed(1)+
    '" stroke="#8A3324" stroke-width="1.2" stroke-dasharray="4 3" opacity=".75"/>' : '';
  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" '+
    'role="img" aria-label="Faturamento dos últimos meses">'+
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+yBase+'" y2="'+yBase+'" stroke="#E6E0D8"/>'+
    linhaMeta + barras + rot + '</svg>';
}

/* Lista agrupada por bairro/cidade: é assim que ele monta o dia de rua,
   em vez de cruzar a serra atrás de um cliente de cada vez. */
function listaPorRegiao(clientes, rotuloDe){
  const grupos = {}, ordem = [];
  clientes.forEach(c=>{
    const g = regiao(c) || 'Sem bairro no cadastro';
    if(!grupos[g]){ grupos[g] = []; ordem.push(g); }
    grupos[g].push(c);
  });
  ordem.sort((a,b)=> grupos[b].length - grupos[a].length || a.localeCompare(b,'pt-BR'));
  let h = '';
  ordem.forEach(g=>{
    h += '<div class="secao" style="display:flex;justify-content:space-between;align-items:baseline">'+
      '<span>'+esc(g)+'</span><span style="text-transform:none;letter-spacing:0;'+
      'font-weight:750;color:var(--grafite3)">'+grupos[g].length+'</span></div><div class="cartao">';
    grupos[g].forEach(c=>{
      h += '<button class="lin" data-a="verCliente" data-i="'+esc(c.id)+'">'+
        '<span class="ini">'+esc(iniciais(c.fantasia||c.razao))+'</span>'+

        '<span class="seta">'+ico('seta')+'</span></button>';

}

      rotuloDe = c => '<span class="et et-al">nunca comprou</span>';
    }

    let h = chipsCorteCli();
    h += '<div class="secao">'+esc(titulo)+' ('+alvo.length+')</div>';
    if(!alvo.length)
      return h + '<div class="cartao"><div class="vazio">'+ico('check')+'<p>Nenhum nesta lista</p>'+
        '<span>Nada a recuperar por aqui — o que já é uma boa notícia.</span></div></div>';
    h += '<div class="aviso" style="margin-bottom:10px">'+ico('alerta')+'<span>'+aviso1+'</span></div>';
    h += '<div class="peq" style="margin:0 3px 4px">Agrupados por bairro e cidade, para fechar '+
      'a rua num dia só.</div>';
    h += listaPorRegiao(alvo, rotuloDe);
    return h;
  }

  const lista = comparar(a.cli, b.cli, id=>{
    const c = clientePorId(id); return c ? nomeCli(c) : 'Cliente removido';
  }).filter(x=>clientePorId(x.id));

  if(!lista.length)
    return chipsCorteCli() + '<div class="cartao"><div class="vazio">'+ico('clientes')+
      '<p>Nenhuma venda em '+esc(perRot(PER))+'</p>'+
      '<span>Assim que houver pedidos fechados no período, o comparativo por cliente aparece '+
      'aqui. Os outros cortes acima funcionam mesmo sem venda.</span>'+
      '</div></div>';

  const sobem = lista.filter(x=>x.dif>0.5).sort((x,y)=>y.dif-x.dif);
  const caem  = lista.filter(x=>x.dif<-0.5).sort((x,y)=>x.dif-y.dif);
  const ganho = sobem.reduce((s,x)=>s+x.dif,0);
  const perda = caem.reduce((s,x)=>s+x.dif,0);

  let h = chipsCorteCli() + '<div class="kpis">'+
    kpi('Clientes que compraram', nm(lista.filter(x=>x.agora>0).length),
        'de '+D.clientes.length+' na carteira') +
    kpi('Saldo do período', brl0(ganho+perda),
        'ganhou '+brl0(ganho)+' · perdeu '+brl0(Math.abs(perda)),
        (ganho+perda)>=0?'v-verde':'v-terra') +
  '</div>';

  if(sobem.length){
    h += '<div class="secao">Crescendo ('+sobem.length+')</div><div class="cartao">';
    sobem.slice(0,8).forEach(x=>{
      const c = clientePorId(x.id);
      h += linhaVar(x, (c.rede?'<span class="et et-rede">'+esc(c.rede)+'</span>':'')+
        '<span>'+(x.antes>0 ? '+'+brl0(x.dif)+' que antes'
                            : 'não comprava no período anterior')+'</span>', 'verCliente', x.id);
    });
    h += '</div>';
  }
  if(caem.length){
    h += '<div class="secao">Caindo ('+caem.length+')</div><div class="cartao">';
    caem.slice(0,8).forEach(x=>{
      const c = clientePorId(x.id);
      h += linhaVar(x, (c.rede?'<span class="et et-rede">'+esc(c.rede)+'</span>':'')+
        '<span>'+(x.agora===0?'não comprou · fazia '+brl0(x.antes)
                             :'−'+brl0(Math.abs(x.dif))+' que antes')+'</span>',
        'verCliente', x.id);
    });
    h += '</div>';
  }

  h += '<div class="secao">Todos os clientes do mês</div><div class="cartao">';
  lista.filter(x=>x.agora>0).forEach(x=>{
    const c = clientePorId(x.id), d = x.dados;
    h += linhaVar(x,
      (c.rede?'<span class="et et-rede">'+esc(c.rede)+'</span>':'')+
      '<span>'+d.peds+' pedido'+(d.peds===1?'':'s')+'</span>'+
      '<span>'+nm(d.cx, d.cx%1?1:0)+' cx</span>'+
      '<span>ticket '+brl0(d.val/d.peds)+'</span>',
      'verCliente', x.id);
  });
  h += '</div>';
  return h;
}

/* =====================================================

function painelProdutos(){
  const a = analisePer(PER), b = analisePer(perAnt(PER));
  const lista = comparar(a.sku, b.sku, (id,d)=> d ? d.nome : id);

  if(!a.total)
    return '<div class="cartao"><div class="vazio">'+ico('caixa')+
      '<p>Nenhum produto vendido em '+esc(perRot(PER))+'</p>'+
      '<span>O comparativo de SKU aparece quando houver pedidos fechados no mês.</span></div></div>';

  const sobem = lista.filter(x=>x.dif>0.5).sort((x,y)=>y.dif-x.dif);
  const caem  = lista.filter(x=>x.dif<-0.5).sort((x,y)=>x.dif-y.dif);
  const vendidos = lista.filter(x=>x.agora>0);

  let h = '<div class="kpis">'+
    kpi('SKUs vendidos', nm(vendidos.length), 'de '+CAT.length+' no catálogo') +
    kpi('Concentração', vendidos.length ? nm(vendidos.slice(0,3).reduce((s,x)=>s+x.agora,0)/a.total*100,0)+'%' : '—',
        'os 3 maiores no faturamento') +

  /* mix por categoria: onde o dinheiro está */
  const cats = Object.keys(a.cat).map(k=>({nome:k, val:a.cat[k]})).sort((x,y)=>y.val-x.val);
  if(cats.length){
    h += '<div class="cartao"><div class="cab">'+ico('painel')+'<h2>Por categoria</h2></div>'+
      '<div class="corpo">';

      h += '<div class="rank"><span class="nm" style="flex:1">'+
        '<span style="display:block">'+esc(c.nome)+'</span>'+
        '<span class="mini"><i style="width:'+((c.val/maxc)*100).toFixed(1)+'%"></i></span></span>'+
        '<span class="vl">'+brl0(c.val)+
        '<br><span style="font-size:calc(11px * var(--esc));color:var(--cinza);font-weight:600">'+
        nm(c.val/a.total*100,0)+'%</span></span></div>';
    });
    h += '</div></div>';
  }

  if(sobem.length){
    h += '<div class="secao">SKU em crescimento ('+sobem.length+')</div><div class="cartao">';
    sobem.slice(0,8).forEach(x=>{
      const d = x.dados;
      h += linhaVar(x, '<span class="et et-cod">'+esc((x.dados||{}).cod || (b.sku[x.id]||{}).cod || '')+'</span>'+
        '<span>'+(x.antes>0 ? '+'+brl0(x.dif) : 'não saía antes')+'</span>'+
        (d?'<span>'+nm(d.cx,d.cx%1?1:0)+' cx</span>':''));
    });
    h += '</div>';
  }
  if(caem.length){
    h += '<div class="secao">SKU em queda ('+caem.length+')</div><div class="cartao">';
    caem.slice(0,8).forEach(x=>{
      h += linhaVar(x, '<span class="et et-cod">'+esc((x.dados||{}).cod || (b.sku[x.id]||{}).cod || '')+'</span>'+
        '<span>'+(x.agora===0?'parou de sair · fazia '+brl0(x.antes):'−'+brl0(Math.abs(x.dif)))+'</span>');
    });
    h += '</div>';
  }

  h += '<div class="secao">Tudo que saiu no período</div><div class="cartao">';
  vendidos.forEach(x=>{
    const d = x.dados;
    h += linhaVar(x, '<span class="et et-cod">'+esc(d.cod)+'</span>'+
      '<span>'+nm(d.cx, d.cx%1?1:0)+' cx · '+nm(d.kg,0)+' kg</span>'+
      '<span>'+nm(x.agora/a.total*100,1)+'% do período</span>');
  });
  h += '</div>';
  return h;
}

/* =====================================================
   TELA DE UMA REDE
   ===================================================== */
function telaRede(){
  const alvo = chaveRede(VISTA.id);
  const r = redesDoPer(PER).filter(x=>x.chave===alvo)[0];
  if(!r){ VISTA=null; return telaPainel(); }

  const a = analisePer(PER), b = analisePer(perAnt(PER));
  const fx = perFaixa(PER);
  const dentro = {}, dentroAntes = {};
  r.lojas.forEach(c=>{
    if(a.cli[c.id]) dentro[c.id] = a.cli[c.id];
    if(b.cli[c.id]) dentroAntes[c.id] = b.cli[c.id];
  });
  const lojas = comparar(dentro, dentroAntes, id=>{
    const c = clientePorId(id); return c ? (c.loja || c.fantasia || c.razao) : '—';
  });
  const naoCompraram = r.lojas.filter(c=>!a.cli[c.id]);

  /* SKU dentro da rede: o que a bandeira compra é diferente do total */
  const skuRede = {};
  pedidosValidos().forEach(p=>{
    if(p.data<fx.ini || p.data>fx.fim) return;
    const c = clientePorId(p.clienteId);
    if(!c || chaveRede(c.rede)!==alvo) return;
    const t = totais(p), fator = t.bruto>0 ? t.liquido/t.bruto : 1;
    (p.itens||[]).forEach(it=>{
      const pr = porId[it.skuId] || {};
      const s = skuRede[it.skuId] || (skuRede[it.skuId] = {nome:it.nome, cod:it.cod, val:0, cx:0});
      s.val += it.preco*it.qtd*fator;
      s.cx  += caixasEquiv(pr, it.un, it.qtd);
    });
  });
  const topSku = Object.keys(skuRede).map(k=>skuRede[k]).sort((x,y)=>y.val-x.val).slice(0,8);

  /* série da rede nos últimos 6 meses */
  const serie = [];
  let ym = fx.fim.slice(0,7);
  const meses = []; for(let i=0;i<6;i++){ meses.unshift(ym); ym = mesVizinho(ym,-1); }
  meses.forEach(y=>{
    let v=0, cx=0;
    pedidosValidos().forEach(p=>{
      if(p.data.slice(0,7)!==y) return;
      const c = clientePorId(p.clienteId);
      if(!c || chaveRede(c.rede)!==alvo) return;
      const t = totais(p); v+=t.liquido; cx+=t.cx;
    });
    serie.push({ym:y, val:v, cx:cx});
  });

  const cPos = r.posit>=70?'v-verde': r.posit>=40?'v-ambar':'v-terra';

  let h = '<div class="cartao"><div class="corpo">'+
    '<div class="rot" style="font-size:calc(11px * var(--esc));font-weight:700;letter-spacing:.5px;'+
      'text-transform:uppercase;color:var(--cinza);margin-bottom:4px">'+esc(perRot(PER))+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'+
      '<div style="font-size:calc(29px * var(--esc));font-weight:800;letter-spacing:-1px;line-height:1">'+brl0(r.val)+'</div>'+
      (r.pct===null?'<span class="var v-verde">novo</span>':(r.antes?setinha(r.pct):''))+
    '</div>'+
    (r.antes?'<div class="peq" style="margin-top:5px">'+brl0(r.antes)+' em '+esc(perCurto(perAnt(PER)))+'</div>':'')+
    '<hr><table class="tabelinha">'+
      '<tr><td>Lojas que compraram</td><td class="'+cPos+'">'+r.compraram+' de '+r.lojas.length+
        ' ('+nm(r.posit,0)+'%)</td></tr>'+
      '<tr><td>Pedidos no período</td><td>'+r.peds+'</td></tr>'+
      '<tr><td>Ticket médio</td><td>'+brl0(r.ticket)+'</td></tr>'+
      '<tr><td>Caixas · peso</td><td>'+nm(r.cx,r.cx%1?1:0)+' cx · '+nm(r.kg,0)+' kg</td></tr>'+
      (r.compraram?'<tr><td>Média por loja ativa</td><td>'+brl0(r.val/r.compraram)+'</td></tr>':'')+
    '</table></div></div>';

  h += '<div class="cartao"><div class="cab">'+ico('painel')+'<h2>Últimos 6 meses</h2></div>'+
    '<div class="corpo" style="padding:10px 6px 12px">'+graficoMeses(serie,0)+'</div></div>';

  h += '<div class="secao">Loja a loja</div><div class="cartao">';
  lojas.forEach(x=>{
    const c = clientePorId(x.id), d = x.dados;
    h += linhaVar(x, (c && c.cidade?'<span>'+esc(c.cidade)+'</span>':'')+
      (d?'<span>'+d.peds+' pedido'+(d.peds===1?'':'s')+'</span><span>'+
         nm(d.cx,d.cx%1?1:0)+' cx</span>':'<span>não comprou no mês</span>'),
      'verCliente', x.id);
  });
  if(!lojas.length) h += '<div class="corpo peq">Nenhuma loja desta rede comprou no período.</div>';
  h += '</div>';

  if(naoCompraram.length){
    h += '<div class="secao">Lojas sem pedido no período ('+naoCompraram.length+')</div>'+
      '<div class="aviso" style="margin-bottom:10px">'+ico('alerta')+
      '<span>A bandeira já compra de você. Estas lojas são a venda mais barata que existe: '+
      'o produto já está aprovado na rede.</span></div><div class="cartao">';
    naoCompraram.forEach(c=>{
      const rc = resumoCliente(c.id);
      h += '<button class="lin" data-a="verCliente" data-i="'+esc(c.id)+'">'+
        '<span class="ini">'+esc(iniciais(c.loja||c.fantasia||c.razao))+'</span>'+
        '<span class="info"><span class="nm">'+esc(c.loja||c.fantasia||c.razao)+'</span>'+
        '<span class="sub">'+(c.cidade?'<span>'+esc(c.cidade)+'</span>':'')+
        '<span class="et et-al">'+(rc.dias===null?'nunca comprou':rc.dias+' dias')+'</span></span></span>'+
        '<span class="seta">'+ico('seta')+'</span></button>';
    });
    h += '</div>';
  }

  if(topSku.length){
    h += '<div class="secao">O que esta rede compra</div><div class="cartao"><div class="corpo">';
    const maxv = topSku[0].val||1;
    topSku.forEach((s,i)=>{
      h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
        '<span class="nm" style="flex:1"><span style="display:block">'+esc(s.nome)+'</span>'+
        '<span class="mini"><i style="width:'+((s.val/maxv)*100).toFixed(1)+'%"></i></span></span>'+
        '<span class="vl">'+brl0(s.val)+
        '<br><span style="font-size:calc(11px * var(--esc));color:var(--cinza);font-weight:600">'+
        nm(s.cx,s.cx%1?1:0)+' cx</span></span></div>';
    });
    h += '</div></div>';
  }
  return h;
}

/* =====================================================
   E-MAIL DO PEDIDO
   Assunto que já diz tudo na caixa de entrada, e um corpo
   em tabela de verdade — dados selecionáveis, não imagem,
   para o faturamento copiar direto para a planilha.
   ===================================================== */

function assuntoPedido(ped, paraCliente){
  const cli = clienteDe(ped) || {};
  const t = totais(ped);
  const quem = cli.fantasia || cli.razao || 'cliente';
  const onde = [cli.loja, cli.cidade].filter(Boolean).join(', ');
  /* o numero que vai na frente e o do CLIENTE (e o que a industria usa na nota);
     o do representante vai no fim, com nome de referencia, para ninguem confundir */
  const partes = [];
  if(paraCliente) partes.push('Confirmação de pedido' + (ped.numCliente ? ' ' + ped.numCliente : ''));
  else partes.push(ped.numCliente ? 'Pedido de compra ' + (/^[A-Za-z]/.test(ped.numCliente) ? ped.numCliente : 'nº '+ped.numCliente)
                                  : 'Pedido (sem nº do cliente)');
  partes.push(quem + (onde ? ' ('+onde+')' : ''));
  if(ped.dataEntrega) partes.push('entrega '+dbr(ped.dataEntrega).slice(0,5));
  partes.push(brl(t.liquido));
  partes.push('ref. ' + ped.num);
  return partes.join(' — ');
}

/* =====================================================
   E-MAIL DIRETO PELO GMAIL (API do Google) — sem biblioteca
   O Anderson autoriza uma vez neste aparelho; o e-mail sai da conta dele,
   com o pedido em tabela no corpo e PDF + planilha anexados.
   Fluxo: redireciona para o Google (response_type=token), volta com o
   token no #hash, guarda 1 h em K_GMAIL e retoma o envio pendente.
   ===================================================== */
const GMAIL_CLIENT_ID = '155708121820-afqmuubq34fq2o1v7snba388smtiuhmt.apps.googleusercontent.com';
const GMAIL_ESCOPO = 'https://www.googleapis.com/auth/gmail.send';
let GM = lerJSON(K_GMAIL, null);
function gmailToken(){ return (GM && GM.token && GM.exp > Date.now()+60000) ? GM.token : null; }
function gmailRedirect(){ return location.origin + location.pathname; }
function gmailPedirAcesso(pendente){
  const e = encodeURIComponent;
  try{ localStorage.setItem('harus.gmail.pendente', JSON.stringify(pendente||{})); }catch(x){}
  const st = 'g'+Math.random().toString(36).slice(2);
  try{ localStorage.setItem('harus.gmail.state', st); }catch(x){}
  /* sem login_hint: o e-mail da nuvem pode nao ser a conta Google do aparelho (foi o caso no
     teste do Willian) e o Google ficava pedindo a senha de outra pessoa. Ele escolhe a conta. */
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id='+e(GMAIL_CLIENT_ID)+
    '&redirect_uri='+e(gmailRedirect())+'&response_type=token&scope='+e(GMAIL_ESCOPO)+
    '&include_granted_scopes=true&prompt=select_account&state='+st;
}
/* na volta do Google: guarda o token e retoma o que estava fazendo */
function gmailDebug(o){ try{ o.quando = new Date().toISOString(); o.ua = navigator.userAgent.slice(0,80); localStorage.setItem('harus.gmail.debug', JSON.stringify(o)); }catch(e){} }
function gmailRetorno(){
  const h = location.hash || '';
  let pend = null; try{ pend = JSON.parse(localStorage.getItem('harus.gmail.pendente')||'null'); }catch(e){}
  if(!/access_token=|error=/.test(h)){
    /* saiu para o Google mas voltou sem nada: registra para o diagnostico em Ajustes */
    if(pend){ localStorage.removeItem('harus.gmail.pendente'); gmailDebug({resultado:'voltou sem token', hash:h.slice(0,40), url:location.href.slice(0,120)});
      setTimeout(()=>aviso('Voltou do Google sem a permissão. Veja Ajustes › E-mail direto.'), 800); }
    return;
  }
  const p = new URLSearchParams(h.slice(1));
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  try{ localStorage.removeItem('harus.gmail.pendente'); }catch(e){}
  const st = localStorage.getItem('harus.gmail.state'); localStorage.removeItem('harus.gmail.state');
  if(p.get('error')){ gmailDebug({resultado:'erro do Google', erro:p.get('error')}); setTimeout(()=>aviso('O Google não liberou o envio: '+p.get('error')), 600); return; }
  const stateOk = !st || !p.get('state') || p.get('state')===st;
  GM = { token:p.get('access_token'), exp: Date.now() + (parseInt(p.get('expires_in')||'3600',10)-30)*1000,
         desde: (GM&&GM.desde)||new Date().toISOString() };
  let gravou = false; try{ localStorage.setItem(K_GMAIL, JSON.stringify(GM)); gravou = !!localStorage.getItem(K_GMAIL); }catch(e){}
  gmailDebug({resultado:'token recebido', stateOk:stateOk, gravou:gravou, expiraEm:p.get('expires_in'), tinhaPendente:!!pend, url:location.href.slice(0,120)});
  if(pend && pend.pedidoId){
    TRAVADO = false;   /* ele acabou de sair do app para o Google; nao faz sentido pedir o PIN agora */
    setTimeout(()=>{ if(precisaEntrar()) return; ACOES.irEnviar(pend.pedidoId); ACOES.gmailEnviar(pend.pedidoId, pend.variante); }, 400);
  } else setTimeout(()=>{ aviso('Gmail conectado neste aparelho'); if(ABA==='ajustes') render(); }, 400);
}

/* quem recebe: industria = contatos com e-mail (Para / Cc); cliente = e-mail do cadastro */
function destinatarios(ped, paraCliente){
  const cli = clienteDe(ped) || {};
  if(paraCliente) return { para: cli.email ? [cli.email] : [], cc: [] };
  const cs = D.cfg.contatos.filter(c=>c.email && (c.recebe||'para')!=='nao');
  return { para: cs.filter(c=>(c.recebe||'para')==='para').map(c=>c.email),
           cc:   cs.filter(c=>c.recebe==='cc').map(c=>c.email) };
}
function b64Bytes(x){
  if(typeof x === 'string') return btoa(x);
  const u8 = x instanceof Uint8Array ? x : new Uint8Array(x.buffer || x);
  let s=''; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
  return btoa(s);
}
function b64Txt(t){ return b64Bytes(new TextEncoder().encode(t)); }
function quebra76(b){ return b.replace(/(.{76})/g, '$1\r\n'); }
function rfc2047(t){ return /^[\x20-\x7e]*$/.test(t) ? t : '=?UTF-8?B?'+b64Txt(t)+'?='; }
/* o HTML do app usa calc(...var(--esc)) para a letra grande; e-mail nao entende: vira px fixo */
function htmlParaEmail(html){
  const corpo = html.replace(/calc\(\s*([\d.]+)px\s*\*\s*var\(--esc\)\s*\)/g, '$1px');
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>'+
         '<body style="margin:0;padding:12px;background:#ffffff">'+corpo+'</body></html>';
}
function montarMime(m){
  const b = '=_harus_' + Date.now(), alt = '=_alt_' + Date.now();
  let t = 'To: ' + m.para.join(', ') + '\r\n';
  if(m.cc && m.cc.length)  t += 'Cc: ' + m.cc.join(', ') + '\r\n';
  if(m.bcc && m.bcc.length) t += 'Bcc: ' + m.bcc.join(', ') + '\r\n';
  t += 'Subject: ' + rfc2047(m.assunto) + '\r\nMIME-Version: 1.0\r\n';
  t += 'Content-Type: multipart/mixed; boundary="' + b + '"\r\n\r\n';
  t += '--' + b + '\r\nContent-Type: multipart/alternative; boundary="' + alt + '"\r\n\r\n';
  t += '--' + alt + '\r\nContent-Type: text/plain; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n' + quebra76(b64Txt(m.texto)) + '\r\n';
  t += '--' + alt + '\r\nContent-Type: text/html; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n' + quebra76(b64Txt(m.html)) + '\r\n';
  t += '--' + alt + '--\r\n';
  (m.anexos||[]).forEach(a=>{
    t += '--' + b + '\r\nContent-Type: ' + a.tipo + '; name="' + a.nome + '"\r\n' +
         'Content-Disposition: attachment; filename="' + a.nome + '"\r\nContent-Transfer-Encoding: base64\r\n\r\n' +
         quebra76(b64Bytes(a.dados)) + '\r\n';
  });
  t += '--' + b + '--\r\n';
  return t;
}
function anexosDoPedido(ped, paraCliente){
  const L = [ {nome: nomeArquivo(ped,'pdf',paraCliente), tipo:'application/pdf', dados: pdfDoPedido(ped, paraCliente)} ];
  if(!paraCliente) L.push({nome: nomeArquivo(ped,'xlsx'), tipo: TIPO_XLSX, dados: xlsxDoPedido(ped)});
  if(!paraCliente && ped.anexo && ped.anexo.dados){
    try{ L.push({nome:'pedido-original-'+ped.num+'.jpg', tipo:'image/jpeg', dados: atob(ped.anexo.dados.split(',')[1])}); }catch(e){}
  }
  return L;
}

    modal('Conectar o Gmail',
      '<p style="margin:2px 0 10px;font-size:calc(14.5px * var(--esc));line-height:1.5">Para mandar o pedido direto por e-mail, o app precisa da sua permissão no Google. '+
      'É uma vez só neste aparelho: vai abrir a tela do Google, você escolhe a <b>sua conta do Gmail</b>, toca em <b>Continuar</b> no aviso de app em teste e em <b>Continuar</b> para permitir. Depois o app volta sozinho e continua o envio.</p>'+
      '<div class="peq">Permissão pedida: só "enviar e-mail em seu nome". O app não lê a sua caixa.</div>',
      '<button class="bt bt-p bt-bloco" data-a="gmailAutorizar" data-i="'+esc(id)+'" data-v="'+(paraCliente?'cliente':'industria')+'">Abrir o Google e permitir</button>'+

  }
  const anexos = anexosDoPedido(ped, paraCliente);

  const bcc = (D.cfg.copiaRep && D.cfg.repEmail) ? [D.cfg.repEmail] : [];
  modal(paraCliente ? 'Enviar confirmação ao cliente' : 'Enviar para a indústria',
    '<table class="tabelinha">'+
      '<tr><td>Para</td><td style="word-break:break-all">'+d.para.map(esc).join('<br>')+'</td></tr>'+
      (d.cc.length?'<tr><td>Cópia</td><td style="word-break:break-all">'+d.cc.map(esc).join('<br>')+'</td></tr>':'')+
      (bcc.length?'<tr><td>Cópia oculta</td><td style="word-break:break-all">'+esc(bcc[0])+'</td></tr>':'')+
      '<tr><td>Assunto</td><td>'+esc(assunto)+'</td></tr>'+
      '<tr><td>Anexos</td><td>'+anexos.map(a=>esc(a.nome)).join('<br>')+'</td></tr>'+
      '<tr><td>Corpo</td><td>Pedido em tabela: cliente completo, itens, totais, entrega e pagamento</td></tr>'+
    '</table>'+
    '<div class="peq" style="margin-top:10px">Sai do Gmail que você autorizou neste aparelho e fica na pasta Enviados dele.</div>',
    '<button class="bt bt-v bt-bloco bt-alto" data-a="gmailDisparar" data-i="'+esc(id)+'" data-v="'+(paraCliente?'cliente':'industria')+'">'+ico('email')+'ENVIAR AGORA</button>'+
    '<button class="bt bt-t bt-bloco mt10" data-a="fechaModal">Voltar</button>');
};
ACOES.gmailAutorizar = (id, variante) => { gmailPedirAcesso({pedidoId:id, variante:variante}); };
ACOES.gmailDisparar = async (id, variante) => {
  const ped = pedidoPorId(id); if(!ped) return;
  const paraCliente = variante === 'cliente';
  const tok = gmailToken();
  if(!tok){ fechaModal(); gmailPedirAcesso({pedidoId:id, variante:variante}); return; }
  const bt = document.querySelector('[data-a="gmailDisparar"]'); if(bt){ bt.disabled = true; bt.textContent = 'Enviando...'; }
  try{
    const d = destinatarios(ped, paraCliente);
    const bcc = (D.cfg.copiaRep && D.cfg.repEmail) ? [D.cfg.repEmail] : [];
    const mime = montarMime({ para:d.para, cc:d.cc, bcc:bcc, assunto: assuntoPedido(ped, paraCliente),
      html: htmlParaEmail(emailHtml(ped, paraCliente)), texto: montarTexto(ped, false, paraCliente),
      anexos: anexosDoPedido(ped, paraCliente) });
    /* endpoint JSON com o MIME em base64url: e o que o navegador consegue chamar (CORS) */
    const raw = b64Txt(mime).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
      method:'POST', headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/json' }, body: JSON.stringify({raw:raw}) });
    if(r.status===401 || r.status===403){
      GM = null; try{ localStorage.removeItem(K_GMAIL); }catch(e){}
      fechaModal(); gmailPedirAcesso({pedidoId:id, variante:variante}); return;
    }
    if(!r.ok){ let m=''; try{ m = (await r.json()).error.message; }catch(e){} throw new Error(m || ('HTTP '+r.status)); }
    const js = await r.json();
    ped.emails = ped.emails || [];
    ped.emails.push({ quando:new Date().toISOString(), para:d.para, cc:d.cc, assunto: assuntoPedido(ped, paraCliente),
                      via:'gmail', paraCliente: paraCliente, idGmail: js.id||'' });
    if(!paraCliente && (ped.status==='Rascunho' || ped.status==='Fechado')){ ped.status = 'Enviado'; ped.enviadoEm = new Date().toISOString(); }
    if(D.rascunhoId===id) D.rascunhoId = null;
    gravar(); fechaModal(); render();
    aviso('E-mail enviado para '+d.para.join(', '));
  }catch(e){
    if(bt){ bt.disabled = false; bt.textContent = 'ENVIAR AGORA'; }
    aviso(/failed to fetch|network/i.test(String(e.message)) ? 'Sem internet agora. Tente de novo com sinal.' : 'Não consegui enviar: '+e.message);
  }
};

/* ---------- copiar preservando a formatação ----------
   O celular não deixa o app escrever direto no corpo do e-mail, então o
   caminho é colar. Vai HTML e texto puro no mesmo copiar: onde não houver
   suporte a tabela, cai no texto e nada se perde. */
async function copiarRico(html, texto){
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([ new ClipboardItem({
        'text/html' : new Blob([html],  {type:'text/html'}),
        'text/plain': new Blob([texto], {type:'text/plain'})
      })]);
      return true;
    }
  }catch(e){}
  try{
    const d = document.createElement('div');
    d.setAttribute('contenteditable','true');
    d.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    d.innerHTML = html;
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const ok = document.execCommand('copy');
    sel.removeAllRanges(); d.remove();
    return ok;
  }catch(e){ return false; }
}

ACOES.copiarEmail = async (id, variante) => {
  const ped = pedidoPorId(id); if(!ped) return;
  const paraCliente = variante === 'cliente';
  const ok = await copiarRico(emailHtml(ped, paraCliente),
                              montarTexto(ped, false, paraCliente));
  aviso(ok ? 'Pedido copiado em tabela — cole no corpo do e-mail'
           : 'Não consegui copiar. Use "Ver o texto" e copie à mão.');
};

function tituloTela(){
  if(VISTA){
    if(VISTA.t==='revisar'){
      const p = pedidoPorId(VISTA.id);
      return {tit:'Pedido '+(p?p.num:''), sub:(p&&p.status==='Rascunho')?'Etapa 3 de 3 · confira antes de fechar':'Confira antes de decidir', volta:true};
    }
    if(VISTA.t==='enviar'){
      const p = pedidoPorId(VISTA.id);
      return {tit:'Pedido '+(p?p.num:''), sub:'Vias e envio', volta:true};
    }
    if(VISTA.t==='cliente'){
      const c = clientePorId(VISTA.id);
      return {tit:c?(c.fantasia||c.razao):'Cliente', sub:'Ficha do cliente', volta:true};
    }
    if(VISTA.t==='formCliente'){
      return {tit:VISTA.id?'Editar cliente':'Novo cliente', sub:'', volta:true};
    }
    if(VISTA.t==='rede'){
      return {tit:VISTA.id, sub:'Rede · '+perRot(PER), volta:true};
    }
  }
  const ped = pedidoRascunho();
  switch(ABA){
    case 'pedido':
      /* com cliente escolhido a tela e a montagem: ganha seta de voltar (check-in feito) */
      if(ped && ped.clienteId){
        const et = etapaDe(ped);
        return {tit: et==='dados' ? 'Dados do pedido' : 'Itens do pedido',
                sub: 'Pedido '+ped.num+' · etapa '+(et==='dados'?'1':'2')+' de 3', volta:true};
      }
      if(ESCOLHENDO_CLIENTE) return {tit:'Novo pedido', sub:'Para quem é o pedido?', volta:true};
      return {tit:'Pedidos', sub:'Novo pedido ou rascunho', volta:false};
    case 'clientes':  return {tit:'Clientes', sub:D.clientes.length+' na carteira'};
    case 'painel':    return {tit:'Painel',   sub:perRot(PER)};
    case 'margem':    return {tit:'Margem',   sub:'Simulador para negociar'};
    case 'historico': return {tit:'Histórico',sub:D.pedidos.length+' pedido'+(D.pedidos.length===1?'':'s')};
    default:          return {tit:'Ajustes',  sub:'Configuração do app'};
  }
}

function corpoTela(){
  if(VISTA){
    if(VISTA.t==='revisar')     return telaRevisar();
    if(VISTA.t==='enviar')      return telaEnviar();
    if(VISTA.t==='cliente')     return telaCliente();
    if(VISTA.t==='formCliente') return telaFormCliente();
    if(VISTA.t==='rede')        return telaRede();
  }
  switch(ABA){
    case 'pedido':    return telaPedido();
    case 'clientes':  return telaClientes();
    case 'painel':    return telaPainel();
    case 'margem':    MG.modal=false; return painelMargem();
    case 'historico': return telaHistorico();
    default:          return telaAjustes();
  }
}

  const k = el('pt_chave');
  if(k){
    const v = k.value.replace(/\s+/g,'');   /* tira espaco, quebra de linha, o que veio junto no colar */
    if(!v){ aviso('Cole a chave da nuvem.'); k.focus(); return; }

/* =====================================================
   BLOQUEIO POR PIN — para o celular nao abrir o app direto na mao de outra pessoa.
   Opcional, ligado em Ajustes. O PIN fica embaralhado no aparelho; nao vai para a nuvem
   nem para o backup do arquivo. "Esqueci" = senha da nuvem apaga o PIN.
   ===================================================== */
function pinHash(p){ let h = 2166136261; const t = 'harus|'+String(p); for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return 'p'+(h>>>0).toString(36); }
function pinTravar(){ if(D.cfg.pin && !precisaEntrar()){ TRAVADO = true; PIN_DIG=''; fechaModal(); render(); } }
try{
  document.addEventListener('visibilitychange', ()=>{
    if(!D.cfg.pin) return;
    if(document.visibilityState==='hidden'){ PIN_ESCONDEU = Date.now(); return; }
    const min = Number(D.cfg.pinMinutos); if(isNaN(min) || min<0) return;
    if(PIN_ESCONDEU && Date.now()-PIN_ESCONDEU >= min*60000) pinTravar();
  });
}catch(e){}
function telaPin(){
  const pontos = [0,1,2,3].map(i=>'<span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--grafite);display:inline-block;margin:0 7px;background:'+(i<PIN_DIG.length?'var(--grafite)':'transparent')+'"></span>').join('');
  const tecla = n => '<button class="bt bt-l" data-a="pinTecla" data-i="'+n+'" style="min-height:60px;font-size:calc(22px * var(--esc));font-weight:700">'+n+'</button>';
  return '<div class="cartao" style="margin-top:18px"><div class="corpo" style="text-align:center">'+
    '<div style="font-size:calc(19px * var(--esc));font-weight:800;letter-spacing:-.3px;margin-bottom:4px">Digite o PIN</div>'+
    '<div class="peq" style="margin-bottom:16px">Só quem sabe os 4 números abre os pedidos.</div>'+
    '<div id="pin_pontos" style="margin-bottom:18px">'+pontos+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto">'+
      [1,2,3,4,5,6,7,8,9].map(tecla).join('')+
      '<button class="bt bt-t" data-a="pinEsqueci" style="min-height:60px;font-size:calc(12.5px * var(--esc))">Esqueci</button>'+
      tecla(0)+
      '<button class="bt bt-t" data-a="pinApaga" style="min-height:60px" aria-label="Apagar">'+ico('volta')+'</button>'+
    '</div>'+
    '</div></div>'+
    '<div class="peq ct" style="margin-top:14px">'+esc(nomeMarca())+' · app de pedidos</div>';
}
function pinPintar(){ const c = el('pin_pontos'); if(!c) return; c.innerHTML = [0,1,2,3].map(i=>'<span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--grafite);display:inline-block;margin:0 7px;background:'+(i<PIN_DIG.length?'var(--grafite)':'transparent')+'"></span>').join(''); }
ACOES.pinTecla = n => {
  if(PIN_DIG.length>=4) return;
  PIN_DIG += String(n); pinPintar();
  if(PIN_DIG.length===4){
    if(pinHash(PIN_DIG)===D.cfg.pin){ TRAVADO=false; PIN_DIG=''; render(); }
    else { setTimeout(()=>{ PIN_DIG=''; pinPintar(); aviso('PIN errado'); if(navigator.vibrate) navigator.vibrate(120); }, 250); }
  }
};
ACOES.pinApaga = () => { PIN_DIG = PIN_DIG.slice(0,-1); pinPintar(); };
ACOES.pinEsqueci = () => {
  modal('Esqueceu o PIN?',
    '<p style="margin:2px 0 10px;font-size:calc(14.5px * var(--esc));line-height:1.5">Digite a senha da nuvem (a mesma do login) para tirar o PIN. Depois você cria outro em Ajustes, se quiser.</p>'+
    '<div class="campo mb0"><label>Senha da nuvem de '+esc((SESSAO&&SESSAO.email)||'')+'</label><input type="password" id="pin_senha"></div>',
    '<button class="bt bt-p bt-bloco" data-a="pinResetar">Tirar o PIN</button>'+
    '<button class="bt bt-t bt-bloco mt10" data-a="fechaModal">Voltar</button>');
  setTimeout(()=>{ const n=el('pin_senha'); if(n) n.focus(); }, 150);
};
ACOES.pinResetar = async () => {
  const senha = (el('pin_senha')||{}).value || ''; const email = (SESSAO&&SESSAO.email)||'';
  if(!senha || !email){ aviso('Digite a senha.'); return; }
  aviso('Conferindo...');
  try{
    await nuvemFetch('/auth/v1/token?grant_type=password', { email: email, password: senha }, true);
    D.cfg.pin = ''; gravar(true); TRAVADO=false; PIN_DIG=''; fechaModal(); render(); aviso('PIN removido');
  }catch(e){
    const m = String(e.message||'');
    aviso(/invalid|credentials/i.test(m) ? 'Senha errada.' : /failed to fetch|network/i.test(m) ? 'Sem internet para conferir a senha.' : 'Não deu: '+m);
  }
};

ACOES.pinSalvar = () => {
  const a = (el('pin_atual')||{}).value || '', n1 = (el('pin_novo')||{}).value || '', n2 = (el('pin_novo2')||{}).value || '';
  if(D.cfg.pin && pinHash(a)!==D.cfg.pin){ aviso('O PIN atual não bate.'); return; }
  if(!/^\d{4}$/.test(n1)){ aviso('O PIN precisa ter 4 números.'); return; }
  if(n1!==n2){ aviso('Os dois PINs não são iguais.'); return; }
  D.cfg.pin = pinHash(n1); gravar(); fechaModal(); render(); aviso('PIN salvo. O app vai pedir ao abrir.');
};

    el('tela').innerHTML = faixaVersiculo() + telaPortao();

    el('tela').innerHTML = telaPin();

  }
  const t = tituloTela();

  el('topo').innerHTML = '<div class="barra">'+
    (t.volta
      ? '<button data-a="voltar" aria-label="Voltar">'+ico('volta')+'</button>'

    '<button class="'+(ABA===a.id && !VISTA?'on':'')+'" data-a="aba" data-i="'+a.id+'">'+

/* =====================================================
   PWA: manifesto, ícone e trabalho offline
   ===================================================== */
function ligarPWA(){
  /* quando a pagina e servida dentro de outro documento, os metadados
     do cabecalho podem nao ter vindo junto: coloca os que faltam */
  try{
    const põe = (tag, attrs) => {
      const chave = attrs.rel ? 'link[rel="'+attrs.rel+'"]' : 'meta[name="'+attrs.name+'"]';
      if(document.head.querySelector(chave)) return;
      const n = document.createElement(tag);
      for(const k in attrs) n.setAttribute(k, attrs[k]);
      document.head.appendChild(n);
    };
    põe('meta', {name:'theme-color', content:'#33302E'});
    põe('meta', {name:'apple-mobile-web-app-capable', content:'yes'});
    põe('meta', {name:'apple-mobile-web-app-title', content:(marcaAtual().logo1||nomeMarca()).slice(0,12)});
    põe('link', {rel:'apple-touch-icon', href:ICONE_192});
    põe('link', {rel:'icon', type:'image/png', href:ICONE_192});
  }catch(e){}

  try{
    const man = {
      name:tituloApp(), short_name:(marcaAtual().logo1||nomeMarca()).slice(0,12),
      description:'Pedidos, clientes e metas — '+nomeMarca(),
      start_url: location.href.split('#')[0],
      scope: location.href.split('#')[0],
      display:'standalone', orientation:'portrait',
      background_color:'#FAF7F2', theme_color:'#33302E',
      icons:[
        {src:ICONE_192, sizes:'192x192', type:'image/png', purpose:'any'},
        {src:ICONE_512, sizes:'512x512', type:'image/png', purpose:'any'},
        {src:ICONE_512, sizes:'512x512', type:'image/png', purpose:'maskable'}
      ]
    };
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(l);
  }catch(e){}

  /* Nao ha sw.js no produto: o app e um arquivo unico e funciona offline
     por ser instalado na tela inicial. A tentativa de registrar um service
     worker inexistente so gerava erro no console a cada abertura.
     Se um dia houver sw.js ao lado do app, religar a linha abaixo.
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  } */
}

/* fecha o teclado ao rolar a lista de produtos no celular */
let ultimoY = 0;
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  if(Math.abs(y-ultimoY)>90){
    const a = document.activeElement;
    if(a && a.tagName==='INPUT' && a.dataset.in==='bq') a.blur();
    ultimoY = y;
  }
}, {passive:true});

/* Pede ao navegador para nao jogar fora os dados quando o aparelho aperta
   de espaco. Nao pergunta nada ao usuario; navegador que nao conhece, ignora. */
function fixarArmazenamento(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    navigator.storage.persisted().then(ja=>{
      if(ja){ PERSISTIDO = true; return; }
      navigator.storage.persist().then(ok=>{
        PERSISTIDO = !!ok;
        if(ABA==='ajustes' && !VISTA) render();
      }, ()=>{});
    }, ()=>{});
  }catch(e){}
}

document.documentElement.setAttribute('data-letra', D.cfg.letra || 'p');
aplicarTema();
aplicarMarca();
garantirCodigosClientes();
ligarNuvem();
gmailRetorno();
ouvirTemaDoAparelho();
semearNaPrimeiraVez();
fixarArmazenamento();
ligarPWA();
render();

})();

</script>
