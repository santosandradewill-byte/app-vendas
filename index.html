<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#33302E">
</head>
<body>
<title>App de pedidos</title>
<style>
/* ============ APP DE PEDIDOS — representação comercial ============ */
:root{
  --grafite:#33302E; --vermelho:#C1272D; --dourado:#F2A900;
  --creme:#FAF7F2;   --cinza:#736F6B;   --cinza-fraco:#8A8A8A;
  --verde:#1E7A4D;   --ambar:#B8860B;  --terracota:#8A3324;
  --ambar-txt:#8F6908;
  --branco:#FFFFFF;
  --linha:#E6E0D8;   --linha2:#D6CEC3;
  --grafite2:#4A4643; --grafite3:#6B6663;
  --creme2:#F2ECE3;
  --raio:14px; --raio-p:10px;
  --sombra:0 1px 2px rgba(51,48,46,.06), 0 4px 14px rgba(51,48,46,.07);
  --topo:56px; --abas:62px;
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-t:env(safe-area-inset-top,0px);
  --esc:1;
  --fonte:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-letra="m"]{--esc:1.13}
html[data-letra="g"]{--esc:1.28}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--fonte); background:var(--creme); color:var(--grafite);
  font-size:calc(16px * var(--esc)); line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:20px;height:20px;stroke-width:2;flex-shrink:0}
input,select,textarea{font-size:calc(16px * var(--esc))}
a{color:var(--vermelho)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--linha2);border-radius:8px}

/* ---------- barra superior ---------- */
#topo{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:var(--grafite); color:var(--creme);
  padding-top:var(--sa-t);
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
#topo .barra{height:var(--topo);display:flex;align-items:center;gap:10px;padding:0 14px}
#topo .tit{font-size:calc(17px * var(--esc));font-weight:700;letter-spacing:.2px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topo .sub{font-size:calc(12px * var(--esc));color:#BDB6AF;font-weight:500}
#topo button{color:var(--creme);padding:8px;margin:-8px;border-radius:10px;display:flex}
#topo button:active{background:rgba(255,255,255,.12)}
.logo{display:flex;align-items:baseline;gap:5px;font-weight:800;letter-spacing:.5px}
.logo b{color:var(--dourado)}

/* ---------- área rolável ---------- */
main{
  padding:calc(var(--topo) + var(--sa-t) + 12px) 12px calc(var(--abas) + var(--sa-b) + 20px);
  max-width:640px;margin:0 auto;
}
main.com-rodape{padding-bottom:calc(var(--abas) + var(--sa-b) + 96px)}
/* bloco dobrado ("Ver o texto"): fechado, o conteudo nao entra na conta da rolagem.
   No iPhone o texto escondido esticava a pagina em uma tela em branco no fim. */
details.cartao:not([open]) > *:not(summary){display:none}
/* simulador: o valor travado (custo ou venda) ganha borda dourada */
input.mg-anc{border-color:var(--dourado) !important;box-shadow:0 0 0 2px rgba(242,169,0,.25)}

/* ---------- abas inferiores ---------- */
#abas{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--branco); border-top:1px solid var(--linha);
  padding-bottom:var(--sa-b);
  display:flex;
}
#abas button{
  flex:1;height:var(--abas);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--cinza);font-size:calc(10px * var(--esc));font-weight:600;
  letter-spacing:.1px;position:relative;
}
#abas button svg{width:23px;height:23px;stroke-width:1.9}
#abas button.on{color:var(--grafite)}
#abas button.on::before{
  content:"";position:absolute;top:0;left:22%;right:22%;height:3px;
  background:var(--dourado);border-radius:0 0 3px 3px;
}
#abas .selo{
  position:absolute;top:8px;right:calc(50% - 22px);min-width:17px;height:17px;
  background:var(--vermelho);color:#fff;border-radius:9px;font-size:calc(10px * var(--esc));
  display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700
}

/* ---------- blocos ---------- */
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);
  box-shadow:var(--sombra);margin-bottom:12px;overflow:hidden}
.cartao > .cab{padding:12px 14px;border-bottom:1px solid var(--linha);
  display:flex;align-items:center;gap:8px}
.cartao > .cab h2{margin:0;font-size:calc(14px * var(--esc));font-weight:700;letter-spacing:.2px;flex:1;min-width:0}
.cartao > .cab > svg{width:17px;height:17px;color:var(--cinza)}
.cartao > .corpo{padding:14px}
.secao{margin:20px 0 9px;font-size:calc(12px * var(--esc));font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--cinza);padding:0 3px}
.secao:first-child{margin-top:4px}

/* ---------- botões ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 18px;border-radius:var(--raio-p);font-size:calc(15px * var(--esc));
  font-weight:700;letter-spacing:.2px;transition:transform .06s, filter .12s;
  border:1px solid transparent}
.bt:active{transform:scale(.98)}
.bt svg{width:19px;height:19px;stroke-width:2}
.bt-p{background:var(--grafite);color:var(--creme)}
.bt-d{background:var(--dourado);color:var(--grafite)}
.bt-v{background:var(--verde);color:#fff}
.bt-r{background:var(--vermelho);color:#fff}
.bt-l{background:var(--branco);color:var(--grafite);border-color:var(--linha2)}
.bt-t{background:transparent;color:var(--grafite3);min-height:44px;padding:0 12px}
.bt-bloco{width:100%}
/* decisão principal da tela: alvo grande, no polegar, sem chance de errar */
.bt-alto{min-height:62px;font-size:calc(16.5px * var(--esc));letter-spacing:.6px;
  box-shadow:0 2px 8px rgba(51,48,46,.14)}
.bt-alto svg{width:22px;height:22px}
.bt[disabled]{opacity:.4;pointer-events:none}
.bt-p:active,.bt-d:active,.bt-v:active,.bt-r:active{filter:brightness(.93)}
.bt-l:active{background:var(--creme2)}
.linha-bt{display:flex;gap:8px}
.linha-bt > *{flex:1}

/* ---------- formulários ---------- */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:calc(12px * var(--esc));font-weight:700;color:var(--grafite3);
  margin-bottom:5px;letter-spacing:.2px}
.campo input,.campo select,.campo textarea{
  width:100%;padding:12px 13px;border:1px solid var(--linha2);border-radius:var(--raio-p);
  background:var(--branco);min-height:48px;transition:border-color .12s, box-shadow .12s}
.campo textarea{min-height:76px;resize:vertical;line-height:1.4}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:none;border-color:var(--grafite);box-shadow:0 0 0 3px rgba(51,48,46,.09)}
.campo .dica{font-size:calc(11.5px * var(--esc));color:var(--cinza);margin-top:5px;line-height:1.35}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.campo select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238A8A8A' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}

/* busca */
.busca{position:relative}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;stroke:var(--cinza);stroke-width:2;pointer-events:none}
.busca input{
  width:100%;padding:12px 44px 12px 41px;border:1px solid var(--linha2);
  border-radius:var(--raio-p);background:var(--branco);min-height:48px;
  transition:border-color .12s, box-shadow .12s}
.busca input:focus{outline:none;border-color:var(--grafite);box-shadow:0 0 0 3px rgba(51,48,46,.09)}
.busca .limpar{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:var(--cinza)}
.busca .limpar svg{position:static;transform:none;width:17px;height:17px}

/* ---------- etiquetas ---------- */
.et{display:inline-flex;align-items:center;gap:4px;font-size:calc(10.5px * var(--esc));font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;border-radius:6px;
  background:var(--creme2);color:var(--grafite3);white-space:nowrap}
.et-cod{background:var(--grafite);color:var(--creme);font-variant-numeric:tabular-nums}
.et-vrj{background:#EAF0EC;color:var(--verde)}
.et-fs{background:#F6EDDA;color:var(--ambar-txt)}
.et-pp{background:#FBE9F1;color:#B3357A}
.et-har{background:#FDF0D9;color:#8A5D07}
.et-g{background:#E9E5F2;color:#5B4B8A}
.et-p{background:#E4EEF3;color:#2C6A85}
.et-al{background:#F6E7E2;color:var(--terracota)}
.et-ab{background:var(--creme2);color:var(--grafite3)}
.et-fe{background:#FBEFD6;color:#8A5D07}
.et-rede{background:#EAE6F2;color:#4C3F73;font-weight:750}
button.et-rede{cursor:pointer}
.et-en{background:#E4EEF3;color:#2C6A85}
.et-fa{background:#EAF0EC;color:var(--verde)}
.et-ca{background:#F1EFED;color:var(--cinza)}

/* ---------- produto ---------- */
.prod{padding:12px 13px;border-bottom:1px solid var(--linha)}
.prod:last-child{border-bottom:0}
.prod .topo{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.prod .dados{flex:1;min-width:0;padding-top:2px}
.foto{border-radius:10px;object-fit:contain;border:1px solid var(--linha);
  background:#fff;flex-shrink:0;display:block}
/* a foto manda no cartao: e por ela que ele reconhece o produto */
.foto-bt{position:relative;flex-shrink:0;display:block;padding:0;border:0;background:none;
  border-radius:13px;transition:transform .07s}
.foto-bt:active{transform:scale(.96)}
.prod .foto{width:96px;height:96px;border-radius:13px;padding:3px;
  box-shadow:0 1px 4px rgba(51,48,46,.09)}
.foto-bt .lupa{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;
  border-radius:50%;background:var(--grafite);color:var(--creme);display:flex;
  align-items:center;justify-content:center;border:2px solid var(--branco)}
.foto-bt .lupa svg{width:13px;height:13px}
.item .foto{width:46px;height:46px;border-radius:9px}
.foto-vazia{display:flex;align-items:center;justify-content:center;color:var(--linha2)}
.prod .nm{font-size:calc(15.5px * var(--esc));font-weight:700;line-height:1.3;margin-bottom:7px}
.prod .mt{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center}
.prod .mt > *{flex-shrink:0}
.prod .mt .txt{font-size:calc(11.5px * var(--esc));color:var(--cinza);white-space:nowrap}
.prod .acoes{display:flex;gap:7px}
/* botao de uma linha so: sobra altura para a foto */
.add{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;
  gap:8px;min-height:46px;border-radius:var(--raio-p);border:1.5px solid var(--linha2);
  background:var(--branco);padding:0 13px;transition:transform .06s}
.add:active{transform:scale(.97);background:var(--creme2)}
.add svg{width:16px;height:16px;flex-shrink:0}
.add .u{font-size:calc(11.5px * var(--esc));font-weight:800;letter-spacing:.5px;color:var(--cinza)}
.add .v{font-size:calc(15px * var(--esc));font-weight:750;font-variant-numeric:tabular-nums;
  letter-spacing:-.2px;line-height:1.15;margin-left:auto}
.add-cx{border-color:var(--grafite);background:var(--grafite)}
.add-cx svg,.add-cx .u{color:#B7B0A9}
.add-cx .v{color:var(--creme)}
.add-cx:active{background:var(--grafite2)}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.refs span{border-radius:7px;padding:5px 9px;font-size:calc(11.5px * var(--esc));white-space:nowrap;
  border:1px solid transparent}
.refs b{font-weight:800;font-variant-numeric:tabular-nums}
.refs .r-cx {background:var(--grafite);color:var(--creme);border-color:var(--grafite)}
.refs .r-pct{background:#E9E5F2;color:#54467F;border-color:#DDD6EC}
.refs .r-un {background:#E4EEF3;color:#255D75;border-color:#D3E4EC}
.refs .r-kg {background:#EAF0EC;color:#1B6B44;border-color:#D8E6DE}
.refs .r-cx b,.refs .r-pct b,.refs .r-un b,.refs .r-kg b{color:inherit}

/* produto que já está no pedido: contador no lugar do botão */
.no-pedido{display:flex;align-items:center;gap:11px;background:var(--grafite);
  border-radius:var(--raio-p);padding:5px 10px 5px 5px;min-height:46px;flex:1}
.no-pedido .soma{flex:1;text-align:right;line-height:1.2}
.no-pedido .soma .q{display:block;font-size:calc(11px * var(--esc));color:#B5AEA8;font-weight:650}
.no-pedido .soma .v{font-size:calc(15.5px * var(--esc));font-weight:750;color:var(--creme);
  font-variant-numeric:tabular-nums}
.passo.escuro{border-color:#5A5551;background:#413D3A}
.passo.escuro button{color:var(--creme)}
.passo.escuro button:active{background:#524D49}
.passo.escuro input{background:#413D3A;color:var(--creme);
  border-left-color:#5A5551;border-right-color:#5A5551}
.passo.escuro input:focus{background:#524D49}
.conta{background:var(--creme2);border-radius:var(--raio-p);padding:10px 12px;
  font-size:calc(12.5px * var(--esc));line-height:1.75;color:var(--grafite3);margin-bottom:14px}
.conta b{color:var(--grafite);font-weight:700}
.dif{font-size:calc(12.5px * var(--esc));font-weight:650;margin-top:9px;text-align:center;min-height:18px}
.faixa{display:flex;gap:9px;align-items:flex-start;background:#F6EDDA;color:#7A5A0B;
  border:1px solid #EBDCBC;border-radius:var(--raio);padding:11px 12px;margin-bottom:12px;
  font-size:calc(12.5px * var(--esc));line-height:1.4}
.faixa svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px;color:var(--ambar-txt)}
.faixa b{display:block;margin-bottom:2px;color:#5E4508}
.faixa button{margin-top:6px;font-size:calc(12.5px * var(--esc));font-weight:750;color:#5E4508;
  text-decoration:underline;text-underline-offset:2px;padding:4px 0;min-height:32px}
.et-ex{background:#EFEAF6;color:#5B4B8A}
.aviso{display:flex;gap:7px;align-items:flex-start;font-size:calc(11.5px * var(--esc));line-height:1.35;
  background:#F9F0EC;color:var(--terracota);border-radius:8px;padding:7px 9px;margin-bottom:9px}
.aviso svg{width:14px;height:14px;flex:0 0 14px;margin-top:1px;stroke-width:2.4}

/* ---------- item do pedido ---------- */
.item{padding:11px 13px;border-bottom:1px solid var(--linha);display:flex;gap:10px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item .info{flex:1;min-width:0}
.item .nm{font-size:calc(14px * var(--esc));font-weight:650;line-height:1.28;margin-bottom:4px}
.item .sub{font-size:calc(11.5px * var(--esc));color:var(--cinza);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .pr{font-variant-numeric:tabular-nums;font-weight:600;color:var(--grafite3);
  border-bottom:1px dashed var(--linha2);padding-bottom:1px}
.item .dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.item .tot{font-size:calc(14.5px * var(--esc));font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.preco-cx{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:8px 10px;border-radius:9px;
  background:var(--creme2);color:var(--grafite2);font-size:calc(12.5px * var(--esc));font-weight:600;text-align:left}
.preco-cx svg{width:14px;height:14px}
.passo{display:flex;align-items:center;border:1px solid var(--linha2);border-radius:9px;
  overflow:hidden;background:var(--branco)}
.passo button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  color:var(--grafite);font-size:calc(19px * var(--esc));font-weight:600}
.passo button:active{background:var(--creme2)}
.passo input{width:46px;height:38px;border:0;border-left:1px solid var(--linha);
  border-right:1px solid var(--linha);text-align:center;font-weight:700;
  font-variant-numeric:tabular-nums;padding:0;background:var(--branco);font-size:calc(15px * var(--esc))}
.passo input:focus{outline:none;background:var(--creme2)}

/* ---------- rodapé do pedido ---------- */
#rodape{
  position:fixed;left:0;right:0;bottom:calc(var(--abas) + var(--sa-b));z-index:35;
  background:var(--branco);border-top:1px solid var(--linha);
  box-shadow:0 -3px 14px rgba(51,48,46,.09);
  padding:9px 12px;display:none;
}
#rodape.on{display:block}
#rodape .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:11px}
#rodape .nums{flex:1;min-width:0}
#rodape .tt{font-size:calc(20px * var(--esc));font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.4px;line-height:1.1}
#rodape .dt{font-size:calc(11.5px * var(--esc));color:var(--cinza);margin-top:1px}
#rodape .bt{min-height:48px;padding:0 20px;white-space:nowrap}

/* ---------- lista genérica ---------- */
.lin{display:flex;align-items:center;gap:11px;padding:13px;
  border-bottom:1px solid var(--linha);width:100%;text-align:left;background:none}
.lin:last-child{border-bottom:0}
.lin:active{background:var(--creme2)}
.lin .info{flex:1;min-width:0;display:block}
.lin .nm{font-size:calc(14.5px * var(--esc));font-weight:650;line-height:1.3;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* na revisão o nome inteiro importa mais do que a linha única */
.lin-item{align-items:flex-start}
.lin-item .nm{white-space:normal;overflow:visible;padding-right:8px}
.lin-item .dir{padding-top:1px}
.lin .sub{font-size:calc(12px * var(--esc));color:var(--cinza);margin-top:2px;display:flex;gap:6px;
  flex-wrap:wrap;align-items:center}
.lin .dir{text-align:right;flex-shrink:0}
.lin .val{font-size:calc(14.5px * var(--esc));font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.lin .seta{color:var(--linha2);flex-shrink:0}
.lin .seta svg{width:17px;height:17px;stroke-width:2.4;display:block}
.ini{width:40px;height:40px;border-radius:11px;background:var(--creme2);color:var(--grafite3);
  display:flex;align-items:center;justify-content:center;font-weight:750;font-size:calc(14px * var(--esc));
  flex-shrink:0;letter-spacing:-.3px}

/* ---------- painel ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);
  padding:13px;box-shadow:var(--sombra)}
.kpi .rot{font-size:calc(11px * var(--esc));font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--cinza);margin-bottom:5px;line-height:1.2}
.kpi .num{font-size:calc(23px * var(--esc));font-weight:800;letter-spacing:-.7px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .pe{font-size:calc(11.5px * var(--esc));color:var(--cinza);margin-top:3px;line-height:1.3}
.kpi.larga{grid-column:1/-1}
.v-verde{color:var(--verde)} .v-ambar{color:var(--ambar-txt)} .v-terra{color:var(--terracota)}
.b-verde{background:var(--verde)} .b-ambar{background:var(--ambar)} .b-terra{background:var(--terracota)}
.barra-p{height:9px;background:var(--creme2);border-radius:5px;overflow:hidden;margin-top:9px}
.barra-p i{display:block;height:100%;border-radius:5px;transition:width .4s ease}
.marco{position:relative}
.marco .agulha{position:absolute;top:-3px;width:2px;height:15px;background:var(--grafite);
  border-radius:1px;opacity:.55}
.grafico{width:100%;height:150px;display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(11.5px * var(--esc));color:var(--cinza);margin-top:9px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;
  vertical-align:-1px}
.var{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--creme2)}
.mix i{display:block;height:100%}
.mix .mix-v{background:#1E7A4D}
.mix .mix-f{background:#B8860B}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha)}
.rank:last-child{border-bottom:0}
.rank .pos{width:21px;height:21px;border-radius:6px;background:var(--creme2);color:var(--grafite3);
  font-size:calc(11px * var(--esc));font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank .nm{flex:1;min-width:0;font-size:calc(13.5px * var(--esc));font-weight:600;line-height:1.25}
.rank .vl{font-size:calc(13.5px * var(--esc));font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank .mini{height:4px;background:var(--creme2);border-radius:2px;margin-top:4px}
.rank .mini i{display:block;height:100%;background:var(--dourado);border-radius:2px}

/* ---------- vazio ---------- */
.vazio{text-align:center;padding:38px 22px;color:var(--cinza)}
.vazio svg{width:42px;height:42px;stroke-width:1.4;opacity:.35;margin-bottom:11px}
.vazio p{margin:0 0 4px;font-size:calc(14.5px * var(--esc));font-weight:650;color:var(--grafite3)}
.vazio span{font-size:calc(13px * var(--esc));line-height:1.45;display:block;max-width:270px;margin:0 auto}

/* ---------- filtros ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* dentro do modal não há para onde rolar: os atalhos quebram em linhas */
.chips-quebra{flex-wrap:wrap;overflow:visible}
/* prévia do e-mail: a tabela é larga, então rola dentro da própria caixa */
.previa{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linha);
  border-radius:10px;padding:10px;background:#fff}
.previa table{max-width:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--branco);
  border:1px solid var(--linha2);font-size:calc(13px * var(--esc));font-weight:650;color:var(--grafite3);
  min-height:38px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--grafite);border-color:var(--grafite);color:var(--creme)}
.chip .n{font-size:calc(11px * var(--esc));opacity:.65;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none}
#modal.on{display:block}
#modal .fundo{position:absolute;inset:0;background:rgba(51,48,46,.45);
  animation:fade .16s ease}
#modal .folha{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;background:var(--creme);
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:sobe .22s cubic-bezier(.22,.9,.3,1);
  padding-bottom:var(--sa-b);
}
@media(min-width:660px){
  #modal .folha{left:50%;transform:translateX(-50%);width:620px;border-radius:20px;
    bottom:20px;max-height:88vh}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sobe{from{transform:translateY(26px);opacity:.5}to{transform:translateY(0);opacity:1}}
@media(min-width:660px){@keyframes sobe{from{transform:translate(-50%,26px);opacity:.5}
  to{transform:translate(-50%,0);opacity:1}}}
#modal .cabm{display:flex;align-items:center;gap:10px;padding:14px 15px 12px;
  border-bottom:1px solid var(--linha);flex-shrink:0}
#modal .cabm h2{margin:0;font-size:calc(16px * var(--esc));font-weight:750;flex:1;letter-spacing:-.1px}
#modal .cabm .x{width:36px;height:36px;border-radius:50%;background:var(--creme2);
  display:flex;align-items:center;justify-content:center;color:var(--grafite3);flex-shrink:0}
#modal .corpom{overflow-y:auto;padding:15px;-webkit-overflow-scrolling:touch}
#modal .pem{padding:12px 15px;border-top:1px solid var(--linha);background:var(--branco);flex-shrink:0}
.puxador{width:36px;height:4px;background:var(--linha2);border-radius:2px;margin:8px auto 0}

/* ---------- aviso flutuante ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--abas) + var(--sa-b) + 74px);z-index:80;
  background:var(--grafite);color:var(--creme);padding:11px 18px;border-radius:22px;
  font-size:calc(13.5px * var(--esc));font-weight:600;box-shadow:0 6px 22px rgba(51,48,46,.3);
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ---------- utilidades ---------- */
/* ---------- documento anexado ---------- */
.anexo{display:flex;gap:12px;align-items:center}
.anexo img{width:66px;height:66px;object-fit:cover;border-radius:10px;
  border:1px solid var(--linha2);flex-shrink:0;background:var(--creme2)}
.anexo .info{flex:1;min-width:0}
.anexo .nm{font-size:calc(13.5px * var(--esc));font-weight:650}

.mono{font-variant-numeric:tabular-nums}
.ct{text-align:center}
.dir{text-align:right}
.mb0{margin-bottom:0}
.mt10{margin-top:10px}
.peq{font-size:calc(12px * var(--esc));color:var(--cinza);line-height:1.45}
hr{border:0;border-top:1px solid var(--linha);margin:14px 0}
.tabelinha{width:100%;border-collapse:collapse;font-size:calc(13px * var(--esc))}
.tabelinha td{padding:7px 0;border-bottom:1px solid var(--linha);vertical-align:top}
.tabelinha tr:last-child td{border-bottom:0}
.tabelinha td:first-child{color:var(--cinza);width:44%}
.tabelinha td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.total-lin{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:calc(14px * var(--esc))}
.total-lin.forte{font-size:calc(19px * var(--esc));font-weight:800;padding-top:11px;margin-top:5px;
  border-top:1.5px solid var(--grafite);letter-spacing:-.3px}
.total-lin span:last-child{font-variant-numeric:tabular-nums;font-weight:700}

/* =====================================================
   TEMA ESCURO
   O app inteiro ja rodava em variaveis, entao o tema e
   uma troca de valores. Tudo aqui dentro so vale quando
   o <html> esta com data-tema="escuro": o tema claro
   continua se comportando exatamente como sempre.
   ===================================================== */
html[data-tema="escuro"]{
  --grafite:#ECEAE5;  --grafite2:#2A3145;  --grafite3:#98A2B8;
  --creme:#0B0E16;    --creme2:#1B2133;    --branco:#151A28;
  --cinza:#8E99B0;    --cinza-fraco:#7E889E;
  --linha:rgba(255,255,255,.09);          --linha2:rgba(255,255,255,.17);
  --dourado:#FFC02E;  --vermelho:#FF6B6B;  --verde:#3DDC97;
  --ambar:#FFC02E;    --ambar-txt:#FFC02E; --terracota:#FF6B6B;
  --sombra:0 1px 0 rgba(255,255,255,.035), 0 10px 30px rgba(0,0,0,.45);
  --barra:#0E1220;    --forte:#FFC02E;     --forte-tx:#14161F;
  color-scheme:dark;
}
/* o ceu: estrelas e uma bruma distante, presas ao fundo.
   Ficam atras de tudo e so aparecem nos vaos entre os cartoes. */
html[data-tema="escuro"] body{
  background-color:var(--creme);
  background-image:
    radial-gradient(1.4px 1.4px at 12% 6%,  rgba(255,255,255,.50), transparent 60%),
    radial-gradient(1.1px 1.1px at 78% 4%,  rgba(255,255,255,.36), transparent 60%),
    radial-gradient(1.5px 1.5px at 33% 19%, rgba(255,214,140,.40), transparent 60%),
    radial-gradient(1.1px 1.1px at 88% 27%, rgba(255,255,255,.30), transparent 60%),
    radial-gradient(1.2px 1.2px at 7%  44%, rgba(255,255,255,.28), transparent 60%),
    radial-gradient(1.1px 1.1px at 62% 53%, rgba(180,205,255,.34), transparent 60%),
    radial-gradient(1.4px 1.4px at 25% 70%, rgba(255,255,255,.30), transparent 60%),
    radial-gradient(1.1px 1.1px at 92% 77%, rgba(255,214,140,.28), transparent 60%),
    radial-gradient(1.2px 1.2px at 47% 90%, rgba(255,255,255,.26), transparent 60%),
    radial-gradient(circle at 90% 3%, rgba(96,86,190,.20), transparent 52%);
  background-attachment:fixed;
}
/* barras de cima e de baixo */
html[data-tema="escuro"] #topo{background:var(--barra);color:#F2EFE9;
  box-shadow:0 1px 0 rgba(255,192,46,.12)}
html[data-tema="escuro"] #topo .sub{color:#A9B0C2}
html[data-tema="escuro"] #topo button{color:#F2EFE9}
html[data-tema="escuro"] #topo button:active{background:rgba(255,255,255,.12)}
html[data-tema="escuro"] #abas{background:var(--barra);border-top-color:rgba(255,255,255,.08)}
html[data-tema="escuro"] #abas button{color:#7C8598}
html[data-tema="escuro"] #abas button.on{color:var(--dourado)}
html[data-tema="escuro"] #abas button.on::before{background:var(--dourado);
  box-shadow:0 0 12px rgba(255,192,46,.75)}
html[data-tema="escuro"] #abas .selo{background:#CE2027;color:#fff}
html[data-tema="escuro"] #rodape{background:var(--branco)}
/* contador de caixas no card do produto: no tema escuro ficava apagado (escuro sobre escuro) */
html[data-tema="escuro"] .passo{border-color:rgba(255,255,255,.38)}
html[data-tema="escuro"] .passo.escuro{border-color:rgba(255,255,255,.55);background:#2A3145}
html[data-tema="escuro"] .passo.escuro button{color:#FFFFFF}
html[data-tema="escuro"] .passo.escuro button:active{background:#3A4360}
html[data-tema="escuro"] .passo.escuro input{background:#2A3145;color:#FFFFFF;font-weight:800;border-color:rgba(255,255,255,.35)}
html[data-tema="escuro"] .passo.escuro input:focus{background:#3A4360}
html[data-tema="escuro"] .no-pedido .soma .q{color:#C9CFDD}
html[data-tema="escuro"] .no-pedido .soma .v{color:#FFFFFF}
/* botoes: o dourado vira o sinal de acao principal */
html[data-tema="escuro"] .bt-p{background:var(--forte);color:var(--forte-tx)}
html[data-tema="escuro"] .bt-d{background:var(--forte);color:var(--forte-tx)}

html[data-tema="escuro"] .chip.on{background:var(--forte);border-color:var(--forte);color:var(--forte-tx)}
/* campos: o anel de foco tem que aparecer no escuro */
html[data-tema="escuro"] input:focus,
html[data-tema="escuro"] select:focus,
html[data-tema="escuro"] textarea:focus{
  border-color:var(--dourado);box-shadow:0 0 0 3px rgba(255,192,46,.22)}
/* etiquetas: no escuro o fundo vira um so, e quem distingue e a cor do texto */
html[data-tema="escuro"] .et{background:rgba(255,255,255,.075)}

html[data-tema="escuro"] .et-p{color:#7CC6E8}
html[data-tema="escuro"] .et-al{color:#FF8A7A}
html[data-tema="escuro"] .et-fe{color:#FFC02E}
html[data-tema="escuro"] .et-rede{color:#AFA2EE}
html[data-tema="escuro"] .et-en{color:#7CC6E8}
html[data-tema="escuro"] .et-fa{color:#3DDC97}
html[data-tema="escuro"] .et-ca{color:var(--cinza)}
html[data-tema="escuro"] .et-ex{color:#AFA2EE}
/* referencias de preco */
html[data-tema="escuro"] .refs .r-cx {background:var(--forte);color:var(--forte-tx);border-color:var(--forte)}
html[data-tema="escuro"] .refs .r-pct{background:rgba(175,162,238,.14);color:#BCB1F2;border-color:rgba(175,162,238,.26)}
html[data-tema="escuro"] .refs .r-un {background:rgba(124,198,232,.14);color:#8FD0EE;border-color:rgba(124,198,232,.26)}
html[data-tema="escuro"] .refs .r-kg {background:rgba(61,220,151,.13);color:#57E0A6;border-color:rgba(61,220,151,.25)}
/* produto no pedido e botao de caixa */
html[data-tema="escuro"] .no-pedido{background:#212942}
html[data-tema="escuro"] .no-pedido .soma .q{color:#9AA4BC}
html[data-tema="escuro"] .no-pedido .soma .v{color:var(--grafite)}

html[data-tema="escuro"] .add-cx svg,html[data-tema="escuro"] .add-cx .u{color:rgba(16,18,26,.78)}

  border-left-color:rgba(255,255,255,.16);border-right-color:rgba(255,255,255,.16)}
html[data-tema="escuro"] .passo.escuro button:active,
html[data-tema="escuro"] .passo.escuro input:focus{background:#2E3750}
/* faixas e avisos */
html[data-tema="escuro"] .faixa{background:rgba(255,192,46,.10);border-color:rgba(255,192,46,.28);color:#EFD9AC}

/* graficos */
html[data-tema="escuro"] .mix .mix-v{background:#3DDC97}
html[data-tema="escuro"] .mix .mix-f{background:#7B8FF0}
html[data-tema="escuro"] #modal .fundo{background:rgba(0,0,0,.62)}
html[data-tema="escuro"] #toast{background:var(--forte);color:var(--forte-tx);
  box-shadow:0 6px 22px rgba(0,0,0,.55)}
@media (prefers-reduced-motion: reduce){
  html[data-tema="escuro"] body{background-attachment:scroll}
}

function rotuloCaixa(p){
  const pc = p.pacotesPorCaixa||0;
  return (p.caixa==='GRANDE'?'CX grande':'CX pequena') + (pc?' · '+nm(pc)+' pct':'');
}
function kgDe(p,un){
  if(!p) return 0;
  if(un==='CX')  return p.kgCaixa||0;
  if(un==='PCT') return (p.gPacote||0)/1000;
  return (p.gUnidade||0)/1000;
}
function precoDe(p,un){
  if(!p) return 0;
  if(un==='CX')  return p.pCaixa||0;
  if(un==='PCT') return p.pPacote||0;
  return p.pUnidade||0;
}
function caixasEquiv(p,un,q){
  if(!p) return 0;
  if(un==='CX') return q;
  if(un==='PCT') return p.pacotesPorCaixa ? q/p.pacotesPorCaixa : 0;
  const unCx = (p.unPorPacote||0)*(p.pacotesPorCaixa||0);
  return unCx ? q/unCx : 0;
}
const UN_NOME  = {CX:'Caixa', PCT:'Pacote', UN:'Unidade'};
const UN_CURTO = {CX:'CX',    PCT:'PCT',    UN:'UN'};
const CANAL_NOME = {VAREJO:'Varejo', FOODSERVICE:'Food Service'};

/* ---------------- cálculo ---------------- */
function totais(ped){
  let bruto=0, kg=0, cx=0, qi=0;
  (ped.itens||[]).forEach(it=>{
    const p = porId[it.skuId];
    bruto += (it.preco||0) * (it.qtd||0);
    kg    += kgDe(p,it.un) * (it.qtd||0);
    cx    += caixasEquiv(p,it.un,it.qtd||0);
    qi++;
  });
  const desc = bruto * ((ped.desc||0)/100);
  /* entrega conferida: o que a industria de fato mandou (qtdFat), o que cortou
     e o que ainda vem. Sem conferencia, entregue = pedido. */
  let entregueBruto = 0, cortadoBruto = 0, pendenteBruto = 0;
  (ped.itens||[]).forEach(it=>{
    const q = it.qtd||0, qf = (it.qtdFat==null ? q : it.qtdFat), pr = it.preco||0;
    entregueBruto += pr*qf;
    if(qf < q){ if(it.falta==='pendente') pendenteBruto += pr*(q-qf); else cortadoBruto += pr*(q-qf); }
  });
  const fator = bruto>0 ? (bruto-desc)/bruto : 1;
  return { bruto:bruto, desc:desc, liquido:bruto-desc, kg:kg, cx:cx, itens:qi,
           entregue: entregueBruto*fator, cortado: cortadoBruto*fator, pendente: pendenteBruto*fator,
           conferido: !!ped.conferido };
}

function pnum(v){
  let s = String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');

  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

   ===================================================== */
let bq = '';            // texto da busca de produto
let ESCOLHENDO_CLIENTE = false;   // aba Pedido: false = tela "Novo pedido"; true = escolhendo o cliente
let fCanal = null;      // canal escolhido à mão
let fCat = null;        // categoria
let bqCli = '';         // busca de cliente

function canalAtivo(ped){
  if(fCanal) return fCanal;
  const c = ped && clienteDe(ped);
  return (c && c.canal) || 'VAREJO';
}

function produtosFiltrados(ped){
  const canal = canalAtivo(ped);
  const q = sac(bq).trim();
  const termos = q ? q.split(/\s+/) : [];
  return CAT.filter(p=>{
    if(canal !== 'TODOS' && p.canal !== canal) return false;
    if(fCat && p.categoria !== fCat) return false;
    if(!termos.length) return true;
    return termos.every(t=>p.busca.indexOf(t)>-1);
  }).sort((a,b)=>
    ordemMarca(a) - ordemMarca(b) ||
    a.categoria.localeCompare(b.categoria,'pt-BR') ||
    a.nome.localeCompare(b.nome,'pt-BR') ||
    (a.caixa==='GRANDE'?0:1)-(b.caixa==='GRANDE'?0:1)
  );
}
/* a lista nunca mistura marcas: Harus inteira, depois PP inteira */
function ordemMarca(p){ const m = String(p.marca||'').toUpperCase(); return m==='HARUS' ? 0 : m==='PP' ? 1 : 2; }

/* O que ESTE cliente ja comprou, por SKU: ultima data, preco e quantidade.
   Recalcula so quando muda o cliente. */
let HIST = { cli:null, mapa:{} };
function historicoDoCliente(clienteId){
  if(HIST.cli === clienteId) return HIST.mapa;
  const mapa = {};
  D.pedidos.filter(p=>p.clienteId===clienteId && VALE(p.status))
    .sort((a,b)=>String(a.data).localeCompare(String(b.data)))
    .forEach(p=>{ (p.itens||[]).forEach(it=>{
      const h = mapa[it.skuId] || (mapa[it.skuId] = {vezes:0});
      h.vezes++; h.data = p.data; h.preco = it.preco; h.qtd = it.qtd; h.un = it.un; h.num = p.num;
    }); });
  HIST = { cli:clienteId, mapa };
  return mapa;
}
function seloJaComprou(p, ped){
  if(!ped || !ped.clienteId) return '';
  const h = historicoDoCliente(ped.clienteId)[p.id];
  if(!h) return '';
  return '<span class="et et-fe" title="última compra">já comprou '+h.vezes+'× · '+brl(h.preco)+' em '+dbr(h.data).slice(0,5)+'</span>';
}
function cartaoProduto(p, ped){

     sem precisar abrir a revisão para lembrar quantas já pôs. */
  const idx = (ped.itens||[]).findIndex(i=>i.skuId===p.id);
  const it = idx>=0 ? ped.itens[idx] : null;
  const botoes = it
    ? '<div class="no-pedido">'+
        '<div class="passo escuro">'+
          '<button data-a="menosCard" data-i="'+idx+'" aria-label="Menos uma caixa">'+ico('menos')+'</button>'+
          '<input type="text" inputmode="numeric" value="'+(it.qtd||0)+'" '+
            'data-in="qtdCard" data-ch="qtdCardFim" data-i="'+idx+'" aria-label="Caixas no pedido">'+
          '<button data-a="maisCard" data-i="'+idx+'" aria-label="Mais uma caixa">'+ico('mais')+'</button>'+
        '</div>'+
        '<div class="soma"><span class="q">'+nm(it.qtd)+(it.qtd===1?' caixa':' caixas')+'</span>'+
          '<span class="v">'+brl((it.preco||0)*(it.qtd||0))+'</span></div>'+
      '</div>'+
      /* preco da caixa a vista, com o botao de mudar: o pedido nasce na tabela; mudou, avisa */
      '<button class="pr preco-cx" data-a="editarPreco" data-i="'+idx+'">'+ico('editar')+brl(it.preco)+' a caixa · '+
        (it.abaixoTabela ? '<b style="color:var(--terracota)">abaixo da tabela</b>' :
         it.acimaTabela  ? '<b style="color:var(--verde)">acima da tabela</b>' : 'preço de tabela')+' · alterar</button>'
    : '<button class="add add-cx" data-a="add" data-i="'+p.id+'" data-v="CX">'+
        ico('mais')+'<span class="u">ADICIONAR CAIXA</span>'+
        '<span class="v">'+brl(p.pCaixa)+'</span></button>';

  const ref = referencias(p);

  const kgTxt = p.kgCaixa ? nm(p.kgCaixa,2).replace(/,00$/,'')+' kg/cx' : '';
  const unTxt = p.gUnidade ? nm(p.gUnidade,0)+' g/un' : '';

  return '<div class="prod">'+
    '<div class="topo">'+ fotoDe(p, 'prod') +'<div class="dados">'+
    '<div class="nm">'+esc(p.nome)+'</div>'+
    '<div class="mt">'+
      '<span class="et et-cod">'+esc(p.cod)+'</span>'+
      '<span class="et '+(p.caixa==='GRANDE'?'et-g':'et-p')+'">'+esc(rotuloCaixa(p))+'</span>'+
      '<span class="et '+(p.marca==='PP'?'et-pp':'et-har')+'">'+esc(p.marca)+'</span>'+
      (fCanal==='TODOS'?'<span class="et '+(p.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+CANAL_NOME[p.canal]+'</span>':'')+
      seloJaComprou(p, ped)+
      (kgTxt?'<span class="txt">'+kgTxt+'</span>':'')+
      (unTxt?'<span class="txt">· '+unTxt+'</span>':'')+
      (it?'<span class="et et-fa">'+ico('check')+' no pedido</span>':'')+
    '</div></div></div>'+
    (p.flag?'<div class="aviso">'+ico('alerta')+'<span>'+esc(p.flag)+'</span></div>':'')+
    '<div class="acoes">'+botoes+'</div>'+
    (ref?'<div class="refs">'+ref+'</div>':'')+
  '</div>';
}

/* A cadeia por extenso: caixa -> pacote -> unidade. É o que ele mostra
   ao comprador quando precisa justificar o preço. */
function contaDoProduto(p){
  const L = [];
  if(p.pacotesPorCaixa && p.pPacote)
    L.push('<div>'+brl(p.pCaixa)+' a caixa ÷ <b>'+nm(p.pacotesPorCaixa)+' pacotes</b> = '+
           brl(p.pPacote)+' o pacote</div>');
  if(p.unNoPacote && p.pUnidade)
    L.push('<div>'+brl(p.pPacote)+' o pacote ÷ <b>'+nm(p.unNoPacote, p.unNoPacote%1?1:0)+
           ' unidades</b> = '+brl(p.pUnidade)+' a unidade</div>');
  if(p.kgCaixa && p.pKg)
    L.push('<div>'+brl(p.pCaixa)+' a caixa ÷ <b>'+nm(p.kgCaixa,2).replace(/,00$/,'')+' kg</b> = '+
           brl(p.pKg)+' o quilo</div>');
  return L.join('');
}

/* O que ele fala com o cliente: quanto sai o pacote, a unidade e o quilo.
   A unidade do varejo é o preço do pacote dividido pelas unidades que vêm nele. */
function referencias(p){
  const partes = [];
  if(p.pPacote)  partes.push('<span class="r-pct"><b>'+brl(p.pPacote)+'</b> o pacote</span>');
  /* pacote de uma unidade so: repetir o mesmo numero so confunde */
  if(p.pUnidade && !(p.pPacote && Math.abs(p.pUnidade-p.pPacote)<0.005))
    partes.push('<span class="r-un"><b>'+brl(p.pUnidade)+'</b> a unidade</span>');
  if(p.pKg)      partes.push('<span class="r-kg"><b>'+brl(p.pKg)+'</b> o quilo</span>');
  return partes.join('');
}

  h += '<div class="chips"><button class="chip '+(!fCat?'on':'')+'" data-a="setCat" data-i="">Todos</button>';

         '. Você está vendo a tabela de '+CANAL_NOME[canal]+'.</span></div>';

  return h;
}

/* ---- seletor de cliente dentro do pedido ---- */
function seletorCliente(){
  const q = sac(bqCli).trim();
  let lista = D.clientes.slice();
  if(q) lista = lista.filter(c=>sac(c.razao+' '+c.fantasia+' '+c.cidade+' '+c.cnpj).indexOf(q)>-1);
  lista.sort((a,b)=>{
    const ua=ultimaCompra(a.id)||'', ub=ultimaCompra(b.id)||'';
    if(ua!==ub) return ub.localeCompare(ua);
    return (a.fantasia||a.razao).localeCompare(b.fantasia||b.razao,'pt-BR');
  });

  let h = '';

  /* rascunhos guardados: ele salvou para voltar depois, então voltar
     tem que ser um toque — não uma caçada no histórico */
  const rasc = D.pedidos.filter(p=>p.status==='Rascunho' && p.itens.length)
    .sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  if(rasc.length){
    h += '<div class="secao">Rascunho'+(rasc.length===1?'':'s')+' guardado'+(rasc.length===1?'':'s')+'</div>'+
      '<div class="cartao" style="margin-bottom:14px">';
    rasc.slice(0,5).forEach(p=>{
      const c = clienteDe(p), t = totais(p);
      h += '<button class="lin" data-a="retomar" data-i="'+esc(p.id)+'">'+
        '<span class="ini">'+esc(iniciais(c?(c.fantasia||c.razao):'?'))+'</span>'+
        '<span class="info"><span class="nm">'+esc(c?(c.fantasia||c.razao):'Sem cliente')+'</span>'+
        '<span class="sub"><span>'+esc(p.num)+'</span><span>'+dbr(p.data)+'</span>'+
        '<span>'+t.itens+' it · '+nm(t.cx,t.cx%1?1:0)+' cx</span>'+
        (p.demo?'<span class="et et-ex">exemplo</span>':'')+'</span></span>'+
        '<span class="dir"><span class="val">'+brl0(t.liquido)+'</span></span>'+
        '<span class="seta">'+ico('seta')+'</span></button>';
    });
    h += '</div>';
  }

  /* aba Pedido abre com um botao so: NOVO PEDIDO. Escolher o cliente vem depois do toque.
     Cadastro de cliente e coisa da aba Clientes (pedido do Willian). */
  if(!ESCOLHENDO_CLIENTE){
    h += '<button class="bt bt-p bt-bloco bt-alto" data-a="novoPedidoIniciar">'+ico('mais')+'NOVO PEDIDO</button>'+
      '<div class="peq" style="margin:7px 3px 14px">Escolhe o cliente, preenche os dados, monta os itens e confere. '+
      (D.clientes.length ? '' : 'Ainda não há cliente cadastrado: cadastre na aba <b>Clientes</b> primeiro.')+'</div>';
    const ult = D.pedidos.filter(p=>p.status!=='Rascunho').sort((a,b)=>(b.criadoEm||b.data||'').localeCompare(a.criadoEm||a.data||'')).slice(0,4);
    if(ult.length){
      h += '<div class="secao">Últimos pedidos</div><div class="cartao">';
      ult.forEach(p=>{
        const c = clienteDe(p), t = totais(p);
        h += '<button class="lin" data-a="abrirPedido" data-i="'+esc(p.id)+'">'+
          '<span class="ini">'+esc(iniciais(c?(c.fantasia||c.razao):'?'))+'</span>'+
          '<span class="info"><span class="nm">'+esc(c?(c.fantasia||c.razao):'Sem cliente')+'</span>'+
          '<span class="sub"><span>'+esc(p.num)+'</span><span>'+dbr(p.data)+'</span><span class="et '+seloStatus(p.status)+'">'+esc(p.status)+'</span>'+
          (p.demo?'<span class="et et-ex">exemplo</span>':'')+'</span></span>'+
          '<span class="dir"><span class="val">'+brl0(t.liquido)+'</span></span>'+
          '<span class="seta">'+ico('seta')+'</span></button>';
      });
      h += '</div>';
    }
    return h;
  }

  h += '<div class="secao">Para quem é o pedido?</div>';
  if(!D.clientes.length){
    h += '<div class="cartao"><div class="vazio">'+ico('clientes')+
      '<p>Nenhum cliente cadastrado</p><span>Cadastre o primeiro cliente na aba Clientes para abrir um pedido. '+
      'Leva menos de um minuto.</span></div></div>'+
      '<button class="bt bt-d bt-bloco" data-a="aba" data-i="clientes">'+ico('clientes')+'Ir para Clientes</button>';
    return h;
  }
  h += '<div class="busca" style="margin-bottom:10px">'+ico('busca')+
       '<input type="text" placeholder="Buscar cliente" value="'+esc(bqCli)+'" data-in="bqCli">'+
       (bqCli?'<button class="limpar" data-a="limpaCli">'+ico('x')+'</button>':'')+'</div>';
  h += '<div class="cartao">';
  if(!lista.length) h += '<div class="vazio">'+ico('busca')+'<p>Nenhum cliente com esse nome</p></div>';
  lista.forEach(c=>{
    const u = ultimaCompra(c.id);
    const d = u ? diasEntre(u,hoje()) : null;
    h += '<button class="lin" data-a="escolherCliente" data-i="'+c.id+'">'+
      '<span class="ini">'+esc(iniciais(c.fantasia||c.razao))+'</span>'+
      '<span class="info"><span class="nm">'+esc(c.fantasia||c.razao)+'</span>'+
      '<span class="sub"><span class="et '+(c.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+CANAL_NOME[c.canal]+'</span>'+
      (c.segmento?'<span>'+esc(c.segmento)+'</span>':'')+
      (c.cidade?'<span>'+esc(c.cidade)+'</span>':'')+
      (d===null?'<span>nunca comprou</span>':'<span>há '+d+' dia'+(d===1?'':'s')+'</span>')+
      '</span></span>'+
      '<span class="seta">'+ico('seta')+'</span></button>';
  });
  h += '</div>';
  return h;
}
/* C0001, C0002... unico por cliente neste aparelho; clientes antigos ganham o deles na abertura */
function proximoCodCliente(){
  D.seqCli = (D.seqCli||0) + 1;
  return 'C' + String(D.seqCli).padStart(4,'0');
}
function garantirCodigosClientes(){
  let maior = D.seqCli||0;
  D.clientes.forEach(c=>{ const n = parseInt(String(c.cod||'').replace(/\D/g,''),10); if(!isNaN(n) && n>maior) maior=n; });
  D.seqCli = maior;
  let mudou = false;
  D.clientes.slice().sort((a,b)=>String(a.criadoEm||'').localeCompare(String(b.criadoEm||''))).forEach(c=>{ if(!c.cod && !c.demo){ c.cod = proximoCodCliente(); mudou = true; } });
  if(mudou) gravar(true);
}
function iniciais(t){
  const p = String(t||'?').trim().split(/\s+/).filter(Boolean);
  return ((p[0]||'?')[0] + (p.length>1?p[p.length-1][0]:'')).toUpperCase();
}

/* ---- montagem da tela ---- */
function telaPedido(){
  const ped = pedidoRascunho();
  if(!ped || !ped.clienteId) return seletorCliente();
  const cli = clienteDe(ped);
  /* o cliente deste rascunho foi apagado: volta para a escolha do cliente
     em vez de quebrar a tela (TAREFA 3, bug achado no teste) */
  if(!cli){ ped.clienteId = null; gravar(); return seletorCliente(); }

  /* etapa 1 (dados) vem antes dos itens; a tela dos itens fica so com os itens */
  if(etapaDe(ped)==='dados') return telaDadosPedido(ped, cli);

  let h = cartaoClientePedido(ped, cli);
  /* resumo da etapa 1 com atalho para voltar la */
  const resumo = [ped.numCliente?'OC '+ped.numCliente:'', ped.dataEntrega?'entrega '+dbr(ped.dataEntrega):'', ped.cond||''].filter(Boolean).join(' · ');
  h += '<div class="cartao" style="margin-bottom:10px"><div class="corpo" style="padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px">'+
    '<div class="peq" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
      (resumo?esc(resumo):'Sem nº do cliente nem data de entrega')+'</div>'+
    '<button class="bt bt-l" data-a="etapaDados" style="min-height:36px;padding:0 12px;flex:0 0 auto">'+ico('editar')+'Dados</button></div></div>';

  h += '<div class="busca" style="margin-bottom:9px">'+ico('busca')+
    '<input type="text" placeholder="Buscar produto ou código" value="'+esc(bq)+'" data-in="bq" '+
    'autocomplete="off" autocorrect="off" spellcheck="false">'+
    (bq?'<button class="limpar" data-a="limpaBusca">'+ico('x')+'</button>':'')+'</div>';

  h += '<div id="chips">'+chipsProduto(ped)+'</div>';

    '<div class="dupla">'+
      '<div class="campo"><label>Entrega combinada</label><input type="date" value="'+esc(ped.dataEntrega||'')+'" data-in="dataEnt" min="'+hoje()+'"></div>'+
      '<div class="campo"><label>Pagamento</label><input type="text" value="'+esc(ped.cond||'')+'" list="conds" placeholder="28 dias" data-in="cond"></div>'+
    '</div>'+
    '<div class="campo mb0"><label>Observações do pedido</label>'+
      '<textarea placeholder="Entrega, horário de recebimento, bonificação..." data-in="obs">'+esc(ped.obs||'')+'</textarea></div>'+
    '<div class="dica" style="margin-top:8px">O número do cliente é o que a indústria usa na nota; o seu ('+esc(ped.num)+') é controle interno. '+
      (cli.agendamento?'<b>Descarga:</b> '+esc(cli.agendamento):'Entrega em branco = o quanto antes.')+'</div>'+
  '</div></div>';
  h += '<button class="bt bt-p bt-bloco bt-alto" data-a="etapaItens">CONTINUAR PARA OS ITENS '+ico('seta')+'</button>'+

function pintaResultados(){

function pintaItens(){

function pintaRodape(){

      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">'+

      '</div></div></div>';
  });
  modal('Histórico de '+esc(c.fantasia||c.razao), h,
    '<div class="linha-bt"><button class="bt bt-l" data-a="fechaModal">Fechar</button>'+
    (peds.length?'<button class="bt bt-p" data-a="repetirUltimo" data-i="'+esc(id)+'">'+ico('repetir')+'Repetir o último</button>':'')+'</div>');
};
/* Repete o ultimo pedido fechado deste cliente no rascunho atual, com o preco de tabela de hoje */
ACOES.repetirUltimo = id => {
  const ped = pedidoRascunho(); if(!ped || ped.clienteId!==id){ aviso('Abra um pedido para este cliente primeiro.'); return; }
  const ult = D.pedidos.filter(p=>p.clienteId===id && VALE(p.status) && p.id!==ped.id).sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(!ult){ aviso('Este cliente ainda não tem pedido fechado.'); return; }
  const aplica = () => {
    let n = 0, fora = 0;
    (ult.itens||[]).forEach(it=>{
      const pr = porId[it.skuId]; if(!pr) return;
      const ja = ped.itens.find(x=>x.skuId===it.skuId);
      if(ja){ ja.qtd = it.qtd; }
      else {
        /* nasce no ultimo preco digitado (Willian: se vendeu mais caro, nao pode cair sem querer);
           o que estiver fora da tabela de hoje fica marcado, e ele ve no card */
        const tab = precoDe(pr,it.un);
        const pv = (Number(it.preco)>0) ? Number(it.preco) : tab;
        const novo = { skuId:it.skuId, cod:pr.cod, nome:pr.nome, un:it.un, qtd:it.qtd, preco:pv };
        if(tab>0 && pv < tab-0.005){ novo.abaixoTabela = tab; fora++; }
        if(tab>0 && pv > tab+0.005){ novo.acimaTabela = tab; fora++; }
        ped.itens.push(novo);
      }
      n++;
    });
    gravar(); fechaModal(); render();
    aviso('Repetido o pedido '+ult.num+': '+n+' itens no último preço'+(fora?' · '+fora+' fora da tabela de hoje (marcados)':''));
  };
  if(ped.itens.length){ confirmar('Somar ao pedido atual?', 'Os '+ult.itens.length+' itens do pedido '+ult.num+' entram no que você já montou (quantidades iguais são substituídas).', 'Somar', 'bt-p', aplica); }
  else aplica();
};

ACOES.mais = i => { const ped=pedidoRascunho(); ped.itens[+i].qtd = (ped.itens[+i].qtd||0)+1; gravar(); pintaItens(); };

function textoDiferenca(preco, tab){
  if(!tab) return '';
  const d = preco - tab;
  if(Math.abs(d) < 0.005) return '<span style="color:var(--cinza)">é o preço de tabela</span>';
  const pct = d/tab*100;
  const acima = d > 0;
  return '<span style="color:var(--'+(acima?'verde':'terracota')+')">'+
    (acima?'+':'−')+' '+brl(Math.abs(d))+' por caixa  ·  '+
    (acima?'+':'−')+nm(Math.abs(pct),1)+'% '+(acima?'acima':'abaixo')+' da tabela</span>';
}

};

ACOES.salvarPreco = i => {
  const ped=pedidoRascunho(); const it=ped.itens[+i];
  const v = pnum(el('np').value);
  if(v<=0){ aviso('Informe um preço maior que zero.'); return; }
  const tab = precoDe(porId[it.skuId], it.un);
  const aplica = () => {
    it.preco = v;
    it.abaixoTabela = (tab>0 && v < tab - 0.005) ? tab : undefined;
    it.acimaTabela  = (tab>0 && v > tab + 0.005) ? tab : undefined;
    gravar(); fechaModal(); pintaItens(); pintaResultados();
  };
  /* acima da tabela tambem pergunta: o pedido nasce na tabela e qualquer mudanca e consciente */
  if(tab>0 && v > tab + 0.005){
    const pct = (v-tab)/tab*100;
    modal('Vender acima da tabela?',
      '<div style="font-size:calc(15px * var(--esc));font-weight:650;margin-bottom:6px">'+esc(it.nome)+'</div>'+
      '<table class="tabelinha"><tr><td>Tabela</td><td>'+brl(tab)+'</td></tr>'+
      '<tr><td>Você digitou</td><td class="v-verde">'+brl(v)+'</td></tr>'+
      '<tr><td>Diferença</td><td class="v-verde">+ '+brl(v-tab)+' por caixa · +'+nm(pct,1)+'%</td></tr></table>'+
      '<div class="aviso mt10">'+ico('alerta')+'<span>Vale só neste pedido e fica marcado no item como acima da tabela. Confirme se foi combinado com o cliente (contrato, frete, prazo).</span></div>',
      '<div class="linha-bt"><button class="bt bt-l" data-a="editarPreco" data-i="'+i+'">Voltar</button>'+
      '<button class="bt bt-v" data-a="confAbaixo">Sim, vender a '+brl(v)+'</button></div>');
    ACOES.confAbaixo = aplica;
    return;
  }
  /* abaixo da tabela pode — mas nunca por engano: pergunta antes, mostrando a diferença */
  if(tab>0 && v < tab - 0.005){
    const pct = (tab-v)/tab*100;
    modal('Vender abaixo da tabela?',
      '<div style="font-size:calc(15px * var(--esc));font-weight:650;margin-bottom:6px">'+esc(it.nome)+'</div>'+
      '<table class="tabelinha"><tr><td>Tabela</td><td>'+brl(tab)+'</td></tr>'+
      '<tr><td>Você digitou</td><td class="v-terra">'+brl(v)+'</td></tr>'+
      '<tr><td>Diferença</td><td class="v-terra">− '+brl(tab-v)+' por caixa · −'+nm(pct,1)+'%</td></tr></table>'+
      '<div class="aviso mt10">'+ico('alerta')+'<span>Vale só neste pedido e fica marcado no item. Confirme só se é negociação de verdade.</span></div>',
      '<div class="linha-bt"><button class="bt bt-l" data-a="editarPreco" data-i="'+i+'">Voltar</button>'+
      '<button class="bt bt-r" data-a="confAbaixo">Sim, vender a '+brl(v)+'</button></div>');
    ACOES.confAbaixo = aplica;
    return;
  }
  aplica();
};

/* =====================================================
   TEXTO DO PEDIDO  +  TELA DE ENVIO
   ===================================================== */
/* Linha com pontinhos: "Subtotal ........ R$ 11.836,24".
   Sem isso o WhatsApp vira um bloco de texto sem hierarquia. */
function _pt(rot, val, larg){
  larg = larg || 38;
  const espaco = larg - rot.length - val.length - 2;
  return rot + ' ' + (espaco>0 ? '.'.repeat(espaco) : '') + ' ' + val;
}
const _REGUA = '─────────────────────────────';

function montarTexto(ped, marcado, paraCliente){
  const b = marcado ? '*' : '';
  const cli = clienteDe(ped) || {};
  const t = totais(ped);
  const L = [];

  L.push(b + (paraCliente ? 'CONFIRMAÇÃO DE PEDIDO ' : 'PEDIDO ') + ped.num + ' — ' + nomeMarca().toUpperCase() + b);
  L.push(_REGUA);
  /* o numero que a industria tem que usar na NF e o do CLIENTE; o nosso e controle interno */
  if(ped.numCliente)  L.push(b+'Nº DO PEDIDO DO CLIENTE (usar na NF): ' + ped.numCliente + b);
  else if(!paraCliente) L.push('Cliente não informou nº de pedido — emitir com o número de vocês.');
  L.push('Ref. interna do representante (não usar na NF): ' + ped.num);
  L.push('Data do pedido: ' + dbr(ped.data));
  if(ped.dataEntrega) L.push(b+'Entrega combinada: ' + dbr(ped.dataEntrega)+b);
  if(ped.cond)        L.push('Pagamento: ' + ped.cond);

  L.push('');
  L.push(b+'CLIENTE'+b);
  L.push(_REGUA);
  L.push(cli.razao||'—');
  if(cli.fantasia && cli.fantasia!==cli.razao) L.push('Fantasia: '+cli.fantasia);
  if(cli.cod || cli.codIndustria) L.push('Código: '+[cli.cod, cli.codIndustria?'indústria '+cli.codIndustria:''].filter(Boolean).join(' · '));
  if(cli.agendamento) L.push('Descarga / agendamento: '+cli.agendamento);
  if(cli.rede)      L.push('Rede: '+cli.rede + (cli.loja?' — loja '+cli.loja:''));
  else if(cli.loja) L.push('Loja: '+cli.loja);
  if(cli.cnpj)   L.push('CNPJ: '+cnpjBonito(cli.cnpj));
  if(cli.ie)     L.push('Inscrição estadual: '+cli.ie);
  if(cli.regime) L.push('Regime: '+cli.regime);
  L.push('Canal: '+(CANAL_NOME[cli.canal]||'—')+(cli.segmento?' · '+cli.segmento:''));
  if(cli.endereco)   L.push('Entrega: '+cli.endereco);
  const reg = [cli.bairro, cli.cidade].filter(Boolean).join(' — ');
  if(reg)            L.push('Bairro/cidade: '+reg);
  if(cli.cep)        L.push('CEP: '+cepBonito(cli.cep));
  if(cli.referencia) L.push('Referência: '+cli.referencia);
  const contato = [cli.contato, cli.whats?telBonito(cli.whats):'', cli.fone?telBonito(cli.fone):'']
    .filter(Boolean).join(' — ');
  if(contato) L.push('Contato: '+contato);

  L.push('');
  L.push(b+'ITENS'+b);
  L.push(_REGUA);
  ped.itens.forEach((it,k)=>{
    const p = porId[it.skuId] || {};
    L.push((k+1)+') cód '+it.cod+' — '+it.nome);
    L.push('   ' + _pt(nm(it.qtd)+' '+UN_CURTO[it.un]+' x '+brl(it.preco),
                       brl(it.preco*it.qtd), 36));
    const det = [];
    if(p.pacotesPorCaixa) det.push(nm(p.pacotesPorCaixa)+' pct/cx');
    if(p.kgCaixa && it.un==='CX') det.push(nm(kgDe(p,it.un)*it.qtd,1)+' kg no total');
    if(det.length) L.push('   '+det.join(' · '));
    if(paraCliente){
      const ref = [];
      if(p.pPacote)  ref.push(brl(p.pPacote)+' o pacote');
      if(p.pUnidade && !(p.pPacote && Math.abs(p.pUnidade-p.pPacote)<0.005))
        ref.push(brl(p.pUnidade)+' a unidade');
      if(p.pKg)      ref.push(brl(p.pKg)+' o quilo');
      if(ref.length) L.push('   ' + ref.join(' · '));
    }
    if(k < ped.itens.length-1) L.push('');
  });

  L.push('');
  L.push(b+'RESUMO'+b);
  L.push(_REGUA);
  L.push(_pt('Itens',    String(t.itens)));
  L.push(_pt('Caixas',   nm(t.cx, t.cx%1?1:0)));
  L.push(_pt('Peso',     nm(t.kg,1)+' kg'));
  L.push(_pt('Subtotal', brl(t.bruto)));
  if(t.desc>0) L.push(_pt('Desconto '+vlr(ped.desc).replace(/,00$/,'')+'%', '- '+brl(t.desc)));
  L.push(_REGUA);
  L.push(b+_pt('TOTAL', brl(t.liquido))+b);

  if(ped.obs){ L.push(''); L.push(b+'OBSERVAÇÕES'+b); L.push(ped.obs); }

  const rep = [D.cfg.repNome, D.cfg.repTel?telBonito(D.cfg.repTel):'', D.cfg.repEmail]
    .filter(Boolean).join(' — ');
  if(rep){ L.push(''); L.push('Representante: '+rep); }

  if(!paraCliente){
    const anx = ['PDF do pedido', 'planilha (CSV)'];
    if(ped.anexo && ped.anexo.dados) anx.push('foto do pedido original do cliente');
    L.push('Em anexo: '+anx.join(', ')+'.');
  }
  return L.join('\n');
}

function telBonito(t){
  const n = soN(t);
  const s = n.length>11 && n.slice(0,2)==='55' ? n.slice(2) : n;
  if(s.length===11) return '('+s.slice(0,2)+') '+s.slice(2,7)+'-'+s.slice(7);
  if(s.length===10) return '('+s.slice(0,2)+') '+s.slice(2,6)+'-'+s.slice(6);
  return t;
}
function telWa(t){
  let n = soN(t);
  if(!n) return '';
  if(n.length<=11) n = '55'+n;
  return n;
}

function precisaConferir(p){ return (p.status==='Enviado' || p.status==='Faturado') && !p.conferido; }
function cartaoEntrega(ped){
  if(ped.status!=='Enviado' && ped.status!=='Faturado') return '';
  const t = totais(ped);
  if(!ped.conferido){
    return '<div class="secao">Entrega</div><div class="cartao"><div class="corpo">'+
      '<div style="font-size:calc(15px * var(--esc));font-weight:700;margin-bottom:4px">O pedido veio completo?</div>'+

        '<button class="bt bt-v" data-a="entregaCompleta" data-i="'+esc(ped.id)+'">'+ico('check')+'Veio tudo</button>'+
        '<button class="bt bt-l" data-a="entregaFaltou" data-i="'+esc(ped.id)+'">Faltou algo</button>'+
      '</div></div></div>';
  }
  return '<div class="secao">Entrega</div><div class="cartao"><div class="corpo">'+
    '<table class="tabelinha">'+
      '<tr><td>Pedido</td><td>'+brl(t.liquido)+'</td></tr>'+

      (t.cortado>0?'<tr><td>Cortado pela indústria</td><td class="v-terra">'+brl(t.cortado)+'</td></tr>':'')+
      (t.pendente>0?'<tr><td>Ainda vai vir</td><td class="v-ambar">'+brl(t.pendente)+'</td></tr>':'')+
      (t.cortado<=0&&t.pendente<=0?'<tr><td>Situação</td><td class="v-verde">completo</td></tr>':'')+
    '</table>'+
    '<div class="peq mt10">Conferido em '+dbr(String(ped.conferido).slice(0,10))+'. '+
    '<button class="bt bt-t" data-a="entregaFaltou" data-i="'+esc(ped.id)+'" style="min-height:32px;padding:0 6px">Refazer</button></div>'+
    '</div></div>';
}
ACOES.entregaCompleta = id => {
  const p = pedidoPorId(id); if(!p) return;
  p.itens.forEach(it=>{ it.qtdFat = it.qtd; delete it.falta; });
  p.conferido = new Date().toISOString(); gravar(); render(); aviso('Entrega conferida: veio tudo');
};
let CONF = null;
ACOES.entregaFaltou = id => {
  const p = pedidoPorId(id); if(!p) return;
  CONF = { id:id, itens: p.itens.map(it=>({ skuId:it.skuId, un:it.un, qtd:it.qtd, preco:it.preco,
           qtdFat:(it.qtdFat==null?it.qtd:it.qtdFat), falta:(it.falta||'cortado') })) };
  modal('O que faltou?', corpoConferencia(), '<button class="bt bt-p bt-bloco" data-a="salvarConferencia">Salvar conferência</button>');
};
function corpoConferencia(){
  let h = '<div class="peq" style="margin-bottom:10px">Mexa só no que veio diferente. Quantidade entregue por item:</div>';
  CONF.itens.forEach((it,i)=>{
    const pr = porId[it.skuId]; const nome = pr ? pr.nome : it.skuId;
    const faltou = it.qtdFat < it.qtd;

ENTRADAS.confQtd = (v,i) => {
  if(!CONF) return; const it = CONF.itens[+i]; const q = pnum(v);
  it.qtdFat = Math.max(0, Math.min(isNaN(q)?it.qtd:q, it.qtd));
  const c = document.querySelector('#modal .corpom'); if(c){ const foco=document.activeElement&&document.activeElement.dataset.i; c.innerHTML = corpoConferencia(); if(foco!=null){ const n=c.querySelector('[data-in="confQtd"][data-i="'+foco+'"]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } } }
};
ACOES.confFalta = par => {
  if(!CONF) return; const [i,f] = String(par).split(':'); CONF.itens[+i].falta = f;
  const c = document.querySelector('#modal .corpom'); if(c) c.innerHTML = corpoConferencia();
};
ACOES.salvarConferencia = () => {
  if(!CONF) return; const p = pedidoPorId(CONF.id); if(!p) return;
  CONF.itens.forEach((ci,i)=>{ const it = p.itens[i]; if(!it) return;
    it.qtdFat = ci.qtdFat; if(ci.qtdFat < ci.qtd) it.falta = ci.falta; else delete it.falta; });
  p.conferido = new Date().toISOString(); CONF = null;
  gravar(); fechaModal(); render();
  const t = totais(p); aviso('Conferência salva'+(t.cortado>0?' · corte '+brl(t.cortado):''));
};
/* linhas do painel: so aparecem quando ha pedido conferido no periodo */
function linhasEntrega(P){
  const f = perFaixa(P);
  const peds = pedidosValidos().filter(p=>p.conferido && p.data>=f.ini && p.data<=f.fim);
  if(!peds.length) return '';
  let ent=0, cor=0, pen=0; peds.forEach(p=>{ const t=totais(p); ent+=t.entregue; cor+=t.cortado; pen+=t.pendente; });
  const aConf = pedidosValidos().filter(p=>precisaConferir(p) && p.data>=f.ini && p.data<=f.fim).length;
  return '<tr><td>Entregue (pedidos conferidos)</td><td class="v-verde">'+brl0(ent)+'</td></tr>'+
    (cor>0?'<tr><td>Corte da indústria</td><td class="v-terra">'+brl0(cor)+'</td></tr>':'')+
    (pen>0?'<tr><td>Ainda vai vir</td><td class="v-ambar">'+brl0(pen)+'</td></tr>':'')+
    (aConf?'<tr><td>Entregas a conferir</td><td class="v-ambar">'+aConf+'</td></tr>':'');
}

/* --- as três saídas da revisão --- */

/* Fechar: a venda existe a partir daqui. Vai direto para as vias,
   que é o que ele faz em seguida com o comprador ainda na frente. */
ACOES.fecharPedido = id => {
  const p = pedidoPorId(id); if(!p) return;
  if(!p.itens.length){ aviso('Coloque pelo menos um item antes de fechar.'); return; }
  p.status = 'Fechado';
  p.fechadoEm = new Date().toISOString();
  if(D.rascunhoId===id) D.rascunhoId = null;
  gravar();
  VISTA = {t:'enviar', id:id}; window.scrollTo(0,0); render();
  aviso('Pedido '+p.num+' fechado · '+brl(totais(p).liquido));
};

/* Rascunho: sai do pedido sem perder nada e volta para a carteira. */
ACOES.salvarRascunho = id => {
  const p = pedidoPorId(id); if(!p) return;
  p.status = 'Rascunho';
  if(D.rascunhoId===id) D.rascunhoId = null;
  gravar(); VISTA = null; bq=''; bqCli=''; fCat=null; fCanal=null;
  irPara('clientes');
  aviso('Pedido '+p.num+' salvo como rascunho');
};

/* Cancelar: fica no histórico como Cancelado, fora das contas do painel. */
ACOES.cancelarPedido = id => {

    'Ele sai da sua frente e fica no histórico marcado como <b>Cancelado</b> — '+
    'não entra na venda do mês nem na última compra do cliente.</p>'+
    '<p style="margin:0;font-size:calc(14.5px * var(--esc));line-height:1.5">Se foi engano seu e o pedido nem '+
    'existiu, dá para apagar de vez.</p>',
    '<button class="bt bt-r bt-bloco" data-a="confCancelar" data-i="'+esc(id)+'">'+
      ico('x')+'Cancelar o pedido</button>'+
    '<button class="bt bt-l bt-bloco mt10" data-a="apagarPedido" data-i="'+esc(id)+'" '+
      'style="color:var(--terracota)">'+ico('lixo')+'Apagar de vez</button>'+
    '<button class="bt bt-t bt-bloco mt10" data-a="fechaModal">Voltar</button>');
};

/* Voltar a mexer num pedido já fechado. */
ACOES.reabrirPedido = id => {
  const p = pedidoPorId(id); if(!p) return;

    p.status = 'Rascunho'; D.rascunhoId = id; gravar();

ACOES.setStatus = (id,st) => {
  const p = pedidoPorId(id); if(!p) return;
  p.status = st;
  if(st==='Fechado' && !p.fechadoEm) p.fechadoEm = new Date().toISOString();

/* O app abre o WhatsApp ou o e-mail com o texto pronto — quem envia é ele.
   Então a situação do pedido só muda quando ele confirma que enviou. */
function perguntarSeSaiu(ped){
  if(ped.status!=='Rascunho' && ped.status!=='Fechado') return;
  setTimeout(()=>{
    modal('O pedido saiu?',
      '<p style="margin:2px 0 12px;font-size:calc(14.5px * var(--esc));line-height:1.5">'+
      'O app não envia sozinho. Ele abre o WhatsApp (ou o e-mail) já com o texto do pedido '+
      '<b>'+esc(ped.num)+'</b> escrito. O pedido só sai quando você toca no botão de enviar lá dentro.</p>'+
      '<p style="margin:0;font-size:calc(14.5px * var(--esc));line-height:1.5">Conseguiu enviar?</p>',
      '<div class="linha-bt">'+
      '<button class="bt bt-l" data-a="fechaModal">Ainda não</button>'+
      '<button class="bt bt-v" data-a="confirmarEnvio" data-i="'+esc(ped.id)+'">Sim, enviei</button></div>');
  }, 1200);
}

const EH_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function abrir(url){
  /* no iPhone o clique programatico com _blank e barrado como pop-up; mailto: e wa.me abrem
     o app certo pela propria aba, e o navegador volta sozinho */
  if(EH_IOS || /^mailto:/i.test(url)){ location.href = url; return; }
  const a = document.createElement('a');
  a.href = url; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
ACOES.enviarWa = (cid, pid) => {

  abrir('https://wa.me/'+telWa(c.tel)+'?text='+encodeURIComponent(montarTexto(ped,true)));
  perguntarSeSaiu(ped);
};

ACOES.copiarTexto = pid => {
  const ped = pedidoPorId(pid); if(!ped) return;
  copiar(montarTexto(ped,true));
};
function copiar(txt){
  const ok = ()=>aviso('Texto copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, ()=>copiaVelha(txt,ok));
  } else copiaVelha(txt,ok);
}
function copiaVelha(txt, ok){
  const a = document.createElement('textarea');
  a.value = txt; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.focus(); a.select();
  try{ document.execCommand('copy'); ok(); }
  catch(e){ aviso('Não consegui copiar. Use "Ver o texto" e copie à mão.'); }
  a.remove();
}

let bqClientes = '';
let fCliCanal = null;
let fCliSeg   = null;
/* Tipos de negocio sugeridos no cadastro. O Canal continua mandando na tabela de preco;
   o tipo e para ele saber quem e quem e para o Painel somar por tipo. Pode digitar outro. */
const SEGMENTOS = ['Padaria','Lanchonete','Cafeteria','Restaurante','Pizzaria','Bar','Hotel / Pousada',
  'Supermercado','Mercadinho','Mercearia','Hortifruti','Açougue','Conveniência','Empório / Delicatessen',
  'Distribuidor / Atacado','Cozinha industrial','Escola / Refeitório','Outro'];
function contarSegmentos(lista){
  const m = {};
  lista.forEach(c=>{ const k=(c.segmento||'').trim(); if(k) m[k]=(m[k]||0)+1; });
  return Object.keys(m).map(k=>({nome:k, n:m[k]})).sort((a,b)=>b.n-a.n || a.nome.localeCompare(b.nome,'pt-BR'));
}

function resumoCliente(id){
  const ps = D.pedidos.filter(p=>p.clienteId===id && VALE(p.status));
  let total=0, cx=0, kg=0;
  ps.forEach(p=>{ const t=totais(p); total+=t.liquido; cx+=t.cx; kg+=t.kg; });
  const u = ultimaCompra(id);
  return { qtd:ps.length, total:total, cx:cx, kg:kg, ultima:u,
           dias: u?diasEntre(u,hoje()):null, ticket: ps.length?total/ps.length:0 };
}
/* Redes já digitadas, para ele escolher em vez de redigitar (e não escrever
   "Bramil" numa loja e "BRAMIL" na outra, que quebraria o agrupamento). */
/* "Bairro · Cidade" — o endereço curto que serve para montar rota. */
function regiao(c){
  return [c.bairro, c.cidade].filter(Boolean).join(' · ');
}
function bairrosCadastrados(){
  const vistos = {}, fora = [];
  D.clientes.forEach(c=>{
    const bR = (c.bairro||'').trim();
    if(!bR) return;
    const k = sac(bR);
    if(!vistos[k]){ vistos[k] = 1; fora.push(bR); }
  });
  return fora.sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function redesCadastradas(){
  const vistas = {}, fora = [];
  D.clientes.forEach(c=>{
    const r = (c.rede||'').trim();
    if(!r) return;
    const k = sac(r);
    if(!vistas[k]){ vistas[k] = r; fora.push(r); }
  });
  return fora.sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
/* Duas lojas da mesma rede podem estar escritas diferente; a chave é o texto
   sem acento e sem caixa. O nome mostrado é o primeiro que ele digitou. */
const chaveRede = r => sac(String(r||'').trim());

function cnpjBonito(v){
  const n = soN(v);
  if(n.length!==14) return v||'';
  return n.slice(0,2)+'.'+n.slice(2,5)+'.'+n.slice(5,8)+'/'+n.slice(8,12)+'-'+n.slice(12);
}

  const q = sac(bqClientes).trim();
  let lista = D.clientes.slice();

  if(fCliSeg)   lista = lista.filter(c=>(c.segmento||'')===fCliSeg);

  lista.sort((a,b)=>
    (a.rede||'\uffff').localeCompare(b.rede||'\uffff','pt-BR') ||
    nomeCli(a).localeCompare(nomeCli(b),'pt-BR'));

  let h = '<div class="busca" style="margin-bottom:9px">'+ico('busca')+
    '<input type="text" placeholder="Buscar cliente, cidade ou CNPJ" value="'+esc(bqClientes)+'" data-in="bqClientes">'+
    (bqClientes?'<button class="limpar" data-a="limpaClientes">'+ico('x')+'</button>':'')+'</div>';

  const nV = D.clientes.filter(c=>c.canal==='VAREJO').length;
  const nF = D.clientes.filter(c=>c.canal==='FOODSERVICE').length;
  h += '<div class="chips">'+
    '<button class="chip '+(!fCliCanal?'on':'')+'" data-a="setCliCanal" data-i="">Todos<span class="n">'+D.clientes.length+'</span></button>'+
    '<button class="chip '+(fCliCanal==='VAREJO'?'on':'')+'" data-a="setCliCanal" data-i="VAREJO">Varejo<span class="n">'+nV+'</span></button>'+
    '<button class="chip '+(fCliCanal==='FOODSERVICE'?'on':'')+'" data-a="setCliCanal" data-i="FOODSERVICE">Food Service<span class="n">'+nF+'</span></button>'+
    '</div>';

  /* segunda fila de filtros: o tipo de negocio (padaria, supermercado...), so quando alguem tem */
  const segs = contarSegmentos(D.clientes.filter(c=>!fCliCanal || c.canal===fCliCanal));
  if(segs.length){
    h += '<div class="chips" style="margin-top:-4px">'+
      '<button class="chip '+(!fCliSeg?'on':'')+'" data-a="setCliSeg" data-i="">Todos os tipos</button>'+

        esc(x.nome)+'<span class="n">'+x.n+'</span></button>').join('')+
      '</div>';
  }

  /* cadastrar novo fica no alto: com 200 clientes ninguem rola ate o fim para achar o botao */
  h += '<button class="bt bt-d bt-bloco" style="margin-bottom:10px" data-a="novoCliente">'+ico('mais')+'Novo cliente</button>';

  if(!D.clientes.length){
    h += '<div class="cartao"><div class="vazio">'+ico('clientes')+'<p>Sua carteira começa aqui</p>'+
      '<span>Cadastre os clientes uma vez. Depois é só escolher e o pedido sai em poucos toques.</span></div></div>';
  } else if(!lista.length){
    h += '<div class="cartao"><div class="vazio">'+ico('busca')+'<p>Nenhum cliente encontrado</p></div></div>';
  } else {
    h += '<div class="cartao">';
    lista.forEach(c=>{
      const r = resumoCliente(c.id);
      const frio = r.dias!==null && r.dias>=30;
      h += '<button class="lin" data-a="verCliente" data-i="'+c.id+'">'+
        '<span class="ini">'+esc(iniciais(c.fantasia||c.razao))+'</span>'+
        '<span class="info"><span class="nm">'+esc(nomeCli(c))+'</span>'+
        '<span class="sub">'+

          '<span class="et '+(c.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+CANAL_NOME[c.canal]+'</span>'+
          (c.segmento?'<span>'+esc(c.segmento)+'</span>':'')+
          (c.demo?'<span class="et et-ex">exemplo</span>':'')+

          (r.dias===null?'<span>nunca comprou</span>':
            frio?'<span class="et et-al">'+r.dias+' dias sem comprar</span>':'<span>há '+r.dias+' dia'+(r.dias===1?'':'s')+'</span>')+

function ehUtil(dt){
  const d = dia(dt).getDay();               // 0 dom ... 6 sáb
  if(D.cfg.diasUteis==='seg-sab') return d>=1 && d<=6;
  if(D.cfg.diasUteis==='todos')   return true;
  return d>=1 && d<=5;
}
function diasDoMes(ym){
  const [a,m] = ym.split('-').map(Number);
  const n = new Date(a, m, 0).getDate();
  const out = [];
  for(let i=1;i<=n;i++) out.push(ym+'-'+String(i).padStart(2,'0'));
  return out;
}
function mesBonito(ym){
  const [a,m] = ym.split('-').map(Number);
  return MES_NOME[m-1] + ' de ' + a;
}
function mesVizinho(ym, passo){
  let [a,m] = ym.split('-').map(Number);
  m += passo;
  if(m<1){ m=12; a--; } if(m>12){ m=1; a++; }
  return a+'-'+String(m).padStart(2,'0');
}

/* O painel trabalha sempre com um PERÍODO. Mês é o normal — é como ele
   pensa e como a meta é definida — mas dá para abrir uma faixa de datas
   qualquer sem que o resto da tela precise saber a diferença. */
let PER = {tipo:'mes', ym:hoje().slice(0,7)};

function somaDias(d, n){
  const x = dia(d); x.setDate(x.getDate()+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+
         String(x.getDate()).padStart(2,'0');
}
function perFaixa(P){
  if(P.tipo==='mes'){ const d = diasDoMes(P.ym); return {ini:d[0], fim:d[d.length-1]}; }
  return {ini:P.ini, fim:P.fim};
}
function perDias(P){
  const f = perFaixa(P), out = [];
  let d = f.ini;
  while(d <= f.fim){ out.push(d); d = somaDias(d,1); }
  return out;
}
/* O período de comparação: o mês anterior, ou a mesma quantidade de dias
   imediatamente antes. É o que dá sentido às setas de variação. */
function perAnt(P){
  if(P.tipo==='mes') return {tipo:'mes', ym:mesVizinho(P.ym,-1)};
  const f = perFaixa(P), n = diasEntre(f.ini, f.fim) + 1;
  const fim = somaDias(f.ini, -1);
  return {tipo:'faixa', ini:somaDias(fim, -(n-1)), fim:fim};
}
function perRot(P){
  if(P.tipo==='mes') return mesBonito(P.ym);
  const f = perFaixa(P);
  if(f.ini===f.fim) return dbr(f.ini);
  const mesmoAno = f.ini.slice(0,4)===f.fim.slice(0,4);
  return (mesmoAno ? dbr(f.ini).slice(0,5) : dbr(f.ini)) + ' a ' + dbr(f.fim);
}
function perCurto(P){
  return P.tipo==='mes' ? mesBonito(P.ym).split(' de ')[0] : 'o período anterior';
}

function dadosPer(P){
  const f = perFaixa(P);
  const peds = pedidosValidos().filter(p=>p.data>=f.ini && p.data<=f.fim);
  const dias = perDias(P);
  const porDia = {}; dias.forEach(d=>porDia[d]=0);
  let total=0, cx=0, kg=0;
  const clientes = {}, prods = {}, cliVal = {};
  peds.forEach(p=>{
    const t = totais(p);
    total += t.liquido; cx += t.cx; kg += t.kg;
    if(porDia[p.data]!==undefined) porDia[p.data] += t.liquido;
    if(p.clienteId){
      clientes[p.clienteId] = true;
      cliVal[p.clienteId] = (cliVal[p.clienteId]||0) + t.liquido;
    }
    const fator = t.bruto>0 ? t.liquido/t.bruto : 1;
    (p.itens||[]).forEach(it=>{
      const k = it.skuId;
      if(!prods[k]) prods[k] = {nome:it.nome, cod:it.cod, val:0, cx:0};
      prods[k].val += it.preco*it.qtd*fator;
      prods[k].cx  += caixasEquiv(porId[it.skuId], it.un, it.qtd);
    });
  });
  const porCanal = {VAREJO:0, FOODSERVICE:0};
  const porSeg = {};
  peds.forEach(p=>{
    const c = clientePorId(p.clienteId);
    const v = totais(p).liquido;
    if(c && porCanal[c.canal] !== undefined) porCanal[c.canal] += v;
    /* por tipo de negocio: quem nao tem tipo entra como "Sem tipo", para a conta fechar */
    const k = (c && c.segmento && c.segmento.trim()) || 'Sem tipo';
    if(!porSeg[k]) porSeg[k] = {nome:k, val:0, n:0, cli:{}};
    porSeg[k].val += v; porSeg[k].n += 1; if(c) porSeg[k].cli[c.id] = 1;
  });
  const porSegmento = Object.keys(porSeg).map(k=>porSeg[k])
    .map(x=>({nome:x.nome, val:x.val, n:x.n, clientes:Object.keys(x.cli).length}))
    .sort((a,b)=>b.val-a.val);

  const hj = hoje();
  const ehMesAtual = hj>=f.ini && hj<=f.fim;
  const uteisTotal = dias.filter(ehUtil).length;
  const uteisAte   = ehMesAtual ? dias.filter(d=>d<=hj && ehUtil(d)).length : uteisTotal;
  const uteisFalta = Math.max(0, uteisTotal - uteisAte);

  return {
    P:P, ini:f.ini, fim:f.fim, ym:(P.tipo==='mes'?P.ym:f.ini.slice(0,7)),
    peds:peds, dias:dias, porDia:porDia, total:total, cx:cx, kg:kg,
    nClientes:Object.keys(clientes).length,
    ticket: peds.length ? total/peds.length : 0,
    nPedidos: peds.length,
    hojeVal: porDia[hj]||0,
    ehMesAtual:ehMesAtual, uteisTotal:uteisTotal, uteisAte:uteisAte, uteisFalta:uteisFalta,
    topProd: Object.keys(prods).map(k=>prods[k]).sort((a,b)=>b.val-a.val).slice(0,5),
    topCli: Object.keys(cliVal).map(k=>({id:k, val:cliVal[k]})).sort((a,b)=>b.val-a.val).slice(0,5),
    porCanal: porCanal,
    porSegmento: porSegmento,
    quemComprou: clientes
  };
}

/* Quem comprou no mês passado e ainda não comprou neste. É a lista que
   salva faturamento antes de virar cliente inativo. */
function sumiramNoPer(P){
  const a = perFaixa(P), b = perFaixa(perAnt(P));
  const compraramAntes = {}, compraramAgora = {};
  pedidosValidos().forEach(p=>{
    if(!p.clienteId) return;
    if(p.data>=b.ini && p.data<=b.fim)
      compraramAntes[p.clienteId] = (compraramAntes[p.clienteId]||0) + totais(p).liquido;
    if(p.data>=a.ini && p.data<=a.fim) compraramAgora[p.clienteId] = true;
  });
  return Object.keys(compraramAntes)
    .filter(id => !compraramAgora[id] && clientePorId(id))
    .map(id => ({ c: clientePorId(id), valor: compraramAntes[id] }))
    .sort((a,b)=>b.valor-a.valor);
}

function graficoMes(m){
  const dias = m.dias, n = dias.length;
  const W = 340, H = 150, x0 = 8, x1 = 332, yTopo = 12, yBase = 120;
  const larg = (x1-x0)/n;
  const bw = Math.max(3, larg*0.62);
  let max = 0; dias.forEach(d=>{ if(m.porDia[d]>max) max = m.porDia[d]; });
  const metaDia = (D.cfg.metaMes>0 && m.uteisTotal) ? D.cfg.metaMes/m.uteisTotal : 0;
  if(metaDia>max) max = metaDia;
  if(max<=0) max = 1;
  const y = v => yBase - (v/max)*(yBase-yTopo);
  const hj = hoje();

  let barras = '';
  dias.forEach((d,i)=>{
    const v = m.porDia[d];
    const cx = x0 + larg*i + larg/2;
    if(v>0){
      const alt = Math.max(2, yBase - y(v));
      barras += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(yBase-alt).toFixed(1)+
        '" width="'+bw.toFixed(1)+'" height="'+alt.toFixed(1)+'" rx="'+Math.min(2,bw/2).toFixed(1)+
        '" fill="'+(d===hj?'#33302E':'#F2A900')+'"/>';
    } else if(d<=hj || !m.ehMesAtual){
      barras += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(yBase-2)+'" width="'+bw.toFixed(1)+
        '" height="2" rx="1" fill="#E6E0D8"/>';
    }
  });

  let rotulos = '';
  const mostraUltimo = (n%5!==0) && (n - Math.floor(n/5)*5 >= 3);
  dias.forEach((d,i)=>{
    const num = i+1;
    if(num===1 || num%5===0 || (num===n && mostraUltimo)){
      rotulos += '<text x="'+(x0+larg*i+larg/2).toFixed(1)+'" y="136" text-anchor="middle" '+
        'font-size="9" fill="#8A8A8A" font-family="system-ui,sans-serif">'+num+'</text>';
    }
  });

  const metaLinha = metaDia>0 ?
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+y(metaDia).toFixed(1)+'" y2="'+y(metaDia).toFixed(1)+
    '" stroke="#8A3324" stroke-width="1.2" stroke-dasharray="4 3" opacity=".75"/>' : '';

  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" '+
    'aria-label="Venda por dia em '+mesBonito(m.ym)+'">'+
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+yBase+'" y2="'+yBase+'" stroke="#E6E0D8" stroke-width="1"/>'+
    metaLinha + barras + rotulos + '</svg>';
}
