/* =====================================================
   SIMULADOR DE MARGEM — para a negociação na hora
   Custo (o que o cliente paga), margem, markup, preço de venda e
   lucro. Mexeu num, os outros seguem. A conta âncora é custo + margem:
   margem  = lucro / venda        (sobre o preço de venda)
   markup  = lucro / custo        (sobre o custo)
   ===================================================== */
/* =====================================================
   TABELAS E CONTRATOS (simulação)
   Cliente pede contrato de X% sobre a nota. Para o representante continuar
   recebendo o mesmo, a tabela dele sobe: preço ÷ (1 - X%), arredondado
   PARA CIMA no centavo. Ex.: 10,00 com 5% -> 10 / 0,95 = 10,5263 -> 10,53.
   ===================================================== */
function precoContrato(preco, pct){
  const p = Number(preco)||0, c = Number(pct)||0;
  if(c<=0 || c>=100) return Math.round(p*100)/100;
  return Math.ceil(p/(1-c/100)*100 - 1e-9)/100;
}
function tabelaDoCliente(cli){
  if(!cli || !cli.tabelaId || !Array.isArray(D.cfg.tabelas)) return null;
  return D.cfg.tabelas.find(t=>t.id===cli.tabelaId) || null;
}

function pdfDaTabela(t){
  const A4L = 595.28, A4A = 841.89, M = 38;
  const paginas = []; const recursos = {};
  const mk = marcaAtual();
  let pg, y;
  const cab = () => {
    pg = NovaPagina(A4L, A4A); paginas.push(pg); y = M;
    const fim = pg.txt(M, y+16, (mk.logo1||mk.nome||'')+' ', {tam:20, negrito:true, cor:GRAFITE_PDF});
    if(mk.logo2) pg.txt(fim, y+16, mk.logo2, {tam:20, negrito:true, cor:DOURADO_PDF});
    pg.txt(M, y+29, 'Tabela de preços', {tam:8, cor:CINZA_PDF});
    pg.txt(A4L-M, y+12, dbr(hoje()), {tam:9, cor:CINZA_PDF, align:'r'});
    pg.txt(A4L-M, y+26, t.nome, {tam:10, negrito:true, cor:GRAFITE_PDF, align:'r'});
    y += 40; pg.linha(M, y, A4L-M, y, 2, GRAFITE_PDF); y += 16;
    pg.ret(M, y-11, A4L-2*M, 16, GRAFITE_PDF);
    pg.txt(M+5, y, 'CÓD.', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(M+48, y, 'PRODUTO', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(A4L-M-150, y, 'CAIXA', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(A4L-M-58, y, 'R$ CAIXA', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(A4L-M-4, y, 'R$ PACOTE', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    y += 14;
  };
  cab();
  let cat = null, zebra = 0;
  linhasTabela(t).forEach(l=>{
    if(y > A4A - M - 30) cab();
    if(l.categoria !== cat){
      cat = l.categoria;
      if(y > A4A - M - 44) cab();
      y += 4; pg.txt(M, y, cat.toUpperCase(), {tam:7.5, negrito:true, cor:CINZA_PDF}); y += 12;
    }
    const nomeL = quebrarLinhas(l.nome, A4L-M-150-(M+48)-8, 8.5, false);
    const alt = Math.max(1, nomeL.length)*10 + 5;
    if(zebra%2===0) pg.ret(M, y-8, A4L-2*M, alt, CREME_PDF);
    pg.txt(M+5, y, l.cod, {tam:8, cor:GRAFITE_PDF});
    nomeL.forEach((ln,k)=>pg.txt(M+48, y+k*10, ln, {tam:8.5, negrito:k===0, cor:GRAFITE_PDF}));
    pg.txt(A4L-M-150, y, l.caixa, {tam:7.5, cor:CINZA_PDF});
    pg.txt(A4L-M-58, y, brl(l.pCaixa), {tam:8.5, negrito:true, cor:GRAFITE_PDF, align:'r'});
    if(l.pPacote) pg.txt(A4L-M-4, y, brl(l.pPacote), {tam:8.5, cor:GRAFITE_PDF, align:'r'});
    y += alt; zebra++;
  });
  y += 14; pg.linha(M, y, A4L-M, y, 0.5, LINHA_PDF); y += 14;
  const rep = [D.cfg.repNome, D.cfg.repTel?telBonito(D.cfg.repTel):'', D.cfg.repEmail].filter(Boolean).join('  ·  ');
  pg.txt(M, y, 'Representante: '+rep+'  ·  Preços por caixa fechada, sujeitos a confirmação no pedido.', {tam:8, cor:CINZA_PDF});
  return montarPdf(paginas, recursos);
}

const MG = { vista:'margem', modo:'custo', ultimo:'custo', custo:10, venda:14.29, margem:30, rotulo:'', opcoes:null, voltarPedido:false, modal:false, item:null, busca:'' };
/* dois caminhos: 'custo' (custo + margem -> preço de venda) ou 'venda' (preço de venda + margem -> custo) */
function mgCalc(){
  const m = Math.min(Math.max(Number(MG.margem)||0, -900), 99.99);
  let c, v;
  if(MG.modo==='venda'){ v = Math.max(0, Number(MG.venda)||0); c = v*(1-m/100); }
  else { c = Math.max(0, Number(MG.custo)||0); v = c/(1-m/100); }
  return { custo:c, margem:m, markup: m/(100-m)*100, venda:v, lucro:v-c };
}
function mgFmt(campo, r){
  if(campo==='custo' || campo==='venda' || campo==='lucro') return vlr(r[campo]);
  return nm(r[campo], 2);
}
function mgTexto(){
  return MG.modo==='venda'
    ? 'o <b>preço de venda está travado</b> — mexendo na margem, muda o custo que você precisa fazer.'
    : 'o <b>custo está travado</b> — mexendo na margem, muda o preço de venda.';
}

    '<span class="et '+(p.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+CANAL_NOME[p.canal]+'</span></span></span>'+
    '<span class="dir"><span class="val">'+brl(p.pCaixa)+'</span></span></button>').join('');
}

function mgPintar(exceto){
  const r = mgCalc();
  ['custo','margem','markup','venda','lucro'].forEach(k=>{
    if(k===exceto) return;
    const n = el('mg_'+k); if(n) n.value = mgFmt(k, r);
  });
  document.querySelectorAll('[data-a="mgMargem"]').forEach(b=>b.classList.toggle('on', Math.abs(r.margem-Number(b.dataset.i))<0.005));
  document.querySelectorAll('[data-a="mgModo"]').forEach(b=>b.classList.toggle('on', b.dataset.i===MG.modo));
  ['custo','venda'].forEach(k=>{ const n=el('mg_'+k); if(n) n.classList.toggle('mg-anc', k===MG.modo); });
  const tx = el('mg_txt'); if(tx) tx.innerHTML = mgTexto();
  document.querySelectorAll('[data-a="mgCusto"]').forEach(b=>b.classList.toggle('on', MG.modo!=='venda' && Math.abs(r.custo-Number(b.dataset.i))<0.005));
}
/* Mesa de negociacao: o ultimo valor em R$ que ele digitou (custo ou venda) fica travado.
   Digitou venda e depois margem -> muda o custo. Digitou custo e depois margem -> muda a venda.
   Digitou custo e venda em seguida -> os dois ficam e a margem e calculada. */
ENTRADAS.mg = (v, campo) => {
  const x = pnum(v); const r = mgCalc();
  if(campo==='custo'){
    MG.custo = x;
    if(MG.ultimo==='venda' && r.venda>0) MG.margem = (r.venda-x)/r.venda*100;
    MG.venda = r.venda; MG.modo = 'custo';
  } else if(campo==='venda'){
    MG.venda = x;
    if(MG.ultimo==='custo' && x>0) MG.margem = (x-r.custo)/x*100;
    MG.custo = r.custo; MG.modo = 'venda';
  } else if(campo==='margem'){ MG.margem = Math.min(x, 99.99); }
  else if(campo==='markup'){ MG.margem = x/(100+x)*100; }
  else if(campo==='lucro'){
    if(MG.modo==='venda'){ if(r.venda>0) MG.margem = x/r.venda*100; }
    else { if(r.custo+x>0) MG.margem = x/(r.custo+x)*100; }
  }
  MG.ultimo = campo;
  mgPintar(campo);
};
ENTRADAS.mgBusca = v => { MG.busca = v; const l = el('mg_lista'); if(l) l.innerHTML = mgListaHTML(); };
ACOES.mgModo = m => { const r = mgCalc(); MG.modo = (m==='venda') ? 'venda' : 'custo'; MG.ultimo = MG.modo; MG.custo = r.custo; MG.venda = r.venda; mgRefazer(); };
ACOES.mgMargem = v => { MG.margem = Number(v)||0; mgPintar(null); };
ACOES.mgCusto  = v => { const r = mgCalc(); MG.modo = 'custo'; MG.ultimo = 'custo'; MG.custo = Number(v)||0; MG.margem = r.margem; mgRefazer(); };
/* produto da tabela: custo = preco por pacote, com caixa e unidade como opcao */
ACOES.mgProduto = id => {
  const p = porId[id]; if(!p) return;
  const cx = p.pCaixa||0, pc = p.pPacote||0, un = p.pUnidade||0;
  MG.opcoes = [{rot:'Caixa', v:Math.round(cx*100)/100}];
  if(pc) MG.opcoes.push({rot:'Pacote', v:Math.round(pc*100)/100});
  if(un && (p.unPorPacote||0)>1) MG.opcoes.push({rot:'Unidade', v:Math.round(un*100)/100});
  MG.modo = 'custo'; MG.ultimo = 'custo'; MG.custo = pc || cx; MG.rotulo = p.nome+' — cód. '+p.cod+' (tabela)'; MG.busca = '';
  mgRefazer();
};
ACOES.mgLimpar = () => {
  MG.modo='custo'; MG.ultimo='custo'; MG.custo = 0; MG.venda = 0; MG.margem = 30; MG.rotulo=''; MG.opcoes=null; MG.voltarPedido=false; MG.item=null; MG.busca='';
  mgRefazer(); setTimeout(()=>{ const n=el('mg_custo'); if(n){ n.focus(); n.select(); } },150);
};
ACOES.mgVoltarPedido = () => { MG.voltarPedido = false; irPara('pedido'); };
/* Do preço do item no pedido: o custo do cliente é o que ele paga a você */
ACOES.simularMargem = i => {
  const ped = pedidoRascunho(); const it = ped ? ped.itens[+i] : null; if(!it) return;
  const p = porId[it.skuId] || {};
  const np = el('np'); const precoCx = np ? pnum(np.value) : it.preco;
  const cx = it.un==='CX' ? precoCx : (precoDe(p,'CX')||0);
  const pc = p.pacotesPorCaixa ? cx/p.pacotesPorCaixa : 0;
  const un = (pc && p.unPorPacote) ? pc/p.unPorPacote : 0;
  MG.opcoes = [{rot:'Caixa', v:Math.round(cx*100)/100}];
  if(pc) MG.opcoes.push({rot:'Pacote', v:Math.round(pc*100)/100});
  if(un && p.unPorPacote>1) MG.opcoes.push({rot:'Unidade', v:Math.round(un*100)/100});
  MG.modo = 'custo'; MG.ultimo = 'custo'; MG.custo = pc || cx; MG.rotulo = it.nome + ' — cód. ' + it.cod; MG.voltarPedido = false; MG.item = +i; MG.busca = '';
  abrirMargemModal();
};

function telaPainel(){
  const mes = PER.tipo==='mes';
  let topo = '<div class="chips" style="justify-content:space-between;padding-bottom:8px">'+
    (mes?'<button class="chip" data-a="mesAnterior" aria-label="Período anterior">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:15px;height:15px;transform:rotate(180deg)">'+IC.seta+'</svg></button>':'')+
    '<button class="chip on" style="flex:1;justify-content:center" data-a="escolherPeriodo">'+
      esc(perRot(PER))+'</button>'+
    (mes?'<button class="chip" data-a="mesSeguinte" aria-label="Período seguinte">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:15px;height:15px">'+IC.seta+'</svg></button>'
        :'<button class="chip" data-a="voltarAoMes">Mês</button>')+
  '</div>';
  if(!mes){
    const n = perDias(PER).length;
    topo += '<div class="peq" style="margin:-4px 3px 9px">Período livre de '+n+' dia'+(n===1?'':'s')+
      ', comparado com os '+n+' dias anteriores. Toque em <b>Mês</b> para voltar ao normal.</div>';
  }
  topo += '<div class="chips">'+ VISTAS_PAINEL.map(v=>
    '<button class="chip '+(vistaPainel===v.id?'on':'')+'" data-a="setVistaPainel" data-i="'+v.id+'">'+
    v.rot+'</button>').join('') +'</div>';

  if(vistaPainel==='clientes') return topo + painelClientes();
  if(vistaPainel==='produtos') return topo + painelProdutos();
  if(vistaPainel==='redes')    return topo + painelRedes();
  return topo + painelDoMes();
}

/* ---- escolher o período ---- */
const ATALHOS_PER = [
  {id:'7',    rot:'Últimos 7 dias'},
  {id:'14',   rot:'Últimos 14 dias'},
  {id:'30',   rot:'Últimos 30 dias'},
  {id:'90',   rot:'Últimos 90 dias'},
  {id:'mes',  rot:'Este mês'},
  {id:'ant',  rot:'Mês passado'},
  {id:'tri',  rot:'Últimos 3 meses'},
  {id:'ano',  rot:'Este ano'}
];
ACOES.escolherPeriodo = () => {
  const f = perFaixa(PER);
  modal('Período do painel',
    '<div class="peq" style="margin:0 0 10px">Vale para os quatro cortes — mês, clientes, '+
    'produtos e redes. A comparação usa sempre o período de mesmo tamanho logo antes.</div>'+
    '<div class="chips chips-quebra" style="padding-bottom:12px">'+ ATALHOS_PER.map(a=>
      '<button class="chip" data-a="perAtalho" data-i="'+a.id+'">'+a.rot+'</button>').join('') +'</div>'+
    '<div class="dupla">'+
      '<div class="campo mb0"><label>De</label><input type="date" id="p_ini" value="'+esc(f.ini)+'"></div>'+
      '<div class="campo mb0"><label>Até</label><input type="date" id="p_fim" value="'+esc(f.fim)+'"></div>'+
    '</div>',
    '<button class="bt bt-p bt-bloco" data-a="perAplicar">'+ico('check')+'Usar este período</button>');
};
ACOES.perAtalho = id => {
  const hj = hoje();
  if(id==='mes'){ PER = {tipo:'mes', ym:hj.slice(0,7)}; mesPainel = PER.ym; }
  else if(id==='ant'){ PER = {tipo:'mes', ym:mesVizinho(hj.slice(0,7),-1)}; mesPainel = PER.ym; }
  else if(id==='ano'){ PER = {tipo:'faixa', ini:hj.slice(0,4)+'-01-01', fim:hj}; }
  else if(id==='tri'){ PER = {tipo:'faixa', ini:diasDoMes(mesVizinho(hj.slice(0,7),-2))[0], fim:hj}; }
  else { PER = {tipo:'faixa', ini:somaDias(hj, -(Number(id)-1)), fim:hj}; }
  fechaModal(); window.scrollTo(0,0); render();
};
ACOES.perAplicar = () => {
  const a = el('p_ini').value, b = el('p_fim').value;
  if(!a || !b){ aviso('Escolha as duas datas.'); return; }
  PER = a<=b ? {tipo:'faixa', ini:a, fim:b} : {tipo:'faixa', ini:b, fim:a};
  fechaModal(); window.scrollTo(0,0); render();
};
ACOES.voltarAoMes = () => {
  PER = {tipo:'mes', ym:mesPainel}; window.scrollTo(0,0); render();
};

function painelDoMes(){
  const m = dadosPer(PER);
  const meta = PER.tipo==='mes' ? (Number(D.cfg.metaMes)||0) : 0;
  const pct = meta>0 ? m.total/meta : 0;
  const esperado = meta>0 && m.uteisTotal ? meta*(m.uteisAte/m.uteisTotal) : 0;
  const ritmo = esperado>0 ? m.total/esperado : null;
  const c = ritmo===null ? '' : cor(ritmo);
  const projecao = m.uteisAte>0 ? m.total/m.uteisAte*m.uteisTotal : 0;
  const falta = Math.max(0, meta - m.total);
  const porDiaFalta = m.uteisFalta>0 ? falta/m.uteisFalta : falta;

  let h = '';

  /* --- meta do mês --- */
  h += '<div class="cartao"><div class="corpo">'+
    '<div class="rot" style="font-size:calc(11px * var(--esc));font-weight:700;letter-spacing:.5px;'+
      'text-transform:uppercase;color:var(--cinza);margin-bottom:4px">Faturamento '+
      (PER.tipo==='mes'?'do mês':'do período')+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">'+
      '<div style="font-size:calc(31px * var(--esc));font-weight:800;letter-spacing:-1px;line-height:1" class="'+(c?'v-'+c:'')+'">'+brl0(m.total)+'</div>'+
      (meta>0?'<div class="peq" style="font-weight:650">de '+brl0(meta)+'</div>':'')+
    '</div>';
  if(meta>0){
    const larg = Math.min(100, pct*100);
    const marco = Math.min(100, (m.uteisTotal? m.uteisAte/m.uteisTotal:0)*100);
    h += '<div class="barra-p marco"><i class="b-'+(c||'ambar')+'" style="width:'+larg.toFixed(1)+'%"></i>'+
         '<span class="agulha" style="left:'+marco.toFixed(1)+'%"></span></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:7px;font-size:calc(12px * var(--esc));color:var(--cinza)">'+
        '<span>'+nm(pct*100,0)+'% da meta</span>'+
        '<span>'+(ritmo!==null?'ritmo '+nm(ritmo*100,0)+'%':'')+'</span></div>';
    if(m.ehMesAtual){
      h += '<hr><table class="tabelinha">'+
        '<tr><td>Projeção de fechamento</td><td class="'+(projecao>=meta?'v-verde':'v-terra')+'">'+brl0(projecao)+'</td></tr>'+
        '<tr><td>Falta para a meta</td><td>'+(falta>0?brl0(falta):'meta batida')+'</td></tr>'+
        linhasEntrega(PER)+
        (falta>0?'<tr><td>Por dia útil ('+m.uteisFalta+' restante'+(m.uteisFalta===1?'':'s')+')</td><td>'+
          (m.uteisFalta>0?brl0(porDiaFalta):'último dia')+'</td></tr>':'')+
        '</table>';
    }
  } else {
    if(PER.tipo==='mes'){
      h += '<div class="peq" style="margin-top:9px">Defina a meta do mês em Ajustes para acompanhar o ritmo, '+
        'a projeção e quanto falta por dia.</div>'+
        '<button class="bt bt-l bt-bloco mt10" data-a="aba" data-i="ajustes" style="min-height:44px">'+ico('alvo')+'Definir meta</button>';
    } else {
      h += '<div class="peq" style="margin-top:9px">'+dbr(m.ini)+' a '+dbr(m.fim)+' · '+
        m.nPedidos+' pedido'+(m.nPedidos===1?'':'s')+' · '+m.uteisTotal+' dias úteis. '+
        'A meta é mensal, então não entra numa faixa livre.</div>';
    }
  }
  /* entrega conferida aparece mesmo sem meta definida */
  { const le = linhasEntrega(PER); if(le && !(meta>0 && m.ehMesAtual)) h += '<table class="tabelinha mt10">'+le+'</table>'; }
  h += '</div></div>';

  /* --- comparação com o mês anterior --- */
  const ant = dadosPer(perAnt(PER));
  const vFat = variacao(m.total, ant.total);
  const vTic = variacao(m.ticket, ant.ticket);
  const vCx  = variacao(m.cx, ant.cx);
  const vCli = variacao(m.nClientes, ant.nClientes);

  const metaCx = Number(D.cfg.metaCaixas)||0;
  const carteira = D.clientes.length;
  const posit = carteira ? m.nClientes/carteira*100 : 0;

  h += '<div class="kpis">'+
    kpi(m.ehMesAtual?'Venda de hoje':'Melhor dia',
        m.ehMesAtual ? brl0(m.hojeVal) : brl0(Math.max.apply(null,[0].concat(m.dias.map(d=>m.porDia[d])))),
        m.ehMesAtual ? dbr(hoje()).slice(0,5) : '') +
    kpi('Ticket médio', brl0(m.ticket),
        m.nPedidos+' pedido'+(m.nPedidos===1?'':'s')+' '+setinha(vTic)) +
    kpi('Positivação', carteira? nm(posit,0)+'%' : '—',
        carteira ? m.nClientes+' de '+carteira+' clientes '+setinha(vCli) : 'cadastre a carteira',
        posit>=70?'v-verde':posit>=40?'v-ambar':(carteira?'v-terra':'')) +
    kpi('Caixas', nm(m.cx, m.cx%1?1:0),
        (metaCx?'meta '+nm(metaCx)+' cx · ':nm(m.kg,0)+' kg ')+setinha(vCx)) +
  '</div>';

  /* --- mês contra mês --- */
  if(ant.total > 0 || m.total > 0){
    h += '<div class="cartao"><div class="corpo" style="padding:12px 14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'+
        '<div><div class="rot" style="font-size:calc(11px * var(--esc));font-weight:700;letter-spacing:.5px;'+
          'text-transform:uppercase;color:var(--cinza)">Contra '+esc(perCurto(perAnt(PER)))+'</div>'+
          '<div class="peq" style="margin-top:2px">'+brl0(ant.total)+' naquele mês</div></div>'+
        '<div style="font-size:calc(19px * var(--esc));font-weight:800">'+(vFat===null?'—':setinha(vFat))+'</div>'+
      '</div></div></div>';
  }

  /* --- mix por canal --- */
  const somaCanal = m.porCanal.VAREJO + m.porCanal.FOODSERVICE;
  if(somaCanal > 0){
    const pv = m.porCanal.VAREJO/somaCanal*100;
    h += '<div class="cartao"><div class="cab">'+ico('caixa')+'<h2>De onde veio a venda</h2></div>'+
      '<div class="corpo">'+
      '<div class="mix"><i class="mix-v" style="width:'+pv.toFixed(1)+'%"></i>'+
        '<i class="mix-f" style="width:'+(100-pv).toFixed(1)+'%"></i></div>'+
      '<div class="leg" style="margin-top:10px">'+
        '<span><i style="background:#1E7A4D"></i>Varejo '+nm(pv,0)+'% · '+brl0(m.porCanal.VAREJO)+'</span>'+
        '<span><i style="background:#B8860B"></i>Food Service '+nm(100-pv,0)+'% · '+brl0(m.porCanal.FOODSERVICE)+'</span>'+
      '</div></div></div>';
  }

  /* --- por tipo de negocio (padaria, supermercado...) --- */
  const segsComTipo = (m.porSegmento||[]).filter(x=>x.nome!=='Sem tipo');
  if(segsComTipo.length){
    const maxs = m.porSegmento[0].val || 1;
    const semTipo = (m.porSegmento||[]).find(x=>x.nome==='Sem tipo');
    h += '<div class="cartao"><div class="cab">'+ico('clientes')+'<h2>Por tipo de negócio</h2></div>'+
      '<div class="corpo">';
    m.porSegmento.forEach((x,i)=>{
      const pct = m.total>0 ? x.val/m.total*100 : 0;
      h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
        '<span class="nm" style="flex:1"><span style="display:block">'+esc(x.nome)+
          ' <span style="color:var(--cinza);font-weight:600">· '+x.clientes+' cliente'+(x.clientes===1?'':'s')+' · '+x.n+' pedido'+(x.n===1?'':'s')+'</span></span>'+
        '<span class="mini"><i style="width:'+((x.val/maxs)*100).toFixed(1)+'%'+(x.nome==='Sem tipo'?';background:var(--linha2)':'')+'"></i></span></span>'+
        '<span class="vl">'+brl0(x.val)+'<br><span style="font-size:calc(11px * var(--esc));color:var(--cinza);font-weight:600">'+nm(pct,0)+'%</span></span></div>';
    });
    if(semTipo) h += '<div class="peq" style="margin-top:10px">"Sem tipo" são clientes sem o tipo de negócio no cadastro. Preencha em Clientes › editar para a conta ficar completa.</div>';
    h += '</div></div>';
  }

  /* --- gráfico --- */
  h += '<div class="cartao"><div class="cab">'+ico('painel')+'<h2>Dia a dia</h2></div>'+
    '<div class="corpo" style="padding:10px 6px 12px">'+graficoMes(m)+
    '<div class="leg" style="padding:0 8px">'+
      '<span><i style="background:#F2A900"></i>venda do dia</span>'+
      (m.ehMesAtual?'<span><i style="background:#33302E"></i>hoje</span>':'')+
      ((D.cfg.metaMes>0)?'<span><i style="background:#8A3324"></i>meta diária</span>':'')+
    '</div></div></div>';

  /* --- os ultimos seis meses --- */
  const serie = serieMeses(m.fim.slice(0,7), 6);
  if(serie.some(x=>x.val>0)){
    h += '<div class="cartao"><div class="cab">'+ico('historico')+'<h2>Últimos 6 meses</h2></div>'+
      '<div class="corpo" style="padding:10px 6px 12px">'+graficoMeses(serie, Number(D.cfg.metaMes)||0)+
      (D.cfg.metaMes>0?'<div class="leg" style="padding:0 8px">'+
        '<span><i style="background:#8A3324"></i>meta do mês</span></div>':'')+
      '</div></div>';
  }

  /* --- top produtos --- */
  h += '<div class="secao">Top produtos</div><div class="cartao"><div class="corpo">';
  if(!m.topProd.length) h += '<div class="peq">Nenhuma venda registrada neste mês.</div>';
  else {
    const maxv = m.topProd[0].val || 1;
    m.topProd.forEach((p,i)=>{
      h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
        '<span class="nm" style="flex:1"><span style="display:block">'+esc(p.nome)+'</span>'+
        '<span class="mini"><i style="width:'+((p.val/maxv)*100).toFixed(1)+'%"></i></span></span>'+
        '<span class="vl">'+brl0(p.val)+
        (p.cx>=0.05?'<br><span style="font-size:calc(11px * var(--esc));color:var(--cinza);font-weight:600">'+
          nm(p.cx, p.cx%1?1:0)+' cx</span>':'')+'</span></div>';
    });
  }
  h += '</div></div>';

  /* --- top clientes --- */
  h += '<div class="secao">Top clientes</div><div class="cartao"><div class="corpo">';
  if(!m.topCli.length) h += '<div class="peq">Nenhum cliente comprou neste mês.</div>';
  else {
    const maxv = m.topCli[0].val || 1;
    m.topCli.forEach((c2,i)=>{
      const cl = clientePorId(c2.id);
      h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
        '<span class="nm" style="flex:1"><span style="display:block">'+esc(cl?(cl.fantasia||cl.razao):'Cliente removido')+'</span>'+
        '<span class="mini"><i style="width:'+((c2.val/maxv)*100).toFixed(1)+'%"></i></span></span>'+
        '<span class="vl">'+brl0(c2.val)+'</span></div>';
    });
  }
  h += '</div></div>';

  /* --- sumiram de um mês para o outro --- */
  const sumidos = sumiramNoPer(PER);
  if(sumidos.length){
    const perdido = sumidos.reduce((s,x)=>s+x.valor, 0);
    h += '<div class="secao">Compraram '+(PER.tipo==='mes'?'mês passado':'no período anterior')+
      ' e ainda não '+(PER.tipo==='mes'?'neste':'agora')+' ('+sumidos.length+')</div>';
    h += '<div class="aviso" style="margin-bottom:10px">'+ico('alerta')+
      '<span>Juntos, fizeram <b>'+brl0(perdido)+'</b> antes. É o dinheiro mais fácil '+
      'de recuperar: eles já compram.</span></div>';
    h += '<div class="cartao">';
    sumidos.slice(0,10).forEach(x=>{
      h += '<button class="lin" data-a="verCliente" data-i="'+x.c.id+'">'+
        '<span class="ini">'+esc(iniciais(x.c.fantasia||x.c.razao))+'</span>'+
        '<span class="info"><span class="nm">'+esc(x.c.fantasia||x.c.razao)+'</span>'+
        '<span class="sub"><span class="et '+(x.c.canal==='VAREJO'?'et-vrj':'et-fs')+'">'+
          CANAL_NOME[x.c.canal]+'</span>'+
          (x.c.cidade?'<span>'+esc(x.c.cidade)+'</span>':'')+'</span></span>'+
        '<span class="dir"><span class="val">'+brl0(x.valor)+'</span>'+
          '<span class="peq" style="display:block">mês passado</span></span>'+
        '<span class="seta">'+ico('seta')+'</span></button>';
    });
    h += '</div>';
  }

  /* --- inativos --- */
  const frios = D.clientes.map(c=>({c:c, r:resumoCliente(c.id)}))
    .filter(x=>x.r.dias===null || x.r.dias>=30)
    .sort((a,b)=>(b.r.dias===null?99999:b.r.dias)-(a.r.dias===null?99999:a.r.dias));
  h += '<div class="secao">Sem comprar há 30 dias ou mais'+(frios.length?' ('+frios.length+')':'')+'</div>';

/* =====================================================
   XLSX escrito a mao (zip sem compressao + XML do Excel).
   Sem biblioteca: continua arquivo unico e offline.
   ===================================================== */
const CRC_TAB = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_TAB[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function zipStore(arquivos){   /* [{nome, texto}] -> Uint8Array de um .zip (metodo STORE) */
  const enc = new TextEncoder(); const partes=[]; const central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  arquivos.forEach(a=>{
    const nome=enc.encode(a.nome), dados=enc.encode(a.texto), crc=crc32(dados);
    const loc=new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nome.length), ...u16(0)]);
    partes.push(loc, nome, dados);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nome.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nome);
    off += loc.length + nome.length + dados.length;
  });
  const cdSize = central.reduce((s,x)=>s+x.length,0);
  const fim=new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(arquivos.length), ...u16(arquivos.length), ...u32(cdSize), ...u32(off), ...u16(0)]);
  const total=[...partes, ...central, fim]; const tam=total.reduce((s,x)=>s+x.length,0);
  const out=new Uint8Array(tam); let i=0; total.forEach(x=>{ out.set(x,i); i+=x.length; }); return out;
}
const xmlEsc = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colLetra(n){ let s=''; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
/* linhas: array de arrays. Celula pode ser numero, texto, ou {v, s:'moeda'|'negrito'|'titulo'|'cinza'} */
function xlsxDe(nomeAba, linhas, larguras){
  const estilos = { normal:0, negrito:1, moeda:2, titulo:3, cinza:4, moedaNegrito:5, inteiro:6 };
  let sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(larguras && larguras.length){ sheet += '<cols>'+larguras.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>'; }
  sheet += '<sheetData>';
  linhas.forEach((lin,r)=>{
    sheet += '<row r="'+(r+1)+'">';
    lin.forEach((cel,c)=>{
      if(cel==null || cel==='') return;
      const ref = colLetra(c)+(r+1);
      let v = cel, st = 'normal';
      if(cel && typeof cel==='object'){ v = cel.v; st = cel.s||'normal'; }
      if(v==null || v==='') return;
      const sIdx = estilos[st]||0;
      if(typeof v==='number') sheet += '<c r="'+ref+'" s="'+sIdx+'"><v>'+v+'</v></c>';
      else sheet += '<c r="'+ref+'" s="'+sIdx+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>';
    });
    sheet += '</row>';
  });
  sheet += '</sheetData></worksheet>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;R$&quot;\ #,##0.00"/><numFmt numFmtId="165" formatCode="0"/></numFmts>'+
    '<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font><font><sz val="10"/><color rgb="FF736F6B"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2ECE3"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="7">'+
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
      '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
      '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>'+
      '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
    '</cellXfs></styleSheet>';
  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEsc(nomeAba.slice(0,31))+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  return zipStore([
    {nome:'[Content_Types].xml', texto:ct}, {nome:'_rels/.rels', texto:rels},
    {nome:'xl/workbook.xml', texto:wb}, {nome:'xl/_rels/workbook.xml.rels', texto:wbRels},
    {nome:'xl/styles.xml', texto:styles}, {nome:'xl/worksheets/sheet1.xml', texto:sheet}
  ]);
}

function csvCampo(v){
  const s = String(v==null?'':v);
  return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvNum(v){ return String((Number(v)||0).toFixed(2)).replace('.',','); }

function montarCSV(){
  let lista = D.pedidos.slice();
  if(fStatus) lista = lista.filter(p=>p.status===fStatus);
  lista.sort((a,b)=>a.data.localeCompare(b.data));
  if(!lista.length) return null;
  const cab = ['Pedido','PedidoCliente','Data','DataEntrega','Status','Cliente','Fantasia','Rede','Loja','CNPJ','Canal','Cidade',
    'Codigo','Produto','Unidade','Quantidade','PrecoUnitario','TotalItem',
    'DescontoPct','Pagamento','Observacoes'];
  const linhas = [cab.join(';')];
  lista.forEach(p=>{
    const c = clienteDe(p) || {};
    (p.itens||[]).forEach(it=>{
      linhas.push([
        p.num, p.numCliente||'', dbr(p.data), dbr(p.dataEntrega)||'', p.status, c.razao||'', c.fantasia||'', c.rede||'', c.loja||'', cnpjBonito(c.cnpj)||'',
        CANAL_NOME[c.canal]||'', c.cidade||'',
        it.cod, it.nome, UN_CURTO[it.un], nm(it.qtd),
        csvNum(it.preco), csvNum(it.preco*it.qtd),
        csvNum(p.desc), p.cond||'', (p.obs||'').replace(/\n/g,' ')
      ].map(csvCampo).join(';'));
    });
  });
  return { nome:'pedidos-'+slugMarca()+'-'+hoje()+(fStatus?'-'+fStatus.toLowerCase():'')+'.csv',
           texto: linhas.join('\r\n') };
}

/* Quando a pagina roda dentro do visualizador da Claude, o download so passa
   pela ponte oficial. Fora dela, o jeito normal do navegador funciona. */
let PONTE_DL = null;
try{
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(d=>{ PONTE_DL = d; }, ()=>{});
  }
}catch(e){}

function baixar(nome, conteudo, tipo){
  if(PONTE_DL){
    PONTE_DL.save({filename:nome, data:conteudo}).then(
      ()=>aviso('Arquivo salvo: '+nome),
      err=>{
        const c = err && err.code;
        if(c==='declined' || c==='rate_limited') return;
        aviso('Não consegui salvar o arquivo aqui. Use o botão Copiar.');
      });
    return;
  }
  try{
    const blob = new Blob([conteudo], {type: tipo||'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    aviso('Arquivo gerado: '+nome);
  }catch(e){ aviso('Não consegui gerar o arquivo neste navegador.'); }
}

/* ---- tema ----
   'auto' nao vai para o <html>: o que vai e o tema ja resolvido,
   senao cada regra de cor precisaria ser escrita duas vezes. */
const TEMAS = [['claro','Claro'],['escuro','Escuro'],['auto','Autom\u00e1tico']];
function temaResolvido(){
  const t = D.cfg.tema || 'claro';
  if(t !== 'auto') return t;
  try{
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'escuro' : 'claro';
  }catch(e){ return 'claro'; }
}
function aplicarTema(){
  const r = temaResolvido();
  document.documentElement.setAttribute('data-tema', r);
  /* a barra do sistema no celular acompanha */
  try{
    const m = document.head.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', r === 'escuro' ? '#0E1220' : '#33302E');
  }catch(e){}
}
/* no automatico, o app vira junto com o aparelho, sem precisar reabrir */
function ouvirTemaDoAparelho(){
  try{
    if(!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const aoMudar = () => { if((D.cfg.tema||'claro') === 'auto'){ aplicarTema(); render(); } };
    if(mq.addEventListener) mq.addEventListener('change', aoMudar);
    else if(mq.addListener) mq.addListener(aoMudar);
  }catch(e){}
  /* Cinto e suspensorio: nem todo navegador avisa quando o aparelho troca
     de tema com o app aberto. Toda vez que o app volta para a frente a
     gente confere de novo — que e quando o vendedor vai olhar mesmo. */
  try{
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState !== 'visible') return;
      if((D.cfg.tema||'claro') !== 'auto') return;
      if(document.documentElement.getAttribute('data-tema') === temaResolvido()) return;
      aplicarTema(); render();
    });
  }catch(e){}
}
ACOES.setTema = t => {
  D.cfg.tema = t; gravar(); aplicarTema(); render();
  aviso(t==='claro' ? 'Tema claro' : t==='escuro' ? 'Tema escuro' : 'O tema segue o aparelho');
};

ACOES.setLetra = t => {
  D.cfg.letra = t; gravar();
  document.documentElement.setAttribute('data-letra', t);
  render();
  aviso(t==='p'?'Letra normal':t==='m'?'Letra maior':'Letra bem maior');
};

ACOES.salvarMarca = i => {
  const dados = { nome:el('mk_nome').value.trim(), logo1:el('mk_l1').value.trim(),
                  logo2:el('mk_l2').value.trim(), emailFat:el('mk_email').value.trim() };
  if(!dados.nome){ aviso('Informe o nome da marca.'); return; }
  if(i==='novo') D.cfg.marcas.push(Object.assign({id:'m'+uid(), catalogo:[]}, dados));
  else Object.assign(D.cfg.marcas[+i], dados);
  gravar(); fechaModal(); aplicarMarca(); render(); aviso('Marca salva');
};
ACOES.apagarMarca = i => {
  const m = D.cfg.marcas[+i];
  if(!m || m.id===D.cfg.marcaAtiva || D.cfg.marcas.length<2){ aviso('Não dá para apagar a marca em uso.'); return; }
  D.cfg.marcas.splice(+i,1); gravar(); fechaModal(); render(); aviso('Marca apagada');
};
ACOES.usarMarca = i => {
  D.cfg.marcaAtiva = D.cfg.marcas[+i].id; gravar(); fechaModal(); aplicarMarca(); render();
  aviso('Agora em uso: '+nomeMarca());

ACOES.lerCSVPrecos = () => {
  const f = el('arqp').files[0];
  if(!f){ aviso('Escolha o arquivo primeiro.'); return; }
  const r = new FileReader();
  r.onload = () => {
    const linhas = String(r.result).replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
    let n=0, ign=0;
    linhas.forEach(l=>{
      const c = l.split(/[;\t]/);
      if(c.length<2) return;
      const cod = String(c[0]).trim().replace(/^"|"$/g,'');
      const v = pnum(c[1]);
      if(!cod || !v || !/^\d/.test(cod)) { ign++; return; }
      const alvo = CAT.filter(p=>p.cod===cod || p.cod===cod.replace(/^0+/,''));
      if(!alvo.length){ ign++; return; }
      alvo.forEach(p=>{
        const fa = p.pCaixa>0 ? v/p.pCaixa : 1;
        p.pCaixa = v;
        if(p.pPacote)  p.pPacote  = Math.round(p.pPacote*fa*100)/100;
        if(p.pUnidade) p.pUnidade = Math.round(p.pUnidade*fa*10000)/10000;
        n++;
      });
    });
    gravarCat(); refazIndice(); fechaModal(); render();
    aviso(n+' preços atualizados'+(ign?', '+ign+' linhas ignoradas':''));
  };
  r.readAsText(f, 'utf-8');
};

function listaVersiculos(){
  const t = String(D.cfg.versiculos||'').trim();
  if(!t) return VERSICULOS_PADRAO;
  const l = t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const i = x.indexOf('|'); return i>0 ? [x.slice(0,i).trim(), x.slice(i+1).trim()] : ['', x];
  }).filter(v=>v[1]);
  return l.length ? l : VERSICULOS_PADRAO;
}
function versiculoDoDia(){
  const L = listaVersiculos();
  const d = new Date(), ini = new Date(d.getFullYear(),0,1);
  const dia = Math.floor((d - ini)/864e5);
  return L[dia % L.length];
}

/* =====================================================
   NUVEM — o cofre de mão única (Supabase, sem biblioteca)
   O celular e o dono da verdade. Tudo que muda aqui sobe
   para o banco sozinho; o banco so devolve quando um
   aparelho vazio entra com o login. Tokens ficam em
   K_SESSAO, fora do backup.
   ===================================================== */
let SESSAO = lerJSON(K_SESSAO, null);
let syncEmCurso = false, tSync = null, PENDENTES = 0;

function nuvemPronta(){ return !!(D.cfg.nuvem && D.cfg.nuvem.url && D.cfg.nuvem.chave); }
function nuvemLogada(){ return nuvemPronta() && !!(SESSAO && SESSAO.refresh_token); }
function guardarSessao(sx){
  SESSAO = sx;
  try{ if(sx) localStorage.setItem(K_SESSAO, JSON.stringify(sx)); else localStorage.removeItem(K_SESSAO); }catch(e){}
}
/* FNV-1a: assinatura barata do registro, para saber o que mudou desde o ultimo envio */
function assinatura(obj){
  const t = JSON.stringify(obj); let h = 0x811c9dc5;
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}
function hostNuvem(){ return String(D.cfg.nuvem.url||'').replace(/\/+$/,''); }

/* chamada crua a API do Supabase; renova o token quando esta para vencer */
async function nuvemFetch(caminho, corpo, semAuth, metodo, extra){
  if(!nuvemPronta()) throw new Error('Nuvem não configurada');
  if(!semAuth) await renovarSeVencendo();
  const cab = Object.assign({ 'apikey': D.cfg.nuvem.chave, 'Content-Type':'application/json' }, extra||{});
  if(!semAuth && SESSAO && SESSAO.access_token) cab['Authorization'] = 'Bearer '+SESSAO.access_token;
  const met = metodo || 'POST';
  const r = await fetch(hostNuvem()+caminho, met==='GET' ? { method:'GET', headers:cab } : { method:met, headers:cab, body:JSON.stringify(corpo||{}) });
  const txt = await r.text();
  let js = null; try{ js = txt ? JSON.parse(txt) : null; }catch(e){ js = txt; }
  if(!r.ok){
    const msg = (js && (js.message || js.msg || js.error_description || js.error || js.hint)) || ('HTTP '+r.status);
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return js;
}
async function renovarSeVencendo(){
  if(!SESSAO || !SESSAO.refresh_token) return;
  const falta = (SESSAO.expires_at||0) - Math.floor(Date.now()/1000);
  if(falta > 90) return;
  const js = await nuvemFetch('/auth/v1/token?grant_type=refresh_token', { refresh_token: SESSAO.refresh_token }, true);
  guardarSessao(sessaoDe(js));
}
function sessaoDe(js){
  return { access_token: js.access_token, refresh_token: js.refresh_token,
           expires_at: Math.floor(Date.now()/1000) + (Number(js.expires_in)||3600),
           email: js.user && js.user.email || '', user: js.user && js.user.id || '' };
}

    '<div class="campo mb0"><label>Senha</label><input type="password" id="nv_senha"></div>',

  setTimeout(()=>{ const n=el(SESSAO&&SESSAO.email?'nv_senha':'nv_email'); if(n) n.focus(); },150);
};
ACOES.nuvemLogar = async () => {
  const email = el('nv_email').value.trim(), senha = el('nv_senha').value;
  if(!email || !senha){ aviso('Preencha e-mail e senha.'); return; }
  aviso('Entrando...');
  try{
    const js = await nuvemFetch('/auth/v1/token?grant_type=password', { email, password: senha }, true);
    guardarSessao(sessaoDe(js));
    let quem = null; try{ quem = await nuvemFetch('/rest/v1/rpc/quem_sou', {}); }catch(e){}
    D.nuvem.quem = quem; D.nuvem.erro = ''; gravar(true); ajustarRepDaNuvem(); fechaModal(); render();
    if(quem && !quem.vendedor){ aviso('Entrou, mas este usuário não está amarrado a uma empresa. Avise o Willian.'); return; }
    aviso('Entrou como '+((quem&&quem.vendedor)||email));
    if(!CAT.length) await ACOES.catalogoBaixar(true);
    const temLocal = D.clientes.some(c=>!c.demo) || D.pedidos.some(p=>!p.demo);
    if(!temLocal && quem && (quem.clientes>0 || quem.pedidos>0)) ACOES.nuvemBaixar();
    else agendarSync(300);
  }catch(e){
    const m = String(e.message||'');
    if(/api ?key/i.test(m) && precisaEntrar()){
      /* ainda no portao: a chave colada nao serve; reabre o campo com ela dentro para conferir */
      PORTAO_TROCAR_CHAVE = true; render();
      aviso('A chave da nuvem está errada. Confira a chave que o Willian mandou e cole de novo.');
      return;
    }
    aviso(/api ?key/i.test(m) ? 'A chave da nuvem está errada. Confira em Ajustes › Nuvem.'
        : /invalid|credentials/i.test(m) ? 'E-mail ou senha errados.'
        : /failed to fetch|network/i.test(m) ? 'Sem internet agora. Tente de novo com sinal.'
        : 'Não entrou: '+m);
  }
};

/* ---- o que sobe ---- */
function pacoteCliente(c){ return c; }
function pacotePedido(p){
  const t = totais(p);
  const itens = (p.itens||[]).map(it=>{
    const pr = porId[it.skuId];
    return Object.assign({}, it, { nome: pr ? pr.nome : (it.nome||''), cod: pr ? pr.cod : (it.cod||'') });
  });
  const x = Object.assign({}, p, { itens, total: t.liquido, kg: t.kg, cx: t.cx,
                                   totalFat: p.conferido ? t.entregue : null });
  /* a foto do pedido original fica so no aparelho: pesada demais para o espelho */
  if(x.anexo && x.anexo.dados) x.anexo = { w:x.anexo.w, h:x.anexo.h, soNoAparelho:true };
  return x;
}
function contarPendentes(){
  let n = 0;
  D.clientes.forEach(c=>{ if(!c.demo && D.nuvem.enviados['c:'+c.id] !== assinatura(pacoteCliente(c))) n++; });
  D.pedidos.forEach(p=>{ if(!p.demo && D.nuvem.enviados['p:'+p.id] !== assinatura(pacotePedido(p))) n++; });
  PENDENTES = n; return n;
}
function agendarSync(ms){
  if(!nuvemLogada()) return;
  clearTimeout(tSync);
  tSync = setTimeout(()=>{ sincronizar().catch(()=>{}); }, ms==null ? 2500 : ms);
}
async function sincronizar(){
  if(syncEmCurso || !nuvemLogada()) return;
  if(navigator.onLine === false){ D.nuvem.erro = 'sem internet'; return; }
  syncEmCurso = true; let mudou = false;
  try{
    for(const c of D.clientes){
      if(c.demo) continue;
      const pac = pacoteCliente(c), h = assinatura(pac);
      if(D.nuvem.enviados['c:'+c.id] === h) continue;
      await nuvemFetch('/rest/v1/rpc/salvar_cliente', { c: pac });
      D.nuvem.enviados['c:'+c.id] = h; mudou = true;
    }
    for(const p of D.pedidos){
      if(p.demo) continue;
      const pac = pacotePedido(p), h = assinatura(pac);
      if(D.nuvem.enviados['p:'+p.id] === h) continue;
      await nuvemFetch('/rest/v1/rpc/salvar_pedido', { p: pac });
      D.nuvem.enviados['p:'+p.id] = h; mudou = true;
    }
    /* o que sumiu daqui vira "apagado" la — nunca some. So depois que este aparelho
       ja conversou com a nuvem pelo menos uma vez, e so se ele tem dados de verdade. */
    const vivosC = {}, vivosP = {};
    D.clientes.forEach(c=>{ if(!c.demo) vivosC[c.id] = true; });
    D.pedidos.forEach(p=>{ if(!p.demo) vivosP[p.id] = true; });
    /* Regra dura, aprendida no teste de 03/09: um aparelho so pode marcar coisas como
       apagadas na nuvem se ele TEM os dados de verdade (algum registro real aqui) ou se
       ele BAIXOU da nuvem nesta vida (baixadoEm). Sem isso, um aparelho zerado que acabou
       de entrar marcaria tudo como apagado no primeiro ciclo. */
    const temReais = Object.keys(vivosC).length > 0 || Object.keys(vivosP).length > 0;
    if(D.nuvem.ultimoOk && (temReais || D.nuvem.baixadoEm)){
      await nuvemFetch('/rest/v1/rpc/marcar_apagados', { tipo:'cliente', vivos: vivosC });
      await nuvemFetch('/rest/v1/rpc/marcar_apagados', { tipo:'pedido',  vivos: vivosP });
    }
    /* limpa assinaturas de registros que nao existem mais */
    Object.keys(D.nuvem.enviados).forEach(k=>{
      const id = k.slice(2);
      if((k[0]==='c' && !vivosC[id]) || (k[0]==='p' && !vivosP[id])) delete D.nuvem.enviados[k];
    });
    D.nuvem.ultimoOk = new Date().toISOString(); D.nuvem.erro = '';
  }catch(e){
    D.nuvem.erro = e.message || 'falhou';
    if(e.status === 401){ D.nuvem.erro = 'login venceu; entre de novo'; }
  }finally{
    syncEmCurso = false; contarPendentes(); gravar(true);
    if(ABA==='ajustes' && !VISTA) render(); else pintaEstadoNuvem();
  }
}
ACOES.nuvemSincronizar = () => {
  if(!nuvemLogada()){ ACOES.nuvemEntrar(); return; }
  aviso('Sincronizando...'); sincronizar().then(()=>aviso(D.nuvem.erro ? 'Falhou: '+D.nuvem.erro : 'Sincronizado'));
};

/* ---- o que desce: aparelho vazio ---- */
ACOES.nuvemBaixar = async () => {
  if(!nuvemLogada()){ ACOES.nuvemEntrar(); return; }
  aviso('Buscando na nuvem...');
  let js;
  try{ js = await nuvemFetch('/rest/v1/rpc/baixar_tudo', {}); }
  catch(e){ aviso('Não consegui baixar: '+e.message); return; }
  const cl = js.clientes||[], pe = js.pedidos||[];
  const aplicar = () => {
    D.clientes = D.clientes.filter(c=>c.demo).concat(cl);
    D.pedidos  = D.pedidos.filter(p=>p.demo).concat(pe);
    D.pedidos.forEach(p=>{ if(p.status==='Aberto') p.status='Rascunho'; });
    D.seq = Math.max(D.seq||0, Number(js.seq)||0);
    D.rascunhoId = null;
    /* tudo que desceu ja esta na nuvem: assina para nao subir de novo */
    D.nuvem.enviados = {};
    cl.forEach(c=>{ D.nuvem.enviados['c:'+c.id] = assinatura(pacoteCliente(c)); });
    pe.forEach(p=>{ D.nuvem.enviados['p:'+p.id] = assinatura(pacotePedido(p)); });
    D.nuvem.ultimoOk = new Date().toISOString(); D.nuvem.baixadoEm = D.nuvem.ultimoOk; D.nuvem.erro='';
    gravar(true); fechaModal(); VISTA=null; ABA='pedido'; render();
    aviso('Baixou da nuvem: '+cl.length+' clientes, '+pe.length+' pedidos');
  };
  const temLocal = D.clientes.some(c=>!c.demo) || D.pedidos.some(p=>!p.demo);
  if(!temLocal){ aplicar(); return; }
  modal('Baixar da nuvem?',
    '<table class="tabelinha"><tr><td>Na nuvem</td><td>'+cl.length+' clientes · '+pe.length+' pedidos</td></tr>'+
    '<tr><td>Neste aparelho</td><td>'+D.clientes.filter(c=>!c.demo).length+' clientes · '+D.pedidos.filter(p=>!p.demo).length+' pedidos</td></tr></table>'+
    '<div class="aviso mt10">'+ico('alerta')+'<span>O que está neste aparelho é substituído pelo da nuvem. Se aqui tem pedido que ainda não subiu, sincronize antes.</span></div>',
    '<div class="linha-bt"><button class="bt bt-l" data-a="fechaModal">Voltar</button><button class="bt bt-p" data-a="nuvemBaixarConfirma">Baixar</button></div>');
  ACOES.nuvemBaixarConfirma = aplicar;
};

/* ---- a tabela de precos mora na nuvem ----
   O arquivo do app e publico; a tabela nao pode ser. Ela so desce depois

async function marcaNaNuvem(){
  const ms = await nuvemFetch('/rest/v1/marcas?select=id,nome&order=criado_em', null, false, 'GET');
  return (ms && ms[0]) || null;
}
ACOES.catalogoBaixar = async (silencioso) => {

/* liga os gatilhos: abrir, voltar para a frente, sinal voltar */
/* O nome que assina os documentos vem do cadastro do vendedor na nuvem, a menos que ele
   tenha escrito outro em Ajustes. Enquanto estava vazio, o app punha "Vendedor de exemplo"
   e isso saia no rodape do e-mail e do PDF. */
function ajustarRepDaNuvem(){
  const q = D.nuvem && D.nuvem.quem; if(!q || !q.vendedor) return false;
  const demo = (D.demoCfg && D.demoCfg.repNome) || 'Vendedor de exemplo';
  if(!D.cfg.repNome || D.cfg.repNome===demo || D.cfg.repNome==='Vendedor de exemplo'){
    D.cfg.repNome = q.vendedor; gravar(true); return true;
  }
  return false;
}
function ligarNuvem(){
  ajustarRepDaNuvem();
  /* se entrou mas o app nao guardou quem e (falha na hora do login), pergunta de novo a nuvem */
  if(nuvemLogada() && !(D.nuvem.quem && D.nuvem.quem.vendedor)){
    setTimeout(()=>{ nuvemFetch('/rest/v1/rpc/quem_sou', {}).then(q=>{
      if(q && q.vendedor){ D.nuvem.quem = q; gravar(true); if(ajustarRepDaNuvem()) render(); }
    }).catch(()=>{}); }, 900);
  }
  if(nuvemLogada() && !CAT.length) setTimeout(()=>ACOES.catalogoBaixar(true), 400);
  try{
    window.addEventListener('online', ()=>agendarSync(500));
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') agendarSync(800); });
  }catch(e){}
  agendarSync(1500);
}

/* ---- backup ---- */
/* O pacote leva TUDO que mora neste aparelho: clientes, pedidos, ajustes,
   contador de pedido, rascunho aberto e a tabela de precos como esta hoje.
   O resumo no topo e so para a tela de conferencia ler sem abrir o resto. */
function pacoteBackup(){
  return JSON.stringify({
    app:'app-pedidos', versao:1, gerado:new Date().toISOString(),   /* backups antigos ('harus-pedidos') continuam restaurando */
    resumo:{ clientes:D.clientes.length, pedidos:D.pedidos.length,
             fechados:D.pedidos.filter(p=>VALE(p.status)).length,
             catalogo:CAT.length, rep:D.cfg.repNome||'' },
    dados:D, catalogo:CAT,
    extras:{ aba: localStorage.getItem(K_ABA)||'',
             exemploJaSaiu: localStorage.getItem('harus.exemploJaSaiu')||'' }
  });
}
function nomeBackup(){ return 'backup-'+slugMarca()+'-'+hoje()+'.json'; }
function marcarBackup(){ D.cfg.ultimoBackup = hoje(); gravar(); render(); }

/* Quantos dias desde o ultimo backup. 0 = feito hoje, -1 = nunca. */
function diasSemBackup(){
  const u = D.cfg.ultimoBackup;
  if(!u) return -1;
  const d = diasEntre(u, hoje());
  return (isNaN(d) || d<0) ? 0 : d;
}
/* Atrasado: passou de 7 dias (ou nunca houve) e ja existe pedido fechado de verdade. */
function atrasoBackup(){
  if(!D.pedidos.some(p=>VALE(p.status) && !p.demo)) return false;
  const d = diasSemBackup();
  return d === -1 || d > 7;
}
function faixaBackup(){
  if(!atrasoBackup()) return '';
  const d = diasSemBackup();
  return '<div class="faixa">'+ico('alerta')+
    '<div><b>Faça um backup</b>'+
    (d === -1
      ? 'Ainda não há nenhum backup deste aparelho. Se o celular sumir ou o navegador '+
        'limpar os dados, os pedidos vão junto.'
      : 'Último backup em '+dbr(D.cfg.ultimoBackup)+' — '+d+' dias atrás. '+
        'Leva dez segundos: manda o arquivo pra você mesmo no WhatsApp.')+
    '<button data-a="fazerBackup" style="display:block">Fazer backup agora</button>'+
    '</div></div>';
}

/* Mesmo caminho do PDF e da planilha: a folha de compartilhar do aparelho,
   que e o unico jeito de o arquivo cair direto no WhatsApp ou no e-mail.
   Navegador de computador nao tem folha: ai baixa, como antes. */
ACOES.fazerBackup = async () => {
  const txt  = pacoteBackup();
  const nome = nomeBackup();
  try{
    const arq = new File([txt], nome, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[arq]})){
      await navigator.share({
        files:[arq],
        title:'Backup do app de pedidos',
        text:'Backup de '+dbr(hoje())+' — '+D.clientes.length+' clientes, '+
             D.pedidos.length+' pedidos. Guarde este arquivo.'
      });
      marcarBackup();
      aviso('Backup enviado. Guarde o arquivo.');
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   /* desistiu na folha de compartilhar */
  }
  baixar(nome, txt, 'application/json');
  marcarBackup();
};
ACOES.baixarBackup = () => { baixar(nomeBackup(), pacoteBackup(), 'application/json'); marcarBackup(); };
ACOES.copiarBackup = () => { copiar(pacoteBackup()); marcarBackup(); };

    '<div class="campo mb0"><label>Ou cole aqui o texto do backup</label>'+

    '<button class="bt bt-p bt-bloco" data-a="lerBackup">Restaurar</button>');

/* Antes de sobrescrever, o app abre o pacote e mostra o que tem dentro.
   So depois de conferir e confirmar e que o aparelho e trocado. */
let PACOTE_PEND = null;

function aplicarBackup(txt){
  let p;
  try{ p = JSON.parse(txt); }catch(e){ aviso('Não consegui ler: o conteúdo está incompleto.'); return; }
  if(!p || !p.dados || !Array.isArray(p.dados.clientes)){ aviso('Isto não é um backup do app.'); return; }
  PACOTE_PEND = p;
  conferirBackup(p);
}

/* Data local (AAAA-MM-DD) de um carimbo ISO. O ISO vem em UTC:
   depois das 21h de Brasilia ele ja esta no dia seguinte, e cortar a
   string daria um dia a mais. */
function isoParaDiaLocal(iso){
  const d = iso ? new Date(iso) : null;
  if(!d || isNaN(d)) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function dataHoraBR(iso){
  if(!iso) return 'sem data';
  const d = new Date(iso);
  if(isNaN(d)) return 'sem data';
  const z = n => String(n).padStart(2,'0');
  return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' às '+z(d.getHours())+':'+z(d.getMinutes());
}

/* Tela de conferencia: o que veio no arquivo x o que sai do aparelho. */
function conferirBackup(p){
  const ped   = Array.isArray(p.dados.pedidos) ? p.dados.pedidos : [];
  const nCli  = p.dados.clientes.length;
  const nPed  = ped.length;
  const nFec  = ped.filter(x=>VALE(x.status)).length;
  const nCat  = Array.isArray(p.catalogo) ? p.catalogo.length : 0;
  const rep   = (p.dados.cfg && p.dados.cfg.repNome) || '';
  const datas = ped.map(x=>x.data).filter(Boolean).sort();

function gravarBackup(p){
  D = p.dados;
  D.cfg = Object.assign({}, CFG_PADRAO, D.cfg||{});
  if(!Array.isArray(D.cfg.contatos)) D.cfg.contatos = [];
  D.cfg.semContatosEmbutidos = true;
  normalizarMarcas(); normalizarNuvem();
  D.nuvem.enviados = {};   /* o que veio do arquivo ainda nao foi conferido com a nuvem */
  D.clientes = D.clientes||[]; D.pedidos = D.pedidos||[]; D.seq = D.seq||0;
  if(Array.isArray(p.catalogo) && p.catalogo.length){ CAT = p.catalogo; gravarCat(); }
  aplicarMarca();
  /* O arquivo dentro do pacote guarda a data do backup ANTERIOR, porque o
     pacote e montado antes de o backup existir. Quem manda e a data em que
     o arquivo foi gerado: o aparelho acabou de ficar igual a ela. */
  const dGer = isoParaDiaLocal(p.gerado);
  if(dGer && (!D.cfg.ultimoBackup || D.cfg.ultimoBackup < dGer)) D.cfg.ultimoBackup = dGer;
  /* o aparelho que restaura ja viu o app: nao semeia exemplo de novo */
  try{ localStorage.setItem('harus.exemploJaSaiu','1'); }catch(e){}
  refazIndice(); gravar(); fechaModal(); VISTA=null; ABA='pedido'; aplicarTema(); render();

}

function pdfDaFicha(c){
  const A4L = 595.28, A4A = 841.89, M = 38;
  const paginas = []; const recursos = {};
  const pg = NovaPagina(A4L, A4A); paginas.push(pg);
  let y = M;
  const mk = marcaAtual();
  const fim = pg.txt(M, y+16, (mk.logo1||mk.nome||'')+' ', {tam:20, negrito:true, cor:GRAFITE_PDF});
  if(mk.logo2) pg.txt(fim, y+16, mk.logo2, {tam:20, negrito:true, cor:DOURADO_PDF});
  pg.txt(M, y+29, 'Ficha cadastral de cliente', {tam:8, cor:CINZA_PDF});
  pg.txt(A4L-M, y+12, dbr(hoje()), {tam:9, cor:CINZA_PDF, align:'r'});
  if(c.cod) pg.txt(A4L-M, y+26, 'Cód. '+c.cod, {tam:9, negrito:true, cor:GRAFITE_PDF, align:'r'});
  y += 40; pg.linha(M, y, A4L-M, y, 2, GRAFITE_PDF); y += 22;
  pg.txt(M, y, c.razao||'', {tam:15, negrito:true, cor:GRAFITE_PDF}); y += 10;
  if(c.fantasia && c.fantasia!==c.razao){ y += 12; pg.txt(M, y, c.fantasia, {tam:10, cor:CINZA_PDF}); }
  y += 20;
  const linhas = dadosFicha(c);
  const wRot = 150, wVal = A4L - 2*M - wRot - 8;
  linhas.forEach((par,i)=>{
    const partes = quebraTexto(par[1], 9.5, false, wVal);
    const alt = Math.max(1, partes.length) * 12 + 8;
    if(i%2===0) pg.ret(M, y-9, A4L-2*M, alt, CREME_PDF);
    pg.txt(M+6, y+3, par[0], {tam:8.5, cor:CINZA_PDF});
    partes.forEach((t,k)=>{ pg.txt(M+wRot+8, y+3+k*12, t, {tam:9.5, negrito:k===0, cor:GRAFITE_PDF}); });
    y += alt;
  });
  y += 16; pg.linha(M, y, A4L-M, y, 0.5, LINHA_PDF); y += 16;
  const rep = [D.cfg.repNome, D.cfg.repEmpresa, D.cfg.repTel?telBonito(D.cfg.repTel):'', D.cfg.repEmail].filter(Boolean).join('  ·  ');
  pg.txt(M, y, 'Representante: '+rep, {tam:8.5, cor:CINZA_PDF});
  return montarPdf(paginas, recursos);
}
/* quebra um texto em linhas que cabem na largura (mesma métrica do PDF) */
function quebraTexto(texto, tam, neg, larg){
  const palavras = String(texto||'').split(/\s+/); const out = []; let atual = '';
  palavras.forEach(w=>{ const tent = atual ? atual+' '+w : w; if(larguraTexto(tent, tam, neg) <= larg) atual = tent; else { if(atual) out.push(atual); atual = w; } });
  if(atual) out.push(atual); return out.length ? out : [''];
}
