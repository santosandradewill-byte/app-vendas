const TIPO_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
/* planilha de UM pedido: cabecalho, itens, totais — pronta para a industria digitar */
function xlsxDoPedido(ped){
  const c = clienteDe(ped) || {}; const t = totais(ped); const bon = ehBonif(ped);
  const neg = itensNegociados(ped).length;
  const NC = neg ? 9 : 8;                      /* colunas usadas: A..H (ou A..I com "Tabela") */
  const ultima = colLetra(NC-1);
  const L = []; const mesclar = [];
  const linha = (arr, altura) => { if(altura) arr.__altura = altura; L.push(arr); return L.length; };
  const faixa = (texto, estilo, altura) => { const n = linha([{v:texto, s:estilo}], altura); for(let k=1;k<NC;k++) L[n-1][k] = {v:'', s:estilo}; mesclar.push('A'+n+':'+ultima+n); return n; };
  /* rotulo em A:C, valor em D:ultima (todas as celulas do trecho recebem o estilo, para a borda fechar) */
  const par = (rot, val, estilo) => {
    if(val==null || val==='') return;
    const n = L.length+1; const r = [];
    for(let k=0;k<3;k++) r[k] = {v:k===0?rot:'', s:estilo||'rotulo'};
    for(let k=3;k<NC;k++) r[k] = {v:k===3?String(val):'', s:estilo||'cel'};
    linha(r); mesclar.push('A'+n+':C'+n); mesclar.push('D'+n+':'+ultima+n);
  };
  /* cabecalho: com logo, a primeira linha fica alta e o titulo vai para a direita dela */
  const lg = logoDaMarca();
  if(lg){ const n = linha([{v:'', s:'normal'}, '', '', {v:(bon?'BONIFICAÇÃO — ':'')+'Pedido '+ped.num+'  ·  '+nomeMarca()+'  ·  '+dbr(ped.data), s:'titulo'}], 44); mesclar.push('D'+n+':'+ultima+n); }
  else faixa((bon?'BONIFICAÇÃO — ':'')+'Pedido '+ped.num+'  ·  '+nomeMarca()+'  ·  '+dbr(ped.data), 'titulo', 26);
  if(bon) faixa('PEDIDO DE BONIFICAÇÃO — SEM COBRANÇA. Não faturar como venda; os valores são referência para a nota de bonificação.', 'aviso', 22);
  if(neg) faixa('ATENÇÃO: '+neg+' item(ns) com preço negociado, diferente da tabela. Faturar pelo "Preço caixa" de cada item.', 'aviso', 22);
  { const rv = revisaoDe(ped); if(rv) faixa(rv.frase, 'aviso', 22); }
  linha([]);
  faixa('PEDIDO', 'cab', 18);
  par('Nº do pedido no cliente (usar na NF)', ped.numCliente || 'não informado — usar o número de vocês', ped.numCliente ? 'nf' : null);
  par('Ref. do representante', ped.num);
  par('Data do pedido', dbr(ped.data));
  par('Entrega combinada', ped.dataEntrega ? dbr(ped.dataEntrega) : 'o quanto antes');
  par('Tipo', bon ? 'Bonificação (sem cobrança)' : 'Venda');
  par('Pagamento', bon ? 'Não se aplica — sem cobrança' : (ped.cond||''));
  par('Situação', ped.status);
  linha([]);
  faixa('CLIENTE', 'cab', 18);
  par('Razão social', c.razao||'');
  par('Nome fantasia', (c.fantasia&&c.fantasia!==c.razao)?c.fantasia:'');
  par('Código do cliente na indústria', c.codIndustria || 'ainda não tem — cadastro novo');
  par('CNPJ', c.cnpj?cnpjBonito(c.cnpj):'');
  par('IE / Regime', [c.ie, c.regime].filter(Boolean).join(' · '));
  par('Canal', [CANAL_NOME[c.canal], c.segmento].filter(Boolean).join(' · '));
  par('Endereço de entrega', [c.endereco, c.bairro, c.cidade, c.cep?'CEP '+cepBonito(c.cep):''].filter(Boolean).join(' — '));
  par('Referência / descarga', [c.referencia, c.agendamento].filter(Boolean).join(' · '));
  par('Contato', [c.contato, c.fone?telBonito(c.fone):''].filter(Boolean).join(' · '));   /* so o fixo do estabelecimento */
  par('E-mail', c.email||'');
  par('E-mail para o XML da NF', c.emailXml||'');
  linha([]);
  /* itens com formulas */
  const rCab = linha([{v:'#',s:'cabD'},{v:'Código',s:'cab'},{v:'Produto',s:'cab'},{v:'Marca',s:'cab'},{v:'Caixas',s:'cabD'},{v:'Peso (kg)',s:'cabD'},{v:'Preço caixa',s:'cabD'},{v:'Total',s:'cabD'}].concat(neg?[{v:'Obs.',s:'cab'}]:[]), 20);
  const r1 = rCab + 1;
  ped.itens.forEach((it,i)=>{
    const p = porId[it.skuId] || {};
    const r = rCab + 1 + i;
    const kgCx = kgDe(p, it.un);
    linha([{v:i+1,s:'celD'}, {v:String(it.cod||p.cod||''),s:'cel'}, {v:it.nome||p.nome||'',s:'cel'}, {v:p.marca||'',s:'cel'},
           {v:it.qtd,s:'num'}, {f:'ROUND('+String(kgCx).replace(',','.')+'*E'+r+',2)', v:Math.round(kgCx*it.qtd*100)/100, s:'num'},
           {v:it.preco,s:'moedaCel'}, {f:'ROUND(E'+r+'*G'+r+',2)', v:Math.round(it.preco*it.qtd*100)/100, s:'moedaCel'}].concat(neg?[ tabelaDoItem(it)!==null ? {v:'PREÇO NEGOCIADO',s:'aviso'} : {v:'',s:'cel'} ]:[]));
  });
  const rN = rCab + ped.itens.length;
  linha([]);
  const rSub = linha(['','','','','','',{v:'Subtotal',s:'negrito'},{f:'SUM(H'+r1+':H'+rN+')', v:Math.round(t.bruto*100)/100, s:'moedaNegrito'}]);
  /* planilha vai so para a industria: sem linha de desconto negociado (ela recebe so o preco a faturar) */
  let rDesc = 0;
  if(t.desc>0){
    const rd = L.length + 1;
    rDesc = linha(['','','','','',{v:Number(ped.desc)/100, s:'pct'},{v:'Desconto',s:'negrito'},{f:'-ROUND(H'+rSub+'*F'+rd+',2)', v:-Math.round(t.desc*100)/100, s:'moeda'}]);
  }
  linha(['','','','',{f:'SUM(E'+r1+':E'+rN+')', v:t.cx, s:'numNegrito'},{f:'SUM(F'+r1+':F'+rN+')', v:Math.round(t.kg*100)/100, s:'numNegrito'},
         {v: bon ? 'Referência (sem cobrança)' : 'TOTAL', s:'total'},
         {f: rDesc ? 'H'+rSub+'+H'+rDesc : 'H'+rSub, v:Math.round(t.liquido*100)/100, s:'totalMoeda'}]);
  if(ped.obs){ linha([]); par('Observações', ped.obs); }
  linha([]);
  linha([{v:'Representante: '+[D.cfg.repNome, D.cfg.repTel?telBonito(D.cfg.repTel):'', D.cfg.repEmail].filter(Boolean).join(' · ')+' · gerado pelo app em '+dbr(hoje()), s:'cinza'}]);
  return xlsxDe('Pedido '+ped.num, L, [5, 10, 46, 9, 9, 11, 14, 14, 14], {congelar:0, grade:false, mesclar:mesclar, logo: lg ? Object.assign({col:0,row:0}, lg) : null});
}
/* Texto curto para corpo de e-mail e folha de compartilhar (a tabela inteira vai no PDF/planilha) */
function resumoTexto(ped, paraCliente, soPdf){
  const cli = clienteDe(ped) || {}; const t = totais(ped);
  const L = [];
  L.push((paraCliente?'Confirmação de pedido':'Pedido')+' '+ped.num+' — '+nomeMarca());
  if(ped.numCliente) L.push('Nº do pedido do cliente (usar na NF): '+ped.numCliente);
  L.push('Cliente: '+(cli.razao||cli.fantasia||'—')+(cli.fantasia&&cli.fantasia!==cli.razao?' ('+cli.fantasia+')':''));
  if(cli.cnpj) L.push('CNPJ: '+cnpjBonito(cli.cnpj));
  /* endereco completo em toda via: e o que a industria usa para faturar e entregar */
  const end = [cli.endereco, cli.bairro, cli.cidade, cli.cep?'CEP '+cepBonito(cli.cep):''].filter(Boolean).join(' — ');
  if(end) L.push('Entrega: '+end);
  if(cli.referencia) L.push('Referência: '+cli.referencia);
  L.push('Data: '+dbr(ped.data)+(ped.dataEntrega?' · Entrega combinada: '+dbr(ped.dataEntrega):''));
  if(ehBonif(ped)) L.push('BONIFICAÇÃO — sem cobrança, não faturar como venda.');
  else if(ped.cond) L.push('Pagamento: '+ped.cond);
  L.push(t.itens+(t.itens===1?' item':' itens')+' · '+nm(t.cx, t.cx%1?1:0)+' cx · '+nm(t.kg,1)+' kg · Total '+brl(t.liquido));
  if(cli.agendamento) L.push('Descarga: '+cli.agendamento);
  L.push('');
  L.push('Itens completos no PDF'+((paraCliente||soPdf)?'':' e na planilha')+' em anexo.');
  const rep = [D.cfg.repNome, D.cfg.repTel?telBonito(D.cfg.repTel):''].filter(Boolean).join(' · ');
  if(rep) L.push(rep);
  return L.join('\n');
}

function csvCampo(v){
  const s = String(v==null?'':v);
  return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvNum(v){ return String((Number(v)||0).toFixed(2)).replace('.',','); }

function montarCSV(){
  let lista = D.pedidos.slice();
  if(fStatus) lista = lista.filter(p=>p.status===fStatus);
  lista.sort((a,b)=>a.data.localeCompare(b.data));
  if(!lista.length) return null;
  const cab = ['Pedido','PedidoCliente','Data','DataEntrega','Status','Tipo','Marca','Cliente','Fantasia','Rede','Loja','CNPJ','Canal','Cidade',
    'Codigo','Produto','Unidade','Quantidade','PrecoUnitario','TotalItem',
    'DescontoPct','Pagamento','Observacoes'];
  const linhas = [cab.join(';')];
  lista.forEach(p=>{
    const c = clienteDe(p) || {};
    (p.itens||[]).forEach(it=>{
      linhas.push([
        p.num, p.numCliente||'', dbr(p.data), dbr(p.dataEntrega)||'', p.status, ehBonif(p)?'Bonificacao':'Venda', p.marca||nomeMarca(), c.razao||'', c.fantasia||'', c.rede||'', c.loja||'', cnpjBonito(c.cnpj)||'',
        CANAL_NOME[c.canal]||'', c.cidade||'',
        it.cod, it.nome, UN_CURTO[it.un], nm(it.qtd),
        csvNum(it.preco), csvNum(it.preco*it.qtd),
        csvNum(p.desc), ehBonif(p)?'':(p.cond||''), (p.obs||'').replace(/\n/g,' ')
      ].map(csvCampo).join(';'));
    });
  });
  return { nome:'pedidos-'+slugMarca()+'-'+hoje()+(fStatus?'-'+fStatus.toLowerCase():'')+'.csv',
           texto: linhas.join('\r\n') };
}
ACOES.exportarCSV = () => {
  const c = montarCSV();
  if(!c){ aviso('Nada para exportar.'); return; }
  baixar(c.nome, '﻿'+c.texto, 'text/csv;charset=utf-8');
};
ACOES.copiarCSV = () => {
  const c = montarCSV();
  if(!c){ aviso('Nada para exportar.'); return; }
  copiar(c.texto);
};

/* Quando a pagina roda dentro do visualizador da Claude, o download so passa
   pela ponte oficial. Fora dela, o jeito normal do navegador funciona. */
let PONTE_DL = null;
try{
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(d=>{ PONTE_DL = d; }, ()=>{});
  }
}catch(e){}

function baixar(nome, conteudo, tipo){
  if(PONTE_DL){
    PONTE_DL.save({filename:nome, data:conteudo}).then(
      ()=>aviso('Arquivo salvo: '+nome),
      err=>{
        const c = err && err.code;
        if(c==='declined' || c==='rate_limited') return;
        aviso('Não consegui salvar o arquivo aqui. Use o botão Copiar.');
      });
    return;
  }
  try{
    const blob = new Blob([conteudo], {type: tipo||'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    aviso('Arquivo gerado: '+nome);
  }catch(e){ aviso('Não consegui gerar o arquivo neste navegador.'); }
}

/* ---- tema ----
   'auto' nao vai para o <html>: o que vai e o tema ja resolvido,
   senao cada regra de cor precisaria ser escrita duas vezes. */
const TEMAS = [['claro','Claro'],['escuro','Escuro'],['auto','Autom\u00e1tico']];
function temaResolvido(){
  const t = D.cfg.tema || 'claro';
  if(t !== 'auto') return t;
  try{
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'escuro' : 'claro';
  }catch(e){ return 'claro'; }
}
function aplicarTema(){
  const r = temaResolvido();
  document.documentElement.setAttribute('data-tema', r);
  /* a barra do sistema no celular acompanha */
  try{
    const m = document.head.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', r === 'escuro' ? '#0E1220' : '#33302E');
  }catch(e){}
}
/* no automatico, o app vira junto com o aparelho, sem precisar reabrir */
function ouvirTemaDoAparelho(){
  try{
    if(!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const aoMudar = () => { if((D.cfg.tema||'claro') === 'auto'){ aplicarTema(); render(); } };
    if(mq.addEventListener) mq.addEventListener('change', aoMudar);
    else if(mq.addListener) mq.addListener(aoMudar);
  }catch(e){}
  /* Cinto e suspensorio: nem todo navegador avisa quando o aparelho troca
     de tema com o app aberto. Toda vez que o app volta para a frente a
     gente confere de novo — que e quando o vendedor vai olhar mesmo. */
  try{
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState !== 'visible') return;
      if((D.cfg.tema||'claro') !== 'auto') return;
      if(document.documentElement.getAttribute('data-tema') === temaResolvido()) return;
      aplicarTema(); render();
    });
  }catch(e){}
}
ACOES.setTema = t => {
  D.cfg.tema = t; gravar(); aplicarTema(); render();
  aviso(t==='claro' ? 'Tema claro' : t==='escuro' ? 'Tema escuro' : 'O tema segue o aparelho');
};

ACOES.setLetra = t => {
  D.cfg.letra = t; gravar();
  document.documentElement.setAttribute('data-letra', t);
  render();
  aviso(t==='p'?'Letra normal':t==='m'?'Letra maior':'Letra bem maior');
};

      selectCond(m.condPadrao||'', 'id="mk_cond" data-ch="condSel" data-i="mk"')+
      '<div class="dica">É o prazo que o pedido desta indústria nasce quando o cliente ainda não tem um combinado. Você pode mudar em cada pedido; o app lembra o último de cada cliente.</div></div>'+
    '<div class="campo mb0"><label>E-mail de faturamento</label><input type="email" inputmode="email" autocapitalize="off" id="mk_email" value="'+esc(m.emailFat||'')+'" placeholder="pedidos@industria.com.br"></div>'+
    '<div class="campo mb0" style="margin-top:12px"><label>Logo (imagem) — sai no PDF e na planilha</label>'+
      (function(){ const propria = !!(m.logoImg && m.logoImg.dados); const lg = propria ? m.logoImg : (novo ? null : logoEmbutida(m));
        if(!lg) return '<div class="peq" style="margin:2px 0 8px">Sem logo: sai o nome em texto.</div>';
        return '<img src="'+lg.dados+'" alt="" style="max-width:100%;max-height:70px;display:block;border:1px solid var(--linha);border-radius:8px;background:#fff;padding:4px;margin:4px 0 8px">'+
          (propria ? '' : '<div class="peq" style="margin:0 0 8px">Logo padrão que já vem no app. Só troque se quiser outra.</div>'); })()+
      (novo ? '<div class="dica">Salve a marca primeiro; depois volte aqui para colocar a logo.</div>'
            : '<div class="linha-bt"><button class="bt bt-l" data-a="marcaLogo" data-i="'+i+'">'+ico('subir')+(m.logoImg?'Trocar logo':'Escolher logo')+'</button>'+
              (m.logoImg?'<button class="bt bt-l" data-a="marcaLogoTirar" data-i="'+i+'" style="color:var(--terracota)">Tirar</button>':'')+'</div>')+
    '</div>'+
    '<div class="peq mt10">'+(m.catalogo==='embutido'
      ? 'Usa a tabela de preços embutida no app.'
      : 'Tabela própria: '+(m.catalogo||[]).length+' produtos. Importar a tabela de uma marca nova fica para a próxima rodada.')+'</div>',
    '<div class="linha-bt">'+
    (novo||ativa?'':'<button class="bt bt-l" data-a="apagarMarca" data-i="'+i+'" style="color:var(--terracota)">Apagar</button>')+
    (novo||ativa?'':'<button class="bt bt-l" data-a="usarMarca" data-i="'+i+'">Usar esta</button>')+
    '<button class="bt bt-p" data-a="salvarMarca" data-i="'+esc(novo?'novo':i)+'">Salvar</button></div>');
};
/* Logo da industria em imagem: vira JPEG de ate 600 px de largura (fundo branco se a imagem tiver
   transparencia) e fica em cfg.marcas[i].logoImg = {dados, w, h}. Sai no PDF e na planilha. */
ACOES.marcaLogo = i => {
  const ent = document.createElement('input'); ent.type = 'file'; ent.accept = 'image/*';
  ent.onchange = () => {
    const f = ent.files[0]; if(!f) return;
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const esc_ = Math.min(1, 600/img.width, 220/img.height);
      const w = Math.max(1, Math.round(img.width*esc_)), h = Math.max(1, Math.round(img.height*esc_));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0,0,w,h); cx.drawImage(img, 0, 0, w, h);
      const dados = cv.toDataURL('image/jpeg', 0.88); URL.revokeObjectURL(url);
      const m = i==='novo' ? null : D.cfg.marcas[+i]; if(!m){ aviso('Salve a marca primeiro, depois coloque a logo.'); return; }
      m.logoImg = { dados: dados, w: w, h: h }; gravar(); fechaModal(); ACOES.editarMarca(i); aviso('Logo guardada');
    };
    img.onerror = () => { aviso('Não consegui ler essa imagem.'); URL.revokeObjectURL(url); };
    img.src = url;
  };
  ent.click();
};
ACOES.marcaLogoTirar = i => { const m = D.cfg.marcas[+i]; if(m){ delete m.logoImg; gravar(); fechaModal(); ACOES.editarMarca(i); aviso('Logo removida'); } };

function logoEmbutida(mk){
  mk = mk || marcaAtual() || {};
  const sg = siglaMarca(mk), nm = sac(mk.nome||'');
  if(LOGOS_EMBUTIDAS[sg]) return LOGOS_EMBUTIDAS[sg];
  if(/harus|pp/.test(nm)) return LOGOS_EMBUTIDAS.HAR;
  if(/coffee|coffe|cafe/.test(nm)) return LOGOS_EMBUTIDAS.COF;
  return null;
}
function logoDaMarca(mk){ mk = mk || marcaAtual(); if(mk && mk.logoImg && mk.logoImg.dados) return mk.logoImg; return logoEmbutida(mk); }
function logoBytes(lg){ const bin = atob(lg.dados.split(',')[1]); return bin; }
/* cabecalho dos PDFs: com logo em imagem, ou o nome em texto (HARUS +PP) */
function cabecalhoMarcaPdf(pg, recursos, M, y, subtitulo){
  const mk = marcaAtual() || {}; const lg = logoDaMarca(mk);
  if(lg){
    if(!recursos.Logo) recursos.Logo = { w: lg.w, h: lg.h, bytes: logoBytes(lg) };
    const alt = 30, larg = lg.w * (alt/lg.h);
    pg.imagem('Logo', M, y-2, larg, alt);
    pg.txt(M, y+40, subtitulo, {tam:8, cor:CINZA_PDF});
    return;
  }
  const fim = pg.txt(M, y+16, (mk.logo1||mk.nome||'')+' ', {tam:20, negrito:true, cor:GRAFITE_PDF});
  if(mk.logo2) pg.txt(fim, y+16, mk.logo2, {tam:20, negrito:true, cor:DOURADO_PDF});
  pg.txt(M, y+29, subtitulo, {tam:8, cor:CINZA_PDF});
}
ACOES.salvarMarca = i => {
  const dados = { nome:el('mk_nome').value.trim(), logo1:el('mk_l1').value.trim(),
                  logo2:el('mk_l2').value.trim(), emailFat:el('mk_email').value.trim(),
                  sigla: ((el('mk_sigla')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4),
                  condPadrao: (((el('mk_cond')||{}).value)||'').replace('__outro','') };
  if(!dados.nome){ aviso('Informe o nome da marca.'); return; }
  if(i==='novo') D.cfg.marcas.push(Object.assign({id:'m'+uid(), catalogo:[]}, dados));
  else Object.assign(D.cfg.marcas[+i], dados);
  gravar(); fechaModal(); aplicarMarca(); render(); aviso('Marca salva');
};
ACOES.apagarMarca = i => {
  const m = D.cfg.marcas[+i];
  if(!m || m.id===D.cfg.marcaAtiva || D.cfg.marcas.length<2){ aviso('Não dá para apagar a marca em uso.'); return; }
  D.cfg.marcas.splice(+i,1); gravar(); fechaModal(); render(); aviso('Marca apagada');
};
ACOES.usarMarca = i => {
  const nova = D.cfg.marcas[+i]; if(!nova) return;
  /* rascunho de outra industria nao se mistura: fica guardado no Historico como Rascunho */
  const r = pedidoRascunho();
  if(r && r.marcaId && r.marcaId!==nova.id){
    if(!r.itens.length && !r.clienteId) D.pedidos = D.pedidos.filter(x=>x.id!==r.id);
    else aviso('O rascunho '+r.num+' ficou guardado no Histórico');
    D.rascunhoId = null;
  }
  D.cfg.marcaAtiva = nova.id; gravar(); fechaModal(); aplicarMarca(); fCanal = null; fCat = null; render();
  aviso('Agora em uso: '+nomeMarca());
};
/* abrir um pedido ja feito usa a industria dele (logo, sigla, contatos, tabela) */
function ativarMarcaDoPedido(ped){
  if(!ped || !ped.marcaId || ped.marcaId===D.cfg.marcaAtiva) return;
  if(!D.cfg.marcas.some(m=>m.id===ped.marcaId)) return;
  D.cfg.marcaAtiva = ped.marcaId; aplicarMarca(); fCanal = null; fCat = null; gravar(true);
}
ACOES.trocarMarca = () => {
  if(D.cfg.marcas.length < 2) return;
  modal('Trabalhar com qual indústria?',
    D.cfg.marcas.map((m,i)=>'<button class="lin" data-a="usarMarca" data-i="'+i+'">'+
      '<span class="ini">'+esc(siglaMarca(m))+'</span><span class="info"><span class="nm">'+esc(m.nome)+
      (m.id===D.cfg.marcaAtiva?' <span class="et et-fa">em uso</span>':'')+'</span>'+
      '<span class="sub"><span>'+(Array.isArray(m.catalogo)?m.catalogo.length:CAT.length)+' produtos</span>'+(m.condPadrao?'<span>prazo '+esc(m.condPadrao)+'</span>':'')+'</span></span>'+
      '<span class="seta">'+ico('seta')+'</span></button>').join(''), '');
};
function chipsMarcas(){
  if(D.cfg.marcas.length < 2) return '';
  return '<div class="secao" style="margin-top:0">Indústria deste pedido</div><div class="chips" style="padding-bottom:10px">'+
    D.cfg.marcas.map((m,i)=>'<button class="chip '+(m.id===D.cfg.marcaAtiva?'on':'')+'" data-a="usarMarca" data-i="'+i+'">'+esc(m.nome)+'</button>').join('')+'</div>';
}

ACOES.lerCSVPrecos = () => {
  const f = el('arqp').files[0];
  if(!f){ aviso('Escolha o arquivo primeiro.'); return; }
  const r = new FileReader();
  r.onload = () => {
    const linhas = String(r.result).replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
    let n=0, ign=0;
    linhas.forEach(l=>{
      const c = l.split(/[;\t]/);
      if(c.length<2) return;
      const cod = String(c[0]).trim().replace(/^"|"$/g,'');
      const v = pnum(c[1]);
      if(!cod || !v || !/^\d/.test(cod)) { ign++; return; }
      const alvo = CAT.filter(p=>p.cod===cod || p.cod===cod.replace(/^0+/,''));
      if(!alvo.length){ ign++; return; }
      alvo.forEach(p=>{
        const fa = p.pCaixa>0 ? v/p.pCaixa : 1;
        p.pCaixa = v;
        if(p.pPacote)  p.pPacote  = Math.round(p.pPacote*fa*100)/100;
        if(p.pUnidade) p.pUnidade = Math.round(p.pUnidade*fa*10000)/10000;
        n++;
      });
    });
    gravarCat(); refazIndice(); fechaModal(); render();
    aviso(n+' preços atualizados'+(ign?', '+ign+' linhas ignoradas':''));
  };
  r.readAsText(f, 'utf-8');
};

function listaVersiculos(){
  const t = String(D.cfg.versiculos||'').trim();
  if(!t) return VERSICULOS_PADRAO;
  const l = t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const i = x.indexOf('|'); return i>0 ? [x.slice(0,i).trim(), x.slice(i+1).trim()] : ['', x];
  }).filter(v=>v[1]);
  return l.length ? l : VERSICULOS_PADRAO;
}
function versiculoDoDia(){
  const L = listaVersiculos();
  const d = new Date(), ini = new Date(d.getFullYear(),0,1);

  return L[dia % L.length];
}

/* =====================================================
   NUVEM — o cofre de mão única (Supabase, sem biblioteca)
   O celular e o dono da verdade. Tudo que muda aqui sobe
   para o banco sozinho; o banco so devolve quando um
   aparelho vazio entra com o login. Tokens ficam em
   K_SESSAO, fora do backup.
   ===================================================== */
let SESSAO = lerJSON(K_SESSAO, null);
let syncEmCurso = false, tSync = null, PENDENTES = 0;

function nuvemPronta(){ return !!(D.cfg.nuvem && D.cfg.nuvem.url && D.cfg.nuvem.chave); }
function nuvemLogada(){ return nuvemPronta() && !!(SESSAO && SESSAO.refresh_token); }
function guardarSessao(sx){
  SESSAO = sx;
  try{ if(sx) localStorage.setItem(K_SESSAO, JSON.stringify(sx)); else localStorage.removeItem(K_SESSAO); }catch(e){}
}
/* FNV-1a: assinatura barata do registro, para saber o que mudou desde o ultimo envio */
function assinatura(obj){
  const t = JSON.stringify(obj); let h = 0x811c9dc5;
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}
function hostNuvem(){ return String(D.cfg.nuvem.url||'').replace(/\/+$/,''); }

/* chamada crua a API do Supabase; renova o token quando esta para vencer */
async function nuvemFetch(caminho, corpo, semAuth, metodo, extra){
  if(!nuvemPronta()) throw new Error('Nuvem não configurada');
  if(!semAuth) await renovarSeVencendo();
  const cab = Object.assign({ 'apikey': D.cfg.nuvem.chave, 'Content-Type':'application/json' }, extra||{});
  if(!semAuth && SESSAO && SESSAO.access_token) cab['Authorization'] = 'Bearer '+SESSAO.access_token;
  const met = metodo || 'POST';
  const r = await fetch(hostNuvem()+caminho, met==='GET' ? { method:'GET', headers:cab } : { method:met, headers:cab, body:JSON.stringify(corpo||{}) });
  const txt = await r.text();
  let js = null; try{ js = txt ? JSON.parse(txt) : null; }catch(e){ js = txt; }
  if(!r.ok){
    const msg = (js && (js.message || js.msg || js.error_description || js.error || js.hint)) || ('HTTP '+r.status);
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return js;
}
async function renovarSeVencendo(){
  if(!SESSAO || !SESSAO.refresh_token) return;
  const falta = (SESSAO.expires_at||0) - Math.floor(Date.now()/1000);
  if(falta > 90) return;
  const js = await nuvemFetch('/auth/v1/token?grant_type=refresh_token', { refresh_token: SESSAO.refresh_token }, true);
  guardarSessao(sessaoDe(js));
}
function sessaoDe(js){
  return { access_token: js.access_token, refresh_token: js.refresh_token,
           expires_at: Math.floor(Date.now()/1000) + (Number(js.expires_in)||3600),
           email: js.user && js.user.email || '', user: js.user && js.user.id || '' };
}

    '<div class="campo mb0"><label>Senha</label><input type="password" id="nv_senha"></div>',

  setTimeout(()=>{ const n=el(SESSAO&&SESSAO.email?'nv_senha':'nv_email'); if(n) n.focus(); },150);

ACOES.nuvemLogar = async () => {
  const email = el('nv_email').value.trim(), senha = el('nv_senha').value;
  if(!email || !senha){ aviso('Preencha e-mail e senha.'); return; }
  aviso('Entrando...');
  try{
    const js = await nuvemFetch('/auth/v1/token?grant_type=password', { email, password: senha }, true);
    guardarSessao(sessaoDe(js));
    let quem = null; try{ quem = await nuvemFetch('/rest/v1/rpc/quem_sou', {}); }catch(e){}
    D.nuvem.quem = quem; D.nuvem.erro = ''; gravar(true); ajustarRepDaNuvem(); fechaModal(); render();
    if(quem && !quem.vendedor){ aviso('Entrou, mas este usuário não está amarrado a uma empresa. Avise quem administra o app.'); return; }
    aviso('Entrou como '+((quem&&quem.vendedor)||email));
    await ACOES.catalogoBaixar(true);
    const temLocal = D.clientes.some(c=>!c.demo) || D.pedidos.some(p=>!p.demo);
    if(!temLocal && quem && (quem.clientes>0 || quem.pedidos>0)) ACOES.nuvemBaixar();
    else agendarSync(300);
  }catch(e){
    const m = String(e.message||'');
    if(/api ?key/i.test(m) && precisaEntrar()){
      /* ainda no portao: a chave colada nao serve; reabre o campo com ela dentro para conferir */
      PORTAO_TROCAR_CHAVE = true; render();
      aviso('A chave da nuvem está errada. Confira a chave que você recebeu e cole de novo.');
      return;
    }
    aviso(/api ?key/i.test(m) ? 'A chave da nuvem está errada. Confira em Ajustes › Nuvem.'
        : /invalid|credentials/i.test(m) ? 'E-mail ou senha errados.'
        : /failed to fetch|network/i.test(m) ? 'Sem internet agora. Tente de novo com sinal.'
        : 'Não entrou: '+m);
  }
};

/* ---- o que sobe ---- */
function pacoteCliente(c){ return c; }
function pacotePedido(p){
  const t = totais(p);
  const itens = (p.itens||[]).map(it=>{
    const pr = porId[it.skuId];
    return Object.assign({}, it, { nome: pr ? pr.nome : (it.nome||''), cod: pr ? pr.cod : (it.cod||'') });
  });
  const x = Object.assign({}, p, { itens, total: t.liquido, kg: t.kg, cx: t.cx,
                                   totalFat: p.conferido ? t.entregue : null });
  /* a foto do pedido original fica so no aparelho: pesada demais para o espelho */
  if(x.anexo && x.anexo.dados) x.anexo = { w:x.anexo.w, h:x.anexo.h, soNoAparelho:true };
  return x;
}
function contarPendentes(){
  let n = 0;
  D.clientes.forEach(c=>{ if(!c.demo && D.nuvem.enviados['c:'+c.id] !== assinatura(pacoteCliente(c))) n++; });
  D.pedidos.forEach(p=>{ if(!p.demo && D.nuvem.enviados['p:'+p.id] !== assinatura(pacotePedido(p))) n++; });
  PENDENTES = n; return n;
}
function agendarSync(ms){
  if(!nuvemLogada()) return;
  clearTimeout(tSync);
  tSync = setTimeout(()=>{ sincronizar().catch(()=>{}); }, ms==null ? 2500 : ms);
}
async function sincronizar(){
  if(syncEmCurso || !nuvemLogada()) return;
  if(navigator.onLine === false){ D.nuvem.erro = 'sem internet'; return; }
  syncEmCurso = true; let mudou = false;
  try{
    for(const c of D.clientes){
      if(c.demo) continue;
      const pac = pacoteCliente(c), h = assinatura(pac);
      if(D.nuvem.enviados['c:'+c.id] === h) continue;
      await nuvemFetch('/rest/v1/rpc/salvar_cliente', { c: pac });
      D.nuvem.enviados['c:'+c.id] = h; mudou = true;
    }
    for(const p of D.pedidos){
      if(p.demo) continue;
      const pac = pacotePedido(p), h = assinatura(pac);
      if(D.nuvem.enviados['p:'+p.id] === h) continue;
      await nuvemFetch('/rest/v1/rpc/salvar_pedido', { p: pac });
      D.nuvem.enviados['p:'+p.id] = h; mudou = true;
    }
    /* o que sumiu daqui vira "apagado" la — nunca some. So depois que este aparelho
       ja conversou com a nuvem pelo menos uma vez, e so se ele tem dados de verdade. */
    const vivosC = {}, vivosP = {};
    D.clientes.forEach(c=>{ if(!c.demo) vivosC[c.id] = true; });
    D.pedidos.forEach(p=>{ if(!p.demo) vivosP[p.id] = true; });
    /* r34: marca como apagado SO o que este aparelho enviou e depois apagou (lista exata de ids).
       Nunca "tudo que nao esta aqui": com dois aparelhos no mesmo login, um apagaria o do outro. */
    const mortosC = [], mortosP = [];
    Object.keys(D.nuvem.enviados).forEach(k=>{
      const id = k.slice(2);
      if(k[0]==='c' && !vivosC[id]) mortosC.push(id);
      if(k[0]==='p' && !vivosP[id]) mortosP.push(id);
    });
    try{
      if(mortosC.length) await nuvemFetch('/rest/v1/rpc/marcar_apagados_ids', { tipo:'cliente', ids: mortosC });
      if(mortosP.length) await nuvemFetch('/rest/v1/rpc/marcar_apagados_ids', { tipo:'pedido',  ids: mortosP });
    }catch(e){ /* funcao ainda nao criada na nuvem: nao marca nada (seguro) e tenta de novo depois */
      mortosC.concat(mortosP).length && console.warn('marcar_apagados_ids:', e.message); throw e; }
    /* limpa assinaturas de registros que nao existem mais */
    Object.keys(D.nuvem.enviados).forEach(k=>{
      const id = k.slice(2);
      if((k[0]==='c' && !vivosC[id]) || (k[0]==='p' && !vivosP[id])) delete D.nuvem.enviados[k];
    });
    D.nuvem.ultimoOk = new Date().toISOString(); D.nuvem.erro = '';
  }catch(e){
    D.nuvem.erro = e.message || 'falhou';
    if(e.status === 401){ D.nuvem.erro = 'login venceu; entre de novo'; }
  }finally{
    syncEmCurso = false; contarPendentes(); gravar(true);
    if(ABA==='ajustes' && !VISTA) render(); else pintaEstadoNuvem();
  }
}
ACOES.nuvemSincronizar = () => {
  if(!nuvemLogada()){ ACOES.nuvemEntrar(); return; }
  aviso('Sincronizando...'); sincronizar().then(()=>aviso(D.nuvem.erro ? 'Falhou: '+D.nuvem.erro : 'Sincronizado'));

ACOES.nuvemBaixar = async () => {
  if(!nuvemLogada()){ ACOES.nuvemEntrar(); return; }
  aviso('Buscando na nuvem...');
  let js;
  try{ js = await nuvemFetch('/rest/v1/rpc/baixar_tudo', {}); }
  catch(e){ aviso('Não consegui baixar: '+e.message); return; }
  const cl = js.clientes||[], pe = js.pedidos||[];
  const aplicar = () => {
    D.clientes = D.clientes.filter(c=>c.demo).concat(cl);
    D.pedidos  = D.pedidos.filter(p=>p.demo).concat(pe);
    D.pedidos.forEach(p=>{ if(p.status==='Aberto') p.status='Rascunho'; });
    D.seq = Math.max(D.seq||0, Number(js.seq)||0);
    D.rascunhoId = null;
    /* tudo que desceu ja esta na nuvem: assina para nao subir de novo */
    D.nuvem.enviados = {};
    cl.forEach(c=>{ D.nuvem.enviados['c:'+c.id] = assinatura(pacoteCliente(c)); });
    pe.forEach(p=>{ D.nuvem.enviados['p:'+p.id] = assinatura(pacotePedido(p)); });
    D.nuvem.ultimoOk = new Date().toISOString(); D.nuvem.baixadoEm = D.nuvem.ultimoOk; D.nuvem.erro='';
    gravar(true); fechaModal(); VISTA=null; ABA='pedido'; render();
    aviso('Baixou da nuvem: '+cl.length+' clientes, '+pe.length+' pedidos');
  };
  const temLocal = D.clientes.some(c=>!c.demo) || D.pedidos.some(p=>!p.demo);
  if(!temLocal){ aplicar(); return; }
  modal('Baixar da nuvem?',
    '<table class="tabelinha"><tr><td>Na nuvem</td><td>'+cl.length+' clientes · '+pe.length+' pedidos</td></tr>'+
    '<tr><td>Neste aparelho</td><td>'+D.clientes.filter(c=>!c.demo).length+' clientes · '+D.pedidos.filter(p=>!p.demo).length+' pedidos</td></tr></table>'+
    '<div class="aviso mt10">'+ico('alerta')+'<span>O que está neste aparelho é substituído pelo da nuvem. Se aqui tem pedido que ainda não subiu, sincronize antes.</span></div>',
    '<div class="linha-bt"><button class="bt bt-l" data-a="fechaModal">Voltar</button><button class="bt bt-p" data-a="nuvemBaixarConfirma">Baixar</button></div>');
  ACOES.nuvemBaixarConfirma = aplicar;
};

/* ---- a tabela de precos mora na nuvem ----
   O arquivo do app e publico; a tabela nao pode ser. Ela so desce depois
   do login, fica guardada no aparelho (funciona sem sinal) e o gestor e
   quem sobe a tabela nova para todo mundo. */
async function marcasNaNuvem(){ return (await nuvemFetch('/rest/v1/marcas?select=id,nome&order=criado_em', null, false, 'GET')) || []; }
const nomeLimpo = t => sac(t).replace(/[^a-z0-9]/g,'');
/* a marca da nuvem que corresponde a esta marca do aparelho: pelo id guardado, pelo nome,
   ou (a primeira, Harus) pela primeira da nuvem, como sempre foi */
function casarMarca(ms, m){
  if(m.nuvemId){ const a = ms.find(x=>x.id===m.nuvemId); if(a) return a; }
  const b = ms.find(x=>nomeLimpo(x.nome)===nomeLimpo(m.nome)); if(b) return b;
  if(D.cfg.marcas[0] && m.id===D.cfg.marcas[0].id && ms[0] && !D.cfg.marcas.some(o=>o!==m && o.nuvemId===ms[0].id)) return ms[0];
  return null;
}
async function marcaNaNuvem(m){ return casarMarca(await marcasNaNuvem(), m || marcaAtual()); }
/* Traz da nuvem as industrias e suas tabelas. Industria nova (ex.: Coffee ++ cadastrada pelo suporte)
   aparece sozinha no aparelho. Tabela que ja existe aqui so e trocada quando ele pede (forcar),
   para nao apagar preco que ele ajustou a mao. */
async function sincronizarMarcas(forcar){
  const ms = await marcasNaNuvem(); let novas = 0, tabelas = 0;
  for(const x of ms){
    let m = D.cfg.marcas.find(mm=>casarMarca(ms, mm) === x);
    if(!m){
      m = { id:'m'+uid(), nome:x.nome, logo1:x.nome, logo2:'', emailFat:'', catalogo:[], nuvemId:x.id };
      if(/coffee|cafe/.test(sac(x.nome))){ m.sigla = 'COF'; m.logo1 = 'COFFEE'; m.logo2 = ' ++'; m.condPadrao = '21 dias'; }
      D.cfg.marcas.push(m); novas++;
    }
    m.nuvemId = x.id;
    const vazia = !Array.isArray(m.catalogo) ? (m.catalogo==='embutido' && !CAT.length) : !m.catalogo.length;
    if(!forcar && !vazia) continue;
    const rows = await nuvemFetch('/rest/v1/produtos?select=dados&marca_id=eq.'+x.id+'&ativo=is.true&order=ordem.asc.nullslast,cod', null, false, 'GET');
    const lista = (rows||[]).map(r=>r.dados).filter(Boolean);
    if(lista.length){ m.catalogo = lista; m.tabelaBaixadaEm = new Date().toISOString(); tabelas++;
      if(m.id===D.cfg.marcaAtiva){ try{ localStorage.removeItem(K_CAT); }catch(e){} } }
  }
  D.nuvem.marcasEm = new Date().toISOString();
  aplicarMarca(); gravar(true);
  return { novas, tabelas };
}
ACOES.catalogoBaixar = async (silencioso) => {
  if(!nuvemLogada()){ if(!silencioso) ACOES.nuvemEntrar(); return; }

  try{
    /* silencioso (entrada/abertura): so completa o que falta; tocado por ele: atualiza todas */
    const r = await sincronizarMarcas(!silencioso);
    semearNaPrimeiraVez(); render();
    if(!silencioso) aviso(r.tabelas ? 'Tabelas atualizadas ('+r.tabelas+')' + (r.novas?' · '+r.novas+' indústria nova':'') : 'A nuvem ainda não tem tabela para estas marcas.');
    else if(r.novas) aviso('Nova indústria no app: '+D.cfg.marcas.slice(-r.novas).map(m=>m.nome).join(', '));
  }catch(e){ if(!silencioso) aviso('Não consegui buscar a tabela: '+e.message); }
};

function estadoNuvem(){

/* liga os gatilhos: abrir, voltar para a frente, sinal voltar */
/* O nome que assina os documentos vem do cadastro do vendedor na nuvem, a menos que ele
   tenha escrito outro em Ajustes. Enquanto estava vazio, o app punha "Vendedor de exemplo"
   e isso saia no rodape do e-mail e do PDF. */
/* "Anderson Santos (001) · e-mail" ou "Suporte (SUP) · e-mail · gestor": para nunca ficar na duvida de qual login esta no aparelho */
function quemRotulo(){
  const q = (D.nuvem && D.nuvem.quem) || {};
  const email = q.email || (SESSAO && SESSAO.email) || '';
  return [ (q.vendedor||'') + (q.codigo?' ('+q.codigo+')':''), email ].filter(Boolean).join(' · ') + (q.codigo==='SUP' ? ' · suporte' : '');
}
function ajustarRepDaNuvem(){
  const q = D.nuvem && D.nuvem.quem; if(!q || !q.vendedor) return false;
  const demo = (D.demoCfg && D.demoCfg.repNome) || 'Vendedor de exemplo';
  if(!D.cfg.repNome || D.cfg.repNome===demo || D.cfg.repNome==='Vendedor de exemplo'){
    D.cfg.repNome = q.vendedor; gravar(true); return true;
  }
  return false;
}
function ligarNuvem(){
  ajustarRepDaNuvem();
  /* se entrou mas o app nao guardou quem e (falha na hora do login), pergunta de novo a nuvem */
  if(nuvemLogada() && !(D.nuvem.quem && D.nuvem.quem.vendedor)){
    setTimeout(()=>{ nuvemFetch('/rest/v1/rpc/quem_sou', {}).then(q=>{
      if(q && q.vendedor){ D.nuvem.quem = q; gravar(true); if(ajustarRepDaNuvem()) render(); }
    }).catch(()=>{}); }, 900);
  }
  /* ao abrir: traz industria nova e tabela que falta (no maximo a cada 6 h) */
  if(nuvemLogada() && (!CAT.length || !D.nuvem.marcasEm || Date.now()-new Date(D.nuvem.marcasEm).getTime() > 6*3600e3))
    setTimeout(()=>ACOES.catalogoBaixar(true), 1500);
  try{
    window.addEventListener('online', ()=>agendarSync(500));
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') agendarSync(800); });
  }catch(e){}
  agendarSync(1500);
}

/* ---- backup ---- */
/* O pacote leva TUDO que mora neste aparelho: clientes, pedidos, ajustes,
   contador de pedido, rascunho aberto e a tabela de precos como esta hoje.
   O resumo no topo e so para a tela de conferencia ler sem abrir o resto. */
function pacoteBackup(){
  return JSON.stringify({
    app:'app-pedidos', versao:1, gerado:new Date().toISOString(),   /* backups antigos ('harus-pedidos') continuam restaurando */
    resumo:{ clientes:D.clientes.length, pedidos:D.pedidos.length,
             fechados:D.pedidos.filter(p=>VALE(p.status)).length,
             catalogo:CAT.length, rep:D.cfg.repNome||'' },
    dados:D, catalogo:CAT,
    extras:{ aba: localStorage.getItem(K_ABA)||'',
             exemploJaSaiu: localStorage.getItem('harus.exemploJaSaiu')||'' }
  });
}
function nomeBackup(){ return 'backup-'+slugMarca()+'-'+hoje()+'.json'; }
function marcarBackup(){ D.cfg.ultimoBackup = hoje(); gravar(); render(); }

/* Quantos dias desde o ultimo backup. 0 = feito hoje, -1 = nunca. */
function diasSemBackup(){
  const u = D.cfg.ultimoBackup;
  if(!u) return -1;
  const d = diasEntre(u, hoje());
  return (isNaN(d) || d<0) ? 0 : d;
}
/* Atrasado: passou de 7 dias (ou nunca houve) e ja existe pedido fechado de verdade. */
function atrasoBackup(){
  if(!D.pedidos.some(p=>VALE(p.status) && !p.demo)) return false;
  const d = diasSemBackup();
  return d === -1 || d > 7;
}
function faixaBackup(){
  if(!atrasoBackup()) return '';
  const d = diasSemBackup();
  return '<div class="faixa">'+ico('alerta')+
    '<div><b>Faça um backup</b>'+
    (d === -1

ACOES.fazerBackup = async () => {
  const txt  = pacoteBackup();
  const nome = nomeBackup();
  try{
    const arq = new File([txt], nome, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[arq]})){
      await navigator.share({
        files:[arq],
        title:'Backup do app de pedidos',
        text:'Backup de '+dbr(hoje())+' — '+D.clientes.length+' clientes, '+
             D.pedidos.length+' pedidos. Guarde este arquivo.'
      });
      marcarBackup();
      aviso('Backup enviado. Guarde o arquivo.');
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   /* desistiu na folha de compartilhar */
  }
  baixar(nome, txt, 'application/json');
  marcarBackup();
};

/* Antes de sobrescrever, o app abre o pacote e mostra o que tem dentro.
   So depois de conferir e confirmar e que o aparelho e trocado. */
let PACOTE_PEND = null;

function aplicarBackup(txt){
  let p;
  try{ p = JSON.parse(txt); }catch(e){ aviso('Não consegui ler: o conteúdo está incompleto.'); return; }
  if(!p || !p.dados || !Array.isArray(p.dados.clientes)){ aviso('Isto não é um backup do app.'); return; }
  PACOTE_PEND = p;
  conferirBackup(p);
}

/* Data local (AAAA-MM-DD) de um carimbo ISO. O ISO vem em UTC:
   depois das 21h de Brasilia ele ja esta no dia seguinte, e cortar a
   string daria um dia a mais. */
function isoParaDiaLocal(iso){
  const d = iso ? new Date(iso) : null;
  if(!d || isNaN(d)) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function dataHoraBR(iso){
  if(!iso) return 'sem data';
  const d = new Date(iso);
  if(isNaN(d)) return 'sem data';
  const z = n => String(n).padStart(2,'0');
  return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' às '+z(d.getHours())+':'+z(d.getMinutes());
}

/* Tela de conferencia: o que veio no arquivo x o que sai do aparelho. */
function conferirBackup(p){
  const ped   = Array.isArray(p.dados.pedidos) ? p.dados.pedidos : [];
  const nCli  = p.dados.clientes.length;
  const nPed  = ped.length;
  const nFec  = ped.filter(x=>VALE(x.status)).length;
  const nCat  = Array.isArray(p.catalogo) ? p.catalogo.length : 0;
  const rep   = (p.dados.cfg && p.dados.cfg.repNome) || '';
  const datas = ped.map(x=>x.data).filter(Boolean).sort();
  const ultPed= datas.length ? dbr(datas[datas.length-1]) : '—';

  modal('Confira antes de restaurar',
    '<div class="peq" style="margin-bottom:11px">Isto é o que está dentro do arquivo:</div>'+
    '<table class="tabelinha">'+
      '<tr><td>Backup gerado em</td><td>'+esc(dataHoraBR(p.gerado))+'</td></tr>'+
      (rep?'<tr><td>Aparelho de</td><td>'+esc(rep)+'</td></tr>':'')+
      '<tr><td>Clientes</td><td>'+nCli+'</td></tr>'+
      '<tr><td>Pedidos</td><td>'+nPed+(nFec?' ('+nFec+' fechados)':'')+'</td></tr>'+
      '<tr><td>Pedido mais recente</td><td>'+esc(ultPed)+'</td></tr>'+
      '<tr><td>Produtos na tabela</td><td>'+(nCat||'não veio no arquivo')+'</td></tr>'+
    '</table>'+
    '<div class="aviso mt10">'+ico('alerta')+
    '<span>O que está hoje neste aparelho — <b>'+D.clientes.length+' clientes</b> e '+
    '<b>'+D.pedidos.length+' pedidos</b> — sai do lugar e é substituído pelo de cima. '+
    'Não dá para desfazer.</span></div>',
    '<div class="linha-bt">'+
    '<button class="bt bt-l" data-a="restaurarBackup">Voltar</button>'+
    '<button class="bt bt-p" data-a="confirmarRestauro">Restaurar</button></div>');
}

function gravarBackup(p){
  D = p.dados;
  D.cfg = Object.assign({}, CFG_PADRAO, D.cfg||{});
  if(!Array.isArray(D.cfg.contatos)) D.cfg.contatos = [];
  D.cfg.semContatosEmbutidos = true;
  normalizarMarcas(); normalizarNuvem();
  D.nuvem.enviados = {};   /* o que veio do arquivo ainda nao foi conferido com a nuvem */
  D.clientes = D.clientes||[]; D.pedidos = D.pedidos||[]; D.seq = D.seq||0;
  if(Array.isArray(p.catalogo) && p.catalogo.length){ CAT = p.catalogo; gravarCat(); }
  aplicarMarca();
  /* O arquivo dentro do pacote guarda a data do backup ANTERIOR, porque o
     pacote e montado antes de o backup existir. Quem manda e a data em que
     o arquivo foi gerado: o aparelho acabou de ficar igual a ela. */
  const dGer = isoParaDiaLocal(p.gerado);
  if(dGer && (!D.cfg.ultimoBackup || D.cfg.ultimoBackup < dGer)) D.cfg.ultimoBackup = dGer;
  /* o aparelho que restaura ja viu o app: nao semeia exemplo de novo */
  try{ localStorage.setItem('harus.exemploJaSaiu','1'); }catch(e){}
  refazIndice(); gravar(); fechaModal(); VISTA=null; ABA='pedido'; aplicarTema(); render();
  aviso('Backup restaurado: '+D.clientes.length+' clientes, '+D.pedidos.length+' pedidos');
}

function pdfDaFicha(c){
  const A4L = 595.28, A4A = 841.89, M = 38;
  const paginas = []; const recursos = {};
  const pg = NovaPagina(A4L, A4A); paginas.push(pg);
  let y = M;
  const mk = marcaAtual();
  cabecalhoMarcaPdf(pg, recursos, M, y, 'Ficha cadastral de cliente');
  if(logoDaMarca()) y += 12;
  pg.txt(A4L-M, y+12, dbr(hoje()), {tam:9, cor:CINZA_PDF, align:'r'});
  if(c.cod) pg.txt(A4L-M, y+26, 'Cód. '+c.cod, {tam:9, negrito:true, cor:GRAFITE_PDF, align:'r'});
  y += 40; pg.linha(M, y, A4L-M, y, 2, GRAFITE_PDF); y += 22;
  pg.txt(M, y, c.razao||'', {tam:15, negrito:true, cor:GRAFITE_PDF}); y += 10;
  if(c.fantasia && c.fantasia!==c.razao){ y += 12; pg.txt(M, y, c.fantasia, {tam:10, cor:CINZA_PDF}); }
  y += 20;
  const linhas = dadosFicha(c);
  const wRot = 150, wVal = A4L - 2*M - wRot - 8;
  linhas.forEach((par,i)=>{
    const partes = quebraTexto(par[1], 9.5, false, wVal);
    const alt = Math.max(1, partes.length) * 12 + 8;
    if(i%2===0) pg.ret(M, y-9, A4L-2*M, alt, CREME_PDF);
    pg.txt(M+6, y+3, par[0], {tam:8.5, cor:CINZA_PDF});
    partes.forEach((t,k)=>{ pg.txt(M+wRot+8, y+3+k*12, t, {tam:9.5, negrito:k===0, cor:GRAFITE_PDF}); });
    y += alt;
  });
  y += 16; pg.linha(M, y, A4L-M, y, 0.5, LINHA_PDF); y += 16;
  const rep = [D.cfg.repNome, D.cfg.repEmpresa, D.cfg.repTel?telBonito(D.cfg.repTel):'', D.cfg.repEmail].filter(Boolean).join('  ·  ');
  pg.txt(M, y, 'Representante: '+rep, {tam:8.5, cor:CINZA_PDF});
  return montarPdf(paginas, recursos);
}
/* quebra um texto em linhas que cabem na largura (mesma métrica do PDF) */
function quebraTexto(texto, tam, neg, larg){
  const palavras = String(texto||'').split(/\s+/); const out = []; let atual = '';
  palavras.forEach(w=>{ const tent = atual ? atual+' '+w : w; if(larguraTexto(tent, tam, neg) <= larg) atual = tent; else { if(atual) out.push(atual); atual = w; } });
  if(atual) out.push(atual); return out.length ? out : [''];
}

}
function textoFicha(c){

function larguraTexto(s, tam, negrito){
  const tab = negrito ? LARG_NEGRITO : LARG_NORMAL;
  let soma = 0;
  for(const ch of String(s)){
    const base = tab[ch] !== undefined ? ch : (BASE_ACENTO[ch] || ' ');
    soma += (tab[base] !== undefined ? tab[base] : 500);
  }
  return soma * tam / 1000;
}

/* texto -> bytes WinAnsi (o que as fontes padrão do PDF entendem) */
const WINANSI = {'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,
  '‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,
  '•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159,'−':45};
function paraWinAnsi(s){
  let out = '';
  for(const ch of String(s)){
    const c = ch.codePointAt(0);
    if(WINANSI[ch] !== undefined) out += String.fromCharCode(WINANSI[ch]);
    else if(c < 256) out += ch;
    else out += (BASE_ACENTO[ch] || '?');
  }
  return out.replace(/([\\()])/g, '\\$1');
}

/* ---------- página em construção ---------- */
function NovaPagina(larg, alt){
  return {
    larg: larg, alt: alt, ops: [], imagens: [],
    txt: function(x, y, s, o){
      o = o || {};
      const tam = o.tam || 9.5, neg = !!o.negrito;
      let px = x;
      if(o.align === 'r') px = x - larguraTexto(s, tam, neg);
      else if(o.align === 'c') px = x - larguraTexto(s, tam, neg)/2;
      const c = o.cor || [0.2,0.19,0.18];
      this.ops.push(c[0].toFixed(3)+' '+c[1].toFixed(3)+' '+c[2].toFixed(3)+' rg');
      this.ops.push('BT /'+(neg?'F2':'F1')+' '+tam+' Tf 1 0 0 1 '+
        px.toFixed(2)+' '+(this.alt-y).toFixed(2)+' Tm ('+paraWinAnsi(s)+') Tj ET');
      return px + larguraTexto(s, tam, neg);
    },
    ret: function(x, y, w, h, cor){
      this.ops.push(cor[0].toFixed(3)+' '+cor[1].toFixed(3)+' '+cor[2].toFixed(3)+' rg');
      this.ops.push(x.toFixed(2)+' '+(this.alt-y-h).toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+' re f');
    },
    linha: function(x1, y1, x2, y2, esp, cor){
      cor = cor || [0.2,0.19,0.18];
      this.ops.push(cor[0].toFixed(3)+' '+cor[1].toFixed(3)+' '+cor[2].toFixed(3)+' RG');
      this.ops.push((esp||0.5).toFixed(2)+' w '+x1.toFixed(2)+' '+(this.alt-y1).toFixed(2)+' m '+
        x2.toFixed(2)+' '+(this.alt-y2).toFixed(2)+' l S');
    },
    imagem: function(nome, x, y, w, h){
      this.ops.push('q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x.toFixed(2)+' '+
        (this.alt-y-h).toFixed(2)+' cm /'+nome+' Do Q');
      this.imagens.push(nome);
    }
  };
}

function quebrarLinhas(s, larguraMax, tam, negrito){
  const palavras = String(s).split(/\s+/).filter(Boolean);
  const linhas = []; let atual = '';
  palavras.forEach(p=>{
    const tentativa = atual ? atual+' '+p : p;
    if(larguraTexto(tentativa, tam, negrito) <= larguraMax) atual = tentativa;
    else { if(atual) linhas.push(atual); atual = p; }
  });
  if(atual) linhas.push(atual);
  return linhas.length ? linhas : [''];
}

/* ---------- montagem do arquivo ---------- */
function montarPdf(paginas, recursosImg){
  const objs = [];
  const num = corpo => { objs.push(corpo); return objs.length; };

  const fonte1 = num('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const fonte2 = num('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

  const refImg = {};
  for(const nome in recursosImg){
    const im = recursosImg[nome];
    refImg[nome] = num('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+
      ' >>\nstream\n'+im.bytes+'\nendstream');
  }

  const idPaginas = objs.length + 1 + paginas.length*2;
  const refsPag = [];
  paginas.forEach(pg=>{
    const fluxo = pg.ops.join('\n');
    const idFluxo = num('<< /Length '+fluxo.length+' >>\nstream\n'+fluxo+'\nendstream');
    let xo = '';
    if(pg.imagens.length){
      xo = ' /XObject << ' + pg.imagens.map(n=>'/'+n+' '+refImg[n]+' 0 R').join(' ') + ' >>';
    }
    const idPag = num('<< /Type /Page /Parent '+idPaginas+' 0 R /MediaBox [0 0 '+
      pg.larg.toFixed(2)+' '+pg.alt.toFixed(2)+'] /Resources << /Font << /F1 '+fonte1+
      ' 0 R /F2 '+fonte2+' 0 R >>'+xo+' >> /Contents '+idFluxo+' 0 R >>');
    refsPag.push(idPag);
  });

  const idPaginasReal = num('<< /Type /Pages /Count '+paginas.length+' /Kids ['+
    refsPag.map(r=>r+' 0 R').join(' ')+'] >>');
  const idRaiz = num('<< /Type /Catalog /Pages '+idPaginasReal+' 0 R >>');

  /* o /Parent foi escrito com o número previsto; confere */
  if(idPaginasReal !== idPaginas){
    refsPag.forEach(r=>{
      objs[r-1] = objs[r-1].replace('/Parent '+idPaginas+' 0 R', '/Parent '+idPaginasReal+' 0 R');
    });
  }

  let saida = '%PDF-1.4\n%âãÏÓ\n';
  const desloc = [];
  objs.forEach((o,i)=>{ desloc[i] = saida.length; saida += (i+1)+' 0 obj\n'+o+'\nendobj\n'; });
  const inicioXref = saida.length;
  saida += 'xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  desloc.forEach(d=>{ saida += String(d).padStart(10,'0')+' 00000 n \n'; });
  saida += 'trailer\n<< /Size '+(objs.length+1)+' /Root '+idRaiz+' 0 R >>\nstartxref\n'+inicioXref+'\n%%EOF';

  const bytes = new Uint8Array(saida.length);
  for(let i=0;i<saida.length;i++) bytes[i] = saida.charCodeAt(i) & 0xFF;
  return bytes;
}

/* ---------- a folha do pedido ---------- */
const GRAFITE_PDF = [0.200,0.188,0.180];
const CINZA_PDF   = [0.541,0.541,0.541];
const DOURADO_PDF = [0.949,0.663,0.000];
const CREME_PDF   = [0.980,0.968,0.949];
const CREME2_PDF  = [0.949,0.925,0.890];
const LINHA_PDF   = [0.902,0.878,0.847];
const TERRA_PDF   = [0.541,0.200,0.141];

function pdfDoPedido(ped, paraCliente){
  const A4L = 595.28, A4A = 841.89, M = 38;
  const cli = clienteDe(ped) || {};
  const t = totais(ped);
  const cfg = D.cfg;
  const paginas = [];
  const recursos = {};

  let pg = NovaPagina(A4L, A4A);
  paginas.push(pg);
  let y = M;

  /* ---- cabeçalho ---- */
  const mk = marcaAtual();
  cabecalhoMarcaPdf(pg, recursos, M, y, ehBonif(ped) ? 'Pedido de bonificação — sem cobrança' : paraCliente ? 'Confirmação de pedido' : 'Pedido de venda');

  /* rótulo em cinza + número em negrito, os dois alinhados pela direita */
  function parDireita(yy, rotulo, valor, tamR, tamV){
    const nf = /usar na NF/.test(rotulo);
    const wr = larguraTexto(rotulo+'  ', tamR, nf);
    const wv = larguraTexto(valor, tamV, true);
    const x0 = A4L - M - (wr + wv);
    pg.txt(x0, yy, rotulo, {tam:tamR, negrito:nf, cor:nf?[0,0,0]:CINZA_PDF});
    pg.txt(x0 + wr, yy, valor, {tam:tamV, negrito:true, cor:nf?[0,0,0]:GRAFITE_PDF});
  }
  let yd = y+9;
  if(ped.numCliente){
    /* grifado em amarelo: e o numero que tem que sair na nota */
    if(!paraCliente){
      const wr = larguraTexto('Pedido do cliente (usar na NF)  ', 9.5, true), wv = larguraTexto(ped.numCliente, 12, true);
      pg.ret(A4L - M - (wr + wv) - 6, yd-11, wr + wv + 12, 17, [1,0.902,0]);
    }
    parDireita(yd, 'Pedido do cliente (usar na NF)', ped.numCliente, 9.5, 12); yd += 17;
    parDireita(yd, 'Ref. do representante', ped.num, 8.5, 9); yd += 12;
  } else {
    parDireita(yd, 'Ref. do representante', ped.num, 9, 10); yd += 14;
  }
  pg.txt(A4L-M, yd, dbr(ped.data), {tam:9, cor:CINZA_PDF, align:'r'}); yd += 12;
  if(ped.dataEntrega){ parDireita(yd, 'Entrega', dbr(ped.dataEntrega), 9, 9.5); yd += 13; }
  pg.txt(A4L-M, yd, ped.status, {tam:9, cor:CINZA_PDF, align:'r'});

  y = Math.max(y+(logoDaMarca()?52:40), yd+8);
  pg.linha(M, y, A4L-M, y, 2, GRAFITE_PDF);
  y += 20;
  if(ehBonif(ped)){
    /* faixa impossivel de nao ver: a industria nao pode faturar isto como venda */
    pg.ret(M, y-14, A4L-2*M, 34, DOURADO_PDF);
    pg.txt(M+10, y+1,  'PEDIDO DE BONIFICAÇÃO — SEM COBRANÇA', {tam:12, negrito:true, cor:GRAFITE_PDF});
    pg.txt(M+10, y+14, 'Não faturar como venda. Os valores abaixo são referência para a nota de bonificação.', {tam:8, cor:GRAFITE_PDF});
    y += 34;
  }

  { const rv = revisaoDe(ped);
    if(rv){
      const ls = quebrarLinhas(rv.frase, A4L-2*M-20, 8, true);
      const alt = 14 + ls.length*11;
      pg.ret(M, y-11, A4L-2*M, alt, [0.984,0.914,0.894]);
      ls.forEach((ln,i)=>pg.txt(M+10, y+1+i*11, ln, {tam:8, negrito:true, cor:TERRA_PDF}));
      y += alt + 4;
    } }
  /* ---- cliente ---- */
  pg.txt(M, y, 'CLIENTE', {tam:7.5, negrito:true, cor:CINZA_PDF});
  y += 13;
  const dados = [
    ['Razão social', cli.razao],
    ['Nome fantasia', (cli.fantasia && cli.fantasia!==cli.razao) ? cli.fantasia : ''],
    ['Cód. na indústria', paraCliente ? '' : (cli.codIndustria || 'ainda não tem - cadastro novo')],
    ['Descarga', cli.agendamento],
    ['CNPJ', cnpjBonito(cli.cnpj)],
    ['Inscrição estadual', cli.ie],
    ['Regime', cli.regime],
    ['Canal', CANAL_NOME[cli.canal] + (cli.segmento?' - '+cli.segmento:'')],
    ['Entrega', [cli.endereco, cli.bairro, cli.cidade, cli.cep?'CEP '+cepBonito(cli.cep):''].filter(Boolean).join(' - ')],
    ['Referência', cli.referencia],
    ['Contato', [cli.contato, cli.fone?telBonito(cli.fone):''].filter(Boolean).join(' - ')],
    ['E-mail', cli.email]
  ].filter(l=>l[1]);
  dados.forEach(l=>{
    pg.txt(M, y, l[0], {tam:9, cor:CINZA_PDF});
    quebrarLinhas(l[1], A4L-M-M-88, 9, false).forEach((ln,i)=>{
      pg.txt(M+88, y+i*11.5, ln, {tam:9, cor:GRAFITE_PDF});
      if(i>0) y += 11.5;
    });
    y += 13;
  });

  /* ---- itens ---- */
  y += 10;
  if(!paraCliente && itensNegociados(ped).length){
    pg.ret(M, y-4, A4L-2*M, 18, [0.984,0.914,0.894]);
    pg.txt(M+6, y+8, 'ATENÇÃO: '+itensNegociados(ped).length+' item(ns) com preço negociado, diferente da tabela. Faturar pelo preço de cada item (coluna PREÇO CX).', {tam:8, negrito:true, cor:TERRA_PDF});
    y += 20;
  }
  const colX = { n:M+4, cod:M+24, prod:M+68, cx:A4L-M-176, kg:A4L-M-126, pr:A4L-M-66, tot:A4L-M-4 };
  const larguraProduto = colX.cx - colX.prod - 34;

  function cabecalhoTabela(){
    pg.ret(M, y, A4L-2*M, 17, GRAFITE_PDF);
    pg.txt(colX.n,    y+11.5, '#',       {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(colX.cod,  y+11.5, 'CÓDIGO',  {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(colX.prod, y+11.5, 'PRODUTO', {tam:7.5, negrito:true, cor:CREME_PDF});
    pg.txt(colX.cx,   y+11.5, 'CAIXAS',  {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(colX.kg,   y+11.5, 'PESO KG', {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(colX.pr,   y+11.5, 'PREÇO CX',{tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    pg.txt(colX.tot,  y+11.5, 'TOTAL',   {tam:7.5, negrito:true, cor:CREME_PDF, align:'r'});
    y += 17;
  }
  cabecalhoTabela();

  ped.itens.forEach((it, i)=>{
    const p = porId[it.skuId] || {};
    const linhasNome = quebrarLinhas(it.nome, larguraProduto, 9, false);
    let refUn = '';
    if(paraCliente) refUn = refsDoItem(it, p).join('  ·  ');
    const tb = tabelaDoItem(it);
    let negoc = '';
    if(tb !== null && !paraCliente) negoc = 'PREÇO NEGOCIADO — faturar '+brl(it.preco)+' a caixa';
    else if(tb !== null && paraCliente && it.preco < tb) negoc = 'desconto de '+nm((tb-it.preco)/tb*100,1)+'% neste item';
    const altura = Math.max(19, 8 + linhasNome.length*11 + (refUn?10:0) + (negoc?10:0));

    if(y + altura > A4A - 200){          /* estourou a página: começa outra */
      pg = NovaPagina(A4L, A4A); paginas.push(pg); y = M;
      pg.txt(M, y+10, 'Pedido '+ped.num+' — continuação', {tam:9.5, negrito:true});
      y += 24;
      cabecalhoTabela();
    }
    if(i % 2 === 1) pg.ret(M, y, A4L-2*M, altura, CREME_PDF);

    pg.txt(colX.n,    y+13, String(i+1), {tam:9, cor:CINZA_PDF});
    pg.txt(colX.cod,  y+13, it.cod,      {tam:9, negrito:true});
    linhasNome.forEach((ln,k)=> pg.txt(colX.prod, y+13+k*11, ln, {tam:9}));
    if(p.pacotesPorCaixa){
      const larg = larguraTexto(linhasNome[linhasNome.length-1], 9, false);
      pg.txt(colX.prod+larg+4, y+13+(linhasNome.length-1)*11,
        nm(p.pacotesPorCaixa)+' pct/cx', {tam:7, cor:CINZA_PDF});
    }
    let yy = y+13+linhasNome.length*10.5;
    if(refUn){ pg.txt(colX.prod, yy, refUn, {tam:7.5, cor:CINZA_PDF}); yy += 10; }
    if(negoc){ pg.txt(colX.prod, yy, negoc, {tam:7.5, negrito:true, cor:paraCliente?CINZA_PDF:TERRA_PDF}); }
    pg.txt(colX.cx,  y+13, nm(it.qtd), {tam:9, align:'r'});
    pg.txt(colX.kg,  y+13, nm(kgDe(p,it.un)*it.qtd, 1), {tam:9, align:'r', cor:CINZA_PDF});
    pg.txt(colX.pr,  y+13, brl(it.preco), {tam:9, align:'r', negrito: tb!==null && !paraCliente, cor: (tb!==null && !paraCliente) ? TERRA_PDF : GRAFITE_PDF});
    pg.txt(colX.tot, y+13, brl(it.preco*it.qtd), {tam:9, negrito:true, align:'r'});
    y += altura;
    pg.linha(M, y, A4L-M, y, 0.4, LINHA_PDF);
  });

  /* ---- fecho ---- */
  y += 18;
  const yFecho = y;
  let ye = y;
  if(ehBonif(ped)){
    const w = pg.txt(M, ye, 'Pagamento: ', {tam:9, negrito:true});
    pg.txt(w, ye, 'não se aplica — bonificação sem cobrança', {tam:9, cor:TERRA_PDF}); ye += 14;
  } else if(ped.cond){
    const w = pg.txt(M, ye, 'Pagamento: ', {tam:9, negrito:true});
    pg.txt(w, ye, ped.cond, {tam:9}); ye += 14;
  }
  if(ped.dataEntrega){
    const we = pg.txt(M, ye, 'Entrega combinada: ', {tam:9, negrito:true});
    pg.txt(we, ye, dbr(ped.dataEntrega), {tam:9}); ye += 14;
  }
  const w2 = pg.txt(M, ye, 'Volume: ', {tam:9, negrito:true});
  pg.txt(w2, ye, nm(t.cx, t.cx%1?1:0)+' caixas · '+nm(t.kg,1)+' kg', {tam:9}); ye += 14;
  if(ped.obs){
    pg.txt(M, ye, 'Observações:', {tam:9, negrito:true}); ye += 12;
    quebrarLinhas(ped.obs, A4L-2*M-230, 9, false).forEach(ln=>{ pg.txt(M, ye, ln, {tam:9}); ye += 12; });
  }

  let yt = yFecho;
  const xr = A4L-M, xl = A4L-M-175;
  pg.txt(xl, yt, 'Subtotal', {tam:9, cor:CINZA_PDF});
  pg.txt(xr, yt, brl(t.bruto), {tam:9, align:'r'}); yt += 14;
  {
    const dn = descontoNegociado(ped);
    if(paraCliente && dn.valor>0.005){   /* so o cliente ve: a industria recebe so o preco a faturar */
      pg.txt(xl, yt, 'Desconto negociado', {tam:8.5, cor:[0.118,0.478,0.302]});
      pg.txt(xr, yt, '− '+brl(dn.valor), {tam:8.5, align:'r', cor:[0.118,0.478,0.302]}); yt += 11;
      pg.txt(xl, yt, 'já aplicado nos preços acima · sobre a tabela', {tam:7.5, cor:[0.118,0.478,0.302]});
      pg.txt(xr, yt, '−'+nm(dn.pct,1)+'%', {tam:7.5, align:'r', cor:[0.118,0.478,0.302]}); yt += 12;
    }
  }
  if(t.desc > 0){
    pg.txt(xl, yt, 'Desconto '+vlr(ped.desc).replace(/,00$/,'')+'%', {tam:9, cor:TERRA_PDF});
    pg.txt(xr, yt, '- '+brl(t.desc), {tam:9, align:'r', cor:TERRA_PDF}); yt += 14;
  }
  yt += 4;
  pg.linha(xl, yt, xr, yt, 1.4, GRAFITE_PDF); yt += 16;
  pg.txt(xl, yt, ehBonif(ped) ? 'Referência' : 'Total', {tam:13, negrito:true});
  pg.txt(xr, yt, brl(t.liquido), {tam:13, negrito:true, align:'r'});
  if(ehBonif(ped)){ yt += 12; pg.txt(xl, yt, 'bonificação — sem cobrança', {tam:8.5, negrito:true, cor:TERRA_PDF}); }

  /* ---- assinaturas e rodapé ---- */
  let ya = Math.max(ye, yt) + 58;
  if(ya > A4A - 110) ya = A4A - 110;
  const meio = A4L/2;
  pg.linha(M+10, ya, meio-24, ya, 0.7, GRAFITE_PDF);
  pg.linha(meio+24, ya, A4L-M-10, ya, 0.7, GRAFITE_PDF);
  const c1 = (M+10+meio-24)/2, c2 = (meio+24+A4L-M-10)/2;
  pg.txt(c1, ya+12, cfg.repNome || 'Representante', {tam:8.6, align:'c'});
  pg.txt(c2, ya+12, cli.contato || 'Pelo cliente',  {tam:8.6, align:'c'});
  if(cfg.repEmpresa) pg.txt(c1, ya+23, cfg.repEmpresa, {tam:7.5, align:'c', cor:CINZA_PDF});
  if(cfg.repTel)     pg.txt(c1, ya+(cfg.repEmpresa?34:23), telBonito(cfg.repTel), {tam:7.5, align:'c', cor:CINZA_PDF});
  pg.txt(c2, ya+23, cli.fantasia || cli.razao || '', {tam:7.5, align:'c', cor:CINZA_PDF});

  const yr = A4A - M - 8;
  pg.linha(M, yr-10, A4L-M, yr-10, 0.4, LINHA_PDF);
  pg.txt(A4L/2, yr, 'Emitido pelo app de pedidos em '+dbr(hoje())+' · tabela '+cfg.tabelaVersao+
    (ped.demo ? ' · PEDIDO DE EXEMPLO, SEM VALIDADE' : ''),
    {tam:7.5, align:'c', cor:CINZA_PDF});

  /* ---- página do documento do cliente ---- */
  if(ped.anexo && ped.anexo.dados){
    try{
      const b64 = ped.anexo.dados.split(',')[1];
      const bin = atob(b64);
      recursos.Anexo1 = { w: ped.anexo.w, h: ped.anexo.h, bytes: bin };
      const pgA = NovaPagina(A4L, A4A);
      paginas.push(pgA);
      pgA.txt(M, M+10, 'Pedido original do cliente', {tam:11, negrito:true});
      pgA.txt(M, M+24, 'Anexo do pedido '+ped.num+
        (cli.fantasia||cli.razao ? ' — '+(cli.fantasia||cli.razao) : ''), {tam:8.5, cor:CINZA_PDF});
      pgA.linha(M, M+34, A4L-M, M+34, 1, LINHA_PDF);
      const dispW = A4L - 2*M, dispH = A4A - M - (M+52);
      const escala = Math.min(dispW/ped.anexo.w, dispH/ped.anexo.h);
      const iw = ped.anexo.w*escala, ih = ped.anexo.h*escala;
      pgA.imagem('Anexo1', M + (dispW-iw)/2, M+52, iw, ih);
    }catch(e){}
  }

  return montarPdf(paginas, recursos);
}

/* ---------- planilha do pedido ---------- */
function csvDoPedido(ped){
  const c = clienteDe(ped) || {};
  const L = [];
  L.push(['Pedido','PedidoCliente','Data','DataEntrega','Situacao','Tipo','Cliente','CNPJ','Canal','Cidade','Pagamento'].join(';'));
  L.push([ped.num, ped.numCliente||'', dbr(ped.data), dbr(ped.dataEntrega)||'', ped.status, ehBonif(ped)?'Bonificacao (sem cobranca)':'Venda', c.razao||'',
          cnpjBonito(c.cnpj)||'', CANAL_NOME[c.canal]||'', c.cidade||'', ehBonif(ped)?'':(ped.cond||'')
         ].map(csvCampo).join(';'));
  L.push('');
  L.push(['Item','Codigo','Produto','Caixas','PesoKg','PrecoCaixa','PrecoPacote','PrecoUnidade','Total'].join(';'));
  ped.itens.forEach((it,i)=>{
    const p = porId[it.skuId] || {};
    L.push([i+1, it.cod, it.nome, nm(it.qtd), csvNum(kgDe(p,it.un)*it.qtd),
            csvNum(it.preco), p.pPacote?csvNum(p.pPacote):'', p.pUnidade?csvNum(p.pUnidade):'',
            csvNum(it.preco*it.qtd)].map(csvCampo).join(';'));
  });
  const t = totais(ped);
  L.push('');
  L.push(['','','Subtotal','','','','','',csvNum(t.bruto)].join(';'));
  if(t.desc>0) L.push(['','','Desconto '+vlr(ped.desc).replace(/,00$/,'')+'%','','','','','','-'+csvNum(t.desc)].join(';'));
  L.push(['','','Total','',csvNum(t.kg),'','','',csvNum(t.liquido)].join(';'));
  if(ped.obs) { L.push(''); L.push(['Observacoes', ped.obs].map(csvCampo).join(';')); }
  return L.join('\r\n');
}

/* ---------- entrega dos arquivos ---------- */
function nomeArquivo(ped, ext, paraCliente){
  const c = clienteDe(ped);
  const apelido = c ? sac(c.fantasia||c.razao).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24) : 'pedido';
  return (ehBonif(ped)?'bonificacao-':paraCliente?'confirmacao-':'pedido-')+ped.num+'-'+apelido+'.'+ext;
}

ACOES.gerarPDF = (id, variante) => {
  const ped = pedidoPorId(id); if(!ped) return;
  if(!ped.itens.length){ aviso('O pedido está sem itens.'); return; }
  const paraCliente = variante === 'cliente';
  try{
    const bytes = pdfDoPedido(ped, paraCliente);
    baixar(nomeArquivo(ped,'pdf',paraCliente), bytes.buffer.slice(0), 'application/pdf');
  }catch(e){ aviso('Não consegui montar o PDF: '+e.message); }
};
ACOES.gerarCSVPedido = id => {
  const ped = pedidoPorId(id); if(!ped) return;
  baixar(nomeArquivo(ped,'xlsx'), xlsxDoPedido(ped), TIPO_XLSX);
};

/* Compartilhar abre a folha do aparelho com os arquivos já anexados —
   é o único caminho que leva PDF e planilha juntos para o WhatsApp ou o e-mail. */
ACOES.compartilhar = async (id, variante) => {
  const ped = pedidoPorId(id); if(!ped) return;
  if(!ped.itens.length){ aviso('O pedido está sem itens.'); return; }
  if(ehExemplo(ped)) return;
  const paraCliente = variante === 'cliente';
  let arquivos;
  try{
    arquivos = [ new File([pdfDoPedido(ped, paraCliente)],
                          nomeArquivo(ped,'pdf',paraCliente), {type:'application/pdf'}) ];
    if(!paraCliente) arquivos.push(new File([xlsxDoPedido(ped)], nomeArquivo(ped,'xlsx'), {type:TIPO_XLSX}));
    if(!paraCliente && ped.anexo && ped.anexo.dados){
      const bin = atob(ped.anexo.dados.split(',')[1]);
      const b = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
      arquivos.push(new File([b], 'pedido-original-'+ped.num+'.jpg', {type:'image/jpeg'}));
    }
  }catch(e){ aviso('Não consegui preparar os arquivos.'); return; }

  /* o pedido em tabela ja fica copiado antes de abrir a folha: se ele escolher o e-mail,
     e so colar no corpo por cima do texto simples (e-mail aberto por link nao aceita HTML) */
  try{ await copiarRico(emailHtml(ped, paraCliente), montarTexto(ped, false, paraCliente)); }catch(e){}

  /* O Chrome do Android (e do Windows) so aceita na folha de compartilhar alguns tipos de
     arquivo: PDF, foto, texto. Planilha .xlsx ele recusa e a folha nem abre. Nesse caso o
     pedido vai sem a planilha, e o app avisa em seguida como mandar ela a parte. */
  let semPlanilha = false;
  if(navigator.canShare && !navigator.canShare({files:arquivos})){
    const so = arquivos.filter(f=>f.type!==TIPO_XLSX);
    if(so.length && so.length<arquivos.length && navigator.canShare({files:so})){ arquivos = so; semPlanilha = true; }
  }

  const cli = clienteDe(ped) || {};
  try{
    if(navigator.canShare && navigator.canShare({files:arquivos})){
      await navigator.share({
        files: arquivos,
        title: assuntoPedido(ped, paraCliente),
        text: resumoTexto(ped, paraCliente, semPlanilha)
      });
      if(semPlanilha) avisarPlanilhaFicou(ped);
      else if(!paraCliente) perguntarSeSaiu(ped);
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;   /* desistiu na folha de compartilhar */
  }
  modal('Compartilhar não está disponível aqui',
    '<p style="margin:2px 0 12px;font-size:calc(14.5px * var(--esc));line-height:1.5">'+
    'Este navegador não deixa mandar arquivo direto para o WhatsApp ou o e-mail. '+
    'Salve os arquivos e anexe você mesmo — leva o mesmo tempo. '+
    'O pedido em tabela já está copiado para colar no corpo do e-mail.</p>',
    '<div class="linha-bt">'+
    '<button class="bt bt-l" data-a="gerarPDF" data-i="'+esc(ped.id)+'" data-v="'+(paraCliente?'cliente':'')+'">Salvar PDF</button>'+
    (paraCliente?'':'<button class="bt bt-l" data-a="gerarCSVPedido" data-i="'+esc(ped.id)+'">Salvar planilha</button>')+'</div>');
};

function comprimirFoto(arquivo, pronto){
  const fr = new FileReader();
  fr.onerror = () => pronto(null);
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => pronto(null);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const maior = Math.max(w,h), teto = 1400;
      if(maior > teto){ const f = teto/maior; w = Math.round(w*f); h = Math.round(h*f); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.6, dados = cv.toDataURL('image/jpeg', q);
      while(dados.length > 300000 && q > 0.25){ q -= 0.1; dados = cv.toDataURL('image/jpeg', q); }
      pronto({ dados:dados, w:w, h:h, em:new Date().toISOString() });
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(arquivo);
}

   ANÁLISE — o que está crescendo, o que está caindo
   e como cada rede se comporta.
   ===================================================== */

/* Um mês inteiro destrinchado por cliente, por SKU e por rede.
   Tudo que as telas de análise mostram sai daqui. */
function analisePer(P){
  const f = perFaixa(P);
  const peds = pedidosValidos().filter(p=>p.data>=f.ini && p.data<=f.fim);
  const cli = {};        /* clienteId -> {val, cx, kg, peds} */
  const sku = {};        /* skuId     -> {nome, cod, canal, val, cx, kg} */
  const cat = {};        /* categoria -> val */
  let total = 0;

  peds.forEach(p=>{
    const t = totais(p);
    total += t.liquido;
    if(p.clienteId){
      const c = cli[p.clienteId] || (cli[p.clienteId] = {val:0, cx:0, kg:0, peds:0});
      c.val += t.liquido; c.cx += t.cx; c.kg += t.kg; c.peds++;
    }
    /* o desconto do pedido é rateado no item, senão a soma dos SKUs
       não fecha com o faturamento */
    const fator = t.bruto>0 ? t.liquido/t.bruto : 1;
    (p.itens||[]).forEach(it=>{
      const pr = porId[it.skuId] || {};
      const s = sku[it.skuId] || (sku[it.skuId] =
        {nome:it.nome, cod:it.cod, canal:pr.canal||'', categoria:pr.categoria||'—',
         val:0, cx:0, kg:0});
      const v = it.preco*it.qtd*fator;
      s.val += v;
      s.cx  += caixasEquiv(pr, it.un, it.qtd);
      s.kg  += kgDe(pr, it.un)*it.qtd;
      cat[s.categoria] = (cat[s.categoria]||0) + v;
    });
  });
  return {P:P, total:total, nPedidos:peds.length, cli:cli, sku:sku, cat:cat};
}

/* Compara dois meses e devolve a lista já ordenada, com a variação.
   `chaves` é a união dos dois meses: quem sumiu importa tanto quanto quem cresceu. */
function comparar(agora, antes, nome){
  const chaves = {};
  Object.keys(agora).forEach(k=>chaves[k]=1);
  Object.keys(antes).forEach(k=>chaves[k]=1);
  return Object.keys(chaves).map(k=>{
    const a = agora[k] ? agora[k].val : 0;
    const b = antes[k] ? antes[k].val : 0;
    return {
      id:k, nome:nome(k, agora[k]||antes[k]),
      agora:a, antes:b, dif:a-b,
      pct: b>0 ? (a/b-1)*100 : (a>0 ? null : 0),   /* null = estreante */
      dados: agora[k] || null
    };
  }).sort((x,y)=>y.agora-x.agora);
}

/* --------- redes: várias lojas, uma bandeira --------- */
function redesDoPer(P){
  const a = analisePer(P), b = analisePer(perAnt(P));
  const redes = {};
  D.clientes.forEach(c=>{
    const k = chaveRede(c.rede);
    if(!k) return;
    const r = redes[k] || (redes[k] =
      {nome:c.rede, lojas:[], val:0, antes:0, cx:0, kg:0, peds:0, compraram:0});
    r.lojas.push(c);
    const da = a.cli[c.id], db = b.cli[c.id];
    if(da){ r.val += da.val; r.cx += da.cx; r.kg += da.kg; r.peds += da.peds; r.compraram++; }
    if(db){ r.antes += db.val; }
  });
  return Object.keys(redes).map(k=>{
    const r = redes[k]; r.chave = k;
    r.pct = r.antes>0 ? (r.val/r.antes-1)*100 : (r.val>0?null:0);
    r.posit = r.lojas.length ? r.compraram/r.lojas.length*100 : 0;
    r.ticket = r.peds ? r.val/r.peds : 0;
    return r;
  }).sort((x,y)=>y.val-x.val);
}

/* Faturamento dos últimos n meses, para o gráfico mensal. */
function serieMeses(ymFim, n){
  const out = [];
  let ym = ymFim;
  for(let i=0;i<n;i++){ out.unshift(ym); ym = mesVizinho(ym,-1); }
  return out.map(y=>{
    let v=0, cx=0;
    pedidosValidos().forEach(p=>{
      if(p.data.slice(0,7)===y){ const t=totais(p); v+=t.liquido; cx+=t.cx; }
    });
    return {ym:y, val:v, cx:cx};
  });
}

function graficoMeses(serie, meta){
  const W=340, H=142, x0=10, x1=330, yTopo=14, yBase=112;
  const n = serie.length, larg=(x1-x0)/n, bw=Math.min(34, larg*0.56);
  let max = meta>0 ? meta : 0;
  serie.forEach(s=>{ if(s.val>max) max=s.val; });
  if(max<=0) max=1;
  const y = v => yBase - (v/max)*(yBase-yTopo);
  let barras='', rot='';
  serie.forEach((s,i)=>{
    const cx = x0+larg*i+larg/2;
    const ult = i===n-1;
    const alt = Math.max(s.val>0?3:1.5, yBase-y(s.val));
    barras += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(yBase-alt).toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+alt.toFixed(1)+'" rx="3" fill="'+(ult?'#33302E':'#F2A900')+'"/>';
    if(s.val>0)
      barras += '<text x="'+cx.toFixed(1)+'" y="'+(yBase-alt-4).toFixed(1)+'" text-anchor="middle" '+
        'font-size="9" font-weight="700" fill="#5C5854" font-family="system-ui,sans-serif">'+
        (s.val>=1000? nm(s.val/1000,s.val<10000?1:0)+'k' : nm(s.val,0))+'</text>';
    rot += '<text x="'+cx.toFixed(1)+'" y="127" text-anchor="middle" font-size="9" fill="#8A8A8A" '+
      'font-family="system-ui,sans-serif">'+MES_NOME[Number(s.ym.slice(5,7))-1].slice(0,3)+'</text>';
  });
  const linhaMeta = meta>0 ?
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+y(meta).toFixed(1)+'" y2="'+y(meta).toFixed(1)+
    '" stroke="#8A3324" stroke-width="1.2" stroke-dasharray="4 3" opacity=".75"/>' : '';
  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" '+
    'role="img" aria-label="Faturamento dos últimos meses">'+
    '<line x1="'+x0+'" x2="'+x1+'" y1="'+yBase+'" y2="'+yBase+'" stroke="#E6E0D8"/>'+
    linhaMeta + barras + rot + '</svg>';
}

/* linha de comparação usada nas três listas */
function linhaVar(x, sub, acao, id){
  const cresce = x.dif >= 0;
  const selo = x.pct===null ? '<span class="var v-verde">novo</span>'
             : x.antes===0 && x.agora===0 ? ''
             : setinha(x.pct);

  const fim = acao ? '<span class="seta">'+ico('seta')+'</span></button>' : '</div>';

    '<span class="info"><span class="nm">'+esc(x.nome)+'</span>'+
    '<span class="sub">'+sub+'</span></span>'+
