# Mantem a nuvem (Supabase gratis) acordada: o plano gratis pausa depois de 7 dias sem uso.
# Roda 1x por dia e faz uma consulta leve. Nao le nem grava dado de cliente.
# Segredo necessario: Settings > Secrets and variables > Actions > SUPABASE_KEY = a chave sb_publishable_... (a mesma do app)
name: manter nuvem acordada
on:
  schedule:
    - cron: '17 11 * * *'   # todo dia, 08:17 de Brasilia
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: consulta leve
        env:
          CHAVE: ${{ secrets.SUPABASE_KEY }}
        run: |
          K=$(printf '%s' "$CHAVE" | tr -d '[:space:]"')
          echo "chave: ${#K} caracteres, comeca com ${K:0:15}"
          resp=$(curl -s -w '\n%{http_code}' -X POST \
            -H "apikey: $K" -H "Content-Type: application/json" -d '{}' \
            https://wzymaphljtwaoikyyqrk.supabase.co/rest/v1/rpc/quem_sou)
          code=$(printf '%s' "$resp" | tail -n1)
          echo "resposta: $code"
          if [ "$code" != "200" ]; then printf '%s\n' "$resp" | head -n1 | cut -c1-200; exit 1; fi
